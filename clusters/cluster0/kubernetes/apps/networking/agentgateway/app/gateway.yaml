apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: cluster0-gateway
  namespace: networking
spec:
  gatewayClassName: agentgateway
  infrastructure:
    annotations:
      lbipam.cilium.io/ips: 192.168.2.31
      lbipam.cilium.io/sharing-key: cluster0-edge
  listeners:
    - hostname: omni.biggs.dog
      name: omni-https
      port: 443
      protocol: HTTPS
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: omni-biggs-dog-tls
    - hostname: dex.biggs.dog
      name: dex-https
      port: 443
      protocol: HTTPS
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: dex-biggs-dog-tls
    - hostname: netbird.biggs.dog
      name: netbird-https
      port: 443
      protocol: HTTPS
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: netbird-biggs-dog-tls
    - hostname: factory.biggs.dog
      name: factory-https
      port: 443
      protocol: HTTPS
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: factory-biggs-dog-tls
    - hostname: "*.biggs.dog"
      name: wildcard-http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
