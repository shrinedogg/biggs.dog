# Edge TLS certificates for cluster0-gateway's HTTPS listeners.
#
# The Gateway (namespace: networking) references each cert by NAME ONLY in its
# listeners' tls.certificateRefs, which Gateway API resolves to the Gateway's
# OWN namespace. So the Secrets must materialize here in `networking`, not in
# the app namespaces. Issued via letsencrypt-prod (DNS-01 / Cloudflare API), so
# issuance does not require DNS to point at the cluster first.
#
# Notes:
#  - dex: plain-HTTP backend; the gateway is the sole TLS terminator,
#    so this is the only cert it needs.
#  - omni: serves its OWN TLS (deployment mounts omni-biggs-dog-tls at /tls and
#    runs with --cert/--key, backend-protocol HTTPS -> re-encrypt). That pod
#    mount is satisfied by the separate Certificate in the `omni` namespace
#    (apps/omni/omni/app/certificate.yaml); THIS one feeds only the gateway's
#    client-facing omni-https listener. Two certs for one hostname is expected.
#  - image-factory: plain-HTTP backend like dex; the gateway is the
#    sole TLS terminator, so this is the only cert it needs.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: dex-biggs-dog
  namespace: networking
spec:
  commonName: dex.biggs.dog
  dnsNames:
    - dex.biggs.dog
  secretName: dex-biggs-dog-tls
  duration: 720h # 30 days
  renewBefore: 168h # 7 days
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  usages:
    - digital signature
    - key encipherment
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: omni-biggs-dog
  namespace: networking
spec:
  commonName: omni.biggs.dog
  dnsNames:
    - omni.biggs.dog
  secretName: omni-biggs-dog-tls
  duration: 720h # 30 days
  renewBefore: 168h # 7 days
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  usages:
    - digital signature
    - key encipherment
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: factory-biggs-dog
  namespace: networking
spec:
  commonName: factory.biggs.dog
  dnsNames:
    - factory.biggs.dog
  secretName: factory-biggs-dog-tls
  duration: 720h # 30 days
  renewBefore: 168h # 7 days
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  usages:
    - digital signature
    - key encipherment
