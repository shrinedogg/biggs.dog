apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: agentgateway
  namespace: networking
spec:
  chartRef:
    kind: OCIRepository
    name: agentgateway
    namespace: flux-system
  interval: 3m
  values:
    controller:
      extraEnv:
        KGW_ENABLE_GATEWAY_API_EXPERIMENTAL_FEATURES: "true"
    # v2.2.1 schema: podSecurityContext/securityContext are top-level keys, and
    # unlike the alpha this chart ships NO default container securityContext and
    # no HPA template (controller.horizontalPodAutoscaler is vestigial here), so
    # the hardening must be set explicitly. runAsNonRoot/readOnlyRootFilesystem
    # are omitted pending verification of the controller image's UID/write paths.
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault
