apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: gateway-crds
  namespace: flux-system
  interval: 1h
  url: https://github.com/kubernetes-sigs/gateway-api
  ref:
    branch: main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateway-crds
  namespace: flux-system
spec:
  interval: 3m
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: gateway-crds
  path: "./config/crd/standard"
  prune: true
  timeout: 2m