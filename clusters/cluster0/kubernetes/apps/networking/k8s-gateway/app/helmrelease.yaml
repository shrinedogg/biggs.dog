apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8s-gateway
  namespace: networking
spec:
  interval: 3m
  chart:
    spec:
      chart: k8s-gateway
      version: 3.7.1
      sourceRef:
        kind: HelmRepository
        name: k8s-gateway
        namespace: flux-system
  maxHistory: 3
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    # CoreDNS listens on container port 1053 (the Service maps 53 -> 1053), so it
    # can run fully non-root with no added capabilities (NET_BIND_SERVICE is not
    # required). The chart already forces runAsUser 1000 while secure: true.
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault
    # nodeSelector:
    #   kubernetes.io/hostname: control-01
    # Service added so k8s-gateway creates DNS for annotated LoadBalancer services (e.g. turn.biggs.dog → Coturn)
    watchedResources: ["HTTPRoute", "Service"]
    domain: biggs.dog
    # fallthrough:
    # enabled: true
    # zones: [biggs.dog]
    dnsChallenge:
      enabled: true
      domain: dns01.clouddns.com
    ttl: 60
    service:
      type: LoadBalancer
      # Pinned to the live ClusterIP so it survives a Service recreate. lan-dns
      # and the Talos-managed kube-dns both forward biggs.dog to this address
      # (NOT the .6.6 LB VIP, which fails the same-node Cilium LB hairpin when a
      # resolver pod is co-located with the k8s-gateway pod). Was 10.97.206.83,
      # which never applied because ClusterIP is immutable once assigned.
      clusterIP: 10.105.74.41
      loadBalancerIP: 192.168.6.6
      port: 53
      externalTrafficPolicy: Cluster # Allow any node to forward traffic
      useTcp: true
    serviceAccount:
      create: true
      name: ""
      annotations: {}
