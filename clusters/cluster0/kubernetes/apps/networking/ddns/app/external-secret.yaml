---
# Same scoped Cloudflare token cert-manager uses for DNS-01. The token needs
# Zone:DNS:Edit on biggs.dog so the CronJob can maintain Omni's public A record.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
  namespace: networking
  labels:
    app.kubernetes.io/name: cloudflare-ddns
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    creationPolicy: Owner
  data:
    - secretKey: api-token
      remoteRef:
        key: cloudflare-api-token
        property: api-token
