---
# Keeps home.biggs.dog -> current WAN IP. After the cluster1 rebuild its
# gateway fronts netbird/dex.biggs.dog and cluster1's external-dns CNAMEs
# them here. SUSPENDED until that cutover (nothing WAN-side consumes it yet).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app ddns
  namespace: flux-system
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./clusters/cluster0/kubernetes/apps/networking/ddns/app
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  interval: 3m
  retryInterval: 1m
  timeout: 5m
  suspend: true
  dependsOn:
    - name: secretstore
