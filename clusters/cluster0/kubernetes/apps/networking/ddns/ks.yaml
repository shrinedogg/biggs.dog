---
# Keeps omni.biggs.dog -> current WAN IP so Omni remains reachable through
# public DNS when cluster1's LAN resolver is unavailable. HTTPS uses cluster1's
# wildcard Gateway; the UDM forwards TCP 8090/8100 directly to cluster0.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app ddns
  namespace: flux-system
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./clusters/cluster0/kubernetes/apps/networking/ddns/app
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  interval: 3m
  retryInterval: 1m
  timeout: 5m
  suspend: false
  dependsOn:
    - name: secretstore
