---
# Keeps home.biggs.dog -> current WAN IP. SUSPENDED indefinitely: nothing
# consumes it (NetBird dropped 2026-09-06; the UDM's own VPN covers remote
# access). Kept in-tree only as a ready-made option.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app ddns
  namespace: flux-system
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./clusters/cluster0/kubernetes/apps/networking/ddns/app
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  interval: 3m
  retryInterval: 1m
  timeout: 5m
  suspend: true
  dependsOn:
    - name: secretstore
