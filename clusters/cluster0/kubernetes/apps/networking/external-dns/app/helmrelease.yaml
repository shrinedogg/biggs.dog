---
# external-dns owns ONLY records it created (txtOwnerId + txtPrefix registry):
# it CNAMEs omni/dex/netbird/factory to home.biggs.dog, whose A record is kept
# current by the cloudflare-ddns CronJob (../ddns/). Each public HTTPRoute must
# carry: external-dns.alpha.kubernetes.io/target: home.biggs.dog
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
  namespace: networking
spec:
  interval: 10m
  chart:
    spec:
      chart: external-dns
      version: "1.21.1"
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    provider:
      name: cloudflare
    sources:
      - gateway-httproute
    domainFilters:
      - biggs.dog
    policy: sync
    txtOwnerId: cluster0
    txtPrefix: extdns-
    env:
      - name: CF_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: cloudflare-api-token
            key: api-token
    extraArgs:
      - --cloudflare-proxied=false
      - --gateway-namespace=networking
    podLabels:
      app.kubernetes.io/name: external-dns
