---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lan-dns
  namespace: networking
  labels:
    app.kubernetes.io/name: lan-dns
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lan-dns
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lan-dns
      annotations:
        # Roll the pods when the Corefile changes.
        kubectl.kubernetes.io/default-container: coredns
    spec:
      # Spread the two replicas across nodes so a single node loss doesn't take
      # LAN DNS down.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: lan-dns
                topologyKey: kubernetes.io/hostname
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: coredns
          image: docker.io/coredns/coredns:1.11.3
          args: ["-conf", "/etc/coredns/Corefile"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              # The official coredns binary carries a cap_net_bind_service file
              # capability; under no_new_privs (allowPrivilegeEscalation: false)
              # with all caps dropped, the kernel refuses to exec it. Granting
              # NET_BIND_SERVICE (the one cap restricted PodSecurity permits)
              # lets it start. We still bind the unprivileged 1053.
              add:
                - NET_BIND_SERVICE
          ports:
            - name: dns-udp
              containerPort: 1053
              protocol: UDP
            - name: dns-tcp
              containerPort: 1053
              protocol: TCP
            - name: metrics
              containerPort: 9153
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /ready
              port: 8181
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /etc/coredns
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: lan-dns
            items:
              - key: Corefile
                path: Corefile
