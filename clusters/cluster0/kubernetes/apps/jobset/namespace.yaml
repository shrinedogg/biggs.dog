apiVersion: v1
kind: Namespace
metadata:
  name: jobset-system
  labels:
    # JobSet controller runs non-root but the vendored release manifest does not
    # pin a full restricted securityContext, so follow the cluster0 house pattern
    # (omni/ci/openebs) with privileged (non-enforced) rather than invent a
    # third profile.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
