---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: biggs-dog
  namespace: gregbob
spec:
  hostnames:
  - biggs.biggs.dog
  parentRefs:
  - name: biggs-dog
  rules:
  - backendRefs:
    - name: biggs-service
      port: 8080
    matches:
    - path:
        type: PathPrefix
        value: /
