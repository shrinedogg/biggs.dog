apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  labels:
    app.kubernetes.io/name: dragonfly
    app.kubernetes.io/instance: dragonfly-db
    app.kubernetes.io/part-of: dragonfly-operator
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/created-by: dragonfly-operator
  name: dragonfly-db
  namespace: dragonfly
spec:
  replicas: 2
  # Network access is governed centrally by CiliumNetworkPolicies in
  # network-policies/policies/apps/dragonfly.yaml. Disable the operator-managed
  # NetworkPolicy so the Cilium layer is the single source of truth (the
  # operator's policy only allowed in-namespace 6379 ingress, which conflicts
  # conceptually with our cross-namespace allow rules).
  networkPolicyEnabled: false
  args:
    - "--default_lua_flags=allow-undeclared-keys"
    - "--replicaof=dragonfly-db.dragonfly.svc.cluster.local:6379"
  resources:
    requests:
      cpu: 500m
      memory: 500Mi
    limits:
      cpu: 600m
      memory: 750Mi
