apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  labels:
    app.kubernetes.io/name: dragonfly
    app.kubernetes.io/instance: dragonfly-db
    app.kubernetes.io/part-of: dragonfly-operator
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/created-by: dragonfly-operator
  name: dragonfly-db
spec:
  replicas: 2
  # AFFiNE/BullMQ Lua scripts access keys not declared in KEYS[]. Redis allows
  # this, but Dragonfly rejects it by default ("script tried accessing
  # undeclared key"). This flag restores Redis-compatible behavior.
  args:
    - "--default_lua_flags=allow-undeclared-keys"
  resources:
    requests:
      cpu: 500m
      memory: 500Mi
    limits:
      cpu: 600m
      memory: 750Mi