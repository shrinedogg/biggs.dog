apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  labels:
    app.kubernetes.io/name: dragonfly
    app.kubernetes.io/instance: dragonfly-db
    app.kubernetes.io/part-of: dragonfly-operator
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/created-by: dragonfly-operator
  name: dragonfly-db
  namespace: dragonfly
spec:
  replicas: 2
  # Network access is governed centrally by CiliumNetworkPolicies in
  # network-policies/policies/apps/dragonfly.yaml. Disable the operator-managed
  # NetworkPolicy so the Cilium layer is the single source of truth (the
  # operator's policy only allowed in-namespace 6379 ingress, which conflicts
  # conceptually with our cross-namespace allow rules).
  networkPolicyEnabled: false
  args:
    - "--default_lua_flags=allow-undeclared-keys"
    # Cap io threads. Dragonfly defaults to one proactor per CPU core, and each
    # thread reserves ~250MiB of stack/resident memory (the startup check is
    # `threads * 250MiB`). On this node that auto-scaled to 16 threads = 4GiB,
    # which exceeds the pod memory limit and crashes the container on boot.
    - "--proactor_threads=4"
    # NOTE: No --replicaof — let the Dragonfly operator manage master/replica
    # topology automatically. Hardcoding --replicaof to the ClusterIP service
    # causes every pod (including the master) to try replicating to itself
    # through the service VIP, making Redis unusable.
  resources:
    requests:
      cpu: 500m
      memory: 750Mi
    limits:
      memory: 1350Mi
