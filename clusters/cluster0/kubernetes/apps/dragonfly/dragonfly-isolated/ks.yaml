---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dragonfly-isolated
  namespace: flux-system
spec:
  interval: 3m
  path: ./clusters/cluster0/kubernetes/apps/dragonfly/dragonfly-isolated
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: dragonfly-isolated
  retryInterval: 1m
  timeout: 2m
  dependsOn:
    - name: dragonfly
