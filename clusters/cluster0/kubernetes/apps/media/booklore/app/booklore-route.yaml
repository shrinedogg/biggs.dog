---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: booklore
  namespace: media
spec:
  hostnames:
  - booklore.biggs.dog
  parentRefs:
  - name: wildcard-biggs-dog
    namespace: networking
  rules:
  - backendRefs:
    - name: booklore-service
      port: 6060
    matches:
    - path:
        type: PathPrefix
        value: /