apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: ersatz
  name: ersatz
  namespace: media
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
      minAvailable: 1
  template:
    metadata:
      labels:
        app: ersatz
    spec:
      # ErsatzTV (jasongdove/ersatztv) is built to run as root (config lives under
      # /root/.local/share/ersatztv and there is no PUID/PGID support), so
      # runAsNonRoot/readOnlyRootFilesystem are not set. All other hardening that
      # the image supports is applied: no privilege escalation, all capabilities
      # dropped, RuntimeDefault seccomp, and no service-account token mounted.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      nodeSelector:
        intel.feature.node.kubernetes.io/gpu: "true"
      containers:
        - image: ersatztv/legacy:294a2ff10e5e03911b6efa299dd84993d8e5db5b
          imagePullPolicy: Always
          name: ersatz
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: TZ
              value: "Europe/Helsinki"
          ports:
            - name: ersatz-port
              containerPort: 8409
              protocol: TCP
          volumeMounts:
            - name: ersatz-config
              mountPath: /root/.local/share/ersatztv
            - name: ersatz-media
              mountPath: /nfs-share
          resources:
            limits:
              gpu.intel.com/i915: "1"
              memory: 8Gi
            requests:
              gpu.intel.com/i915: "1"
              memory: 8Gi
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      volumes:
        - name: ersatz-config
          persistentVolumeClaim:
            claimName: ersatz-config-pvc
        - name: ersatz-media
          persistentVolumeClaim:
            claimName: media-nfs-pvc
  selector:
    matchLabels:
      app: ersatz
