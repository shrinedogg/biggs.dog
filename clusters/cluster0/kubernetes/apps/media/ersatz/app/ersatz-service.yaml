apiVersion: v1
kind: Service
metadata:
  name: ersatz-service
  namespace: media
spec:
  # ClusterIP only: ErsatzTV is reached via the internal (LAN-only) gateway's
  # HTTPRoute at https://ersatz.biggs.dog (TLS terminated at the gateway), and
  # by in-cluster consumers (e.g. Emby's Live TV tuner) directly. No LB VIP.
  type: ClusterIP
  selector:
    app: ersatz
  ports:
    - name: ersatz-port
      port: 80
      protocol: TCP
      targetPort: 8409
