apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: bookboss
  name: bookboss
  namespace: media
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: bookboss
  template:
    metadata:
      labels:
        app: bookboss
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      containers:
        - name: bookboss
          image: ghcr.io/szinn/bookboss:v0.8.30
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: BOOKBOSS__FRONTEND__BASE_URL
              value: https://bookboss.biggs.dog
            - name: BOOKBOSS__FRONTEND__LISTEN_IP
              value: "0.0.0.0"
            - name: BOOKBOSS__FRONTEND__LISTEN_PORT
              value: "8080"
            - name: BOOKBOSS__LIBRARY__LIBRARY_PATH
              value: /library
            - name: BOOKBOSS__IMPORT__BOOKDROP_PATH
              value: /nfs-share/epub
            - name: RUST_LOG
              value: "debug"
            - name: BOOKBOSS__DATABASE__DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: bookboss-database-url
                  key: DATABASE_URL
            - name: BOOKBOSS__ENCRYPTION_SECRET
              valueFrom:
                secretKeyRef:
                  name: bookboss-encryption
                  key: encryption_secret
            - name: BOOKBOSS__METADATA__HARDCOVER_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: bookboss-metadata
                  key: HARDCOVER_API_TOKEN
                  optional: true
            - name: BOOKBOSS__METADATA__GOOGLEBOOKS_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: bookboss-metadata
                  key: GOOGLEBOOKS_API_TOKEN
                  optional: true
            # - name: BOOKBOSS__OIDC__CLIENT_ID
            #   valueFrom:
            #     secretKeyRef:
            #       name: bookboss-oidc
            #       key: client_id
            #       optional: true
            # - name: BOOKBOSS__OIDC__CLIENT_SECRET
            #   valueFrom:
            #     secretKeyRef:
            #       name: bookboss-oidc
            #       key: client_secret
            #       optional: true
          volumeMounts:
            - name: bookboss-config
              mountPath: /data
            - name: bookboss-library
              mountPath: /library
            - name: media-nfs
              mountPath: /nfs-share
          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: bookboss-config
          persistentVolumeClaim:
            claimName: bookboss-config-pvc
        - name: bookboss-library
          persistentVolumeClaim:
            claimName: bookboss-library-pvc
        - name: media-nfs
          persistentVolumeClaim:
            claimName: media-nfs-pvc
