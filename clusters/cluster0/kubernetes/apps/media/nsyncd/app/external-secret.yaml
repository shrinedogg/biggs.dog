apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nsyncd-secret
  namespace: media
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-connect  # Replace with your SecretStore/ClusterSecretStore name
    kind: ClusterSecretStore  # or SecretStore if namespace-scoped
  target:
    name: nsyncd-secret
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        id_rsa: "{{ .sshKey }}"
        REMOTE_HOST: "{{ .remoteHost }}"
  data:
    - secretKey: sshKey
      remoteRef:
        key: biggkey  # Replace with your secret path (e.g., nsyncd/ssh-key)
        property: biggkey     # Replace with the property name in your secret store
    - secretKey: remoteHost
      remoteRef:
        key: gregbob-ip  # Replace with your secret path
        property: ip  # Replace with the property name in your secret store
