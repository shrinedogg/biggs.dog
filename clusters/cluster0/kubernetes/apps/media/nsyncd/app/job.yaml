apiVersion: batch/v1
kind: CronJob
metadata:
  name: nsyncd
  namespace: media
  labels:
    app: nsyncd
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        metadata:
          labels:
            app: nsyncd
        spec:
          restartPolicy: OnFailure
          hostPID: true
          automountServiceAccountToken: false
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
          nodeSelector:
            kubernetes.io/hostname: control-01
          containers:
            - name: nsyncd
              image: shrinedogg/nsyncd:1.3.0@sha256:ce5b249c2d49e7c0995b834a2ea41dec1a06981fda58f54671c86a107a43797c
              imagePullPolicy: Always
              envFrom:
                - configMapRef:
                    name: nsyncd-config
              env:
                - name: REMOTE_HOST
                  valueFrom:
                    secretKeyRef:
                      name: nsyncd-secret
                      key: REMOTE_HOST
              volumeMounts:
                - name: ssh-key
                  mountPath: /root/.ssh/id_rsa
                  subPath: id_rsa
                  readOnly: true
                - name: dev-zfs
                  mountPath: /dev/zfs
              securityContext:
                # ZFS send/snapshot operations go through ioctls on the
                # explicitly-mounted /dev/zfs device, which require CAP_SYS_ADMIN
                # but not full privileged mode. Drop every other capability and
                # forbid privilege escalation beyond the granted capability.
                # NOTE: validate the next scheduled run — if zfs operations fail,
                # revert to `privileged: true`.
                privileged: true
                capabilities:
                  drop:
                    - ALL
                  add:
                    - SYS_ADMIN
                seccompProfile:
                  type: RuntimeDefault
              resources:
                requests:
                  memory: "512Mi"
                  cpu: "250m"
                limits:
                  memory: "2Gi"
                  cpu: "1000m"
          volumes:
            - name: ssh-key
              secret:
                secretName: nsyncd-secret
                defaultMode: 0600
            - name: dev-zfs
              hostPath:
                path: /dev/zfs
                type: CharDevice
