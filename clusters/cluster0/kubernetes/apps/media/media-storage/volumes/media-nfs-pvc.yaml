---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-nfs-pvc
  namespace: media
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""  # Empty string to bind to static PV
  volumeName: media-nfs-pv  # Explicitly bind to our PV
  resources:
    requests:
      storage: 116Ti
