apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jitsi
  namespace: jitsi
spec:
  interval: 3m
  chart:
    spec:
      chart: jitsi-meet
      version: 2.20.0
      sourceRef:
        kind: HelmRepository
        name: jitsi
        namespace: flux-system
  values:
    publicURL: "https://jitsi.biggs.dog"
    turnHost: "turn.biggs.dog"
    tz: Europe/Helsinki
    service:
      type: ClusterIP
      port: 80
    websockets:
      colibri:
        enabled: true
      xmpp:
        enabled: true
    enableAuth: true
    enableGuests: false
    web:
      image:
        repository: ghcr.io/jitsi-contrib/hardened-images/web
      service:
        type: ClusterIP
        port: 8000
      livenessProbe:
        httpGet:
          path: /
          port: 8000
      readinessProbe:
        httpGet:
          path: /
          port: 8000
      securityContext:
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 1000
      extraVolumes:
        - name: run
          emptyDir:
            sizeLimit: 32Mi
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
      extraVolumeMounts:
        - name: run
          mountPath: /run
        - name: tmp
          mountPath: /tmp
      ingress:
        enabled: false
    prosody:
      image:
        repository: ghcr.io/jitsi-contrib/hardened-images/prosody
      extraEnvFrom:
        - secretRef:
            name: jitsi-users
      securityContext:
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 1000
      extraVolumes:
        - name: run
          emptyDir:
            sizeLimit: 32Mi
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
        - name: prosody-lib
          emptyDir:
            sizeLimit: 16Mi
        - name: extra-config
          configMap:
            name: prosody-register-configmap
            defaultMode: 0755
      extraVolumeMounts:
        - name: run
          mountPath: /run
        - name: tmp
          mountPath: /tmp
        - name: prosody-lib
          mountPath: /var/lib/prosody
        - name: extra-config
          mountPath: /etc/cont-init.d/15-disable-tls
          subPath: 15-disable-tls
        - name: extra-config
          mountPath: /etc/s6-overlay/scripts/register-custom-users
          subPath: 75-register-custom-users
        - name: extra-config
          mountPath: /etc/s6-overlay/s6-rc.d/75-register-custom-users/type
          subPath: oneshot-type
        - name: extra-config
          mountPath: /etc/s6-overlay/s6-rc.d/75-register-custom-users/up
          subPath: oneshot-up
        - name: extra-config
          mountPath: /etc/s6-overlay/s6-rc.d/75-register-custom-users/dependencies.d/70-register-setup
          subPath: empty
        - name: extra-config
          mountPath: /etc/s6-overlay/s6-rc.d/user/contents.d/75-register-custom-users
          subPath: empty
      persistence:
        enabled: true
        size: 3Gi
        storageClassName: ceph-block
    jicofo:
      image:
        repository: ghcr.io/jitsi-contrib/hardened-images/jicofo
      securityContext:
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 1000
      extraVolumes:
        - name: run
          emptyDir:
            sizeLimit: 32Mi
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
      extraVolumeMounts:
        - name: run
          mountPath: /run
        - name: tmp
          mountPath: /tmp
    jvb:
      image:
        repository: ghcr.io/jitsi-contrib/hardened-images/jvb
      securityContext:
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 1000
      extraVolumes:
        - name: run
          emptyDir:
            sizeLimit: 32Mi
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
      extraVolumeMounts:
        - name: run
          mountPath: /run
        - name: tmp
          mountPath: /tmp
      service:
        enabled: true
        type: LoadBalancer
        externalTrafficPolicy: Cluster
        annotations:
          io.cilium/lb-ipam-ips: "192.168.6.9"
      useInternalStun: true
      publicIPs:
        # WAN IP — external clients connect directly; requires UDM SE port forward UDP 10000 → 192.168.6.9:10000
        - 87.92.48.51
        # LAN service IP — used by Coturn as TURN relay peer to avoid hairpin NAT
        - 192.168.6.9
    coturn:
      enabled: true
      replicaCount: 1
      image:
        repository: coturn/coturn
        tag: "4.14"
      # Preserve the Coturn auth secret so Prosody/Jitsi TURN credentials
      # continue to match after the chart reconciles.
      staticAuth:
        existingSecretName: jitsi-coturn-auth
      # The chart hardcodes tls-listening-port=443 with no override value.
      # Use the custom config escape-hatch to change it to 5349, which does
      # not conflict with the agentgateway (which owns WAN:443).
      # All other lines are identical to the chart-generated defaults.
      custom:
        configs:
          _turnserver_conf: |
            realm=turn.biggs.dog
            listening-port=3478
            listening-ip=0.0.0.0
            log-file=stdout
            use-auth-secret
            no-multicast-peers
            no-cli
            no-loopback-peers
            no-tcp-relay
            no-dtls
            tls-listening-port=5349
            cert=/tls/tls.crt
            pkey=/tls/tls.key
            min-port=50000
            max-port=54999
            denied-peer-ip=0.0.0.0-0.255.255.255
            denied-peer-ip=127.0.0.0-127.255.255.255
            denied-peer-ip=::1
            denied-peer-ip=100.64.0.0-100.127.255.255
            denied-peer-ip=169.254.0.0-169.254.255.255
            denied-peer-ip=10.0.0.0-10.255.255.255
            denied-peer-ip=172.16.0.0-172.31.255.255
            denied-peer-ip=192.168.0.0-192.168.255.255
            denied-peer-ip=192.0.0.0-192.0.0.255
            denied-peer-ip=192.0.2.0-192.0.2.255
            denied-peer-ip=192.88.99.0-192.88.99.255
            denied-peer-ip=198.18.0.0-198.19.255.255
            denied-peer-ip=198.51.100.0-198.51.100.255
            denied-peer-ip=203.0.113.0-203.0.113.255
            denied-peer-ip=240.0.0.0-255.255.255.255
            allowed-peer-ip=10.244.0.0-10.244.255.255
            allowed-peer-ip=192.168.6.0-192.168.6.255
      turns:
        enabled: true
        certificate:
          create: true
          issuerRef:
            name: letsencrypt-prod
            kind: ClusterIssuer
            group: cert-manager.io
      service:
        type: LoadBalancer
        annotations:
          io.cilium/lb-ipam-ips: "192.168.6.10"
          # Registers turn.biggs.dog → 192.168.6.10 in k8s-gateway for internal DNS resolution
          external-dns.alpha.kubernetes.io/hostname: "turn.biggs.dog"
      allowedPeerIPs:
        - "10.244.0.0-10.244.255.255" # pod CIDR
        - "192.168.6.0-192.168.6.255" # service/LAN range — allows relay to JVB LB IP 192.168.6.9
      extraVolumes:
        - name: run
          emptyDir:
            sizeLimit: 32Mi
      extraVolumeMounts:
        - name: run
          mountPath: /var/run
