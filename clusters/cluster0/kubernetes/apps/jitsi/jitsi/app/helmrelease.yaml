apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jitsi
  namespace: jitsi
spec:
  interval: 3m
  chart:
    spec:
      chart: jitsi-meet
      version: 2.15.0
      sourceRef:
        kind: HelmRepository
        name: jitsi
        namespace: flux-system
  values:
    publicURL: "https://jitsi.biggs.dog"
    turnHost: "turn.biggs.dog"
    tz: Europe/Helsinki
    service:
      type: ClusterIP
      port: 80
    websockets:
      colibri:
        enabled: true
      xmpp:
        enabled: true
    enableAuth: true
    enableGuests: false
    web:
      image:
        repository: ghcr.io/jitsi-contrib/hardened-images/web
      securityContext:
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 1000
      extraVolumes:
        - name: run
          emptyDir:
            sizeLimit: 32Mi
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
      extraVolumeMounts:
        - name: run
          mountPath: /run
        - name: tmp
          mountPath: /tmp
      custom:
        defaults:
          _nginx_conf: |
            worker_processes {{ .Env.NGINX_WORKER_PROCESSES | default "4" }};
            pid /run/nginx.pid;
            include /etc/nginx/modules-enabled/*.conf;

            events {
            worker_connections {{ .Env.NGINX_WORKER_CONNECTIONS | default "768" }};
            # multi_accept on;
            }

            http {

            ##
            # Basic Settings
            ##

            sendfile on;
            tcp_nopush on;
            tcp_nodelay on;
            keepalive_timeout {{ .Env.NGINX_KEEPALIVE_TIMEOUT | default "65" }};
            types_hash_max_size 2048;
            variables_hash_bucket_size 128;
            server_tokens off;

            # server_names_hash_bucket_size 64;
            # server_name_in_redirect off;

            client_max_body_size 0;

            {{ if .Env.NGINX_RESOLVER }}
            resolver {{ .Env.NGINX_RESOLVER }};
            {{ end -}}

             include /etc/nginx/mime.types;
            types {
            # add support for the wav MIME type that is requried to playback wav files in Firefox.
            audio/wav wav;
            }
            default_type application/octet-stream;

            ##
            # Logging Settings
            ##
            # Matches any URI or Referer with some matches and redacts the whole
            # query string. log_format and map must be at the http context level.
            map $request_uri $loggable_uri {
            ~^(?P<path>[^?]*)\?.*(?:jwt|token)= "${path}?[params_redacted]";
            default $request_uri;
            }

            map $http_referer $loggable_referer {
            ~^(?P<url>[^?]*)\?.*(?:jwt|token)= "${url}?[params_redacted]";
            default $http_referer;
            }

            log_format jitsi_log '$remote_addr - $remote_user [$time_local] '
            '"$request_method $loggable_uri $server_protocol" '
            '$status $body_bytes_sent "$loggable_referer" "$http_user_agent"';

            access_log /dev/stdout jitsi_log;
            error_log /dev/stderr;

            ##
            # Gzip Settings
            ##

            gzip on;
            gzip_types text/plain text/css application/javascript application/json;
            gzip_vary on;
            gzip_min_length 860;

            ##
            # Connection header for WebSocket reverse proxy
            ##
            map $http_upgrade $connection_upgrade {
            default upgrade;
            '' close;
            }

            ##
            # Virtual Host Configs
            ##
            include /run/web/config/nginx/site-confs/*;
            }


            daemon off;
      ingress:
        enabled: false
    prosody:
      image:
        repository: ghcr.io/jitsi-contrib/hardened-images/prosody
      extraEnvFrom:
        - secretRef:
            name: jitsi-users
      securityContext:
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 1000
      extraVolumes:
        - name: run
          emptyDir:
            sizeLimit: 32Mi
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
        - name: prosody-lib
          emptyDir:
            sizeLimit: 16Mi
        - name: extra-config
          configMap:
            name: prosody-register-configmap
            defaultMode: 0755
      extraVolumeMounts:
        - name: run
          mountPath: /run
        - name: tmp
          mountPath: /tmp
        - name: prosody-lib
          mountPath: /var/lib/prosody
        - name: extra-config
          mountPath: /etc/cont-init.d/15-disable-tls
          subPath: 15-disable-tls
        - name: extra-config
          mountPath: /etc/s6-overlay/scripts/register-custom-users
          subPath: 75-register-custom-users
        - name: extra-config
          mountPath: /etc/s6-overlay/s6-rc.d/75-register-custom-users/type
          subPath: oneshot-type
        - name: extra-config
          mountPath: /etc/s6-overlay/s6-rc.d/75-register-custom-users/up
          subPath: oneshot-up
        - name: extra-config
          mountPath: /etc/s6-overlay/s6-rc.d/75-register-custom-users/dependencies.d/70-register-setup
          subPath: empty
        - name: extra-config
          mountPath: /etc/s6-overlay/s6-rc.d/user/contents.d/75-register-custom-users
          subPath: empty
      persistence:
        enabled: true
        size: 3Gi
        storageClassName: ceph-block
    jicofo:
      image:
        repository: ghcr.io/jitsi-contrib/hardened-images/jicofo
      securityContext:
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 1000
      extraVolumes:
        - name: run
          emptyDir:
            sizeLimit: 32Mi
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
      extraVolumeMounts:
        - name: run
          mountPath: /run
        - name: tmp
          mountPath: /tmp
    jvb:
      image:
        repository: ghcr.io/jitsi-contrib/hardened-images/jvb
      securityContext:
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 1000
      extraVolumes:
        - name: run
          emptyDir:
            sizeLimit: 32Mi
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
      extraVolumeMounts:
        - name: run
          mountPath: /run
        - name: tmp
          mountPath: /tmp
      service:
        enabled: true
        type: LoadBalancer
        externalTrafficPolicy: Cluster
        annotations:
          io.cilium/lb-ipam-ips: "192.168.2.9"
      useInternalStun: true
      publicIPs:
       - 192.168.2.9
    coturn:
      enabled: true
      replicaCount: 1
      image:
        repository: coturn/coturn
        tag: "4.9"
      turns:
        enabled: true
        certificate:
          create: true
          issuerRef:
            name: letsencrypt-prod
            kind: ClusterIssuer
            group: cert-manager.io
      service:
        type: LoadBalancer
        annotations:
          io.cilium/lb-ipam-ips: "192.168.2.10"
      allowedPeerIPs:
        - "10.244.0.0-10.244.255.255"