apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jitsi
  namespace: jitsi
spec:
  interval: 3m
  chart:
    spec:
      chart: jitsi-meet
      version: 2.12.1
      sourceRef:
        kind: HelmRepository
        name: jitsi
        namespace: flux-system
  values:
    publicURL: "https://jitsi.biggs.dog"
    tz: Europe/Helsinki
    service:
      type: ClusterIP
      port: 80
    websockets:
      colibri:
        enabled: false
      xmpp:
        enabled: false
    enableAuth: true
    enableGuests: false
    web:
      image:
        repository: ghcr.io/jitsi-contrib/hardened-images/web
      securityContext:
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 1000
      extraVolumes:
        - name: run
          emptyDir:
            sizeLimit: 32Mi
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
      extraVolumeMounts:
        - name: run
          mountPath: /run
        - name: tmp
          mountPath: /tmp
      ingress:
        enabled: false
    prosody:
      image:
        repository: ghcr.io/jitsi-contrib/hardened-images/prosody
      securityContext:
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 1000
      extraVolumes:
        - name: run
          emptyDir:
            sizeLimit: 32Mi
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
        - name: storage
          emptyDir:
            sizeLimit: 32Mi
      extraVolumeMounts:
        - name: run
          mountPath: /run
        - name: tmp
          mountPath: /tmp
        - name: storage
          mountPath: /var/lib/prosody
      persistence:
        enabled: true
        size: 3Gi
        storageClassName: ceph-block
    jicofo:
      image:
        repository: ghcr.io/jitsi-contrib/hardened-images/jicofo
      securityContext:
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 1000
      extraVolumes:
        - name: run
          emptyDir:
            sizeLimit: 32Mi
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
      extraVolumeMounts:
        - name: run
          mountPath: /run
        - name: tmp
          mountPath: /tmp
    jvb:
      image:
        repository: ghcr.io/jitsi-contrib/hardened-images/jvb
      securityContext:
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 1000
      extraVolumes:
        - name: run
          emptyDir:
            sizeLimit: 32Mi
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
      extraVolumeMounts:
        - name: run
          mountPath: /run
        - name: tmp
          mountPath: /tmp
      # xmpp:
      #   existingSecretName: "jvb-user-password"
      service:
        enabled: true
        type: LoadBalancer
        externalTrafficPolicy: Cluster
        annotations:
          io.cilium/lb-ipam-ips: "192.168.2.9"
      publicIPs:
       - 192.168.2.9