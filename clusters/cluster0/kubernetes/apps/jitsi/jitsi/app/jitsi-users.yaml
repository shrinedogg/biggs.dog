apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
    name: jitsi-users
    namespace: jitsi
spec:
    secretStoreRef:
        kind: ClusterSecretStore
        name: onepassword-connect
    target:
        creationPolicy: Owner
    data:
        - secretKey: JITSI_USERS
          remoteRef:
            key: jitsi-users
            property: users
