# Routes zot.biggs.dog to the zot backend through cluster0-gateway.
# Plain-HTTP backend (no backend-protocol annotation): the gateway is the
# sole TLS terminator, same as dex.
#
# LAN-only name: Cloudflare holds a MANUAL A record zot.biggs.dog ->
# 192.168.2.31 (public zone, private value; never port-forwarded), same
# pattern as omni.biggs.dog.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zot
  namespace: zot
  labels:
    app.kubernetes.io/name: zot
spec:
  hostnames:
    - zot.biggs.dog
  parentRefs:
    - name: cluster0-gateway
      namespace: networking
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: zot
          port: 8080
