apiVersion: v1
kind: Service
metadata:
  name: continuwuity-service
  namespace: matrix
spec:
  selector:
    app: continuwuity
  ports:
    - name: uwu-port
      port: 8080
      protocol: TCP
      targetPort: 8080
    - name: uwu-fed-port
      port: 80
      protocol: TCP
      targetPort: 8080