---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: continuwuity-well-known
  namespace: matrix
spec:
  hostnames:
  - biggs.dog
  parentRefs:
  - name: wildcard-biggs-dog
    namespace: networking
    sectionName: biggs-dog-https
  rules:
  - backendRefs:
    - name: continuwuity-service
      port: 8080
    matches:
    - path:
        type: PathPrefix
        value: /.well-known/matrix