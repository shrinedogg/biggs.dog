# Materialises secret "netbird-client-setup-key" (key: setup-key), consumed by
# the netbird-client DaemonSet as NB_SETUP_KEY for unattended peer registration.
#
# 1Password item required (biggs-dog vault):
#   - netbird-client-setup-key (password) -- a REUSABLE NetBird setup key.
#     Create it in the NetBird dashboard (Peers -> Setup Keys) as a reusable key
#     and assign it to the group that the cluster0 routing peer belongs to. State
#     (/var/lib/netbird) is persisted on a hostPath, so across normal pod
#     restarts the same WireGuard keypair -- and thus the same peer -- is reused
#     without re-registering; the setup key is only consumed on first run or if
#     the node's state dir is wiped. The key does NOT, by itself, make this peer
#     a router: that comes from assigning it as the routing peer for a Network
#     Resource in the dashboard (see daemonset.yaml header).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbird-client-setup-key
  namespace: netbird-client
  labels:
    app.kubernetes.io/name: netbird-client
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: netbird-client-setup-key
    creationPolicy: Owner
  data:
    - secretKey: setup-key
      remoteRef:
        key: netbird-client-setup-key
        property: password
