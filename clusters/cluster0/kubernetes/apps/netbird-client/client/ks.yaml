apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app netbird-client
  namespace: flux-system
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./clusters/cluster0/kubernetes/apps/netbird-client/client/app
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  interval: 3m
  retryInterval: 1m
  timeout: 5m
  dependsOn:
    # ClusterSecretStore (onepassword-connect) must exist for the setup-key
    # ExternalSecret to materialise.
    - name: secretstore
    # The management/signal/relay server it registers against.
    - name: netbird
