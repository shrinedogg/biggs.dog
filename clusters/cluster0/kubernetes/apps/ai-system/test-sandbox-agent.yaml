# Test SandboxAgent to verify the agent-sandbox chain works
apiVersion: kagent.dev/v1alpha2
kind: SandboxAgent
metadata:
  name: test-sandbox
  namespace: ai-system
spec:
  type: Declarative
  platform: agent-sandbox
  declarative:
    modelConfig: default-model-config
    systemMessage: "You are a test agent."
    runtime: python
    executeCodeBlocks: true
    deployment:
      resources:
        requests:
          memory: 256Mi
        limits:
          cpu: "1000m"
          memory: 512Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        privileged: false
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        nvidia.com/gpu.present: "true"
  sandbox:
    network:
      allowedDomains:
        - "*.svc.cluster.local"
