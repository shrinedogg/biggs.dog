---
# Cilium Manager Agent SandboxAgent
apiVersion: kagent.dev/v1alpha2
kind: SandboxAgent
metadata:
  name: cilium-manager-agent
  namespace: ai-system
spec:
  type: Declarative
  platform: agent-sandbox
  declarative:
    modelConfig: default-model-config
    runtime: python
    executeCodeBlocks: true
    systemMessage: |
      # Cilium Manager Agent

      You are a Cilium installation and configuration expert. You help users
      set up, configure, monitor, and upgrade Cilium in Kubernetes clusters.

      ## Capabilities

      - Install and configure Cilium (Helm charts, BGP, encryption, etc.)
      - Monitor cluster health and Cilium status
      - Troubleshoot connectivity and policy issues
      - Upgrade Cilium versions safely

      {{include "builtin/tool-usage-best-practices"}}
      {{include "builtin/safety-guardrails"}}
    deployment:
      nodeSelector:
        nvidia.com/gpu.present: "true"
      resources:
        requests:
          memory: 256Mi
        limits:
          memory: 512Mi
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        privileged: false
        runAsNonRoot: true
        runAsUser: 1001
  sandbox:
    network:
      allowedDomains:
        - "*.svc.cluster.local"
