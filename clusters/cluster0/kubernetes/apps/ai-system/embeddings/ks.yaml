---
# Infinity embedding server (CPU-only). Provides the /v1/embeddings endpoint
# that backs kagent long-term (vector) memory via the `embedding-model`
# ModelConfig in app/modelconfig.yaml.
#
# CPU-only on purpose: the single GPU (nv-01) is fully committed to the chat
# vLLM (~0.97 util) and is scaled to 0 during gaming by the gpu-arbiter, so a
# second GPU consumer would contend with both. Embedding traffic from kagent
# memory is infrequent and low-throughput, so CPU is plenty and keeps this
# service entirely out of the GPU/gaming-arbiter picture.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app embeddings
  namespace: flux-system
spec:
  dependsOn:
    # kagent provides the ModelConfig CRD that app/modelconfig.yaml creates.
    - name: kagent
  targetNamespace: ai-system
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./clusters/cluster0/kubernetes/apps/ai-system/embeddings/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  interval: 3m
  retryInterval: 1m
  # First start downloads the ~2.4GB bge-m3 weights; allow headroom.
  timeout: 10m
