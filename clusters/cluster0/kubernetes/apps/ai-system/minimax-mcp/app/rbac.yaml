---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: minimax-mcp-sa
  namespace: ai-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: minimax-mcp-role
  namespace: ai-system
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: minimax-mcp-rb
  namespace: ai-system
subjects:
  - kind: ServiceAccount
    name: minimax-mcp-sa
    namespace: ai-system
roleRef:
  kind: Role
  name: minimax-mcp-role
  apiGroup: rbac.authorization.k8s.io
