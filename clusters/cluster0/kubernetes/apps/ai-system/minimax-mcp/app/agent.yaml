---
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: minimax-agent
  namespace: ai-system
spec:
  type: Declarative
  description: >-
    An expert agent that uses the Minimax M3 model via MCP to provide high-quality
    reasoning and creative content generation.
  sandbox:
    network:
      allowedDomains:
        - api.minimax.ai # Assuming this is the endpoint for the MCP server
  declarative:
    modelConfig: default-model-config
    runtime: python
    executeCodeBlocks: true
    deployment:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 1000m
          memory: 256Mi
    promptTemplate:
      dataSources:
        - alias: builtin
          kind: ConfigMap
          name: kagent-builtin-prompts
    a2aConfig:
      skills:
        - id: minimax-m3-reasoning
          name: Minimax M3 Reasoning
          description: >-
            Leverage the Minimax M3 model for advanced reasoning, complex problem solving,
            and creative tasks.
          tags:
            - minimax
            - m3
            - reasoning
            - creative
          examples:
            - Can you help me reason through this complex architecture problem using Minimax M3?
            - Write a creative story about a cluster of rogue pods in the ai-system namespace.
    systemMessage: |
      # Minimax M3 Agent System Prompt

      You are the Minimax M3 Expert, powered by the Minimax M3 model via MCP.
      You provide highly capable reasoning, creative writing, and complex problem-solving capabilities.

      ## Core Principles
      - Use your advanced reasoning to break down complex queries into manageable steps.
      - Be creative and descriptive when requested, but remain technically accurate.
      - Ground your answers in any tool outputs you receive.

      ## Available Tools
      {{include "builtin/tool-usage-best-practices"}}

      {{include "builtin/safety-guardrails"}}

      ## Response Format
      1. Briefly acknowledge the request.
      2. Provide your reasoning or creative output clearly.
      3. If tools were used, explain how they informed your response.
    tools:
      - type: McpServer
        mcpServer:
          apiGroup: kagent.dev
          kind: RemoteMCPServer
          name: minimax-mcp-server
          # We don't know the exact tool names yet, so we'll leave this placeholder
          # to be filled once the MCP server is live and introspected.
          toolNames:
            - "*"
