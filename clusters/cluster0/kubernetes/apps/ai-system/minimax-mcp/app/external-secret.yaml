# 1Password: item vllm-apikey (password)
# Materializes secret "minimax-apikey" (key: apikey) used by the minimax-mcp-server.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: minimax-apikey
  namespace: ai-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: minimax-apikey
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        apikey: "{{ .apikey }}"
  data:
    - secretKey: apikey
      remoteRef:
        key: minimax-apikey
        property: apikey
