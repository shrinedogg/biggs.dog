# 1Password: item vllm-api-key (password)
# Materializes secret "minimax-api-key" (key: api-key) used by the minimax-mcp-server.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: minimax-api-key
  namespace: ai-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: minimax-api-key
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        api-key: "{{ .apikey }}"
  data:
    - secretKey: api-key
      remoteRef:
        key: minimax-api-key
        property: apikey
