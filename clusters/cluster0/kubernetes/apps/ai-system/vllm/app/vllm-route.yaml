---
# External HTTPS route for the vLLM OpenAI-compatible API.
# Exposes /v1/* at vllm.biggs.dog for Zed AI, Open WebUI, or any
# OpenAI-SDK client pointing at the local LLM.
#
# Authentication: vLLM enforces --api-key on all /v1/* endpoints;
# clients must send:  Authorization: Bearer <VLLM_API_KEY>
#
# Retrieve the key (run once, add to your client config):
#   kubectl -n ai-system get secret kagent-vllm \
#     -o jsonpath='{.data.VLLM_API_KEY}' | base64 -d
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vllm
  namespace: ai-system
spec:
  hostnames:
    - vllm.biggs.dog
  parentRefs:
    - name: wildcard-biggs-dog
      namespace: networking
  rules:
    - backendRefs:
        - name: vllm
          port: 8000
      matches:
        - path:
            type: PathPrefix
            value: /
      # LLM completions at 256K context can run for minutes; set a
      # generous timeout (600 s = 10 min) beyond the gateway default.
      timeouts:
        request: 600s
        backendRequest: 600s
