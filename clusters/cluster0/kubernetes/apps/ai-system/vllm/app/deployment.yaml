---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: ai-system
  labels:
    app: vllm
spec:
  # replicas is intentionally OMITTED: the gpu-arbiter
  # (clusters/cluster0/kubernetes/apps/dreamcast/gpu-arbiter) owns this
  # Deployment's replica count, scaling it to 0 during Wolf gaming sessions and
  # back to 1 afterward. Declaring replicas here would make Flux fight the
  # arbiter on every reconcile. Unmanaged, a Deployment defaults to 1 replica,
  # so the idle state is a single vLLM.
  # Weights live on a RWO host-path volume on nv-01; never run two at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      # The Service is named "vllm", so Kubernetes injects legacy service-link
      # env vars (e.g. VLLM_PORT=tcp://<ip>:8000) that collide with vLLM's own
      # VLLM_PORT config and crash the engine. Disable the injection.
      enableServiceLinks: false
      # Pin to the single RTX 5090 node.
      nodeSelector:
        kubernetes.io/hostname: nv-01
      # Short grace so vLLM RELEASES VRAM fast when the gpu-arbiter scales it to
      # 0 for a gaming session: the gaming pod is held by a scheduling gate until
      # VRAM is free, and direwolf reaps the session after 60s, so vLLM must let
      # go well before then. vLLM is stateless (weights on the PVC), so a quick
      # SIGTERM/SIGKILL is fine; it reloads on scale-up.
      terminationGracePeriodSeconds: 10
      containers:
        - name: vllm
          # CUDA 12.9 build supports the 5090 (Blackwell, sm_120).
          image: docker.io/vllm/vllm-openai:v0.23.0
          args:
            # ----------------------------------------------------------------
            # MODEL: NVIDIA's NVFP4 quant of Alibaba's Qwen3.6-35B-A3B, served
            # per the model card's vLLM command:
            #   https://huggingface.co/nvidia/Qwen3.6-35B-A3B-NVFP4
            # A 35B MoE with only ~3B active params (fast), ~19B on disk (NVFP4
            # ~3x smaller than BF16), Mamba-hybrid attention, and 262K native
            # context -- most layers keep bounded KV, making long context cheap
            # on this 32 GB card. NVFP4 needs Blackwell (nv-01's RTX 5090,
            # sm_120). The checkpoint is multimodal (text/image/video) but we
            # serve text-only for kagent (see --limit-mm-per-prompt below).
            # NOTE: NVIDIA serves this with vllm/vllm-openai:nightly; we pin a
            # release below. If v0.23.0 lacks qwen3_5_moe arch or the qwen3_xml
            # tool parser, bump the image tag (or use :nightly).
            # --served-model-name must match the kagent HelmRelease provider.
            # ----------------------------------------------------------------
            - --model=nvidia/Qwen3.6-35B-A3B-NVFP4
            # served-model-name is intentionally different from --model:
            # the slash in the HuggingFace path (nvidia/) gets stripped by some
            # clients (e.g. Zed), causing 404s. A slash-free alias fixes all
            # clients; kagent and Zed both use this name, not the weights path.
            - --served-model-name=qwen36-local
            # Explicit per the model card (vLLM also auto-detects modelopt's
            # NVFP4 config, but the card serves with this flag set).
            - --quantization=modelopt
            # fp8 KV cache + hybrid attention keep the KV pool small even at
            # long context.
            - --kv-cache-dtype=fp8
            # 131K context. The model's native max is 262K, but at 262K the KV
            # pool (~838K tokens on this 32 GB card) only covers ~3.2 concurrent
            # full-context requests, so high concurrency KV-exhausts/preempts.
            # 131K doubles that to ~6.4x while staying well above flux-agent's
            # ~64K tool-schema need. Raise back toward 262K only if you also drop
            # max-num-seqs.
            - --max-model-len=131072
            # nv-01 is a headless Talos node with a DEDICATED GPU; usable util
            # caps near 0.984. 0.95 leaves headroom for the larger 35B/~19B-on-
            # disk weights (vs Gemma's 14B). Raise toward 0.98 once stable; drop
            # if boot OOMs.
            - --gpu-memory-utilization=0.95
            # Per-step token budget for (chunked) prefill + decode. Raised 4096 ->
            # 8192 so cold large-context prefills (e.g. flux-agent's ~64K tool
            # schemas before the prefix cache warms) process in ~half the steps,
            # cutting TTFT on agent bursts. Measured: prefix-cache hit ~84% and
            # KV peaked only ~26% at a 16-way 62K-token burst, so the extra
            # per-step activation memory is well within budget.
            - --max-num-batched-tokens=8192
            # 64-way concurrency (matches the benchmark sweep + smooths agent
            # fan-out). At 131K max-model-len the ~838K-token KV pool covers
            # ~6.4 full-context reqs; the benchmark's short reqs fit far more.
            # Keep capture-size == max-num-seqs; lower both if CUDA-graph capture
            # OOMs at boot.
            - --max-num-seqs=64
            - --max-cudagraph-capture-size=64
            - --enable-prefix-caching
            # Qwen3.6 hybrid-MoE may ship custom modeling code; the model card's
            # DGX command sets trust-remote-code. NOTE: executes repo Python.
            - --trust-remote-code
            # Qwen3.6 tool-call + reasoning parsers, per the NVIDIA model card
            # (tool parser is qwen3_xml, paired with the model's chat template).
            - --enable-auto-tool-choice
            - --tool-call-parser=qwen3_xml
            - --reasoning-parser=qwen3
            # Text-only kagent traffic; forbid image/video on this multimodal
            # model to skip the vision encoder + multimodal profiling.
            - '--limit-mm-per-prompt={"image":0,"video":0}'
            # Keep port 8000 to match the Service and the kagent provider baseUrl.
            - --host=0.0.0.0
            - --port=8000
          env:
            - name: HF_HOME
              value: /models
            # Secures the OpenAI-compatible endpoint; kagent sends the same key.
            - name: VLLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: kagent-vllm
                  key: VLLM_API_KEY
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          resources:
            requests:
              cpu: "2"
              memory: 16Gi
              nvidia.com/gpu: 1
            limits:
              # Consumes the last of the 4 time-sliced nvidia.com/gpu replicas.
              nvidia.com/gpu: 1
          startupProbe:
            httpGet:
              path: /health
              port: http
            # First boot downloads weights; allow up to ~30 min.
            periodSeconds: 15
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
          volumeMounts:
            - name: models
              mountPath: /models
            # vLLM needs a large shared-memory segment for NCCL/IPC.
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: vllm-models
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
