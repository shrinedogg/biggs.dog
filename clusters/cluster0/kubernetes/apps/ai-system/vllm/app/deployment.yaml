---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: ai-system
  labels:
    app: vllm
spec:
  replicas: 1
  # Weights live on a RWO host-path volume on nv-01; never run two at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      # The Service is named "vllm", so Kubernetes injects legacy service-link
      # env vars (e.g. VLLM_PORT=tcp://<ip>:8000) that collide with vLLM's own
      # VLLM_PORT config and crash the engine. Disable the injection.
      enableServiceLinks: false
      # Pin to the single RTX 5090 node.
      nodeSelector:
        kubernetes.io/hostname: nv-01
      terminationGracePeriodSeconds: 60
      containers:
        - name: vllm
          # CUDA 12.9 build supports the 5090 (Blackwell, sm_120).
          image: docker.io/vllm/vllm-openai:v0.23.0
          args:
            # ----------------------------------------------------------------
            # MODEL: NeuralNet-Hub NVFP4 build of Qwen3.6-27B, served per its
            # model card's recommended vLLM config:
            #   https://huggingface.co/NeuralNet-Hub/Qwen3.6-27B-NVFP4
            # NVFP4 requires Blackwell (sm_100+); nv-01's RTX 5090 (sm_120,
            # 32 GB) qualifies. We keep the card's useful settings (NVFP4 auto-
            # detect, fp8 KV cache, parsers, thinking off) but TUNE FOR 32 GB
            # while keeping CUDA graphs ENABLED: the levers below (small
            # max-num-seqs, matching capture-size cap, fp8 KV, lower context +
            # util) shrink both the KV pool and the graph-capture footprint so
            # capture has room. Earlier capture OOMs used vLLM's large defaults
            # (200 seqs / ~512 capture) with no fp8 KV cache. --served-model-
            # name must match the kagent HelmRelease provider.
            # ----------------------------------------------------------------
            - --model=NeuralNet-Hub/Qwen3.6-27B-NVFP4
            - --served-model-name=NeuralNet-Hub/Qwen3.6-27B-NVFP4
            # Card-recommended dtype/KV-cache. NOTE: the card's
            # `--quantization nvfp4` is WRONG for this checkpoint -- its config
            # declares quantization_config=compressed-tensors, and vLLM rejects
            # the mismatch at startup. Omitting --quantization lets vLLM
            # auto-detect compressed-tensors, which still selects the NVFP4
            # kernel (FlashInferCutlassNvFp4LinearKernel), so we get FP4 either
            # way. Do NOT re-add --quantization here.
            - --dtype=bfloat16
            - --kv-cache-dtype=fp8
            # 80K context (effective ~80K after vLLM's architecture-driven
            # auto-reduction of ~4.3%). Raised from 64K to give heavy agents
            # (e.g. flux-agent, observability-agent) ample room for their
            # large system prompts + tool schemas + output. fp8 KV cache
            # keeps the memory cost manageable on this 32 GB card.
            - --max-model-len=83584
            # nv-01 is a headless Talos node with a DEDICATED GPU -- no
            # desktop/OS holding VRAM -- so we can push utilization high.
            # vLLM v0.23.0 reserves CUDA-graph capture memory UP FRONT (graph
            # memory profiling), then sizes the KV pool from what's left, so
            # raising util feeds the KV pool without risking a capture OOM.
            # History: 0.85 → no cache blocks; 0.92 → 0.33 GiB KV (short);
            # 0.97 → 1.90 GiB KV (working). Hard ceiling: the CUDA driver
            # context consumes ~500 MB before vLLM starts, leaving only
            # 30.86/31.36 GiB free at boot (ceiling = 0.984). 0.99 exceeded
            # that and errored; 0.98 × 31.36 = 30.73 GiB clears it with
            # margin and yields ~2.21 GiB KV -- enough for the 83K window.
            # If it OOMs, fall back to --enforce-eager.
            - --gpu-memory-utilization=0.98
            - --max-num-batched-tokens=4096
            # KEY to fitting graphs on 32 GB: kagent is single-user, so cap
            # concurrency at 8. This bounds the batch sizes vLLM captures (and
            # therefore capture memory) far below the card's 200/209. Keep
            # max-cudagraph-capture-size == max-num-seqs so nothing larger is
            # captured.
            - --max-num-seqs=8
            - --max-cudagraph-capture-size=8
            - --enable-prefix-caching
            # Qwen3.6 ships custom modeling code (model_type qwen3_5); the card
            # requires trust-remote-code. NOTE: this executes repo-provided
            # Python from the checkpoint -- acceptable only for trusted models.
            - --trust-remote-code
            # Thinking disabled (card's config.yaml does the same): kagent only
            # needs tool calls, and reasoning traces would just add latency.
            - '--default-chat-template-kwargs={"enable_thinking": false}'
            - --reasoning-parser=qwen3
            # Required for kagent tool calling; this checkpoint emits
            # Qwen3-Coder XML tool calls, matching the card's parser choice.
            - --enable-auto-tool-choice
            - --tool-call-parser=qwen3_coder
            # DEVIATION (workload + memory): the card leaves vision enabled,
            # but kagent traffic is text-only. Forbidding image/video skips the
            # multimodal profiling + encoder cache, reclaiming the slim margin
            # on a "barely fits" 48 GB budget at no functional cost here.
            - '--limit-mm-per-prompt={"image":0,"video":0}'
            # DEVIATION: card uses port 18000; keep 8000 to match the Service
            # and the kagent provider baseUrl.
            - --host=0.0.0.0
            - --port=8000
          env:
            - name: HF_HOME
              value: /models
            # Secures the OpenAI-compatible endpoint; kagent sends the same key.
            - name: VLLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: kagent-vllm
                  key: VLLM_API_KEY
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          resources:
            requests:
              cpu: "2"
              memory: 16Gi
              nvidia.com/gpu: 1
            limits:
              # Consumes the last of the 4 time-sliced nvidia.com/gpu replicas.
              nvidia.com/gpu: 1
          startupProbe:
            httpGet:
              path: /health
              port: http
            # First boot downloads weights; allow up to ~30 min.
            periodSeconds: 15
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
          volumeMounts:
            - name: models
              mountPath: /models
            # vLLM needs a large shared-memory segment for NCCL/IPC.
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: vllm-models
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
