---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: ai-system
  labels:
    app: vllm
spec:
  replicas: 1
  # Weights live on a RWO host-path volume on nv-01; never run two at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      # The Service is named "vllm", so Kubernetes injects legacy service-link
      # env vars (e.g. VLLM_PORT=tcp://<ip>:8000) that collide with vLLM's own
      # VLLM_PORT config and crash the engine. Disable the injection.
      enableServiceLinks: false
      # Pin to the single RTX 5090 node.
      nodeSelector:
        kubernetes.io/hostname: nv-01
      terminationGracePeriodSeconds: 60
      containers:
        - name: vllm
          # CUDA 12.9 build supports the 5090 (Blackwell, sm_120).
          image: docker.io/vllm/vllm-openai:v0.23.0
          args:
            # ----------------------------------------------------------------
            # MODEL: NVFP4 (4-bit) Qwen3.6-27B. The RTX 5090 (Blackwell,
            # sm_120) has native FP4 Tensor Cores; this is an experiment to
            # confirm vLLM v0.23.0 actually engages an FP4 kernel on sm_120
            # (rather than silently falling back) and that it's beneficial.
            # Quantization is intentionally NOT pinned here: vLLM auto-detects
            # it from the checkpoint's quantization_config. Verify the FP4
            # kernel selection + throughput in the startup logs; if it falls
            # back / is slower, revert to the cyankiwi/Qwen3.6-27B-AWQ-INT4
            # (compressed-tensors INT4, ~15 GB) build.
            # --served-model-name must match the kagent HelmRelease provider.
            # ----------------------------------------------------------------
            - --model=unsloth/Qwen3.6-27B-NVFP4
            - --served-model-name=unsloth/Qwen3.6-27B-NVFP4
            # Vision disabled (text-only kagent traffic). --enforce-eager is
            # intentionally NOT set: this is a hybrid GDN linear-attention
            # model whose conv1d/gating/delta-rule Triton kernels were being
            # JIT-compiled *during inference* under eager mode, causing big
            # first-request latency spikes (and agent timeouts). Letting vLLM
            # warm up + capture CUDA graphs at startup moves that cost off the
            # hot path. CUDA-graph capture needs spare VRAM, so memory util is
            # held at 0.80 (capture OOM'd at 0.90 with only ~759 MiB free on the
            # 32 GB card). KV cache at 0.80/32k is still ample for single-user
            # agent traffic; nudge back toward 0.85 for more cache if capture
            # has headroom. If capture still OOMs/fails, re-add --enforce-eager.
            - --max-model-len=32768
            - --gpu-memory-utilization=0.80
            # kagent only sends text. Qwen3.6 is multimodal-only, so we can't
            # drop the vision weights, but forbidding image/video inputs skips
            # the multimodal profiling + encoder cache (frees several GB).
            - '--limit-mm-per-prompt={"image":0,"video":0}'
            # Required for kagent tool calling. This NVFP4 checkpoint emits
            # Qwen3-Coder-style XML tool calls (<function=..><parameter=..>),
            # NOT hermes JSON, so it needs the qwen3_coder parser. (The old
            # cyankiwi INT4 build used hermes; the two ship different chat
            # templates.) If kagent tool calls still fail, check the vLLM logs
            # for parser errors and confirm the format against the model's
            # tokenizer_config chat template.
            - --enable-auto-tool-choice
            - --tool-call-parser=qwen3_coder
            - --host=0.0.0.0
            - --port=8000
          env:
            - name: HF_HOME
              value: /models
            # Secures the OpenAI-compatible endpoint; kagent sends the same key.
            - name: VLLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: kagent-vllm
                  key: VLLM_API_KEY
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          resources:
            requests:
              cpu: "2"
              memory: 16Gi
              nvidia.com/gpu: 1
            limits:
              # Consumes the last of the 4 time-sliced nvidia.com/gpu replicas.
              nvidia.com/gpu: 1
          startupProbe:
            httpGet:
              path: /health
              port: http
            # First boot downloads weights; allow up to ~30 min.
            periodSeconds: 15
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
          volumeMounts:
            - name: models
              mountPath: /models
            # vLLM needs a large shared-memory segment for NCCL/IPC.
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: vllm-models
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
