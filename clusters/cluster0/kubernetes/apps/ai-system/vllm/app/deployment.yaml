---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: ai-system
  labels:
    app: vllm
spec:
  replicas: 1
  # Weights live on a RWO host-path volume on nv-01; never run two at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      # The Service is named "vllm", so Kubernetes injects legacy service-link
      # env vars (e.g. VLLM_PORT=tcp://<ip>:8000) that collide with vLLM's own
      # VLLM_PORT config and crash the engine. Disable the injection.
      enableServiceLinks: false
      # Pin to the single RTX 5090 node.
      nodeSelector:
        kubernetes.io/hostname: nv-01
      terminationGracePeriodSeconds: 60
      containers:
        - name: vllm
          # CUDA 12.9 build supports the 5090 (Blackwell, sm_120).
          image: docker.io/vllm/vllm-openai:v0.23.0
          args:
            # ----------------------------------------------------------------
            # MODEL: NeuralNet-Hub NVFP4 build of Qwen3.6-27B, served per its
            # model card's recommended vLLM config:
            #   https://huggingface.co/NeuralNet-Hub/Qwen3.6-27B-NVFP4
            # NVFP4 requires Blackwell (sm_100+); nv-01's 48 GB Blackwell card
            # qualifies. The card's full config barely fits in 48 GB, so we run
            # it as-recommended except: context is lowered (kagent needs
            # nowhere near 256K) for comfortable VRAM headroom, plus port and
            # vision-off deviations flagged below. --served-model-name must
            # match the kagent HelmRelease provider.
            # ----------------------------------------------------------------
            - --model=NeuralNet-Hub/Qwen3.6-27B-NVFP4
            - --served-model-name=NeuralNet-Hub/Qwen3.6-27B-NVFP4
            # Card-recommended quantization/dtype/KV-cache.
            - --quantization=nvfp4
            - --dtype=bfloat16
            - --kv-cache-dtype=fp8
            # DEVIATION: card recommends 262144 (256K). kagent prompts (system
            # prompt + tool schemas + tool results) never approach that, so we
            # cap at 64K. This is the single biggest VRAM lever -- it turns the
            # card's "barely fits" 256K KV cache into a comfortable margin while
            # still allowing large tool outputs (k8s manifests, logs).
            - --max-model-len=65536
            # Card value. With the smaller context above there's now real
            # headroom on 48 GB; if CUDA-graph capture still OOMs, drop to 0.90.
            - --gpu-memory-utilization=0.95
            # Card-recommended throughput + bounded graph-capture knobs.
            - --max-num-batched-tokens=4096
            - --max-num-seqs=200
            - --max-cudagraph-capture-size=209
            - --enable-prefix-caching
            # Qwen3.6 ships custom modeling code (model_type qwen3_5); the card
            # requires trust-remote-code. NOTE: this executes repo-provided
            # Python from the checkpoint -- acceptable only for trusted models.
            - --trust-remote-code
            # Thinking disabled (card's config.yaml does the same): kagent only
            # needs tool calls, and reasoning traces would just add latency.
            - '--default-chat-template-kwargs={"enable_thinking": false}'
            - --reasoning-parser=qwen3
            # Required for kagent tool calling; this checkpoint emits
            # Qwen3-Coder XML tool calls, matching the card's parser choice.
            - --enable-auto-tool-choice
            - --tool-call-parser=qwen3_coder
            # DEVIATION (workload + memory): the card leaves vision enabled,
            # but kagent traffic is text-only. Forbidding image/video skips the
            # multimodal profiling + encoder cache, reclaiming the slim margin
            # on a "barely fits" 48 GB budget at no functional cost here.
            - '--limit-mm-per-prompt={"image":0,"video":0}'
            # DEVIATION: card uses port 18000; keep 8000 to match the Service
            # and the kagent provider baseUrl.
            - --host=0.0.0.0
            - --port=8000
          env:
            - name: HF_HOME
              value: /models
            # Secures the OpenAI-compatible endpoint; kagent sends the same key.
            - name: VLLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: kagent-vllm
                  key: VLLM_API_KEY
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          resources:
            requests:
              cpu: "2"
              memory: 16Gi
              nvidia.com/gpu: 1
            limits:
              # Consumes the last of the 4 time-sliced nvidia.com/gpu replicas.
              nvidia.com/gpu: 1
          startupProbe:
            httpGet:
              path: /health
              port: http
            # First boot downloads weights; allow up to ~30 min.
            periodSeconds: 15
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
          volumeMounts:
            - name: models
              mountPath: /models
            # vLLM needs a large shared-memory segment for NCCL/IPC.
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: vllm-models
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
