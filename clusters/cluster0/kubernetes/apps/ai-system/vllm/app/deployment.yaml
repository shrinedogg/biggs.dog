---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: ai-system
  labels:
    app: vllm
spec:
  # replicas is intentionally OMITTED: the gpu-arbiter
  # (clusters/cluster0/kubernetes/apps/dreamcast/gpu-arbiter) owns this
  # Deployment's replica count, scaling it to 0 during Wolf gaming sessions and
  # back to 1 afterward. Declaring replicas here would make Flux fight the
  # arbiter on every reconcile. Unmanaged, a Deployment defaults to 1 replica,
  # so the idle state is a single vLLM.
  # Weights live on a RWO host-path volume on nv-01; never run two at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      # The Service is named "vllm", so Kubernetes injects legacy service-link
      # env vars (e.g. VLLM_PORT=tcp://<ip>:8000) that collide with vLLM's own
      # VLLM_PORT config and crash the engine. Disable the injection.
      enableServiceLinks: false
      # Pin to the single RTX 5090 node.
      nodeSelector:
        kubernetes.io/hostname: nv-01
      terminationGracePeriodSeconds: 60
      containers:
        - name: vllm
          # CUDA 12.9 build supports the 5090 (Blackwell, sm_120).
          image: docker.io/vllm/vllm-openai:v0.23.0
          args:
            # ----------------------------------------------------------------
            # MODEL: NVIDIA's NVFP4 quant of Google's Gemma-4-26B-A4B-IT, served
            # per the model card's vLLM command:
            #   https://huggingface.co/nvidia/Gemma-4-26B-A4B-NVFP4
            # Replaces the oversized NeuralNet-Hub/Qwen3.6-27B-NVFP4 (a 48 GB-
            # class quant its author only ran on 48 GB). This is a 26B MoE with
            # only ~3.8B active params (fast), 14B on disk, and 256K native
            # context using HYBRID sliding-window (1024) + global attention --
            # most layers keep bounded KV, making long context cheap on this
            # 32 GB card. NVFP4 needs Blackwell (nv-01's RTX 5090, sm_120).
            # --served-model-name must match the kagent HelmRelease provider.
            # ----------------------------------------------------------------
            - --model=nvidia/Gemma-4-26B-A4B-NVFP4
            - --served-model-name=nvidia/Gemma-4-26B-A4B-NVFP4
            # No --quantization: vLLM auto-detects the NVFP4 modelopt config.
            # fp8 KV cache + sliding-window attention keep the KV pool small
            # even at long context.
            - --kv-cache-dtype=fp8
            # 256K context (the model's native max). The 14B weights + fp8 KV
            # + sliding-window attention (most layers bounded at 1024 tokens)
            # leave ample room on 32 GB for the full window. Lower if it OOMs.
            - --max-model-len=262144
            # nv-01 is a headless Talos node with a DEDICATED GPU; the CUDA
            # driver context caps usable util near 0.984. 0.98 maximizes the KV
            # pool while staying just under that ceiling. If boot OOMs, drop
            # back toward 0.95.
            - --gpu-memory-utilization=0.98
            - --max-num-batched-tokens=4096
            # KV peaked at only ~20% under real agent load, so there's ample
            # headroom for concurrency. Raised to 64 to smooth TTFT tails when
            # many agents fan out at once and to allow high-throughput
            # benchmarking. Keep capture-size == max-num-seqs; if CUDA-graph
            # capture OOMs at boot (more batch sizes captured = more memory),
            # lower both.
            - --max-num-seqs=64
            - --max-cudagraph-capture-size=64
            - --enable-prefix-caching
            # Gemma-4 ships custom modeling code; the card requires
            # trust-remote-code. NOTE: executes repo-provided Python.
            - --trust-remote-code
            # Gemma-4 tool-call + reasoning parsers, per the NVIDIA card
            # (replaces the Qwen qwen3_coder/qwen3 parsers).
            - --enable-auto-tool-choice
            - --tool-call-parser=gemma4
            - --reasoning-parser=gemma4
            # Text-only kagent traffic; forbid image/video on this multimodal
            # model to skip the vision encoder + multimodal profiling.
            - '--limit-mm-per-prompt={"image":0,"video":0}'
            # Keep port 8000 to match the Service and the kagent provider baseUrl.
            - --host=0.0.0.0
            - --port=8000
          env:
            - name: HF_HOME
              value: /models
            # Secures the OpenAI-compatible endpoint; kagent sends the same key.
            - name: VLLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: kagent-vllm
                  key: VLLM_API_KEY
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          resources:
            requests:
              cpu: "2"
              memory: 16Gi
              nvidia.com/gpu: 1
            limits:
              # Consumes the last of the 4 time-sliced nvidia.com/gpu replicas.
              nvidia.com/gpu: 1
          startupProbe:
            httpGet:
              path: /health
              port: http
            # First boot downloads weights; allow up to ~30 min.
            periodSeconds: 15
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
          volumeMounts:
            - name: models
              mountPath: /models
            # vLLM needs a large shared-memory segment for NCCL/IPC.
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: vllm-models
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
