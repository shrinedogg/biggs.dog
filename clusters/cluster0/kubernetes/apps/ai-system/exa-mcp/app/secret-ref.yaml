---
# Exa API key — managed via External Secrets + 1Password.
#
# 1Password item required (biggs-dog vault): exa-api-key
#   password — your Exa API key from https://exa.com/
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: exa-api-key
  namespace: ai-system
  labels:
    app.kubernetes.io/name: exa-mcp
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: exa-api-key
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: exa-api-key
        property: password
