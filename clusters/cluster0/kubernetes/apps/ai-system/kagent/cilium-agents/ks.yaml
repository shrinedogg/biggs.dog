---
# Cilium agents — standalone Agent manifests with full tool lists including
# k8s tools. Not Helm-managed (Helm agents have fixed tool lists).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cilium-agents
  namespace: flux-system
spec:
  dependsOn:
    - name: kagent # CRDs + controller + RemoteMCPServer all come from this HelmRelease
  interval: 3m
  path: ./clusters/cluster0/kubernetes/apps/ai-system/kagent/cilium-agents
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 5m
  wait: false
