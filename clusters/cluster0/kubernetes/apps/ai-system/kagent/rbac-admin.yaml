---
# ClusterRole to give kagent cilium agents full read access to the cluster
# This enables the k8s_get_resources and k8s_describe_resource tools to work
# across all namespaces.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kagent-cilium-admin
  labels:
    app.kubernetes.io/managed-by: kagent
rules:
  # Full read access to all resources across all namespaces
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  # Core API group (nodes, events, etc.)
  - nonResourceURLs: ["*"]
    verbs: ["get"]
---
# Bind the ClusterRole to the kagent service account used by cilium agents
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kagent-cilium-admin
  labels:
    app.kubernetes.io/managed-by: kagent
subjects:
  - kind: ServiceAccount
    name: kagent-cilium-debug-agent  # agent pods use this SA pattern
    namespace: ai-system
  - kind: ServiceAccount
    name: kagent-cilium-policy-agent
    namespace: ai-system
---
# Also bind for all kagent-managed agents that might need cluster-wide reads
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kagent-admin-readers
  labels:
    app.kubernetes.io/managed-by: kagent
subjects:
  - kind: Group
    name: system:serviceaccounts:ai-system
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: kagent-cilium-admin
  apiGroup: rbac.authorization.k8s.io
