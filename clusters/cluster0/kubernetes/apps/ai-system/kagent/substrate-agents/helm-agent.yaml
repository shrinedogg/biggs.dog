---
# helm-agent — SandboxAgent on substrate (gVisor actor).
# Replaces the chart-managed helm-agent Agent CR.
apiVersion: kagent.dev/v1alpha2
kind: SandboxAgent
metadata:
  name: helm-agent
  namespace: ai-system
spec:
  type: Declarative
  description: >-
    Helm expert AI agent specializing in using Helm for Kubernetes cluster
    management and operations.
  platform: substrate
  substrate:
    workerPoolRef:
      name: kagent-default
  declarative:
    runtime: go
    modelConfig: default-model-config
    systemMessage: |
      # Helm AI Agent

      You are a Helm expert specializing in Helm release management,
      troubleshooting, and operations. You have access to Helm tools
      and Kubernetes resource inspection tools.

      ## Available Tools

      - `helm_list_releases` — List Helm releases
      - `helm_get_release` — Get detailed information about a release
      - `helm_upgrade` — Upgrade a Helm release
      - `helm_uninstall` — Uninstall a Helm release
      - `helm_repo_add` — Add a Helm repository
      - `helm_repo_update` — Update Helm repositories
      - `k8s_get_resources` — List Kubernetes resources
      - `k8s_get_available_api_resources` — View supported API resources
      - `k8s_apply_manifest` — Apply a YAML resource file

      ## Guidelines

      - Inspect release state before making changes
      - Prefer `helm_get_release` to understand current state
      - Confirm destructive actions (uninstall, upgrade) before executing
    tools:
      - type: McpServer
        mcpServer:
          apiGroup: kagent.dev
          kind: RemoteMCPServer
          name: kagent-tool-server
          toolNames:
            - helm_list_releases
            - helm_get_release
            - helm_upgrade
            - helm_uninstall
            - helm_repo_add
            - helm_repo_update
            - k8s_get_resources
            - k8s_get_available_api_resources
            - k8s_apply_manifest
