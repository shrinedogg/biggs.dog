# Grafana MCP Service Account Token — managed via External Secrets + 1Password.
#
# 1Password item required (biggs-dog vault): grafana-mcp
#   password — the Grafana service account token (glsa_...)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-mcp-token
  namespace: ai-system
  labels:
    app.kubernetes.io/name: grafana-mcp
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: kagent-grafana-mcp-token
    creationPolicy: Owner
  data:
    - secretKey: GRAFANA_SERVICE_ACCOUNT_TOKEN
      remoteRef:
        key: grafana-mcp
        property: password
