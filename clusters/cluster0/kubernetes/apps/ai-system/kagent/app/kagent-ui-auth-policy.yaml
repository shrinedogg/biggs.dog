---
# SSO forward-auth in front of the kagent UI via oauth2-proxy (replaces the
# previous basic-auth policy). See the rook-ceph policy for a description of the
# /oauth2/auth ext-authz flow. Note: this protects the browser UI only; the MCP
# endpoint (kagent-mcp) keeps its own basic-auth for machine clients.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: kagent-ui-forward-auth
  namespace: ai-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: kagent
  traffic:
    extAuth:
      backendRef:
        group: ""
        kind: Service
        name: oauth2-proxy
        namespace: auth
        port: 80
      http:
        path: '"/oauth2/auth"'
        allowedRequestHeaders:
          - cookie
          - authorization
        allowedResponseHeaders:
          - authorization
          - x-auth-request-user
          - x-auth-request-email
          - x-auth-request-groups
          - x-auth-request-preferred-username
        redirect: '"https://auth.biggs.dog/oauth2/start?rd=https://kagent.biggs.dog" + request.path'
