---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kagent-mcp
  namespace: ai-system
spec:
  hostnames:
    - kagent-mcp.biggs.dog
  parentRefs:
    - name: wildcard-biggs-dog
      namespace: networking
  rules:
    - backendRefs:
        - name: kagent-controller
          port: 8083
      matches:
        - path:
            type: PathPrefix
            value: /mcp
      # Agent invocations run a multi-step LLM tool-calling loop against the
      # in-cluster vLLM (27B, eager mode), which can take minutes. The gateway's
      # default route timeout (Envoy ~15s) was cutting these off, surfacing to
      # MCP clients as a request timeout. Raise the overall (request) and
      # per-attempt (backendRequest) limits generously.
      timeouts:
        request: 300s
        backendRequest: 300s
