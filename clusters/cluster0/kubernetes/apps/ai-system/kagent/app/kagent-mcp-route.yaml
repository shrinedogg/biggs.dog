---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kagent-mcp
  namespace: ai-system
spec:
  hostnames:
  - kagent-mcp.biggs.dog
  parentRefs:
  - name: wildcard-biggs-dog
    namespace: networking
  rules:
  - backendRefs:
    - name: kagent-controller
      port: 8083
    matches:
    - path:
        type: PathPrefix
        value: /mcp
