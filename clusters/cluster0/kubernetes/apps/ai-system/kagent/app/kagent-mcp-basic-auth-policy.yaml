---
# 1Password item kagent-mcp-basic-auth — see kagent-mcp-basic-auth ExternalSecret.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: kagent-mcp-basic-auth
  namespace: ai-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: kagent-mcp
  traffic:
    basicAuthentication:
      mode: Strict
      realm: kagent
      secretRef:
        name: kagent-mcp-basic-auth
