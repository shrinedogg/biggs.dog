---
# Reuses kagent-ui-basic-auth (1Password item kagent-ui-basic-auth). Same htpasswd
# credentials as the UI at kagent.biggs.dog.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: kagent-mcp-basic-auth
  namespace: ai-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: kagent-mcp
  traffic:
    basicAuthentication:
      mode: Strict
      realm: kagent
      secretRef:
        name: kagent-ui-basic-auth
