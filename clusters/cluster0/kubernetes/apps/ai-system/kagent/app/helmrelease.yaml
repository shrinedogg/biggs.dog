---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kagent
  namespace: ai-system
spec:
  interval: 3m
  chartRef:
    kind: OCIRepository
    name: kagent
    namespace: flux-system
  # Enable agent-sandbox code execution (executeCodeBlocks) on every
  # chart-managed Agent AND de-privilege the runner pods. The chart's agent
  # templates default to `runtime: python` but don't expose
  # executeCodeBlocks/sandbox values, and they schedule the pod privileged;
  # we strategic-merge both fixes onto the rendered Agent CRs here. The
  # securityContext mirrors the static vm-agent/cilium agents (runAsNonRoot,
  # drop ALL, privileged: false) -- without it, kagent schedules these pods
  # privileged, too large a blast radius for executeCodeBlocks code.
  # Egress from each sandbox is locked to in-cluster services; the vm-agent
  # and the two static cilium agents set the same fields directly in their
  # own manifests. A nodeSelector also pins every chart-managed agent to the
  # GPU node (nv-01, via nvidia.com/gpu.present=true); the static
  # vm-agent/cilium agents set the same selector in their own manifests.
  # Post-renderer patches — only Deployment-level patches remain.
  # The 5 chart-managed agents (k8s-agent, helm-agent, promql-agent,
  # observability-agent, cilium-manager-agent) are now deployed as
  # SandboxAgents on substrate (kagent/substrate-agents/) and disabled
  # in the chart values, so no Agent patches are needed here.
  postRenderers:
    - kustomize:
        patches:
          # Pin every chart-managed Deployment (kagent-controller, kagent-ui,
          # kagent-tools, kagent-grafana-mcp, kagent-querydoc,
          # kagent-kmcp-controller-manager) to the GPU node (nv-01) via a JSON
          # 6902 patch. op: add is safe: the chart's Deployments set no nodeSelector.
          - target:
              kind: Deployment
            patch: |-
              - op: add
                path: /spec/template/spec/nodeSelector
                value:
                  nvidia.com/gpu.present: "true"
          # ----------------------------------------------------------------
          # Grafana MCP — mount the service account token so the mcp/grafana
          # server can authenticate against Grafana. The ExternalSecret
          # (grafana-mcp-token-secret.yaml) creates the secret and the env
          # var is picked up by the container.
          # Also add -allowed-hosts=* so the MCP server accepts requests
          # from the kagent controller via the Service DNS (not just loopback).
          # ----------------------------------------------------------------
          - target:
              kind: Deployment
              name: kagent-grafana-mcp
            patch: |-
              - op: add
                path: /spec/template/spec/containers/0/args
                value:
                - "-allowed-hosts=*"
              - op: add
                path: /spec/template/spec/containers/0/env
                value:
                - name: GRAFANA_SERVICE_ACCOUNT_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: kagent-grafana-mcp-token
                      key: GRAFANA_SERVICE_ACCOUNT_TOKEN
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    # ------------------------------------------------------------------
    # Built-in agents we don't use. Disabling here (rather than
    # `kubectl delete`) is the durable removal: the Agent CRs are owned by
    # this HelmRelease, so Flux re-creates anything deleted out-of-band.
    # ------------------------------------------------------------------
    argo-rollouts-agent:
      enabled: false
    cilium-debug-agent:
      enabled: false
    cilium-policy-agent:
      enabled: false
    # ------------------------------------------------------------------
    # These agents are now deployed as SandboxAgents on substrate
    # (kagent/substrate-agents/) with Go runtime. Disable them here
    # to avoid conflicts — the chart can only render Python Agent CRs.
    # ------------------------------------------------------------------
    k8s-agent:
      enabled: false
    helm-agent:
      enabled: false
    promql-agent:
      enabled: false
    observability-agent:
      enabled: false
    cilium-manager-agent:
      enabled: false
    istio-agent:
      enabled: false
    kgateway-agent:
      enabled: false
    # ------------------------------------------------------------------
    # Grafana MCP subchart. The chart defaults GRAFANA_URL to
    # `grafana.kagent:3000/api`, which is broken here on two counts: no
    # http:// scheme, and Grafana lives in the observability namespace
    # (Service `grafana` on port 80 -> targetPort `grafana`/3000), not a
    # `kagent` namespace. Point it at the real Service. Egress from
    # ai-system to observability is already allowed by the CNP
    # `allow-egress-to-observability` (namespace-wide, any port).
    # ------------------------------------------------------------------
    # ------------------------------------------------------------------
    # Grafana MCP — the apiKey is NOT stored in git (GitHub secret
    # scanning would block the push). Instead the runtime token is
    # injected via the post-renderer env patch from the cluster Secret
    # kagent-grafana-mcp-token (created manually via kubectl, synced
    # by ExternalSecret once the 1Password item exists).
    # ------------------------------------------------------------------
    grafana-mcp:
      grafana:
        url: "http://grafana.observability:80/api"
    # ------------------------------------------------------------------
    # Default model provider -> our in-cluster vLLM (OpenAI-compatible).
    # The chart renders a ModelConfig named "default-model-config" that
    # the built-in agents use. Pointing it at vLLM keeps everything local.
    # ------------------------------------------------------------------
    providers:
      default: openAI
      openAI:
        provider: OpenAI
        # Must match vLLM's --served-model-name (not the HuggingFace weights
        # path -- see vllm/app/deployment.yaml for why they differ).
        model: "qwen36-local"
        apiKeySecretRef: kagent-vllm
        apiKeySecretKey: OPENAI_API_KEY
        config:
          baseUrl: "http://vllm.ai-system.svc.cluster.local:8000/v1"
    # Use the cluster's CNPG operator (cnpg-kagent) instead of the bundled
    # dev Postgres. The full connection URL (incl. password) is provided at
    # runtime from a mounted secret file, so no credentials live in git.
    #
    # vectorEnabled=true: long-term (cross-session) vector memory via pgvector.
    # NOTE: the model's NATIVE window is 262K, but vLLM SERVES at a 131K cap
    # (vllm/app/deployment.yaml --max-model-len=131072) for KV-concurrency
    # headroom. 131K is tight for flux-agent's ~64K tool schemas + memory +
    # tasks, and accumulated vector memory DID overflow it (input_tokens=131073
    # on flux-agent); memory is now disabled per-agent on flux-agent
    # (flux-mcp/app/agent.yaml). The other agents have no per-agent memory block
    # and remain well under the cap.
    database:
      postgres:
        bundled:
          enabled: false
        vectorEnabled: true
        urlFile: /etc/kagent-db/url
    controller:
      volumes:
        - name: database-url
          secret:
            secretName: kagent-database-url
      volumeMounts:
        - name: database-url
          mountPath: /etc/kagent-db
          readOnly: true
      # ------------------------------------------------------------------
      # Agent Substrate integration. Enables the substrate controller wiring
      # so the kagent controller can schedule SandboxAgent actors on
      # substrate workers. The substrate HelmRelease (ai-system/substrate/)
      # deploys the substrate control plane in the same ai-system namespace.
      # ------------------------------------------------------------------
      substrate:
        enabled: true
        ateApiEndpoint: "dns:///api.ai-system.svc:443"
        ateApiInsecure: true
    substrateWorkerPool:
      create: true
      replicas: 1
      ateomImage: ghcr.io/kagent-dev/substrate/ateom-gvisor:v0.0.6
