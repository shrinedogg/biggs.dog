---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kagent
  namespace: ai-system
spec:
  interval: 3m
  chartRef:
    kind: OCIRepository
    name: kagent
    namespace: flux-system
  # Enable agent-sandbox code execution (executeCodeBlocks) on every
  # chart-managed Agent. The chart's agent templates default to
  # `runtime: python` but don't expose executeCodeBlocks/sandbox values, so we
  # strategic-merge them onto the rendered Agent CRs here. Egress from each
  # sandbox is locked to in-cluster services; the vm-agent and the two static
  # cilium agents set the same fields directly in their own manifests.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Agent
              name: k8s-agent
            patch: |
              apiVersion: kagent.dev/v1alpha2
              kind: Agent
              metadata:
                name: k8s-agent
              spec:
                sandbox:
                  network:
                    allowedDomains:
                      - "*.svc.cluster.local"
                declarative:
                  executeCodeBlocks: true
          - target:
              kind: Agent
              name: observability-agent
            patch: |
              apiVersion: kagent.dev/v1alpha2
              kind: Agent
              metadata:
                name: observability-agent
              spec:
                sandbox:
                  network:
                    allowedDomains:
                      - "*.svc.cluster.local"
                declarative:
                  executeCodeBlocks: true
          - target:
              kind: Agent
              name: promql-agent
            patch: |
              apiVersion: kagent.dev/v1alpha2
              kind: Agent
              metadata:
                name: promql-agent
              spec:
                sandbox:
                  network:
                    allowedDomains:
                      - "*.svc.cluster.local"
                declarative:
                  executeCodeBlocks: true
          - target:
              kind: Agent
              name: helm-agent
            patch: |
              apiVersion: kagent.dev/v1alpha2
              kind: Agent
              metadata:
                name: helm-agent
              spec:
                sandbox:
                  network:
                    allowedDomains:
                      - "*.svc.cluster.local"
                declarative:
                  executeCodeBlocks: true
          - target:
              kind: Agent
              name: cilium-manager-agent
            patch: |
              apiVersion: kagent.dev/v1alpha2
              kind: Agent
              metadata:
                name: cilium-manager-agent
              spec:
                sandbox:
                  network:
                    allowedDomains:
                      - "*.svc.cluster.local"
                declarative:
                  executeCodeBlocks: true
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    # ------------------------------------------------------------------
    # Built-in agents we don't use. Disabling here (rather than
    # `kubectl delete`) is the durable removal: the Agent CRs are owned by
    # this HelmRelease, so Flux re-creates anything deleted out-of-band.
    # ------------------------------------------------------------------
    argo-rollouts-agent:
      enabled: false
    cilium-debug-agent:
      enabled: false
    cilium-policy-agent:
      enabled: false
    helm-agent:
      enabled: true
    promql-agent:
      enabled: true
    istio-agent:
      enabled: false
    kgateway-agent:
      enabled: false
    observability-agent:
      enabled: true
    # ------------------------------------------------------------------
    # Grafana MCP subchart. The chart defaults GRAFANA_URL to
    # `grafana.kagent:3000/api`, which is broken here on two counts: no
    # http:// scheme, and Grafana lives in the observability namespace
    # (Service `grafana` on port 80 -> targetPort `grafana`/3000), not a
    # `kagent` namespace. Point it at the real Service. Egress from
    # ai-system to observability is already allowed by the CNP
    # `allow-egress-to-observability` (namespace-wide, any port).
    # ------------------------------------------------------------------
    grafana-mcp:
      grafana:
        url: "http://grafana.observability:80/api"
    # ------------------------------------------------------------------
    # Default model provider -> our in-cluster vLLM (OpenAI-compatible).
    # The chart renders a ModelConfig named "default-model-config" that
    # the built-in agents use. Pointing it at vLLM keeps everything local.
    # ------------------------------------------------------------------
    providers:
      default: openAI
      openAI:
        provider: OpenAI
        # Must match vLLM's --served-model-name (not the HuggingFace weights
        # path -- see vllm/app/deployment.yaml for why they differ).
        model: "qwen36-local"
        apiKeySecretRef: kagent-vllm
        apiKeySecretKey: OPENAI_API_KEY
        config:
          baseUrl: "http://vllm.ai-system.svc.cluster.local:8000/v1"
    # Use the cluster's CNPG operator (cnpg-kagent) instead of the bundled
    # dev Postgres. The full connection URL (incl. password) is provided at
    # runtime from a mounted secret file, so no credentials live in git.
    #
    # vectorEnabled=true: long-term (cross-session) vector memory via pgvector.
    # The model is now nvidia/Qwen3.6-35B-A3B-NVFP4 with a 262K context window,
    # so flux-agent's ~64K tool schemas + memory + tasks fit with room to spare
    # -- no context-overflow on the heavy agents.
    database:
      postgres:
        bundled:
          enabled: false
        vectorEnabled: true
        urlFile: /etc/kagent-db/url
    controller:
      volumes:
        - name: database-url
          secret:
            secretName: kagent-database-url
      volumeMounts:
        - name: database-url
          mountPath: /etc/kagent-db
          readOnly: true
