---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kagent
  namespace: ai-system
spec:
  interval: 3m
  chartRef:
    kind: OCIRepository
    name: kagent
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  # Add generic k8s tools to cilium agents so they can inspect pods/deployments
  # beyond cilium-specific CLI commands. Applied at Helm render time so the
  # controller owns them natively (no race with external Kustomization patches).
  patches:
    # cilium-debug-agent: append generic k8s tools to the MCP tool list
    - target:
        kind: Agent
        name: cilium-debug-agent
      patch: |
        apiVersion: kagent.dev/v1alpha2
        kind: Agent
        metadata:
          name: cilium-debug-agent
        spec:
          declarative:
            tools:
              - mcpServer:
                  toolNames:
                    - k8s_get_resources
                    - k8s_describe_resource
    # cilium-policy-agent: same treatment for policy debugging
    - target:
        kind: Agent
        name: cilium-policy-agent
      patch: |
        apiVersion: kagent.dev/v1alpha2
        kind: Agent
        metadata:
          name: cilium-policy-agent
        spec:
          declarative:
            tools:
              - mcpServer:
                  toolNames:
                    - k8s_get_resources
                    - k8s_describe_resource
  values:
    # ------------------------------------------------------------------
    # Built-in agents we don't use. Disabling here (rather than
    # `kubectl delete`) is the durable removal: the Agent CRs are owned by
    # this HelmRelease, so Flux re-creates anything deleted out-of-band.
    # ------------------------------------------------------------------
    argo-rollouts-agent:
      enabled: false
    helm-agent:
      enabled: true
    promql-agent:
      enabled: true
    istio-agent:
      enabled: false
    kgateway-agent:
      enabled: false
    observability-agent:
      enabled: true
    # ------------------------------------------------------------------
    # Grafana MCP subchart. The chart defaults GRAFANA_URL to
    # `grafana.kagent:3000/api`, which is broken here on two counts: no
    # http:// scheme, and Grafana lives in the observability namespace
    # (Service `grafana` on port 80 -> targetPort `grafana`/3000), not a
    # `kagent` namespace. Point it at the real Service. Egress from
    # ai-system to observability is already allowed by the CNP
    # `allow-egress-to-observability` (namespace-wide, any port).
    # ------------------------------------------------------------------
    grafana-mcp:
      grafana:
        url: "http://grafana.observability:80/api"
    # ------------------------------------------------------------------
    # Default model provider -> our in-cluster vLLM (OpenAI-compatible).
    # The chart renders a ModelConfig named "default-model-config" that
    # the built-in agents use. Pointing it at vLLM keeps everything local.
    # ------------------------------------------------------------------
    providers:
      default: openAI
      openAI:
        provider: OpenAI
        # Must match vLLM's --served-model-name (not the HuggingFace weights
        # path -- see vllm/app/deployment.yaml for why they differ).
        model: "qwen36-local"
        apiKeySecretRef: kagent-vllm
        apiKeySecretKey: OPENAI_API_KEY
        config:
          baseUrl: "http://vllm.ai-system.svc.cluster.local:8000/v1"
    # Use the cluster's CNPG operator (cnpg-kagent) instead of the bundled
    # dev Postgres. The full connection URL (incl. password) is provided at
    # runtime from a mounted secret file, so no credentials live in git.
    #
    # vectorEnabled=true: long-term (cross-session) vector memory via pgvector.
    # The model is now nvidia/Qwen3.6-35B-A3B-NVFP4 with a 262K context window,
    # so flux-agent's ~64K tool schemas + memory + tasks fit with room to spare
    # -- no context-overflow on the heavy agents.
    database:
      postgres:
        bundled:
          enabled: false
        vectorEnabled: true
        urlFile: /etc/kagent-db/url
    controller:
      volumes:
        - name: database-url
          secret:
            secretName: kagent-database-url
      volumeMounts:
        - name: database-url
          mountPath: /etc/kagent-db
          readOnly: true
