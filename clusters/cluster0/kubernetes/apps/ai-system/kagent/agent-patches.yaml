---
# Patch Agent CRs created by HelmRelease to add missing generic k8s tools.
# cilium-debug-agent and cilium-policy-agent only have domain-specific MCP tools
# but lack k8s_get_resources/k8s_describe_resource needed for cluster inspection.
# vm-agent is fixed via its static manifest (victoria-metrics-mcp/app/agent.yaml).
# Interval set to 30s to stay ahead of the HelmRelease 3m reconciliation cycle.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kagent-agent-patches
  namespace: flux-system
spec:
  dependsOn:
    - name: kagent
  force: true
  interval: 30s
  retryInterval: 30s
  targetNamespace: ai-system
  path: ./clusters/cluster0/kubernetes/apps/ai-system/kagent/patches
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: false
  timeout: 5m
  patches:
    # cilium-debug-agent: append generic k8s tools to cilium-specific tools
    - target:
        kind: Agent
        name: cilium-debug-agent
      patch: |-
        - op: add
          path: /spec/declarative/tools/0/mcpServer/toolNames/-
          value: k8s_get_resources
        - op: add
          path: /spec/declarative/tools/0/mcpServer/toolNames/-
          value: k8s_describe_resource
    # cilium-policy-agent: same treatment for policy debugging
    - target:
        kind: Agent
        name: cilium-policy-agent
      patch: |-
        - op: add
          path: /spec/declarative/tools/0/mcpServer/toolNames/-
          value: k8s_get_resources
        - op: add
          path: /spec/declarative/tools/0/mcpServer/toolNames/-
          value: k8s_describe_resource
