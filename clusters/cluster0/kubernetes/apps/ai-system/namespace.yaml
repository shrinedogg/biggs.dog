---
apiVersion: v1
kind: Namespace
metadata:
  name: ai-system
  labels:
    # Privileged: the vLLM inference server runs on the nv-01 GPU node and
    # relies on NVIDIA CDI device injection (nvidia.com/gpu). kagent and
    # agent-sandbox controller pods still run with hardened securityContexts.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
