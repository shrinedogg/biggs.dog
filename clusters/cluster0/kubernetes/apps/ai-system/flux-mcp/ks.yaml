---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app flux-mcp
  namespace: flux-system
spec:
  dependsOn:
    # kagent provides the RemoteMCPServer/Agent CRDs, the default-model-config
    # ModelConfig, and the kagent-builtin-prompts ConfigMap referenced here.
    - name: kagent
  # No targetNamespace: this app intentionally spans namespaces (the MCP
  # Deployment/Service + its dedicated SA/RBAC live in flux-system; the
  # RemoteMCPServer + Agent live in ai-system). Each manifest sets its own
  # metadata.namespace.
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./clusters/cluster0/kubernetes/apps/ai-system/flux-mcp/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  interval: 3m
  retryInterval: 1m
  timeout: 5m
