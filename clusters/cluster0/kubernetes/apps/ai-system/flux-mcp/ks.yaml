---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app flux-mcp
  namespace: flux-system
spec:
  dependsOn:
    # kagent provides the RemoteMCPServer CRD and the default-model-config
    # the flux-agent (not defined here; exists in-cluster) consumes.
    - name: kagent
  # No targetNamespace: each manifest sets its own namespace. This app
  # spans namespaces by design — the MCP server Deployment/Service live in
  # flux-system (where they can be reached via the pre-wired CNP
  # 'allow-egress-to-flux-mcp' from ai-system), while the RemoteMCPServer
  # lives in ai-system where kagent references it.
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./clusters/cluster0/kubernetes/apps/ai-system/flux-mcp/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  interval: 3m
  retryInterval: 1m
  timeout: 5m
