apiVersion: v1
kind: Namespace
metadata:
  # Pod Security Standards: this cluster's API server defaults UNLABELED
  # namespaces to enforce=baseline (verified 2026-10-29 via server-side
  # dry-run: a privileged pod is rejected even in unlabeled 'default', while
  # the 'omni' namespace with the privileged triple below accepts it).
  # The dind sidecar requires privileged (kind needs nested containers), so
  # this namespace opts into the privileged profile — the house pattern,
  # same triple as omni / openebs-system / tinkerbell.
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/audit: privileged
  name: ci
