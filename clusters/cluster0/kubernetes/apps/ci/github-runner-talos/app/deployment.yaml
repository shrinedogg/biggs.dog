# Self-hosted GitHub Actions runner for the
# shrinedogg/talos-nvidia-open-extension CI builds. Static Deployment; no
# controller, no CRDs.
#
# Mechanism: myoung34/github-runner (actions/runner v2.338.2, image tag pins
# the upstream release; renovate bumps it via PR) registers REPO-scoped against
# https://github.com/shrinedogg/talos-nvidia-open-extension with label
# `cluster0`, then idles waiting for jobs. A docker:dind sidecar provides the
# docker daemon the bldr builds need; the myoung34 image ships the docker CLI.
#
# REPO SCOPE IS REQUIRED (not user scope): the shrinedogg account is a User,
# not an org, and the runner's GetEntityUrl treats a single-segment URL as an
# ORG (it would call /orgs/shrinedogg/... and 404). The full two-segment repo
# URL routes correctly and is the myoung34 image's primary use case (every
# upstream example is repo-scoped). Repo scope also means only this repo can
# dispatch to the runner (tightest fit; a user scope would expose it to every
# shrinedogg repo).
#
# The talos build is amd64-only and this node (talos-z2j-iay) is amd64, so the
# kernel compile runs natively (no QEMU).
#
# Restart semantics (token-free):
#   - First boot (empty PVC): the image entrypoint runs config.sh with the
#     registration token (RUNNER_TOKEN), then persists .runner/.credentials/
#     _diag to the PVC (CONFIGURED_ACTIONS_RUNNER_FILES_DIR=/runner-state).
#   - Every later boot: the entrypoint finds .runner on the PVC, SKIPS
#     registration, and runs the listener. Pod recreation needs NO fresh
#     token; the stored credentials stay valid until the runner is deleted
#     server-side (the next registration reclaims the fixed name via
#     --replace).
#   - DISABLE_AUTOMATIC_DEREGISTRATION=true is REQUIRED for this reuse mode
#     (the entrypoint exits 1 otherwise). Consequence: deleting the pod leaves
#     a stale "offline" runner entry in the GitHub UI; cosmetic.
#   - EPHEMERAL stays UNSET: an ephemeral runner de-registers after every job
#     and would need a fresh token per run, which a static token cannot provide.
#   - Failure mode: PVC loss + registration token older than its 1h GitHub
#     validity -> registration fails and the container crash-loops. Recovery
#     (user console steps): regenerate the token, update the 1Password item
#     shrinedogg-actions-runner, wait <=5m (ExternalSecret refresh), then
#     kubectl --context cluster0 -n ci delete pod -l
#     app.kubernetes.io/name=github-runner-talos.
#
# KNOWN RISK (registration): the myoung34 entrypoint always passes
# --runnergroup (defaulting to "Default" when RUNNER_GROUP is unset). Repo-scope
# runners do not use runner groups, so if the first registration fails with
# 'Could not find any self-hosted runner group named "Default"', the fix is a
# small entrypoint override that omits --runnergroup. This is the only
# scope-specific uncertainty; the krops org runner proves the image + dind
# shape works on this node.
#
# PRIVILEGED EXCEPTION (dind sidecar): the dind container runs privileged
# because dockerd needs cgroup + overlay mounts to run nested containers. This
# is the standard self-hosted-runner "container mode: docker" shape and a
# deliberate, documented exception to the AGENTS.md hardening convention. The
# unauthenticated docker API is bound to pod-localhost only (tcp://127.0.0.1:
# 2375, TLS off), so no other pod can reach it (the ci namespace carries
# egress-only policies; see network-policies/policies/apps/ci.yaml and
# ci-talos.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-runner-talos
  namespace: ci
spec:
  replicas: 1
  # Recreate (not RollingUpdate): the runner-state PVC is RWO, so a rolling
  # update could never schedule the second replica.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: github-runner-talos
  template:
    metadata:
      labels:
        app.kubernetes.io/name: github-runner-talos
    spec:
      # No cluster0 API access: the job's work targets the build, never
      # cluster0's API server.
      automountServiceAccountToken: false
      containers:
        - name: runner
          image: docker.io/myoung34/github-runner:2.338.2-ubuntu-noble
          # Runs as root by image design (the entrypoint execs the listener
          # as root; RUN_AS_ROOT is the default).
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              # drop ALL alone breaks this image: root without CAP_DAC_OVERRIDE
              # gets only the "other" (r-x) bits on the runner-owned
              # /actions-runner, so config.sh cannot create _diag/.env, the
              # entrypoint's chown (CAP_CHOWN) fails, and gosu's privilege
              # drop (SETUID/SETGID) fails -> Runner.Listener aborts (exit 134).
              # Add back exactly what the entrypoint needs, nothing else.
              drop: ["ALL"]
              add:
                - CHOWN          # entrypoint: chown -R runner /actions-runner /runner-work /runner-state
                - DAC_OVERRIDE   # root writes to runner-owned /actions-runner during config.sh
                - FOWNER         # cp -p preserving times on runner-owned files/dirs
                - SETUID         # gosu: drop root -> runner for the listener
                - SETGID         # gosu: drop root group -> runner group
            seccompProfile:
              type: RuntimeDefault
          env:
            # Registration target: REPO scope (see header). The full two-
            # segment repo URL; a single-segment user URL is mis-handled as an
            # org by the runner.
            - name: REPO_URL
              value: https://github.com/shrinedogg/talos-nvidia-open-extension
            - name: RUNNER_NAME
              value: cluster0-talos
            - name: RUNNER_LABELS
              value: cluster0
            # No RUNNER_GROUP: repo scope has no runner groups. (The myoung34
            # entrypoint still passes --runnergroup Default; see header KNOWN
            # RISK.)
            # Registration token, materialized by the ExternalSecret from the
            # 1Password item shrinedogg-actions-runner / registration-token.
            - name: RUNNER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: shrinedogg-actions-runner
                  key: registration-token
            # Reuse mode: persist config to the PVC so restarts skip
            # registration (token-free). Required true for reuse.
            - name: DISABLE_AUTOMATIC_DEREGISTRATION
              value: "true"
            # Pin the runner binary to the image version (renovate bumps it
            # via PR, not mid-job).
            - name: DISABLE_AUTO_UPDATE
              value: "true"
            # Unset the registration token + config vars before job execution
            # so workflow steps cannot read them.
            - name: UNSET_CONFIG_VARS
              value: "true"
            # PVC-backed runner config/credentials (see Restart semantics).
            - name: CONFIGURED_ACTIONS_RUNNER_FILES_DIR
              value: /runner-state
            # Job checkouts on a dedicated emptyDir (never the PVC).
            - name: RUNNER_WORKDIR
              value: /runner-work
            # Reach the dind sidecar's docker API (pod-localhost, TLS off).
            - name: DOCKER_HOST
              value: tcp://127.0.0.1:2375
            # Temp dir on the shared-tmp volume: docker bind mounts in this
            # container are resolved by the DIND daemon against ITS
            # filesystem, so any host path passed to `docker run -v ...` must
            # exist in both containers at the same path.
            - name: TMPDIR
              value: /shared-tmp
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: runner-state
              mountPath: /runner-state
            - name: runner-work
              mountPath: /runner-work
            - name: shared-tmp
              mountPath: /shared-tmp
        - name: dind
          image: docker.io/docker:29.9.2-dind
          # PRIVILEGED (see header): dockerd needs cgroup + overlay mounts for
          # nested containers. The docker API is loopback-only.
          securityContext:
            privileged: true
          env:
            # No TLS: we bind an explicit loopback socket via command/args
            # below. (Empty value also stops the dind wrapper's TLS cert
            # generation if it were ever invoked.)
            - name: DOCKER_TLS_CERTDIR
              value: ""
          # Bypass the dind wrapper (which would bind tcp://0.0.0.0:2375) and
          # run dockerd directly under docker-init/tini (zombie reaping), bound
          # to pod-localhost only.
          command: ["docker-init", "--", "dockerd"]
          args:
            - --host=tcp://127.0.0.1:2375
          resources:
            requests:
              cpu: 2000m
              memory: 6Gi
            limits:
              # 12 of the node's 16 cores for the nested builds (bldr/make run
              # inside dind and inherit this cgroup limit). 4 cores left as
              # headroom for the krops runner and other workloads.
              cpu: "12"
              memory: 24Gi
          volumeMounts:
            - name: docker-graph
              mountPath: /var/lib/docker
            - name: shared-tmp
              mountPath: /shared-tmp
      volumes:
        # Runner config/credentials, persisted across pod recreation so
        # restarts skip registration (token-free).
        - name: runner-state
          persistentVolumeClaim:
            claimName: github-runner-talos-state
        # Job checkouts (ephemeral).
        - name: runner-work
          emptyDir:
            sizeLimit: 10Gi
        # Shared between runner and dind AT THE SAME PATH so docker bind mounts
        # of runner-side temp paths resolve in the dind daemon's filesystem.
        - name: shared-tmp
          emptyDir:
            sizeLimit: 64Mi
        # dind /var/lib/docker (ephemeral; cold pull after pod recreation is
        # acceptable: the bldr + kernel + NVIDIA build needs ~40 Gi).
        - name: docker-graph
          emptyDir:
            sizeLimit: 40Gi
