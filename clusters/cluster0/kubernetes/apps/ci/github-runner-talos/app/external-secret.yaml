# Materializes secret "shrinedogg-actions-runner" (key: registration-token) —
# the GitHub Actions REPO registration token consumed by the
# github-runner-talos Deployment.
#
# 1Password item required (biggs-dog vault):
#   - shrinedogg-actions-runner (secret) — registration token for the repo
#     shrinedogg/talos-nvidia-open-extension. Generate in the repo console
#     (Settings > Actions > Runners > New self-hosted runner) and copy the
#     token from the config snippet. The token expires 1h after creation; the
#     runner registers once on first boot and then reuses the persisted config
#     on the PVC, so the token is only ever needed for that first registration
#     (or a recovery re-registration).
#
# refreshInterval is 5m (house default is 1h) so a rotated token lands fast
# during the recovery runbook; the load on the self-hosted Connect API is
# trivial.
#
# Merge-before-item safety: until the 1Password item exists this
# ExternalSecret stays pending (SecretSyncedError) and the runner container
# waits in CreateContainerConfigError (unresolvable secretKeyRef). Nothing
# registers, nothing else in the namespace is affected.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: shrinedogg-actions-runner
  namespace: ci
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: shrinedogg-actions-runner
    creationPolicy: Owner
  data:
    - secretKey: registration-token
      remoteRef:
        key: shrinedogg-actions-runner
        property: registration-token
