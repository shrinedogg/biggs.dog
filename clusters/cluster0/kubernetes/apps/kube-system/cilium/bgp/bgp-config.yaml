---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumloadbalancerippool_v2alpha1.json
# Single LoadBalancer pool on a NON-node subnet (192.168.6.0/24). The nodes
# live on 192.168.2.0/24, and LB IPs are BGP-advertised (no L2/ARP), so a VIP
# inside the nodes' own /24 is unreachable FROM the nodes (a node ARPs locally
# and gets no answer). Keeping the whole pool off-subnet means every VIP routes
# via the gateway -> UDM (which holds the BGP route) -> back into the cluster,
# so VIPs are reachable from both LAN clients and the nodes themselves. This is
# why the formerly separate "pool-routed" (192.168.6.x, label lb-ipam-pool=routed)
# was folded in here -- with the whole pool off-subnet it served no extra purpose.
# The CiliumBGPAdvertisement below matches all services, so these VIPs are
# advertised to the UDM automatically.
apiVersion: cilium.io/v2alpha1
kind: CiliumLoadBalancerIPPool
metadata:
  name: pool
spec:
  allowFirstLastIPs: "No"
  blocks:
    - start: 192.168.6.6
      stop: 192.168.6.254
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumbgpadvertisement_v2alpha1.json
apiVersion: cilium.io/v2alpha1
kind: CiliumBGPAdvertisement
metadata:
  name: bgp-advertisement
  labels:
    advertise: bgp
spec:
  advertisements:
    - advertisementType: Service
      service:
        addresses:
          - LoadBalancerIP
      selector:
        matchExpressions:
          - key: fakeSelector
            operator: NotIn
            values:
              - will-match-and-announce-all-services
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumbgppeerconfig_v2alpha1.json
apiVersion: cilium.io/v2alpha1
kind: CiliumBGPPeerConfig
metadata:
  name: bgp-peer-config
spec:
  timers:
    holdTimeSeconds: 9
    keepAliveTimeSeconds: 3
    connectRetryTimeSeconds: 5
  gracefulRestart:
    enabled: true
  families:
    - afi: ipv4
      safi: unicast
      advertisements:
        matchLabels:
          advertise: bgp
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumbgpclusterconfig_v2alpha1.json
apiVersion: cilium.io/v2alpha1
kind: CiliumBGPClusterConfig
metadata:
  name: bgp-cluster-config
spec:
  nodeSelector:
    matchLabels:
      kubernetes.io/os: linux
  bgpInstances:
    - name: cilium
      localASN: 64564
      peers:
        - name: udm
          peerASN: 64563
          peerAddress: 192.168.1.1
          peerConfigRef:
            name: bgp-peer-config
