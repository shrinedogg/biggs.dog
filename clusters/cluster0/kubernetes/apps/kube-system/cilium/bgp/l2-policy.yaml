---
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: l2-policy
spec:
  # Announce on all nodes
  nodeSelector:
    matchLabels:
      kubernetes.io/os: linux
  # Match all interfaces
  interfaces:
    - ^enp.*
    - ^eth.*
    - ^bond.*
  # Announce all LoadBalancer services
  serviceSelector:
    matchExpressions:
      - key: somekey
        operator: DoesNotExist
  loadBalancerIPs: true
  externalIPs: true
