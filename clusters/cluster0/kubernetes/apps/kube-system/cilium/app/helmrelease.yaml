---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 3m
  chart:
    spec:
      chart: cilium
      version: 1.20.1
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: flux-system
  maxHistory: 3
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    cgroup:
      automount:
        enabled: false
      hostRoot: /sys/fs/cgroup
    cluster:
      id: 2
      name: cluster0
    cni:
      exclusive: true
    devices: "eth+ enp+ enx+ eno+ ens+ bond+"
    ipam:
      mode: kubernetes
    # The node runs KubePrism on 7445 (Talos); the CRS bootstrap copy
    # (capi/clusters/management/cilium-crs.yaml) is rendered from THESE
    # values by check-cilium-crs.sh, so they must stay in sync.
    k8sServiceHost: localhost
    k8sServicePort: 7445
    kubeProxyReplacement: true
    kubeProxyReplacementHealthzBindAddr: 0.0.0.0:10256
    # cluster0 announces its LoadBalancer VIP via L2 (see
    # ../../networking/cilium-lb-ip-pool.yaml and cilium-l2-announcement.yaml),
    # unlike cluster1 which uses BGP.
    l2announcements:
      enabled: true
    operator:
      # Management cluster: keep a single operator replica so it schedules on
      # small node counts (the chart default of 2 requires 2 schedulable nodes
      # due to the operator's hostname anti-affinity).
      replicas: 1
      rollOutPods: true
    prometheus:
      enabled: true
      trustCRDsExist: true
    rollOutCiliumPods: true
    securityContext:
      capabilities:
        ciliumAgent:
          - CHOWN
          - KILL
          - NET_ADMIN
          - NET_RAW
          - IPC_LOCK
          - SYS_ADMIN
          - SYS_RESOURCE
          - PERFMON
          - BPF
          - DAC_OVERRIDE
          - FOWNER
          - SETGID
          - SETUID
        cleanCiliumState:
          - NET_ADMIN
          - SYS_ADMIN
          - SYS_RESOURCE
    socketLB:
      enabled: true
      hostNamespaceOnly: true
