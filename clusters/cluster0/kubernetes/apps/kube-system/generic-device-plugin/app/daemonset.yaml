---
# Vendored from fenrir examples/generic_devices/generic-devices.yaml, trimmed
# to the uinput device only (the dri/kfd group is for AMD GPUs; NVIDIA goes
# through nvidia.com/gpu from the gpu-operator).
# Exposes /dev/uinput as squat.ai/uinput for the wolf sidecar (virtual input
# devices). Requires the uinput kernel module on the node (Talos machine
# config: machine.kernel.modules: [{name: uinput}]).
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: generic-device-plugin
  namespace: kube-system
  labels:
    app.kubernetes.io/name: generic-device-plugin
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: generic-device-plugin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: generic-device-plugin
    spec:
      priorityClassName: system-node-critical
      containers:
        - name: generic-device-plugin
          image: ghcr.io/squat/generic-device-plugin:latest
          args:
            - --device
            - |
              name: uinput
              groups:
                - count: 10
                  paths:
                    - path: /dev/uinput
          resources:
            requests:
              cpu: 50m
              memory: 10Mi
          securityContext:
            privileged: true
          volumeMounts:
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins
            - name: dev
              mountPath: /dev
      volumes:
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
        - name: dev
          hostPath:
            path: /dev
  updateStrategy:
    type: RollingUpdate
