apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: nfs
  name: nfs
  namespace: media
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      app: nfs
  template:
    metadata:
      labels:
        app: nfs
    spec:
      terminationGracePeriodSeconds: 30
      # This image runs an in-kernel NFS server (rpc.nfsd): it mounts the nfsd
      # pseudo-filesystem, manages /proc/fs/nfsd and binds privileged ports. That
      # genuinely requires privileged mode — it cannot run unprivileged or with a
      # reduced capability set (see aminvakil/docker-alpine-nfs-server). The pod is
      # therefore intentionally exempt from non-privileged hardening; the media
      # namespace is labelled with the 'privileged' Pod Security Standard. We still
      # drop the service-account token, which the server never needs.
      automountServiceAccountToken: false
      containers:
        - image: quay.io/aminvakil/alpine-nfs-server:latest
          imagePullPolicy: Always
          name: nfs-server
          env:
            - name: NFS_THREADS
              value: "32"
            - name: SHARED_DIRECTORY
              value: "nfs-share"
          ports:
            - name: nfs-port
              containerPort: 2049
              protocol: TCP
          volumeMounts:
            - name: media
              mountPath: /nfs-share
          securityContext:
            allowPrivilegeEscalation: true
            readOnlyRootFilesystem: false
            privileged: true
          lifecycle:
            preStop:
              exec:
                command:
                  [
                    "/bin/sh",
                    "-c",
                    'echo "Stopping NFS server gracefully..."; exportfs -uav; sleep 5',
                  ]
          resources:
            requests:
              memory: 12Mi
              cpu: 100m
            limits:
              memory: 12Mi
              cpu: 100m
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: "media-zfs-pvc"
