# Declaratively enable pgvector in the kagent database. The Cluster mounts the
# extension binaries (via image catalog + postgresql.extensions), but
# CREATE EXTENSION requires superuser; kagent's migration runs as the app user.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: cnpg-kagent-db
  namespace: cnpg-system
spec:
  name: kagent
  owner: kagent
  cluster:
    name: cnpg-kagent
  extensions:
    - name: vector
      version: "0.8.2"
      ensure: present
