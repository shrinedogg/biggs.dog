apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cnpg-kagent
  namespace: cnpg-system
spec:
  instances: 3
  bootstrap:
    initdb:
      database: kagent
      owner: kagent
      dataChecksums: true
      secret:
        name: kagent-user-password
  # Minimal trixie operand + extension images from the official CNPG 1.29 catalog
  # (../app/postgresql-minimal-trixie-catalog.yaml). Enables pgvector by name only.
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ClusterImageCatalog
    name: postgresql-minimal-trixie
    major: 18
  resources:
    requests:
      memory: 300Mi
      cpu: 150m
    limits:
      memory: 300Mi
      cpu: 150m
  storage:
    storageClass: host-path
    size: 5Gi
  postgresql:
    extensions:
      - name: pgvector
  plugins:
  - name: barman-cloud.cloudnative-pg.io
    isWALArchiver: true
    parameters:
      barmanObjectName: barman-object-store
