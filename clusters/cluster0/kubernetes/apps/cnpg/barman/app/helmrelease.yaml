---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app plugin-barman-cloud
  namespace: cnpg-system
spec:
  interval: 3m
  chartRef:
    kind: OCIRepository
    name: *app
    namespace: flux-system
  values:
    crds:
      create: true
    # The chart's self-signed leaf certs (isCA: false) are rejected by
    # cert-manager >= 1.18 (cloudnative-pg/charts#781). We supply
    # barman-cloud-server-tls / barman-cloud-client-tls ourselves as self-signed
    # CA certs, reconciled first by the cnpg-barman-certs Kustomization
    # (../certificates/).
    certificate:
      createServerCertificate: false
      createClientCertificate: false
