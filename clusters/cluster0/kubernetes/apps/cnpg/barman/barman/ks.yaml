apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cnpg-barman
  namespace: flux-system
spec:
  dependsOn:
    - name: cnpg-secrets
    - name: cnpg-barman-certs
  commonMetadata:
    labels:
      app.kubernetes.io/name: cnpg-barman
  targetNamespace: cnpg-system
  path: ./clusters/cluster0/kubernetes/apps/cnpg/barman/app/
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  interval: 3m
  retryInterval: 1m
  timeout: 2m
