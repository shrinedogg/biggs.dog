---
# Replacement TLS for the barman-cloud plugin.
#
# The plugin-barman-cloud chart issues its gRPC server/client certs directly
# from a cert-manager selfSigned Issuer (isCA: false). On cert-manager >= 1.18
# those self-signed leaves are stamped CA:FALSE, so the CNPG operator's x509
# verification rejects them with:
#   "parent certificate cannot sign this kind of certificate ... barman-cloud"
# See cloudnative-pg/charts#781.
#
# We instead issue both certs from a real CA (selfSigned root -> CA -> leaves)
# so each secret's ca.crt is a valid signing authority.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: barman-cloud-selfsigned-root
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: barman-cloud-ca
spec:
  isCA: true
  commonName: barman-cloud-ca
  secretName: barman-cloud-ca
  duration: 87600h # 10y
  renewBefore: 8760h # 1y
  privateKey:
    algorithm: ECDSA
    size: 256
  usages:
    - cert sign
    - crl sign
  issuerRef:
    name: barman-cloud-selfsigned-root
    kind: Issuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: barman-cloud-ca-issuer
spec:
  ca:
    secretName: barman-cloud-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: barman-cloud-server
spec:
  commonName: barman-cloud
  dnsNames:
    - barman-cloud
    - barman-cloud.cnpg-system
    - barman-cloud.cnpg-system.svc
    - barman-cloud.cnpg-system.svc.cluster.local
  secretName: barman-cloud-server-tls
  duration: 2160h
  renewBefore: 360h
  usages:
    - server auth
  privateKey:
    rotationPolicy: Always
  issuerRef:
    name: barman-cloud-ca-issuer
    kind: Issuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: barman-cloud-client
spec:
  commonName: barman-cloud-client
  secretName: barman-cloud-client-tls
  duration: 2160h
  renewBefore: 360h
  usages:
    - client auth
  privateKey:
    rotationPolicy: Always
  issuerRef:
    name: barman-cloud-ca-issuer
    kind: Issuer
    group: cert-manager.io
