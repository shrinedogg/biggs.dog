apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cnpg-barman-certs
  namespace: flux-system
spec:
  dependsOn:
    - name: cert-manager
  commonMetadata:
    labels:
      app.kubernetes.io/name: cnpg-barman-certs
  targetNamespace: cnpg-system
  path: ./clusters/cluster0/kubernetes/apps/cnpg/barman/certificates/
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  # Wait for the CA + leaf Certificates to become Ready (secrets created)
  # before the plugin HelmRelease rolls its Deployment.
  wait: true
  interval: 3m
  retryInterval: 1m
  timeout: 2m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cnpg-barman
  namespace: flux-system
spec:
  dependsOn:
    - name: cnpg-secrets
    - name: cnpg-barman-certs
  commonMetadata:
    labels:
      app.kubernetes.io/name: cnpg-barman
  targetNamespace: cnpg-system
  path: ./clusters/cluster0/kubernetes/apps/cnpg/barman/app/
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  interval: 3m
  retryInterval: 1m
  timeout: 2m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cnpg-barman-object-store
  namespace: flux-system
spec:
  dependsOn:
    - name: cnpg-barman
  commonMetadata:
    labels:
      app.kubernetes.io/name: cnpg-barman-object-store
  targetNamespace: cnpg-system
  path: ./clusters/cluster0/kubernetes/apps/cnpg/barman/stores/
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  interval: 3m
  retryInterval: 1m
  timeout: 2m
