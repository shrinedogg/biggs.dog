# Namespace: ai-system
---
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: "default-deny"
  namespace: "ai-system"
spec:
  endpointSelector: {}
---
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: "allow-egress-dns"
  namespace: "ai-system"
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": "kube-system"
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
---
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: "allow-egress-to-postgres"
  namespace: "ai-system"
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            "io.cnpg.namespace": "cnpg-system"
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
---
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: "allow-egress-to-vllm"
  namespace: "ai-system"
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            app: vllm
            "k8s:io.kubernetes.pod.namespace": "ai-system"
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
---
# Allow ingress from specific application namespaces for inference/training requests
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: "allow-ingress-from-apps"
  namespace: "ai-system"
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": "affine"
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": "biggs"
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": "auth"
---
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: "allow-prometheus-scraping"
  namespace: "ai-system"
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": "observability"
      toPorts:
        - ports:
            - port: "9100"
              protocol: TCP
            - port: "8080"
              protocol: TCP
