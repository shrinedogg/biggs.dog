# Namespace: flux-system  (flux-operator + source/kustomize/helm/notification controllers)
#
# Replaces the native NetworkPolicy shipped by the flux-operator chart
# (flux-operator-web), which created an ingress default-deny scoped to TCP:9080
# only and thereby dropped UDP DNS replies from kube-dns -> intermittent
# name-resolution failures in flux-operator. The chart policy is disabled via
# web.networkPolicy.create: false on the HelmRelease; CiliumNetworkPolicies
# here carry the L7 DNS proxy rule that avoids the reply-drop entirely.
---
# NOTE: No standalone default-deny policy — Cilium rejects an empty deny-all
# (VALID: False, "rule must have at least one of Ingress/Egress"). Default-deny
# is implicit: the allow policies below all select endpointSelector: {} for
# ingress and/or egress, so any traffic not explicitly allowed is dropped.
---
# DNS for all controllers (source-controller resolving git hosts, etc.).
# The L7 DNS proxy injects replies directly into the pod, bypassing the
# conntrack reply-drop that breaks Go resolvers behind default-deny ingress.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-egress-dns
  namespace: flux-system
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchExpressions:
            - key: k8s:io.kubernetes.pod.namespace
              operator: In
              values: [kube-system]
            - key: k8s:k8s-app
              operator: In
              values: [coredns, kube-dns]
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
---
# All Flux controllers drive the Kubernetes API (watch + reconcile).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-egress-kube-apiserver
  namespace: flux-system
spec:
  endpointSelector: {}
  egress:
    - toEntities:
        - kube-apiserver
---
# source-controller pulls Git/OCI/Helm sources; notification-controller posts
# to webhook/alert sinks (Slack, Discord, etc.); flux-operator reports status.
# All HTTPS to the world.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-egress-https
  namespace: flux-system
spec:
  endpointSelector: {}
  egress:
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
# Intra-namespace: controllers <-> flux-operator (status reporting, source
# serving charts to helm-controller, etc.)
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-intra-namespace
  namespace: flux-system
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: flux-system
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: flux-system
---
# kubelet health/readiness probes (flux-operator :8081, controllers :8081/:8080)
# and the host-side API server return path arrive from the host entity.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-ingress-from-host
  namespace: flux-system
spec:
  endpointSelector: {}
  ingress:
    - fromEntities:
        - host
        - remote-node
