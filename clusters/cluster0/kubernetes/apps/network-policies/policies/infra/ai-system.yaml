# Namespace: ai-system  (vLLM, kagent, kagent MCP servers, flux-mcp, vm-mcp)
---
# NOTE: No standalone default-deny policy — Cilium rejects an empty deny-all
# (VALID: False, "rule must have at least one of Ingress/Egress"). Default-deny
# is implicit: the allow policies below all select endpointSelector: {} for
# ingress and/or egress, so any traffic not explicitly allowed is dropped.
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-egress-dns
  namespace: ai-system
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          # L7 DNS proxy — Cilium injects replies directly to the pod, avoiding
          # the conntrack reply-drop that breaks Go resolvers behind default-deny
          # ingress (see auth.yaml), and enables toFQDNs.
          rules:
            dns:
              - matchPattern: "*"
---
# kagent / k8s-agent / flux-mcp drive the Kubernetes & Flux APIs
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-egress-kube-apiserver
  namespace: ai-system
spec:
  endpointSelector: {}
  egress:
    - toEntities:
        - kube-apiserver
---
# In-namespace mesh: kagent <-> MCP servers <-> vLLM (port 8000)
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-intra-namespace
  namespace: ai-system
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ai-system
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ai-system
---
# kagent long-term memory -> cnpg-kagent Postgres (pgvector)
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-egress-to-postgres
  namespace: ai-system
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cnpg-system
            cnpg.io/cluster: cnpg-kagent
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
---
# CNPG's -rw Service is a ClusterIP. With bpf-LB + default-deny ingress, the
# Postgres SYN,ACK reply arrives reverse-NAT'd from the service VIP and misses
# the egress conntrack entry, so Cilium treats it as new ingress and drops it
# ("Policy denied", cnpg pod identity -> app). Allowing the DB return path fixes
# DB clients (DNS got the L7-proxy fix; ClusterIP TCP services need this).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-ingress-from-postgres
  namespace: ai-system
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cnpg-system
            cnpg.io/cluster: cnpg-kagent
---
# flux-agent drives the Flux Operator MCP server (flux-operator-mcp) which runs
# in flux-system on :9090. flux-system has no policies (allow-all), so only this
# egress allow is needed.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-egress-to-flux-mcp
  namespace: ai-system
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: flux-system
            app.kubernetes.io/name: flux-operator-mcp
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
---
# flux-operator-mcp reply path. The flux-operator-mcp Service is a ClusterIP;
# like cnpg above, its SYN,ACK arrives reverse-NAT'd from the service VIP and
# misses the egress conntrack entry, so Cilium treats it as new ingress to
# ai-system and drops it ("Policy denied"). Allowing the return path fixes the
# flux-agent -> flux-operator-mcp:9090 connection. Without this, kagent's
# RemoteMCPServer reconcile for flux-operator-mcp fails with
# "context deadline exceeded", stalling tool registration and (observed)
# blocking all agent invocations via the context server.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-ingress-from-flux
  namespace: ai-system
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: flux-system
            app.kubernetes.io/name: flux-operator-mcp
---
# LAN access to the kagent MCP server via the kagent-mcp-lan LoadBalancer
# (Cilium LBIPAM VIP 192.168.2.x -> kagent-controller:8083). ai-system is
# default-deny ingress, so without this, LAN clients (e.g. an editor on the
# LAN/VPN) hitting the LB VIP are dropped ("Policy denied", world identity ->
# controller:8083). Allow the private LAN (192.168.0.0/16, RFC1918) to the
# controller on 8083. That is LAN/VPN-only by construction -- the public
# internet is not in 192.168.0.0/16, so external traffic stays blocked.
# Scoped to the controller pod (not namespace-wide) to avoid opening every
# ai-system pod to the LAN. HTTP only, no auth -- rely on the LAN being trusted.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-ingress-from-lan-to-mcp
  namespace: ai-system
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: controller
      app.kubernetes.io/instance: kagent
      app.kubernetes.io/name: kagent
  ingress:
    - fromCIDR:
        - 192.168.0.0/16
      toPorts:
        - ports:
            - port: "8083"
              protocol: TCP
---
# vm-mcp queries VictoriaMetrics in observability
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-egress-to-observability
  namespace: ai-system
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
---
# vLLM pulls model weights from Hugging Face on first load of a NEW model,
# caching to the vllm-models PVC (already-cached models need no egress -- which
# is why this only surfaced on a model swap). HF serves metadata from
# huggingface.co but the weight bytes come from rotating Xet/LFS CDN hosts
# (*.xethub.hf.co, CloudFront, etc.) with no stable FQDN set, so this is a broad
# :443 egress scoped to the single vLLM pod.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-egress-vllm-huggingface
  namespace: ai-system
spec:
  endpointSelector:
    matchLabels:
      app: vllm
  egress:
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
# kagent agents need internet access for external APIs (Minimax, GitHub, etc.).
# This allows outbound HTTPS to the world for all agent pods. DNS is already
# allowed by allow-egress-dns.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-egress-internet
  namespace: ai-system
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/managed-by: kagent
  egress:
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
# Infinity embedding server needs internet access to download model weights
# (~2.4GB bge-m3) from Hugging Face on first boot. HF serves weights from
# rotating Xet/LFS CDN hosts (*.xethub.hf.co, CloudFront, etc.) with no
# stable FQDN, so this is a broad :443 egress scoped to the single embeddings
# pod. DNS is already allowed by allow-egress-dns.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-egress-embeddings-huggingface
  namespace: ai-system
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: embeddings
  egress:
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
# kagent MCP server exposed via the kagent-mcp.biggs.dog HTTPRoute
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-ingress-from-gateway
  namespace: ai-system
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: networking
            app.kubernetes.io/name: agentgateway
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: networking
            gateway.networking.k8s.io/gateway-class-name: agentgateway
---
# exa-mcp egress to Exa API. The server calls Exa's web search / fetch /
# research endpoints over HTTPS. No special FQDN is needed -- the broad
# internet egress with TLS allows exa.com and all its CDN hosts.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-egress-to-exa
  namespace: ai-system
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: exa-mcp
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-prometheus-scraping
  namespace: ai-system
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
