# Namespace: networking  (agentgateway data-plane + controller, k8s-gateway DNS)
# This is the cluster ingress edge; rules are intentionally broad so external
# entry and backend routing are never severed. cloudflared has been removed.
---
# NOTE: No standalone default-deny policy — Cilium rejects an empty deny-all
# (VALID: False, "rule must have at least one of Ingress/Egress"). Default-deny
# is implicit: the allow policies below all select endpointSelector: {} for
# ingress and/or egress, so any traffic not explicitly allowed is dropped.
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-egress-dns
  namespace: networking
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          # L7 DNS proxy — Cilium injects replies directly to the pod, avoiding
          # the conntrack reply-drop that breaks Go resolvers behind default-deny
          # ingress (see auth.yaml), and enables toFQDNs. Applies only to egress
          # toward CoreDNS; k8s-gateway's own DNS serving/forwarding is untouched.
          rules:
            dns:
              - matchPattern: "*"
---
# agentgateway: accept external/LB traffic and route to any in-cluster backend
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: agentgateway
  namespace: networking
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: agentgateway
  ingress:
    - fromEntities:
        - world
        - cluster
        - host
        - remote-node
  egress:
    - toEntities:
        - cluster
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
# agentgateway DATA PLANES: one Deployment per Gateway resource (e.g.
# wildcard-biggs-dog) selected by the shared gateway-class label. They receive
# external :443 and forward to in-cluster backends, and dial the agentgateway
# control plane for xDS (:9978, covered by toEntities cluster). The control-plane
# policy above only matches app.kubernetes.io/name=agentgateway, so without this
# every Gateway data plane is default-denied and *.biggs.dog ingress breaks.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: agentgateway-dataplane
  namespace: networking
spec:
  endpointSelector:
    matchLabels:
      gateway.networking.k8s.io/gateway-class-name: agentgateway
  ingress:
    - fromEntities:
        - world
        - cluster
        - host
        - remote-node
  egress:
    - toEntities:
        - cluster
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
# k8s-gateway: split-horizon DNS server; watches Gateway/HTTPRoute via API
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: k8s-gateway
  namespace: networking
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: k8s-gateway
  ingress:
    - fromEntities:
        - world
        - cluster
        - host
        - remote-node
      toPorts:
        # k8s-gateway's container listens on 1053 (non-root); the Service maps
        # 53 -> 1053, and Cilium enforces ingress on the TRANSLATED pod port.
        # Allowing only 53 silently drops every forwarded DNS query.
        - ports:
            - port: "1053"
              protocol: UDP
            - port: "1053"
              protocol: TCP
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
  egress:
    - toEntities:
        - kube-apiserver
        - cluster
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
---
# lan-dns: cluster-hosted LAN resolver (CoreDNS). Clients (via the UDM's DHCP
# DNS) query its LB VIP 192.168.6.16:53; it forwards biggs.dog -> k8s-gateway
# and everything else -> NextDNS over DoT. Like k8s-gateway, it listens on the
# TRANSLATED pod port 1053 (Service maps 53 -> 1053), so ingress allows both.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: lan-dns
  namespace: networking
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: lan-dns
  ingress:
    - fromEntities:
        - world
        - cluster
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "1053"
              protocol: UDP
            - port: "1053"
              protocol: TCP
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
  egress:
    # biggs.dog -> k8s-gateway (LB VIP .6.6 -> pod :1053). toEntities cluster
    # covers the LB-VIP datapath; the explicit endpoint keeps it tight.
    - toEntities:
        - cluster
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: networking
            app.kubernetes.io/name: k8s-gateway
      toPorts:
        - ports:
            - port: "1053"
              protocol: UDP
            - port: "1053"
              protocol: TCP
    # Encrypted upstream: NextDNS DoT (anycast 45.90.28.0 / 45.90.30.0 :853).
    - toCIDR:
        - 45.90.28.0/24
        - 45.90.30.0/24
      toPorts:
        - ports:
            - port: "853"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-prometheus-scraping
  namespace: networking
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
