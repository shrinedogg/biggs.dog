# Namespace: networking  (agentgateway data-plane + controller)
# This is the cluster ingress edge; rules are intentionally broad so external
# entry and backend routing are never severed.
---
# NOTE: No standalone default-deny policy — Cilium rejects an empty deny-all
# (VALID: False, "rule must have at least one of Ingress/Egress"). Default-deny
# is implicit: the allow policies below all select endpointSelector: {} for
# ingress and/or egress, so any traffic not explicitly allowed is dropped.
---
# DNS for all networking pods (agentgateway controllers, data planes).
# L7 DNS proxy — Cilium injects replies directly to the pod, avoiding
# the conntrack reply-drop that breaks Go resolvers behind default-deny ingress.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-egress-dns
  namespace: networking
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: coredns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
---
# agentgateway controller: accept external/LB traffic and route to any
# in-cluster backend.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: agentgateway
  namespace: networking
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: agentgateway
  ingress:
    - fromEntities:
        - world
        - cluster
        - host
        - remote-node
  egress:
    - toEntities:
        - cluster
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
# agentgateway DATA PLANES: one Deployment per Gateway resource (e.g.
# cluster0-gateway data plane) selected by the shared gateway-class label.
# They receive external :443 and forward to in-cluster backends, and dial the
# agentgateway control plane for xDS (:9978, covered by toEntities cluster).
# Without this, every Gateway data plane is default-denied and
# *.biggs.dog ingress breaks.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: agentgateway-dataplane
  namespace: networking
spec:
  endpointSelector:
    matchLabels:
      gateway.networking.k8s.io/gateway-class-name: agentgateway
  ingress:
    - fromEntities:
        - world
        - cluster
        - host
        - remote-node
  egress:
    - toEntities:
        - cluster
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
