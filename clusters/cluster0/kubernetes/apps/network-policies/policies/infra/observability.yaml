# Namespace: observability  (VictoriaMetrics/Logs + Grafana; scrapes the whole cluster)
---
# NOTE: No standalone default-deny policy — Cilium rejects an empty deny-all
# (VALID: False, "rule must have at least one of Ingress/Egress"). Default-deny
# is implicit: the allow policies below all select endpointSelector: {} for
# ingress and/or egress, so any traffic not explicitly allowed is dropped.
---
# Scrape/query the rest of the cluster + DNS, and reach external alert/notification
# and plugin endpoints over HTTPS.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-egress
  namespace: observability
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          # L7 DNS proxy — Cilium injects replies directly to the pod, avoiding
          # the conntrack reply-drop that breaks Go resolvers behind default-deny
          # ingress (see auth.yaml), and enables toFQDNs.
          rules:
            dns:
              - matchPattern: "*"
    - toEntities:
        - cluster
        - host
        - remote-node
        - kube-apiserver
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
# Intra-namespace (vmagent -> vmsingle, grafana -> datasources, etc.)
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-intra-namespace
  namespace: observability
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
---
# API server -> operator admission webhook (VMAgent, VMCluster, VMPodScrape, ...).
# Without this, kube-apiserver SYN packets to the operator's :9443 webhook
# server are dropped by the implicit default-deny (the other allow-* policies
# only cover intra-namespace + gateway ingress). Each of the operator's 24
# validating webhooks has failurePolicy=Ignore + timeoutSeconds=10, so a dropped
# webhook call blocks the API request for 10s before giving up -- this was the
# root cause of the control-plane / terminal latency on 192.168.2.29.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-ingress-webhook-from-apiserver
  namespace: observability
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: victoria-metrics-operator
  ingress:
    - fromEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "9443"
              protocol: TCP
---
# Grafana exposed via HTTPRoute
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-ingress-from-gateway
  namespace: observability
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: networking
            app.kubernetes.io/name: agentgateway
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: networking
            gateway.networking.k8s.io/gateway-class-name: agentgateway
---
# kagent's grafana-mcp server (ai-system/grafana-mcp) queries the Grafana HTTP
# API on :3000. Without this, grafana ingress is locked to the gateway only and
# the MCP's SYN is dropped (Policy denied) -- the grafana-mcp server can't fetch
# dashboards/datasources for the observability-agent.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-grafana-from-kagent-mcp
  namespace: observability
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ai-system
            app.kubernetes.io/name: grafana-mcp
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
