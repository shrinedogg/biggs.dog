# Namespace: media  (emby, bookboss, ersatz, nsyncd, in-cluster nfs server)
---
# NOTE: No standalone default-deny policy — Cilium rejects an empty deny-all
# (VALID: False, "rule must have at least one of Ingress/Egress"). Default-deny
# is implicit: the allow policies below all select endpointSelector: {} for
# ingress and/or egress, so any traffic not explicitly allowed is dropped.
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-egress-dns
  namespace: media
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          # L7 DNS proxy — Cilium injects replies directly to the pod, avoiding
          # the conntrack reply-drop that breaks Go resolvers behind default-deny
          # ingress (see auth.yaml), and enables toFQDNs.
          rules:
            dns:
              - matchPattern: "*"
---
# bookboss -> cnpg-bookboss Postgres
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-egress-to-postgres
  namespace: media
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cnpg-system
            cnpg.io/cluster: cnpg-bookboss
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
---
# CNPG's -rw Service is a ClusterIP; with bpf-LB + default-deny ingress the
# Postgres reply arrives reverse-NAT'd from the VIP and misses egress conntrack,
# so it's dropped as new ingress. Allow the DB return path (see ai-system.yaml).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-ingress-from-postgres
  namespace: media
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cnpg-system
            cnpg.io/cluster: cnpg-bookboss
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-ingress-from-gateway
  namespace: media
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: networking
            app.kubernetes.io/name: agentgateway
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: networking
            gateway.networking.k8s.io/gateway-class-name: agentgateway
---
# In-cluster NFS server (app=nfs, ClusterIP :2049). Nodes/kubelet mount it for
# media volumes, so the mount traffic arrives from host/remote-node (post
# socketLB translation it lands on the pod's 2049).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-nfs-from-nodes
  namespace: media
spec:
  endpointSelector:
    matchLabels:
      app: nfs
  ingress:
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "2049"
              protocol: TCP
---
# nsyncd is a scheduled sync Job that pushes/pulls media from an external host
# (observed: <remote>:20252). DNS is covered by allow-egress-dns above.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-egress-nsyncd
  namespace: media
spec:
  endpointSelector:
    matchLabels:
      app: nsyncd
  egress:
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "20252"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-prometheus-scraping
  namespace: media
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
