# Namespace: media  (emby, bookboss, ersatz, nsyncd, in-cluster nfs server)
---
# NOTE: No standalone default-deny policy — Cilium rejects an empty deny-all
# (VALID: False, "rule must have at least one of Ingress/Egress"). Default-deny
# is implicit: the allow policies below all select endpointSelector: {} for
# ingress and/or egress, so any traffic not explicitly allowed is dropped.
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-egress-dns
  namespace: media
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          # L7 DNS proxy — Cilium injects replies directly to the pod, avoiding
          # the conntrack reply-drop that breaks Go resolvers behind default-deny
          # ingress (see auth.yaml), and enables toFQDNs.
          rules:
            dns:
              - matchPattern: "*"
---
# Intra-namespace mesh: Ersatz streams from Emby, and media pods reach the
# in-cluster NFS server pod directly (pod-to-pod, distinct from the node mount
# path covered by allow-nfs-from-nodes).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-intra-namespace
  namespace: media
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: media
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: media
---
# bookboss -> cnpg-bookboss Postgres
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-egress-to-postgres
  namespace: media
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cnpg-system
            cnpg.io/cluster: cnpg-bookboss
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
---
# CNPG's -rw Service is a ClusterIP; with bpf-LB + default-deny ingress the
# Postgres reply arrives reverse-NAT'd from the VIP and misses egress conntrack,
# so it's dropped as new ingress. Allow the DB return path (see ai-system.yaml).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-ingress-from-postgres
  namespace: media
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cnpg-system
            cnpg.io/cluster: cnpg-bookboss
---
# BookBoss's native OIDC SSO discovers the Pocket ID provider via HTTPS.
# id.biggs.dog is served by the wildcard Gateway (networking/agentgateway)
# which terminates TLS and routes to pocket-id.auth.svc.cluster.local:1411.
# toFQDNs won't work here since id.biggs.dog resolves to a ClusterIP,
# so we allow egress to the Gateway pods by label selector.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-egress-to-pocket-id
  namespace: media
spec:
  endpointSelector:
    matchLabels:
      app: bookboss
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: networking
            app.kubernetes.io/name: agentgateway
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: networking
            gateway.networking.k8s.io/gateway-class-name: agentgateway
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-ingress-from-gateway
  namespace: media
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: networking
            app.kubernetes.io/name: agentgateway
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: networking
            gateway.networking.k8s.io/gateway-class-name: agentgateway
---
# In-cluster NFS server (app=nfs, ClusterIP :2049). Nodes/kubelet mount it for
# media volumes, so the mount traffic arrives from host/remote-node (post
# socketLB translation it lands on the pod's 2049).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-nfs-from-nodes
  namespace: media
spec:
  endpointSelector:
    matchLabels:
      app: nfs
  ingress:
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "2049"
              protocol: TCP
---
# nsyncd is a scheduled sync Job that pushes/pulls media from an external host
# (observed: <remote>:20252). DNS is covered by allow-egress-dns above.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-egress-nsyncd
  namespace: media
spec:
  endpointSelector:
    matchLabels:
      app: nsyncd
  egress:
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "20252"
              protocol: TCP
---
# volsync (restic mover Jobs) backs up to Backblaze B2 (b2:biggs-dog).
# Allow the mover pods outbound HTTPS to the B2 API/data endpoints.
#
# IMPORTANT: the native restic b2: backend spreads operations across TWO
# domains. Auth, listing and downloads hit *.backblazeb2.com
# (api/apiNNN/fNNN.backblazeb2.com), but b2_get_upload_url returns UPLOAD
# hosts on *.backblaze.com (e.g. pod-xxxx.backblaze.com). Without the
# *.backblaze.com allow, reads succeed but every WRITE -- including the repo
# LOCK created during restic's "check for dir initialized" -- is silently
# dropped by default-deny egress and hangs, so the mover never gets past the
# repository existence check. The S3 endpoint (s3.eu-central-003.backblazeb2.com)
# is also allowed in case the repo is switched to the s3: backend.
# toFQDNs relies on the L7 DNS rule on allow-egress-dns above.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-egress-volsync-b2
  namespace: media
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/created-by: volsync
  egress:
    - toFQDNs:
        - matchName: s3.eu-central-003.backblazeb2.com
        - matchName: backblazeb2.com
        - matchPattern: "*.backblazeb2.com"
        # B2 native-API upload pods live on *.backblaze.com (NOT backblazeb2.com).
        - matchName: backblaze.com
        - matchPattern: "*.backblaze.com"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
# ersatz (ErsatzTV) is exposed as a LAN-only LoadBalancer at ersatz.biggs.dog.
# Its IPTV/HLS feed is consumed by media players that can't do an OIDC login, so
# instead of pocket-id forward-auth we restrict reachability to the LAN at L3.
# externalTrafficPolicy: Local on the Service preserves the real client source
# IP (no node SNAT), so this fromCIDR match sees the actual LAN client and
# everything outside 192.168.0.0/16 is dropped by default-deny. In-cluster
# consumers (e.g. Emby) are already covered by allow-intra-namespace.
# NOTE: the Service maps 80 -> 8409; Cilium enforces ingress on the TRANSLATED
# pod port, so the rule targets 8409 (the container port), not the Service port.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-ingress-ersatz-lan
  namespace: media
spec:
  endpointSelector:
    matchLabels:
      app: ersatz
  ingress:
    - fromCIDR:
        - 192.168.0.0/16
      toPorts:
        - ports:
            - port: "8409"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-prometheus-scraping
  namespace: media
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
