# Namespace: auth  (dex OIDC IdP)
#
# cluster0's auth namespace contains only dex. dex is the OIDC provider for
# Omni, Image Factory, and NetBird (embedded IdP connector). HTTPRoute-backed
# at dex.biggs.dog -> gateway -> dex:5556.
---
# NOTE: No standalone default-deny policy — Cilium rejects an empty deny-all
# (VALID: False, "rule must have at least one of Ingress/Egress"). Default-deny
# is implicit: the allow policies below all select endpointSelector: {} for
# ingress and/or egress, so any traffic not explicitly allowed is dropped.
---
# DNS for dex. L7 proxy avoids the Go-resolver UDP conntrack reply-drop behind
# default-deny ingress.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-egress-dns
  namespace: auth
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchExpressions:
            - key: k8s:io.kubernetes.pod.namespace
              operator: In
              values: [kube-system]
            - key: k8s:k8s-app
              operator: In
              values: [coredns, kube-dns]
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
---
# dex serves at dex.biggs.dog via the agentgateway. Allow ingress from both
# the controller and the data-plane deployments. dex's Service maps 80->5556;
# allow both ports because Cilium enforces ingress on the TRANSLATED pod port
# (same gotcha as cluster1's k8s-gateway :1053).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-ingress-from-gateway
  namespace: auth
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: dex
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: networking
            app.kubernetes.io/name: agentgateway
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: networking
            gateway.networking.k8s.io/gateway-class-name: agentgateway
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "5556"
              protocol: TCP
---
# In-cluster OIDC clients (omni, image-factory-oauth2) reach dex
# directly via the `dex.auth.svc` ClusterIP or through the gateway public IP.
# Scoped to the specific client namespaces (strictest policy).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-ingress-from-oidc-clients
  namespace: auth
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: dex
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: omni
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "5556"
              protocol: TCP
---
# kubelet health/readiness probes.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-ingress-from-host
  namespace: auth
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: dex
  ingress:
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "5556"
              protocol: TCP
