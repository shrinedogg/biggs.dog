---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app network-policies-apps
  namespace: flux-system
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  # Policies carry their own explicit metadata.namespace, so no targetNamespace.
  path: ./clusters/cluster0/kubernetes/apps/network-policies/policies/apps
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: false
  interval: 3m
  retryInterval: 1m
  timeout: 2m
