  # policies were removed (deny is implicit via the endpointSelector:{} allows)
  # and every allow-egress-dns carries the L7 DNS rule. Watch the agentgateway
  # edge + ai-system control plane on first reconcile; if anything regresses:
  #   flux suspend kustomization network-policies-infra
  - ./infra-ks.yaml
