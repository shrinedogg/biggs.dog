apiVersion: apps/v1
kind: Deployment
metadata:
  name: windows
  labels:
    name: windows
spec:
  nodeSelector:
    feature.node.kubernetes.io/pci-10de.present: "true"
  replicas: 1
  selector:
    matchLabels:
      app: windows
  template:
    metadata:
      labels:
        app: windows
    spec:
      containers:
        - name: windows
          image: dockurr/windows:5.16
          env:
            - name: VERSION
              value: "11"
            - name: DISK_SIZE
              value: "700G"
          ports:
            - containerPort: 8006
              name: http
              protocol: TCP
            - containerPort: 3389
              name: rdp
              protocol: TCP
            - containerPort: 3389
              name: udp
              protocol: UDP
            - containerPort: 5900
              name: vnc
              protocol: TCP
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
            privileged: true
          resources:
            limits:
              nvidia.com/gpu: "1"
              memory: 42Gi
            requests:
              nvidia.com/gpu: "1"
              memory: 42Gi
          volumeMounts:
            - mountPath: /storage
              name: storage
            - mountPath: /dev/kvm
              name: dev-kvm
            - mountPath: /dev/net/tun
              name: dev-tun
      terminationGracePeriodSeconds: 120
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: windows-pvc
        - hostPath:
            path: /dev/kvm
            type: CharDevice
          name: dev-kvm
        - hostPath:
            path: /dev/net/tun
            type: CharDevice
          name: dev-tun
