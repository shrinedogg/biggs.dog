---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvidia-gpu-tuning
  namespace: dreamcast
  labels:
    app: nvidia-gpu-tuning
spec:
  selector:
    matchLabels:
      app: nvidia-gpu-tuning
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: nvidia-gpu-tuning
    spec:
      # Pin to the single RTX 5090 streaming node.
      nodeSelector:
        kubernetes.io/hostname: nv-01
      terminationGracePeriodSeconds: 10
      containers:
        - name: nvidia-smi-tuning
          # Slim glibc base; nvidia-smi + libnvidia-ml are CDI-injected from the
          # host at /usr/local/{bin,lib} when nvidia.com/gpu is requested.
          image: docker.io/library/ubuntu:26.04
          # nvidia-smi -pm/-pl/-lgc require root + the GPU control device.
          securityContext:
            privileged: true
            runAsUser: 0
          env:
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: utility
            - name: LD_LIBRARY_PATH
              value: /usr/local/lib
            # --- Tunable: mitigation for recurring Xid 109 (CTX SWITCH TIMEOUT) ---
            # RTX 5090 stock max boost is 3105 MHz / stock TDP 600W. Xid 109
            # (CTX SWITCH TIMEOUT) recurred under UE5/DX12 load (Windrose GPU
            # crash -> vkd3d-proton VK_ERROR_DEVICE_LOST -> UE5 ReportGPUCrash,
            # matching an NVRM Xid 109 in dmesg 1:1) at clock caps of 2850, 2800,
            # AND 2600 MHz. A 450W power cap (75% of stock) ALSO failed — the
            # crash reproduced at ~6% GPU util / ~82W, so this is NOT a power/
            # voltage/thermal transient. Conclusion: no nvidia-smi lever fixes it;
            # the Blackwell + open-RM-module Xid 109 instability is a driver/
            # firmware fault requiring a driver/vBIOS update (node-level, not
            # this repo). Clock kept at the documented 2800 MHz; power at stock.
            - name: GPU_CLOCK_MAX_MHZ
              value: "2500"
            - name: REAPPLY_INTERVAL_SECONDS
              value: "300"
          command:
            - /bin/bash
            - -c
            - |
              set -u
              SMI=/usr/local/bin/nvidia-smi
              echo "[gpu-tuning] applying: persistence=on power=stock(600W) gfx_clock_max=${GPU_CLOCK_MAX_MHZ}MHz"
              apply() {
                "${SMI}" -pm 1 || true
                "${SMI}" -lgc "0,${GPU_CLOCK_MAX_MHZ}" || true
              }
              apply
              "${SMI}" --query-gpu=persistence_mode,power.limit,clocks.max.gr --format=csv || true
              # Re-assert periodically in case the driver resets clocks/power.
              while true; do
                sleep "${REAPPLY_INTERVAL_SECONDS}"
                apply
              done
          resources:
            # Consumes one of the 4 time-sliced nvidia.com/gpu replicas (needed to
            # trigger CDI injection of nvidia-smi). Leaves 3 for streaming sessions.
            limits:
              nvidia.com/gpu: 1
            requests:
              cpu: 25m
              memory: 64Mi
