---
# yaml-language-server: $schema=https://github.com/games-on-whales/fenrir/raw/refs/heads/main/schemas/direwolf.games-on-whales.github.io/user_v1alpha1.json
apiVersion: direwolf.games-on-whales.github.io/v1alpha1
kind: User
metadata:
  # Upstream currently hardcodes the "alex" username; do not rename.
  name: alex
  namespace: dreamcast
spec:
  resources:
    limits:
      nvidia.com/gpu: "1"
      memory: 42G
    requests:
      nvidia.com/gpu: "1"
      memory: 42G
  sidecarPolicies:
    wolf:
      env:
        - name: NVIDIA_DRIVER_CAPABILITIES
          value: all
        - name: NVIDIA_VISIBLE_DEVICES
          value: all
        # wolf:stable must start as root: its supervisord.conf has user=root
        # and drops privileges per-program itself. The operator injects
        # PUID=1000/UNAME=ubuntu, making the GOW entrypoint gosu to a non-root
        # user before supervisord runs -> "Can't drop privilege as nonroot
        # user" crash loop. Policy env is appended after the operator's
        # defaults, so these duplicates win (kubelet keeps the last value).
        - name: PUID
          value: "0"
        - name: PGID
          value: "0"
        - name: UNAME
          value: root
      resources:
        requests:
          nvidia.com/gpu: "1"
          squat.ai/uinput: "1"
          cpu: 1000m
          memory: 2G
        limits:
          nvidia.com/gpu: "1"
          squat.ai/uinput: "1"
          cpu: 1000m
          memory: 2G
