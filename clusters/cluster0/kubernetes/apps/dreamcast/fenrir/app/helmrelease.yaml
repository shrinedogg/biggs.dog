---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fenrir
  namespace: dreamcast
spec:
  interval: 3m
  chartRef:
    kind: OCIRepository
    name: direwolf-operator
    namespace: flux-system
  # Upstream chart defaults are already correct for this cluster:
  # - moonlight-proxy LoadBalancer Service with lbipam.cilium.io/sharing-key: direwolf
  #   (Cilium LB-IPAM shares one LB IP between the proxy and per-session services)
  # - cert-manager Issuers/Certificates via rawResources (cert-manager is installed)
  values:
    # The SNAPSHOT chart was built from PR #7 and bakes the CI ref "7/merge"
    # into its image tags, which kubelet rejects (InvalidImageName). Override
    # all three with the published "main" tag (pullPolicy is Always upstream).
    controllers:
      direwolf_operator:
        containers:
          operator:
            image:
              # Patched fork: retries stream reconciliation (upstream stalls
              # the session until the 1-minute reaper kills it whenever
              # wolf-agent isn't up on the first try) and prunes stale
              # trackedSessions entries that spam the logs.
              # Built from https://github.com/shrinedogg/fenrir (tag v0.1.0).
              repository: docker.io/shrinedogg/direwolf-operator
              tag: v0.1.0
            # The operator's --lb-sharing-key defaults to POD_NAMESPACE
            # ("dreamcast"), but the chart's moonlight-proxy Service is
            # annotated with sharing-key "direwolf". Mismatched keys make
            # Cilium LB-IPAM hand the per-session RTP Service a *different*
            # external IP than the proxy, so Moonlight's RTSP handshake to
            # the paired IP:48010 times out (macOS errno 60). Align the key
            # so every session Service shares the proxy's LB IP.
            args:
              - --lb-sharing-key=direwolf
            env:
              # Patched fork: the agent acts as fake-udev for hotplugged
              # input devices (writes /run/udev/data entries to the shared
              # udev-data volume and broadcasts synthetic udev netlink
              # events in the pod netns) so SDL/Steam detect controllers.
              # Built from https://github.com/shrinedogg/fenrir (tag v0.1.0).
              AGENT_IMAGE: docker.io/shrinedogg/wolf-agent:v0.1.0
              # Patched wolf: from-source build adding HDR / HEVC Main10 support.
              # Compositor built from https://github.com/shrinedogg/gst-wayland-display
              # (branch feat/hdr-hevc-main10 @2e01aa9: 10-bit RGB10A2 producer caps +
              # color-management-v1 capture + BT.2020/PQ render, on top of the
              # fix/optional-wl-drm wl_drm fix). Wolf C++ from
              # https://github.com/shrinedogg/wolf (branch feat/hdr-hevc-main10):
              # HEVC Main10 P010 encode + Moonlight HDR-mode control signaling.
              # HDR is opt-in per session via WOLF_ENABLE_HDR=TRUE (see user.yaml
              # sidecarPolicies.wolf.env).
              WOLF_IMAGE: docker.io/shrinedogg/wolf:v0.2.0
      moonlight_proxy:
        containers:
          proxy:
            image:
              # Patched fork: /launch waits up to 120s (upstream 25s) for the
              # session pod to come up. A cold start (image pull + wolf boot +
              # agent readiness) exceeds 25s, so upstream returned 500 right
              # before the pod was ready and the client cancelled the session.
              # Built from https://github.com/shrinedogg/fenrir (tag v0.1.1).
              repository: docker.io/shrinedogg/moonlight-proxy
              tag: v0.1.1
