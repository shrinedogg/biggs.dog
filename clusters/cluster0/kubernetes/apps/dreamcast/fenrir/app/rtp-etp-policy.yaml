---
# The direwolf-operator creates a LoadBalancer Service per streaming session
# (named <user>-<app>-<id>-rtp) for the Moonlight RTSP/RTP ports. It exposes no
# knob for externalTrafficPolicy, so the Service defaults to Cluster, which lets
# the UDM ECMP-route the high-bitrate UDP video flow to any node and then SNAT-
# forward it to the GPU node (nv-01) where the session pod runs -- an extra
# inter-node hop that shows up as packet loss in Moonlight.
#
# This policy mutates those ephemeral Services to externalTrafficPolicy: Local
# at admission time so the shared LB IP (192.168.2.12) is advertised only from
# nv-01 and the stream lands directly on the pod's node. This requires the
# moonlight-proxy to be co-located on nv-01 and its Service to also be Local
# (handled by the fenrir HelmRelease postRenderer); otherwise the shared /32 is
# still advertised from other nodes and Local-policy would drop RTP packets that
# land on a node without the local backend.
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: direwolf-rtp-etp-local
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["services"]
  matchConditions:
    - name: in-dreamcast
      expression: "object.metadata.namespace == 'dreamcast'"
    - name: is-loadbalancer
      expression: "object.spec.type == 'LoadBalancer'"
    - name: is-session-rtp-svc
      expression: "object.metadata.name.endsWith('-rtp')"
  reinvocationPolicy: IfNeeded
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >
          Object{
            spec: Object.spec{
              externalTrafficPolicy: "Local"
            }
          }
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: direwolf-rtp-etp-local
spec:
  policyName: direwolf-rtp-etp-local
  matchResources: {}
