---
# Phase 0: CRDs — deploy first, no waiting for controllers
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gpu-arbiter-operator-crds
  namespace: flux-system
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: gpu-arbiter-operator-crds
  interval: 3m
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./clusters/cluster0/kubernetes/apps/dreamcast/gpu-arbiter-operator/crds
  prune: true
  wait: false
  timeout: 2m
  force: true
---
# Phase 0.5: Cross-namespace RBAC for operator in ai-system — must exist before operator
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gpu-arbiter-ai-system-rbac
  namespace: flux-system
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: gpu-arbiter-ai-system-rbac
  interval: 3m
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./clusters/cluster0/kubernetes/apps/dreamcast/gpu-arbiter-operator/ai-system-rbac
  prune: true
  wait: false
  timeout: 2m
  force: true
---
# Phase 1: Operator deployment — waits for CRDs and cross-namespace RBAC
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app gpu-arbiter-operator
  namespace: flux-system
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  interval: 3m
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./clusters/cluster0/kubernetes/apps/dreamcast/gpu-arbiter-operator/app
  prune: true
  wait: true
  timeout: 2m
  dependsOn:
    - name: gpu-arbiter-operator-crds
    - name: gpu-arbiter-ai-system-rbac
  images:
    - name: shrinedogg/gpu-arbiter-operator
      newTag: "v0.1.1"
