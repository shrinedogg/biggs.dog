---
# Deploy cross-namespace RBAC for gpu-arbiter in ai-system
# This must be created before the operator can scale vLLM
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gpu-arbiter-ai-system-rbac
  namespace: flux-system
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: gpu-arbiter-ai-system-rbac
  interval: 3m
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./clusters/cluster0/kubernetes/apps/dreamcast/gpu-arbiter-operator/ai-system-rbac
  prune: true
  wait: false
  timeout: 2m
  force: true
