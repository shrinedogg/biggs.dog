---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app gpu-arbiter
  namespace: flux-system
spec:
  # NOTE: intentionally NO targetNamespace. This app ships namespaced resources
  # in BOTH dreamcast (SA, Role, RoleBinding, Deployment) and ai-system (Role +
  # RoleBinding to scale vllm), plus a cluster-scoped MutatingAdmissionPolicy.
  # A targetNamespace would rewrite every namespaced object into one namespace
  # via the kustomize namespace transformer and break the cross-namespace RBAC,
  # so each manifest sets its own namespace explicitly.
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./clusters/cluster0/kubernetes/apps/dreamcast/gpu-arbiter/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  interval: 3m
  retryInterval: 1m
  timeout: 2m
  dependsOn:
    # Ensures the GPU operator (DCGM exporter -> DCGM_FI_DEV_FB_FREE in VM) is
    # reconciled before the arbiter that reads that metric.
    - name: nv-gpu-operator
