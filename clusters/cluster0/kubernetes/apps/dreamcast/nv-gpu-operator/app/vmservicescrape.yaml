---
# Scrape the gpu-operator's DCGM exporter into VictoriaMetrics. Without this
# nothing collects DCGM_FI_DEV_XID_ERRORS / GPU temp / power / clocks, which is
# why the nv-01 hard-freeze (suspected GPU Xid 109 CTX_SWITCH_TIMEOUT under
# load) could not be root-caused from metrics. The vmagent (observability/stack)
# runs with selectAllByDefault=true, so this VMServiceScrape is auto-discovered.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: nvidia-dcgm-exporter
  namespace: dreamcast
spec:
  selector:
    matchLabels:
      app: nvidia-dcgm-exporter
  endpoints:
    - port: gpu-metrics
      path: /metrics
      interval: 60s
      scrapeTimeout: 10s
      # DCGM exporter talks to NVML via libnvidia-ml; under load or thermal stress
      # the NVML call chain can stall. 60s interval gives enough headroom for NVML
      # to complete under contention; 10s timeout catches genuinely hung scrapes
      # without dropping samples during normal GPU load spikes.
      honorLabels: true
      # Pre-scrape: save the discovery-level namespace so we can use it later
      # in metricRelabelings (where __meta_* labels are already stripped).
      relabelings:
        - action: replace
          sourceLabels: [__meta_kubernetes_namespace]
          targetLabel: scrape_namespace
      # Post-scrape: swap the labels so `namespace` matches the scrape target's
      # own namespace (dashboard-compatible) while the GPU consumer namespace
      # is preserved separately.
      metricRelabelings:
        - action: replace
          sourceLabels: [namespace]
          targetLabel: workload_namespace
        - action: replace
          sourceLabels: [scrape_namespace]
          targetLabel: namespace
