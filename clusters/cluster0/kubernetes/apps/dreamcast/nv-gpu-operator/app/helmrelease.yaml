---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nv-gpu-operator
  namespace: dreamcast
spec:
  interval: 3m
  chart:
    spec:
      chart: gpu-operator
      version: 26.3.2
      sourceRef:
        kind: HelmRepository
        name: nvidia
        namespace: flux-system
  values:
    nfd:
      enabled: true
