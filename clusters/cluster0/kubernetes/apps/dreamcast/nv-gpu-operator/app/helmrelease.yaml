---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nv-gpu-operator
  namespace: dreamcast
spec:
  interval: 3m
  chart:
    spec:
      chart: gpu-operator
      version: 26.3.2
      sourceRef:
        kind: HelmRepository
        name: nvidia
        namespace: flux-system
  values:
    nfd:
      enabled: true
    # Talos provides the driver via the nonfree-kmod-nvidia system extension.
    driver:
      enabled: false
    # Talos provides nvidia-container-toolkit via system extension + machine config;
    # the operator cannot mutate the immutable Talos host, so keep it disabled.
    toolkit:
      enabled: false
    operator:
      defaultRuntime: containerd
    # Time-slice the single physical GPU into 4 schedulable nvidia.com/gpu
    # replicas: fenrir session pods need one for the wolf sidecar and one for
    # the game container, so a single GPU is not enough without sharing.
    devicePlugin:
      config:
        create: true
        name: time-slicing-config
        default: time-slicing
        data:
          time-slicing: |-
            version: v1
            sharing:
              timeSlicing:
                resources:
                  - name: nvidia.com/gpu
                    replicas: 4
