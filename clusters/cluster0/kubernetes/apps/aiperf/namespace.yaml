apiVersion: v1
kind: Namespace
metadata:
  name: aiperf
  labels:
    # The AIPerfJob benchmark JobSet pods (controller + workers) are created by
    # the aiperf operator into this namespace. Follow the cluster0 house
    # pattern (omni/ci/openebs) with privileged (non-enforced) rather than
    # invent a third profile.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
