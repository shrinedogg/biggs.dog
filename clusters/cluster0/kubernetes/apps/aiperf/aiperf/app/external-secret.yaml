---
# Mirror of the cluster1 ai-system/kagent-vllm ExternalSecret: pulls the SAME
# 1Password item (vllm-api-key / field api-key, biggs-dog vault) into the
# aiperf namespace via the onepassword-connect ClusterSecretStore, so the
# AIPerfJob benchmark pods carry the vLLM bearer. The AIPerfJob CR's
# endpoint.apiKey (${OPENAI_API_KEY}) is substituted from this secret's
# OPENAI_API_KEY key (wired via the CR's podTemplate env secretKeyRef).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aiperf-vllm
  namespace: aiperf
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: aiperf-vllm
    creationPolicy: Owner
    template:
      data:
        # Consumed by the AIPerfJob benchmark pods.
        OPENAI_API_KEY: "{{ .apiKey }}"
  data:
    - secretKey: apiKey
      remoteRef:
        key: vllm-api-key
        property: "api-key"
