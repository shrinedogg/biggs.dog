apiVersion: apps/v1
kind: Deployment
metadata:
  name: netbird-dashboard
  namespace: netbird
  labels:
    app.kubernetes.io/name: netbird
    app.kubernetes.io/component: dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: netbird
      app.kubernetes.io/component: dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: netbird
        app.kubernetes.io/component: dashboard
    spec:
      containers:
        - name: netbird-dashboard
          image: netbirdio/dashboard:v0.31.0
          env:
            - name: NETBIRD_MANAGEMENT_ENDPOINT
              value: http://netbird-server.netbird.svc.cluster.local:4222
            - name: NETBIRD_SIGNAL_ENDPOINT
              value: http://netbird-server.netbird.svc.cluster.local:4223
          ports:
            - containerPort: 5100
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
