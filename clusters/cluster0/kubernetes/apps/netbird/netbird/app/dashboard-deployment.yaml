# NetBird dashboard (embedded nginx serving the web UI on port 80).
# Auth goes through the combined server's embedded IdP at
# https://netbird.biggs.dog/oauth2 (dex.biggs.dog is attached to it as an
# upstream connector); the dashboard itself only ever talks to the embedded
# IdP, hence the static netbird-dashboard client below.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netbird-dashboard
  namespace: netbird
  labels:
    app.kubernetes.io/name: netbird
    app.kubernetes.io/component: dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: netbird
      app.kubernetes.io/component: dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: netbird
        app.kubernetes.io/component: dashboard
    spec:
      containers:
        - name: netbird-dashboard
          image: netbirdio/dashboard:v2.90.10
          env:
            # Endpoints (REST + gRPC share the public host; calls are made
            # from users' browsers, so these must be the external URL).
            - name: NETBIRD_MGMT_API_ENDPOINT
              value: https://netbird.biggs.dog
            - name: NETBIRD_MGMT_GRPC_API_ENDPOINT
              value: https://netbird.biggs.dog
            # OIDC — embedded IdP served by netbird-server at /oauth2.
            - name: AUTH_AUTHORITY
              value: https://netbird.biggs.dog/oauth2
            - name: AUTH_CLIENT_ID
              value: netbird-dashboard
            - name: AUTH_CLIENT_SECRET
              value: ""
            - name: AUTH_AUDIENCE
              value: netbird-dashboard
            - name: AUTH_SUPPORTED_SCOPES
              value: openid profile email groups
            - name: AUTH_REDIRECT_URI
              value: /nb-auth
            - name: AUTH_SILENT_REDIRECT_URI
              value: /nb-silent-auth
            - name: USE_AUTH0
              value: "false"
            # TLS terminates at cluster0-gateway; embedded nginx serves HTTP.
            - name: LETSENCRYPT_DOMAIN
              value: none
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
