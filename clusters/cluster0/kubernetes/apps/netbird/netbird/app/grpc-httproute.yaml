apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: netbird-grpc
  namespace: netbird
  labels:
    app.kubernetes.io/name: netbird
    app.kubernetes.io/component: grpc
  annotations:
    agentgateway.dev/backend-protocol: "h2c"
spec:
  parentRefs:
    - name: cluster0-gateway
      namespace: networking
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /signalexchange.SignalExchange
      backendRefs:
        - name: netbird-server
          port: 4223
    - matches:
        - path:
            type: PathPrefix
            value: /management.ManagementService
      backendRefs:
        - name: netbird-server
          port: 4222
