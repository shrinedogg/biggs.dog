# HTTP(S)/websocket routes for the combined server + dashboard.
# Path split mirrors upstream's reference reverse-proxy config:
#   /relay, /ws-proxy, /api, /oauth2 -> netbird-server (single HTTP port)
#   /                                -> dashboard (catch-all)
# Native gRPC paths live in grpc-httproute.yaml (h2c backend).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: netbird
  namespace: netbird
  labels:
    app.kubernetes.io/name: netbird
  annotations:
    # WAN name after the cluster1 rebuild: cluster1's gateway gets a
    # route for this hostname (cross-cluster backend to the cluster0
    # gateway VIP) and cluster1's external-dns CNAMEs it to
    # home.biggs.dog. Until then its A record points at 192.168.2.31
    # (LAN) via the same manual-record batch as omni/factory.
spec:
  parentRefs:
    - name: cluster0-gateway
      namespace: networking
  hostnames:
    - netbird.biggs.dog
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: netbird-server
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /ws-proxy
      backendRefs:
        - name: netbird-server
          port: 80
      # Long-lived websocket stream; override agentgateway's 15s default
      # (upstream recommends ~1 day for websocket/gRPC connections).
      timeouts:
        request: 24h
    - matches:
        - path:
            type: PathPrefix
            value: /relay
      backendRefs:
        - name: netbird-server
          port: 80
      # Long-lived websocket stream (see /ws-proxy note).
      timeouts:
        request: 24h
    - matches:
        - path:
            type: PathPrefix
            value: /oauth2
      backendRefs:
        - name: netbird-server
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: netbird-dashboard
          port: 80
