# The combined server multiplexes management (REST + gRPC), signal (gRPC),
# relay (websocket) and the embedded IdP on a single HTTP port. Only STUN
# needs a separate (UDP LoadBalancer) exposure.
apiVersion: v1
kind: Service
metadata:
  name: netbird-server
  namespace: netbird
  labels:
    app.kubernetes.io/name: netbird
    app.kubernetes.io/component: server
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: netbird
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: netbird-dashboard
  namespace: netbird
  labels:
    app.kubernetes.io/name: netbird
    app.kubernetes.io/component: dashboard
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: netbird
    app.kubernetes.io/component: dashboard
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
---
# STUN (UDP 3478) exposure.
#
# On-prem single-node cluster0 (2026-09 migration): UDP 3478 rides the node's
# own IP 192.168.2.31 via Cilium LB-IPAM (sharing key cluster0-edge) -- the UpCloud Managed LB had no UDP mode, which forced
# externalIPs; that workaround is gone. NetBird advertises STUN as
# stun:netbird.biggs.dog:3478; after the cluster1 rebuild netbird.biggs.dog
# CNAMEs to home.biggs.dog (cluster1's external-dns + ddns) and the UDM
# forwards UDP 3478 here. Until then its A record is 192.168.2.31 (LAN).
apiVersion: v1
kind: Service
metadata:
  name: netbird-stun
  namespace: netbird
  labels:
    app.kubernetes.io/name: netbird
    app.kubernetes.io/component: server
  annotations:
    lbipam.cilium.io/ips: 192.168.2.31
    lbipam.cilium.io/sharing-key: cluster0-edge
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: netbird
    app.kubernetes.io/component: server
  ports:
    - name: stun
      port: 3478
      targetPort: 3478
      protocol: UDP
