# The combined server multiplexes management (REST + gRPC), signal (gRPC),
# relay (websocket) and the embedded IdP on a single HTTP port. Only STUN
# needs a separate (UDP LoadBalancer) exposure.
apiVersion: v1
kind: Service
metadata:
  name: netbird-server
  namespace: netbird
  labels:
    app.kubernetes.io/name: netbird
    app.kubernetes.io/component: server
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: netbird
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: netbird-dashboard
  namespace: netbird
  labels:
    app.kubernetes.io/name: netbird
    app.kubernetes.io/component: dashboard
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: netbird
    app.kubernetes.io/component: dashboard
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: netbird-stun
  namespace: netbird
  labels:
    app.kubernetes.io/name: netbird
    app.kubernetes.io/component: server
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: netbird
    app.kubernetes.io/component: server
  ports:
    - name: stun
      port: 3478
      targetPort: 3478
      protocol: UDP
