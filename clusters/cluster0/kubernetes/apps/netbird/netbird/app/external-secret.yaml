# Materializes secret "netbird-server-config" (key: config.yaml) consumed by
# the netbird-server Deployment. The combined server (netbird-server) reads
# secrets from its config file only — there are no env-var hooks for the
# store encryption key or relay auth secret — so the whole config is
# templated here (same pattern as dex-config).
#
# 1Password items required (biggs-dog vault):
#   - netbird-datastore-encryption-key (password) — MUST be a base64-encoded
#     32-byte key (e.g. `openssl rand -base64 32`). Encrypts sensitive fields
#     in the SQLite store; changing it makes existing encrypted data
#     unreadable.
#   - netbird-relay-secret (password) — shared secret for relay auth.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbird-server-config
  namespace: netbird
  labels:
    app.kubernetes.io/name: netbird
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: netbird-server-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        config.yaml: |
          server:
            # Single multiplexed port for Management (REST + gRPC), Signal
            # (gRPC), Relay (websocket) and the embedded IdP. TLS terminates
            # at cluster0-gateway; gRPC paths are routed with h2c.
            listenAddress: ":80"
            exposedAddress: "https://netbird.biggs.dog:443"
            metricsPort: 9090
            healthcheckAddress: ":9000"
            logLevel: "info"
            logFile: "console"
            dataDir: "/var/lib/netbird/"
            disableAnonymousMetrics: true
            authSecret: "{{ .relaySecret }}"
            reverseProxy:
              # agentgateway is the single proxy hop in front of the server.
              trustedHTTPProxiesCount: 1
            auth:
              # Embedded IdP (Dex) served by netbird itself at /oauth2.
              # The existing dex.biggs.dog IdP is attached as an upstream OIDC
              # connector at runtime (dashboard -> Settings -> Identity
              # Provider) using the "netbird" static client from the dex
              # config (callback https://netbird.biggs.dog/oauth2/callback).
              # First admin is bootstrapped via the dashboard /setup flow.
              issuer: "https://netbird.biggs.dog/oauth2"
              dashboardRedirectURIs:
                - "https://netbird.biggs.dog/nb-auth"
                - "https://netbird.biggs.dog/nb-silent-auth"
              cliRedirectURIs:
                - "http://localhost:53000/"
                - "http://localhost:54000/"
              dashboardPostLogoutRedirectURIs:
                - "https://netbird.biggs.dog/"
            store:
              engine: "sqlite"
              # Defaults to {dataDir}/store.db on the netbird-data PVC.
              encryptionKey: "{{ .encryptionKey }}"
  data:
    - secretKey: encryptionKey
      remoteRef:
        key: netbird-datastore-encryption-key
        property: password
    - secretKey: relaySecret
      remoteRef:
        key: netbird-relay-secret
        property: password
