apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: manticore
  namespace: manticore
spec:
  interval: 3m
  chart:
    spec:
      chart: manticoresearch
      version: 15.1.0
      sourceRef:
        kind: HelmRepository
        name: manticore
        namespace: flux-system
  values:
    persistence:
      enabled: true
      storageClass: "host-path"