---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: renovate
  namespace: renovate
spec:
  hostnames:
  - renovate.biggs.dog
  parentRefs:
  - name: wildcard-biggs-dog
    namespace: networking
  rules:
  - backendRefs:
    - name: renovate-service
      port: 8080
    matches:
    - path:
        type: PathPrefix
        value: /webhook