apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: windrose
  namespace: games
spec:
  interval: 3m
  chart:
    spec:
      chart: windrose
      version: 1.2.2
      sourceRef:
        kind: HelmRepository
        name: windrose
        namespace: flux-system
  values:
    resources:
      limits:
        memory: 15Gi
      requests:
        memory: 15Gi
    windroseDedicatedServer:
      port: 28050
      volumeStorageSize: "5Gi"
      existingSecret: "windrose-secret"
    instances:
      - name: "The_Bridge"
        inviteCode: "$$!1769!$$"
        maxPlayerCount: "4"
        userSelectedRegion: "EU"
        service:
          type: LoadBalancer
          externalTrafficPolicy: Cluster
          metadata:
            labels: {}
            annotations: {}
