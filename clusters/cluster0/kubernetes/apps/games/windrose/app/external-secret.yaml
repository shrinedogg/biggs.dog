apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: windrose-secret
  namespace: games
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    creationPolicy: Owner
    template:
      data:
        windrose-0: |
          PASSWORD={{ .password }}
  data:
    - secretKey: password
      remoteRef:
        key: windrose-password
        property: "password"
