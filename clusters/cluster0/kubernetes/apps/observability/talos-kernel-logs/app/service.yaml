---
# LoadBalancer VIP so the Talos node host can reach the relay.
#
# Background: the LB pool (192.168.6.6-254) lives off the nodes' own
# 192.168.2.0/24 subnet. LB IPs are BGP-advertised (no L2/ARP), so a VIP inside
# the nodes' /24 would be unreachable FROM a node (it ARPs locally and gets no
# answer). Because the whole pool is off-subnet, a node routes this VIP via the
# gateway -> UDM (BGP route) -> back into the cluster, so nodes (and LAN clients)
# can reach it. The IP is pinned so the address referenced by the Omni
# KmsgLogConfig patch (tcp://192.168.6.14:5170) stays stable.
#
# clusterIP is also pinned and kept as an in-cluster fallback target.
apiVersion: v1
kind: Service
metadata:
  name: talos-kernel-log-relay
  namespace: observability
  annotations:
    io.cilium/lb-ipam-ips: "192.168.6.14"
spec:
  type: LoadBalancer
  clusterIP: "10.109.199.29"
  selector:
    app.kubernetes.io/name: talos-kernel-log-relay
  ports:
    - name: kmsg
      port: 5170
      targetPort: 5170
      protocol: TCP
