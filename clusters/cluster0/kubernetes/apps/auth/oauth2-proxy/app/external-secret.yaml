# Materializes secret "oauth2-proxy" with the keys the chart expects via
# config.existingSecret: client-id, client-secret, cookie-secret.
#
# 1Password item required (biggs-dog vault): oauth2-proxy
#   client-id      — OIDC client ID from the Pocket ID client you create for
#                    oauth2-proxy (callback https://auth.biggs.dog/oauth2/callback).
#   client-secret  — OIDC client secret from that same Pocket ID client.
#   cookie-secret  — random 32-byte cookie key, e.g.
#                    `openssl rand -base64 32 | head -c 32 | base64`
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oauth2-proxy
  namespace: auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: oauth2-proxy
    creationPolicy: Owner
  data:
    - secretKey: client-id
      remoteRef:
        key: oauth2-proxy
        property: client-id
    - secretKey: client-secret
      remoteRef:
        key: oauth2-proxy
        property: client-secret
    - secretKey: cookie-secret
      remoteRef:
        key: oauth2-proxy
        property: cookie-secret
