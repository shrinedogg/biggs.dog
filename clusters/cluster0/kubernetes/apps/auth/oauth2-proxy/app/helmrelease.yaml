---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: oauth2-proxy
  namespace: auth
spec:
  interval: 3m
  chart:
    spec:
      chart: oauth2-proxy
      version: 10.7.0
      sourceRef:
        kind: HelmRepository
        name: oauth2-proxy
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    # client-id / client-secret / cookie-secret come from the oauth2-proxy
    # ExternalSecret (1Password item oauth2-proxy).
    config:
      existingSecret: oauth2-proxy
      configFile: |-
        provider = "oidc"
        provider_display_name = "Pocket ID"
        oidc_issuer_url = "https://id.biggs.dog"
        redirect_url = "https://auth.biggs.dog/oauth2/callback"
        # Auth-only forward-auth: return 202 to authenticated probes from the
        # gateway/other apps rather than proxying a real upstream.
        upstreams = ["static://202"]
        email_domains = ["*"]
        scope = "openid email profile groups"
        code_challenge_method = "S256"
        # Behind the agentgateway (TLS terminated upstream); share cookies across
        # every *.biggs.dog service so it can guard them.
        reverse_proxy = "true"
        # Only the in-cluster agentgateway (pod CIDR) may set X-Forwarded-* —
        # prevents direct callers from spoofing forwarded headers.
        trusted_proxy_ips = ["10.244.0.0/16"]
        cookie_domains = [".biggs.dog"]
        whitelist_domains = [".biggs.dog"]
        cookie_secure = "true"
        cookie_samesite = "lax"
        # Expose identity to protected upstreams via X-Auth-Request-* headers.
        set_xauthrequest = "true"
        pass_access_token = "true"
    # Redis-backed sessions (via Dragonfly). Keeps the browser cookie a small
    # session ticket instead of a chunked multi-KB cookie holding the access /
    # id / refresh tokens — the large cookie didn't survive the agentgateway
    # ext-authz subrequest to /oauth2/auth, causing a forward-auth redirect loop.
    sessionStorage:
      type: redis
      redis:
        clientType: standalone
        standalone:
          connectionUrl: redis://dragonfly-db.dragonfly.svc.cluster.local:6379
    # The chart's built-in waitForRedis init container only renders for the
    # bundled redis subchart (it watches the redis master pod via the API), so
    # it does nothing for our external Dragonfly. Keep it disabled.
    initContainers:
      waitForRedis:
        enabled: false
    # Custom gate for external Dragonfly. This guards against a Cilium
    # pod-startup race: a freshly-created endpoint's egress (incl. DNS) is
    # briefly denied for the first ~15s. oauth2-proxy's go-redis client fires
    # immediately, exhausts its 5 retries on DNS i/o timeout, and exits (code 2)
    # before the window clears -> CrashLoopBackOff. This retry loop blocks until
    # dragonfly-db:6379 resolves + accepts a TCP connection, so the main
    # container boots into a working network and connects to Redis first try.
    extraInitContainers:
      - name: wait-for-dragonfly
        image: busybox:1.36
        command:
          - sh
          - -c
          - |
            echo "waiting for dragonfly-db.dragonfly.svc.cluster.local:6379 ..."
            until nc -z -w2 dragonfly-db.dragonfly.svc.cluster.local 6379; do
              echo "  not reachable yet (DNS/egress warming up), retrying in 2s"
              sleep 2
            done
            echo "dragonfly reachable; starting oauth2-proxy"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65534
          runAsGroup: 65534
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 32Mi
    podDisruptionBudget:
      enabled: false
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 128Mi
