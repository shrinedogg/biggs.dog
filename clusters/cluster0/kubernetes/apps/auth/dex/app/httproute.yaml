apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dex
  namespace: auth
  labels:
    app.kubernetes.io/name: dex
  annotations:
    # LAN-only name: Cloudflare holds a MANUAL A record -> 192.168.2.31
    # (public zone, private value; never port-forwarded).
spec:
  hostnames:
    - dex.biggs.dog
  parentRefs:
    - name: cluster0-gateway
      namespace: networking
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: dex
          port: 80
