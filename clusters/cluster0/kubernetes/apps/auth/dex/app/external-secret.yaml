# Materializes secret "dex-config" (key: config.yaml) consumed by the
# dex Deployment.
#
# 1Password items required (biggs-dog vault):
#   - dex-admin-password    (hash)       — bcrypt password hash for static admin.
#   - dex-omni-client-secret (secret)    — OIDC client secret for Omni.
#   - dex-netbird-client-secret (secret) — OIDC client secret for NetBird.
#
# NOTE on the "netbird" client: the NetBird combined server (>= v0.65) always
# authenticates its dashboard/CLI against its own embedded IdP at
# https://netbird.biggs.dog/oauth2. This dex is attached to that embedded IdP
# as an UPSTREAM OIDC CONNECTOR (configured at runtime in the NetBird
# dashboard: Settings -> Identity Provider; issuer https://dex.biggs.dog,
# client id "netbird", secret from dex-netbird-client-secret). The
# /oauth2/callback redirect URI below is the embedded IdP's connector
# callback — the NetBird dashboard never talks to dex directly. The NetBird
# UI shows the exact redirect URL when creating the connector; if it differs
# (e.g. /oauth2/callback/<connector-id>), add that URI to the list below.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dex-config
  namespace: auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: dex-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        config.yaml: |
          issuer: https://dex.biggs.dog
          # Stateless mgmt IdP: clients and the admin password live in this
          # config, so memory storage is sufficient (single replica; tokens
          # do not survive restarts, which is fine for interactive logins).
          storage:
            type: memory
          # Required for staticPasswords.
          enablePasswordDB: true
          web:
            http: 0.0.0.0:5556
          staticClients:
            - id: omni
              redirectURIs:
                # Omni's actual OIDC callback path (what it sends as
                # redirect_uri). The earlier /Callback and /callback entries
                # were guesses and caused dex 'bad request' (redirect_uri
                # mismatch) -- Omni uses /oidc/consume.
                - https://omni.biggs.dog/oidc/consume
                - https://omni.biggs.dog/Callback
                - https://omni.biggs.dog/callback
              secret: "{{ .omniSecret }}"
              name: Omni
            - id: netbird
              redirectURIs:
                - https://netbird.biggs.dog/oauth2/callback
              secret: "{{ .netbirdSecret }}"
              name: NetBird
          staticPasswords:
            # IMPORTANT: the email MUST be a properly-formatted address (a bare
            # username like 'admin' produces an OIDC email claim that consumers
            # validate as a real email). It ALSO MUST match Omni's
            # --initial-users (jshriner@protonmail.com) so the logged-in user is
            # recognized as an Omni admin; any other address logs in but with no
            # Omni rights. Login at the dex prompt is this email + the password
            # from the dex-admin-password 1Password item.
            - email: jshriner@protonmail.com
              hash: "{{ .hash }}"
              username: admin
              connectorId: local
          connectors: []
          frontend:
            logo: /logo.png
  data:
    - secretKey: hash
      remoteRef:
        key: dex-admin-password
        property: hash
    - secretKey: omniSecret
      remoteRef:
        key: dex-omni-client-secret
        property: secret
    - secretKey: netbirdSecret
      remoteRef:
        key: dex-netbird-client-secret
        property: secret
