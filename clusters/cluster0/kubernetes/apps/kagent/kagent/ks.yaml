---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app kagent
  namespace: flux-system
spec:
  dependsOn:
    # CRDs (kagent + kmcp) must exist before the controller starts.
    - name: kagent-crds
    # agent-sandbox CRDs/controller must exist before SandboxAgent reconciliation.
    - name: agent-sandbox
    # The local model endpoint + shared API key secret must be ready.
    - name: vllm
  targetNamespace: kagent
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./clusters/cluster0/kubernetes/apps/kagent/kagent/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  interval: 3m
  retryInterval: 1m
  timeout: 5m
