---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app kagent
  namespace: flux-system
spec:
  dependsOn:
    # CRDs (kagent + kmcp) must exist before the controller starts.
    - name: kagent-crds
    # The local model endpoint + shared API key secret must be ready.
    - name: vllm
  targetNamespace: kagent
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./clusters/cluster0/kubernetes/apps/kagent/kagent/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  interval: 3m
  retryInterval: 1m
  timeout: 5m
  # Single knob for the kagent chart version. Flux can't feed an OCIRepository's
  # resolved tag into a HelmRelease post-renderer, so this variable carries it:
  # the HelmRelease interpolates ${KAGENT_VERSION} to pin the controller/ui
  # image tags and the version label (otherwise they inherit Flux's
  # "<ver>+<digest>" build metadata, which is an illegal Docker tag and label
  # value). Keep this in sync with the tag in
  # ./clusters/cluster0/flux-system/sources/kagent-oci.yaml.
  postBuild:
    substitute:
      KAGENT_VERSION: "0.9.7"
