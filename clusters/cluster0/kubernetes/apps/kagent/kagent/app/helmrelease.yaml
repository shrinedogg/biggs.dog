---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kagent
  namespace: kagent
spec:
  interval: 3m
  chartRef:
    kind: OCIRepository
    name: kagent
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    # ------------------------------------------------------------------
    # Default model provider -> our in-cluster vLLM (OpenAI-compatible).
    # The chart renders a ModelConfig named "default-model-config" that
    # the built-in agents use. Pointing it at vLLM keeps everything local.
    # ------------------------------------------------------------------
    providers:
      default: openAI
      openAI:
        provider: OpenAI
        # Must match vLLM's --served-model-name.
        model: "cyankiwi/Qwen3.6-27B-AWQ-INT4"
        apiKeySecretRef: kagent-vllm
        apiKeySecretKey: OPENAI_API_KEY
        config:
          baseUrl: "http://vllm.kagent.svc.cluster.local:8000/v1"
    # Use the cluster's CNPG operator (cnpg-kagent) instead of the bundled
    # dev Postgres. The full connection URL (incl. password) is provided at
    # runtime from a mounted secret file, so no credentials live in git.
    # vectorEnabled requires pgvector, which cnpg-kagent loads via its
    # postgresql.extensions image (long-term memory support).
    database:
      postgres:
        bundled:
          enabled: false
        vectorEnabled: true
        urlFile: /etc/kagent-db/url
    controller:
      volumes:
        - name: database-url
          secret:
            secretName: kagent-database-url
      volumeMounts:
        - name: database-url
          mountPath: /etc/kagent-db
          readOnly: true
  # Flux's helm-controller appends the OCI chart digest to .Chart.Version as
  # semver build metadata (e.g. "0.9.7+de7ad4a95185"). The kagent chart emits
  # .Chart.Version verbatim into the app.kubernetes.io/version label, and the
  # "+" is an illegal Kubernetes label value, so every apply fails with
  # 'ServiceAccount "kagent-controller" is invalid: metadata.labels'. Rewrite
  # that one label to a valid value on every resource that carries it. The
  # existence selector skips the lone resource without a labels map, so the
  # replace op is always safe.
  postRenderers:
    - kustomize:
        patches:
          - target:
              labelSelector: app.kubernetes.io/version
            patch: |
              - op: replace
                path: /metadata/labels/app.kubernetes.io~1version
                value: "0.9.7"
