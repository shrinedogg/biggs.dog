---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: kagent-ui-basic-auth
  namespace: kagent
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: kagent
  traffic:
    basicAuthentication:
      mode: Strict
      realm: kagent
      secretRef:
        name: kagent-ui-basic-auth
