---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: kagent
  labels:
    app: vllm
spec:
  replicas: 1
  # Weights live on a RWO host-path volume on nv-01; never run two at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      # The Service is named "vllm", so Kubernetes injects legacy service-link
      # env vars (e.g. VLLM_PORT=tcp://<ip>:8000) that collide with vLLM's own
      # VLLM_PORT config and crash the engine. Disable the injection.
      enableServiceLinks: false
      # Pin to the single RTX 5090 node.
      nodeSelector:
        kubernetes.io/hostname: nv-01
      terminationGracePeriodSeconds: 60
      containers:
        - name: vllm
          # CUDA 12.9 build supports the 5090 (Blackwell, sm_120).
          image: docker.io/vllm/vllm-openai:v0.23.0
          args:
            # ----------------------------------------------------------------
            # MODEL: a 4-bit (INT4) Qwen3.6-27B build that fits the 5090's
            # 32 GB with ample headroom for KV cache (~15 GB weights). This
            # repo is compressed-tensors INT4, so --quantization must be
            # "compressed-tensors". --served-model-name must match the
            # provider model in the kagent HelmRelease.
            # ----------------------------------------------------------------
            - --model=cyankiwi/Qwen3.6-27B-AWQ-INT4
            - --quantization=compressed-tensors
            - --served-model-name=cyankiwi/Qwen3.6-27B-AWQ-INT4
            # Context length sized to leave VRAM for KV cache on a 32 GB card.
            # This is a VL + GDN model; its weights, vision encoder and CUDA
            # graph capture nearly fill the card, so we run eager (no CUDA
            # graphs) to free several GB and keep a conservative context.
            - --max-model-len=16384
            - --gpu-memory-utilization=0.90
            - --enforce-eager
            # kagent only sends text. Qwen3.6 is multimodal-only, so we can't
            # drop the vision weights, but forbidding image/video inputs skips
            # the multimodal profiling + encoder cache (frees several GB).
            - '--limit-mm-per-prompt={"image":0,"video":0}'
            # Required for kagent tool calling. Qwen3 uses the hermes parser.
            - --enable-auto-tool-choice
            - --tool-call-parser=hermes
            - --host=0.0.0.0
            - --port=8000
          env:
            - name: HF_HOME
              value: /models
            # Secures the OpenAI-compatible endpoint; kagent sends the same key.
            - name: VLLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: kagent-vllm
                  key: VLLM_API_KEY
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          resources:
            requests:
              cpu: "2"
              memory: 16Gi
              nvidia.com/gpu: 1
            limits:
              # Consumes the last of the 4 time-sliced nvidia.com/gpu replicas.
              nvidia.com/gpu: 1
          startupProbe:
            httpGet:
              path: /health
              port: http
            # First boot downloads weights; allow up to ~30 min.
            periodSeconds: 15
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
          volumeMounts:
            - name: models
              mountPath: /models
            # vLLM needs a large shared-memory segment for NCCL/IPC.
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: vllm-models
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
