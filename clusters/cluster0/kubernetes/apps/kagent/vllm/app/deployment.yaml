---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: kagent
  labels:
    app: vllm
spec:
  replicas: 1
  # Weights live on a RWO host-path volume on nv-01; never run two at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      # The Service is named "vllm", so Kubernetes injects legacy service-link
      # env vars (e.g. VLLM_PORT=tcp://<ip>:8000) that collide with vLLM's own
      # VLLM_PORT config and crash the engine. Disable the injection.
      enableServiceLinks: false
      # Pin to the single RTX 5090 node.
      nodeSelector:
        kubernetes.io/hostname: nv-01
      terminationGracePeriodSeconds: 60
      containers:
        - name: vllm
          # CUDA 12.9 build supports the 5090 (Blackwell, sm_120).
          image: docker.io/vllm/vllm-openai:v0.23.0
          args:
            # ----------------------------------------------------------------
            # MODEL: NVIDIA ModelOpt NVFP4 build of the Qwen3.6-35B-A3B MoE.
            # NVFP4 is hardware-accelerated on the Blackwell 5090 (sm_120).
            # The checkpoint is mixed-precision (~23 GB weights), so it fits a
            # 32 GB card but leaves a modest KV-cache budget. --quantization
            # must be "modelopt_fp4"; --served-model-name must match the
            # provider model in the kagent HelmRelease.
            # ----------------------------------------------------------------
            - --model=nvidia/Qwen3.6-35B-A3B-NVFP4
            - --quantization=modelopt_fp4
            - --served-model-name=nvidia/Qwen3.6-35B-A3B-NVFP4
            # ~23 GB of weights leaves little headroom on 32 GB, so run eager
            # (no CUDA graph capture) and keep a conservative context. If more
            # context is needed, add "--kv-cache-dtype=fp8" to halve KV memory.
            - --max-model-len=16384
            - --gpu-memory-utilization=0.92
            - --enforce-eager
            # kagent only sends text. Qwen3.6 is multimodal-only, so we can't
            # drop the vision weights, but forbidding image/video inputs skips
            # the multimodal profiling + encoder cache (frees several GB).
            - '--limit-mm-per-prompt={"image":0,"video":0}'
            # Required for kagent tool calling. Qwen3 uses the hermes parser.
            - --enable-auto-tool-choice
            - --tool-call-parser=hermes
            - --host=0.0.0.0
            - --port=8000
          env:
            - name: HF_HOME
              value: /models
            # Secures the OpenAI-compatible endpoint; kagent sends the same key.
            - name: VLLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: kagent-vllm
                  key: VLLM_API_KEY
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          resources:
            requests:
              cpu: "2"
              memory: 16Gi
              nvidia.com/gpu: 1
            limits:
              # Consumes the last of the 4 time-sliced nvidia.com/gpu replicas.
              nvidia.com/gpu: 1
          startupProbe:
            httpGet:
              path: /health
              port: http
            # First boot downloads weights; allow up to ~30 min.
            periodSeconds: 15
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
          volumeMounts:
            - name: models
              mountPath: /models
            # vLLM needs a large shared-memory segment for NCCL/IPC.
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: vllm-models
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
