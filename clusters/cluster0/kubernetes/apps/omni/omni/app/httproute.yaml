apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: omni-ui
  namespace: omni
  labels:
    app.kubernetes.io/name: omni
  annotations:
    agentgateway.dev/backend-protocol: "HTTPS"
    # LAN-only name: Cloudflare holds a MANUAL A record -> 192.168.2.31
    # (public zone, private value; never port-forwarded). cluster1's
    # external-dns must NOT touch it.
spec:
  hostnames:
    - omni.biggs.dog
  parentRefs:
    - name: cluster0-gateway
      namespace: networking
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: omni-ui
          port: 443
