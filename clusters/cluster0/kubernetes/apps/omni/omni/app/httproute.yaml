apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: omni-ui
  namespace: omni
  labels:
    app.kubernetes.io/name: omni
  annotations:
    agentgateway.dev/backend-protocol: "HTTPS"
    # This remains the cluster0-local HTTPS hop. Public clients first reach
    # cluster1's wildcard-biggs-dog HTTPRoute, which re-encrypts to this Gateway.
    # Omni's dedicated public A record is maintained by networking/cloudflare-ddns.
spec:
  hostnames:
    - omni.biggs.dog
  parentRefs:
    - name: cluster0-gateway
      namespace: networking
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: omni-ui
          port: 443
