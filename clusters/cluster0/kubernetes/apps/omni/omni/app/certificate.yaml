apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: omni-biggs-dog
  namespace: omni
spec:
  commonName: omni.biggs.dog
  dnsNames:
    - omni.biggs.dog
  secretName: omni-biggs-dog-tls
  duration: 720h # 30 days
  renewBefore: 168h # 7 days
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  usages:
    - digital signature
    - key encipherment
