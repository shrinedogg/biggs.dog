apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: omni-etcd
  namespace: omni
  labels:
    app.kubernetes.io/name: omni
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: omni-sqlite
  namespace: omni
  labels:
    app.kubernetes.io/name: omni
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
