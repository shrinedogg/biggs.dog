# Materializes secret "image-factory-signing-key" (key: signing-key.key) —
# the ECDSA P-256 private key the Image Factory uses to sign cached boot
# assets (so it can verify they weren't tampered with before serving them).
#
# 1Password items required (biggs-dog vault):
#   - image-factory-signing-key (key) — generate locally with:
#       openssl ecparam -name prime256v1 -genkey -noout
#
# Second document (`image-factory-oauth2`) materializes the secrets consumed
# by the oauth2-proxy Deployment. 1Password items required (biggs-dog vault):
#   - dex-image-factory-client-secret (secret) — generate with:
#       openssl rand -base64 32
#   - image-factory-oauth2-cookie-secret (secret) — oauth2-proxy requires
#     exactly 16/24/32 bytes; generate with:
#       openssl rand -base64 32 | tr -- '+/' '-_' | head -c 32
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: image-factory-signing-key
  namespace: omni
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: image-factory-signing-key
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        signing-key.key: "{{ .key }}"
  data:
    - secretKey: key
      remoteRef:
        key: image-factory-signing-key
        property: key
---
# Secrets for the oauth2-proxy that fronts the Image Factory UI.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: image-factory-oauth2
  namespace: omni
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: image-factory-oauth2
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        OAUTH2_PROXY_CLIENT_SECRET: "{{ .clientSecret }}"
        OAUTH2_PROXY_COOKIE_SECRET: "{{ .cookieSecret }}"
  data:
    - secretKey: clientSecret
      remoteRef:
        key: dex-image-factory-client-secret
        property: secret
    - secretKey: cookieSecret
      remoteRef:
        key: image-factory-oauth2-cookie-secret
        property: secret
---
# Materializes secret "image-factory-cosign-pub" (key: cosign.pub) —
# the cosign public key used by the Image Factory to verify signatures
# on every image pulled from the custom registry.
#
# 1Password items required (biggs-dog vault):
#   - image-factory-cosign-pub (key) — generate the key pair locally with:
#       docker run --rm -it -v $PWD:/keys -w /keys -e COSIGN_PASSWORD="" \
#         ghcr.io/sigstore/cosign/cosign:v2.6.1 generate-key-pair
#     Store the PUBLIC key (cosign.pub) content in 1Password.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: image-factory-cosign-pub
  namespace: omni
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: image-factory-cosign-pub
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        cosign.pub: "{{ .key }}"
  data:
    - secretKey: key
      remoteRef:
        key: image-factory-cosign-pub
        property: key
