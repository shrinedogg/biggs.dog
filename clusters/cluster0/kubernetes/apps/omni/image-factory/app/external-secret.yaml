# Materializes secret "image-factory-signing-key" (key: signing-key.key) —
# the ECDSA P-256 private key the Image Factory uses to sign cached boot
# assets (so it can verify they weren't tampered with before serving them).
#
# 1Password items required (biggs-dog vault):
#   - image-factory-signing-key (key) — generate locally with:
#       openssl ecparam -name prime256v1 -genkey -noout
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: image-factory-signing-key
  namespace: omni
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: image-factory-signing-key
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        signing-key.key: "{{ .key }}"
  data:
    - secretKey: key
      remoteRef:
        key: image-factory-signing-key
        property: key
