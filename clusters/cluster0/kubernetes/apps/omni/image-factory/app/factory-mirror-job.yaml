# One-shot mirror + cosign-sign Job: v1.14.6 factory bundle.
#
# The Image Factory (custom-registry mode) discovers Talos versions from the
# tags of siderolabs/imager in its in-cluster registry
# (image-factory-registry.omni.svc:5000) and reads the per-version extension
# list from siderolabs/extensions:<ver> there. It pulls EVERY image from that
# registry, extensions included: each catalog line
# <registry>/<repo>:<tag>@<digest> is fetched as <in-cluster>/<repo>@<digest>
# and its cosign signature is verified on that digest ref
# (image-factory internal/artifacts versions.go extractExtensionList,
# fetch.go fetchImageByDigest; configmap.yaml says the same). So the four
# core images AND every extension a node schematic uses must be mirrored +
# cosign-signed here. The factory's world:443 egress does not change that.
#
# The ExternalSecret materializes the factory's cosign private key from the
# 1Password item (biggs-dog vault: image-factory-cosign-key, field "key").
# The factory itself verifies signatures with image-factory-cosign-pub.
#
# r2: the first landing (Job factory-mirror-v1146) failed fast - the
# debian base image ships without curl (the script's first command).
# r2 added an apt step but the host egress allowlist blocks port 80, so
# apt (http mirrors) timed out. r3 pointed apt at the HTTPS mirrors but
# sed-ed the classic /etc/apt/sources.list, which this base image does
# not have (it uses the deb822 file
# /etc/apt/sources.list.d/debian.sources). r4 seds whichever layout is
# present (classic file and/or *.sources files, both mirrors hosts).
# k8s Job specs are immutable, so each fix-forward uses a new Job name
# (the failed original must not be updated in place).
#
# r5: r4's pod had NO world egress at all - the omni ns runs implicit
# default-deny (allow-egress-dns selects every omni pod, so pods get
# only DNS + their app grants), and the world:443 grants are tied to
# app.kubernetes.io/name: omni / image-factory labels the Job pod lacks.
# So apt-over-https (deb mirrors :443), the GitHub tooling download and
# the docker.io/ghcr.io crane exports were all dropped. r5 adds a
# dedicated CNP (allow-egress-factory-mirror, policies/apps/omni.yaml)
# granting world:443 to pods labeled
# app.kubernetes.io/component: factory-mirror (this Job; the future
# tag-triggered automation Job reuses the same label). In-cluster
# registry :5000 needs no grant: allow-intra-namespace (endpointSelector
# {}) already covers omni-pod-to-omni-pod :5000.
#
# r6: r5's CNP worked - the TLS handshake now reaches
# deb.debian.org:443 - but the debian:bookworm base image carries no
# system CA store (no /etc/ssl/certs, no ca-certificates package), so
# every apt HTTPS fetch fails certificate verification
# ("No system certificates available") and curl cannot be installed.
# r6 bootstraps ca-certificates with a single apt update that has TLS
# peer verification disabled, then re-updates with normal verification
# before installing curl.
#
# r7: r6's bootstrap UPDATE fetched the package index fine, but the
# Acquire::https::Verify-Peer/Host=false flags are per-invocation: the
# subsequent `apt-get install ca-certificates` ran with verification on
# and its .deb downloads (ca-certificates + libssl3/openssl deps,
# security pool) failed the TLS handshake with "The certificate is NOT
# trusted". r7 carries the same flags onto the bootstrap install; the
# plain `apt-get update` and the curl install that follow run with
# normal verification, because by then the CA bundle exists.
#
# r8: r7 proved the apt bootstrap and the tooling download. The mirror
# step then failed: pinned crane v0.22.1 has no `import` command
# (export is a rootfs-tarball op, not an image round-trip), and a
# single `crane copy` cannot mix a TLS src with an insecure http dst -
# its one global --insecure flag would force http on the src too, and
# port 80 is blocked at the host egress allowlist. r8 mirrors with
# `crane pull` (TLS, public registry) + `crane --insecure push`
# (http, in-cluster registry) through a local tarball.
#
# r9: r8 proved the mirror (imager pushed, digest
# sha256:f7616270...), then cosign sign failed: "Enter password for
# private key ... inappropriate ioctl for device" - the vault key is an
# encrypted PEM whose passphrase is stored nowhere, and a Job pod has
# no TTY. cosign also tries a tlog upload by default (Rekor prompt +
# external egress, both unavailable in-cluster).
#
# Resolution: rotate the factory keypair to an empty-passphrase key.
# The new key + pub replace the 1Password items; a public-key change
# invalidates the existing v1.14.5 signatures, so r9 re-signs them.
# r9 changes:
# - COSIGN_PASSWORD="" env: the rotated key is encrypted with an EMPTY
#   passphrase; the explicit env keeps cosign off any prompt
# - a stale ESO mount after the rotation fails fast: the first
#   sign+verify pair rejects the signature, so the v1.14.5 re-sign
#   (which runs after the v1.14.6 loop) never runs on a stale mount
# - re-sign the 4 v1.14.5 images (skip any absent from the registry)
# - mirror + sign v1.14.6 with --tlog-upload=false, verify with
#   --insecure-ignore-tlog (private registry, no transparency log)
#
# r9 (factory-mirror-v1146-9) completed: all 4 v1.14.6 images mirrored
# + signed + verified, all 4 v1.14.5 images re-signed (MIRROR-DONE).
# The factory then started listing v1.14.6, but its on-demand ISO
# build 500'd: the v1.14.6 schematic pins the amd-ucode extension
# image by DIGEST (ghcr.io/siderolabs/amd-ucode, pinned
# sha256:2346cc8b...), and that image was never mirrored into the
# in-cluster registry, so the signature verification failed with
# "no valid bundles exist in registry / no signatures found".
#
# r10 (factory-mirror-v1146-10): mirror + sign the v1.14.6 EXTENSIONS.
# The factory's 500 names only the first missing extension (amd-ucode);
# the cluster1 nodes' schematics (live extensions.talos.dev/* node labels
# on all 6 nodes) need 18 extension images, none mirrored for v1.14.6.
# Each is transferred at the exact v1.14.6 catalog digest. The
# kernel-module extensions rebuilt against the custom kernel keep their
# siderolabs/<name> catalog path, but their bytes live at
# docker.io/shrinedogg/<name> (the ghcr digest 404s), so the list carries
# source and destination repos separately.
# The transfer is byte-exact (raw manifest/index + blob fetch, sha256
# checks, blob uploads, exact manifest PUTs): a crane tar round-trip
# re-encodes manifests and changes the digest, so the factory's digest
# ref would still 404. Registry v3.1.2 rules the transfer honours:
# children before their index (else 400 MANIFEST_BLOB_UNKNOWN); the
# blob-upload Location is absolute and already carries ?_state=, so
# digest= is appended with &; blob PUTs send
# Content-Type: application/octet-stream (curl's form-urlencoded default
# makes the registry consume the body as a form: 400 DIGEST_INVALID).
# An image already present (digest ref 200) is not re-transferred but is
# still signed: version-stable extensions mirrored for v1.14.5 carry only
# pre-rotation signatures. Every digest ref is signed + verified in turn;
# the first verify doubles as the stale-ESO-mount tripwire.
# The factory reads /cosign.pub once at startup through a subPath mount
# that never refreshes, so deployment.yaml carries a pod-template
# annotation that restarts it onto the rotated key.
#
# r11 (factory-mirror-v1146-11): base image bookworm -> trixie (the
# renovate debian 13 bump changed the pod template, so the revision name
# bumps per the immutability convention; the r10 object must not be
# updated in place).
#
# TTL: the Job GCs itself an hour after completion.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: image-factory-cosign-key
  namespace: omni
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: image-factory-cosign-key
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        cosign.key: "{{ .key }}"
  data:
    - secretKey: key
      remoteRef:
        key: image-factory-cosign-key
        property: key
---
apiVersion: batch/v1
kind: Job
metadata:
  name: factory-mirror-v1146-11
  namespace: omni
  labels:
    app.kubernetes.io/component: factory-mirror
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/component: factory-mirror
    spec:
      restartPolicy: Never
      containers:
        - name: mirror
          image: docker.io/library/debian:trixie
          env:
            # rotated keypair (2026-11-18) is encrypted with an EMPTY
            # passphrase; explicit env keeps cosign off any prompt
            # (no TTY in a Job pod)
            - name: COSIGN_PASSWORD
              value: ""
          command:
            - bash
            - -c
            - |
              set -euo pipefail
              cd /tmp
              echo ">> apt: ca-certificates + curl (base image has no CA store; HTTPS mirrors, port 80 is blocked)"
              # classic layout and/or deb822 layout, whichever the base image has
              for f in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources; do
                if [ -f "$f" ]; then
                  sed -i 's|http://deb.debian.org|https://deb.debian.org|; s|http://security.debian.org|https://security.debian.org|' "$f"
                fi
              done
              # base image ships no system CA store: apt cannot verify the
              # HTTPS mirror (r5 failed here). The bootstrap update AND the
              # bootstrap install run with TLS peer verification disabled -
              # the -o flags are per-invocation, so r6's verify-on install
              # failed the .deb TLS handshake. After the CA bundle lands,
              # the re-update and the curl install verify normally.
              apt-get update -qq -o Acquire::https::Verify-Peer=false -o Acquire::https::Verify-Host=false
              apt-get install -y -qq --no-install-recommends -o Acquire::https::Verify-Peer=false -o Acquire::https::Verify-Host=false ca-certificates >/dev/null
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends curl >/dev/null
              echo ">> download cosign v2.6.1"
              curl -fsSL -o cosign https://github.com/sigstore/cosign/releases/download/v2.6.1/cosign-linux-amd64
              chmod +x cosign
              REG=image-factory-registry.omni.svc.cluster.local:5000
              ACCEPT="application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json, application/vnd.docker.distribution.manifest.list.v2+json"
              # Every extension the cluster1 nodes' v1.14.6 schematics use, at the
              # exact digest siderolabs/extensions:v1.14.6 (image-digests) lists.
              # Columns: source-registry source-repo dest-repo tag digest
              # (dest-repo = the catalog repo path the factory pulls from here).
              cat > refs.txt <<'REFS'
              ghcr.io siderolabs/amd-ucode siderolabs/amd-ucode 20261019 sha256:2346cc8bbe232c5305ce289cf3c14f2d9da923b232cd0cc94792611621fe8da0
              docker.io shrinedogg/amdgpu siderolabs/amdgpu 20261019-v1.14.6 sha256:06d1f8a04b57f41649c24ead863221896db2842342ffa0dba74db57feed1c265
              ghcr.io siderolabs/realtek-firmware siderolabs/realtek-firmware 20261019 sha256:619b0249090b526fb624e1bc7e12d5732a2ec8f5ae18138e70feb221c8b90a2a
              docker.io shrinedogg/uhid siderolabs/uhid v1.14.6 sha256:a20a37186a80b1a658cbdf19f3455f8d6e838b37af8ee08af802972a364bfd22
              docker.io shrinedogg/uinput siderolabs/uinput v1.14.6 sha256:f82726ac003ae45e27a8ef3d1901ed287854640d6a43f682a8e0bf7597d7bfd0
              docker.io shrinedogg/usb-audio-drivers siderolabs/usb-audio-drivers v1.14.6 sha256:bac801a212f50b3d021dacae9a69e70c3dd542fdc413472772bfb67c1ede970c
              ghcr.io siderolabs/nfs-utils siderolabs/nfs-utils v0.1.1 sha256:ab0e015bb6859e2baa3640829ee3793e5a156ffd5157e48ca31ff1fffe36d771
              docker.io shrinedogg/nfsd siderolabs/nfsd v1.14.6 sha256:92b35a5eab12b99ce760ca98b193e1602ee5a49c3e684631c48757006ac7dada
              ghcr.io siderolabs/nfsrahead siderolabs/nfsrahead 2.8.4 sha256:ca64e30323dd5523d2258592423d46b9a6b1bca44b16db2b3e92b9cc0b5608e0
              ghcr.io siderolabs/util-linux-tools siderolabs/util-linux-tools 2.42.2 sha256:f93f23e96b28e00228cf9a006a15c1648bd5975be989adb1bee6c05c046001a1
              docker.io shrinedogg/zfs siderolabs/zfs 2.4.4-v1.14.6 sha256:405a83a77bae7e48c44c1754b528939709dbb6f722dae0692db3426a01c52803
              docker.io shrinedogg/i915 siderolabs/i915 20261019-v1.14.6 sha256:890b096756465d68dbe24630720e319cb2a55c5fdfa0a50143d7a32280906ab8
              ghcr.io siderolabs/intel-ucode siderolabs/intel-ucode 20260812 sha256:94af556dfc8a04aac4acbe9526312bb88bba34b1a0036f66b70ad70f5ed5b334
              docker.io shrinedogg/mei siderolabs/mei v1.14.6 sha256:a2eeb6f5b99560b91159bfee8275544e0a6fc2c1c1288b5dd9aff493eee3a103
              docker.io shrinedogg/xe siderolabs/xe 20261019-v1.14.6 sha256:436c9363ef97c5d6add656277b477c18cad26e67d024d44d20f4c871cd513772
              docker.io shrinedogg/nvidia-open-modules shrinedogg/nvidia-open-modules 620.70.06-v1.14.6 sha256:b2cb3fcabbbe23940548f8133160830185ad70d0647d5fbbd5d6d59e2c4a7f8c
              docker.io shrinedogg/nvidia-open-firmware shrinedogg/nvidia-open-firmware 620.70.06-v1.14.6 sha256:58e11f40b0a084e0d250f17cbd3e9ec7b6ab6ec804e4673bc0caf8676fe85555
              docker.io shrinedogg/nvidia-open-toolkit shrinedogg/nvidia-open-toolkit 620.70.06-v1.19.1 sha256:f30f3353f5f055606b6c5ab583c2ccce648ddf4b2af21fded5845bbc1aee4649
              REFS
              EXPECTED=18
              src_api() {
                case "$1" in
                  ghcr.io) echo https://ghcr.io ;;
                  docker.io) echo https://registry-1.docker.io ;;
                  *) echo "FATAL: unknown source registry $1" >&2; return 1 ;;
                esac
              }
              src_token() { # $1=registry $2=repo ; anonymous pull token (public repos)
                local u
                case "$1" in
                  ghcr.io) u="https://ghcr.io/token?scope=repository:$2:pull" ;;
                  docker.io) u="https://auth.docker.io/token?service=registry.docker.io&scope=repository:$2:pull" ;;
                esac
                curl -fsSL "$u" | grep -oE '"token":"[^"]*"' | head -1 | cut -d'"' -f4
              }
              fetch_manifest() { # $1=digest $2=out-file ; prints content-type
                curl -fsSL -D "$2.hdr" -o "$2" -H "Accept: $ACCEPT" -H "Authorization: Bearer $TOK" "$API/v2/$SRC/manifests/$1"
                local act
                act=sha256:$(sha256sum "$2" | cut -d' ' -f1)
                [ "$act" = "$1" ] || { echo "FATAL: $SRC manifest bytes ($act) != $1" >&2; return 1; }
                grep -i '^Content-Type:' "$2.hdr" | tr -d '\r' | cut -d' ' -f2 | tail -1
                rm -f "$2.hdr"
              }
              fetch_blob() { # $1=digest $2=out-file ; fresh token per blob (large layers outlive a token)
                TOK=$(src_token "$SRCREG" "$SRC")
                curl -fsSL -H "Authorization: Bearer $TOK" -o "$2" "$API/v2/$SRC/blobs/$1"
                local act
                act=sha256:$(sha256sum "$2" | cut -d' ' -f1)
                [ "$act" = "$1" ] || { echo "FATAL: $SRC blob bytes ($act) != $1"; exit 1; }
              }
              reg_has() { # $1=repo $2=ref
                [ "$(curl -s -o /dev/null -w '%{http_code}' -I -H "Accept: $ACCEPT" "http://$REG/v2/$1/manifests/$2")" = "200" ]
              }
              blob_has() { # $1=digest
                [ "$(curl -s -o /dev/null -w '%{http_code}' -I "http://$REG/v2/$DST/blobs/$1")" = "200" ]
              }
              upload_blob() { # $1=file $2=digest
                local loc url sep
                loc=$(curl -fsS -D - -o /dev/null -X POST "http://$REG/v2/$DST/blobs/uploads/" | grep -i '^Location:' | tr -d '\r' | cut -d' ' -f2)
                [ -n "$loc" ] || { echo "FATAL: no Location on blob upload create ($DST $2)"; exit 1; }
                # registry v3 returns an ABSOLUTE Location that already carries ?_state=...
                case "$loc" in http://*|https://*) url=$loc ;; *) url=http://$REG$loc ;; esac
                case "$url" in *\?*) sep='&' ;; *) sep='?' ;; esac
                # octet-stream: curl's form-urlencoded default makes the registry
                # parse the body as a form (DIGEST_INVALID); -T streams large layers
                curl -fsS -o /dev/null -X PUT -H "Content-Type: application/octet-stream" -T "$1" "${url}${sep}digest=$2"
              }
              put_manifest() { # $1=file $2=ref (tag or sha256:digest) $3=content-type
                curl -fsS -o /dev/null -w "  manifest PUT $DST:$2 -> HTTP %{http_code}\n" \
                  -X PUT -H "Content-Type: $3" --data-binary @"$1" "http://$REG/v2/$DST/manifests/$2"
              }
              digests_in() { # $1=file ; config+layer blobs (manifest) or child manifests (index)
                grep -oE '"digest": *"sha256:[0-9a-f]{64}"' "$1" | cut -d'"' -f4 | sort -u
              }
              copy_blobs() { # $1=manifest file
                local b
                for b in $(digests_in "$1"); do
                  if blob_has "$b"; then echo "    blob $b present"; continue; fi
                  fetch_blob "$b" blob.bin
                  upload_blob blob.bin "$b"
                  rm -f blob.bin
                  echo "    blob $b uploaded"
                done
              }
              transfer() { # $1=digest $2=tag
                local rct cct child
                rct=$(fetch_manifest "$1" root.json)
                if grep -q '"manifests"' root.json; then
                  # an index is accepted only once every child exists
                  for child in $(digests_in root.json); do
                    cct=$(fetch_manifest "$child" child.json)
                    copy_blobs child.json
                    put_manifest child.json "$child" "$cct"
                  done
                else
                  copy_blobs root.json
                fi
                put_manifest root.json "$1" "$rct"
                put_manifest root.json "$2" "$rct"
                rm -f root.json child.json
              }
              n=0
              while read -r SRCREG SRC DST TAG DG <&3; do
                [ -n "$SRCREG" ] || continue
                n=$((n+1))
                echo ">> [$n/$EXPECTED] $SRCREG/$SRC@$DG -> $REG/$DST:$TAG"
                if reg_has "$DST" "$DG"; then
                  echo "  digest ref already in the registry; signing only"
                else
                  API=$(src_api "$SRCREG")
                  TOK=$(src_token "$SRCREG" "$SRC")
                  [ -n "$TOK" ] || { echo "FATAL: no pull token for $SRCREG/$SRC"; exit 1; }
                  transfer "$DG" "$TAG"
                  reg_has "$DST" "$DG" || { echo "FATAL: $DST@$DG not resolvable after transfer"; exit 1; }
                fi
                ./cosign sign --key /keys/cosign.key --allow-http-registry=true --insecure-skip-verify=true --tlog-upload=false "$REG/$DST@$DG"
                ./cosign verify --key /pub/cosign.pub --allow-http-registry=true --insecure-ignore-tlog "$REG/$DST@$DG" >/dev/null
                echo "  signed + verified $DST@$DG"
              done 3< refs.txt
              [ "$n" = "$EXPECTED" ] || { echo "FATAL: processed $n refs, expected $EXPECTED"; exit 1; }
              echo "MIRROR-EXT-DONE: $n v1.14.6 extension images mirrored at their catalog digests + signed + verified"
          volumeMounts:
            - name: keys
              mountPath: /keys
              readOnly: true
            - name: pub
              mountPath: /pub
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
      volumes:
        - name: keys
          secret:
            secretName: image-factory-cosign-key
        - name: pub
          secret:
            secretName: image-factory-cosign-pub
