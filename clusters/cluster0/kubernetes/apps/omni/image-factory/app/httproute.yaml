# Routes factory.biggs.dog to the Image Factory (plain HTTP backend on :8080).
# The gateway terminates TLS; no backend-protocol annotation needed (unlike
# omni which self-serves TLS).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: image-factory
  namespace: omni
  labels:
    app.kubernetes.io/name: image-factory
spec:
  hostnames:
    - factory.biggs.dog
  parentRefs:
    - name: cluster0-gateway
      namespace: networking
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: image-factory
          port: 8080
