# Image Factory Deployment.
# Stateless HTTP service on :8080; gateway terminates TLS.
# Everything durable lives in the registry PVC.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-factory
  namespace: omni
  labels:
    app.kubernetes.io/name: image-factory
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: image-factory
  template:
    metadata:
      labels:
        app.kubernetes.io/name: image-factory
    spec:
      volumes:
        - name: config
          configMap:
            name: image-factory-config
        - name: signing-key
          secret:
            secretName: image-factory-signing-key
        - name: cosign-pub
          secret:
            secretName: image-factory-cosign-pub
        - name: tmp
          emptyDir: {}
      containers:
        - name: image-factory
          # Fork of siderolabs/image-factory v1.7.0 with "skip missing
          # non-amd64 architectures in installer image builds" (branch
          # skip-arm64-installer, commit 0c49cc9): our custom kernel-module
          # extensions are amd64-only, and stock v1.7.0 fails the OCI
          # installer route with "OCI layout has no linux/arm64 manifest".
          # Upstream issue siderolabs/image-factory#395.
          image: docker.io/shrinedogg/image-factory:v1.7.0-skip-arm64
          imagePullPolicy: Always
          args:
            - --config
            - /config/image-factory.yaml
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 2122
              protocol: TCP
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: signing-key
              mountPath: /keys
              readOnly: true
            - name: cosign-pub
              mountPath: /cosign.pub
              subPath: cosign.pub
              readOnly: true
            - name: tmp
              mountPath: /tmp
