apiVersion: v1
kind: Namespace
metadata:
  name: aiperf-system
  labels:
    # The AIPerf operator + results-server pods run non-root (runAsUser 1000,
    # readOnlyRootFilesystem, drop ALL, RuntimeDefault seccomp). Follow the
    # cluster0 house pattern (omni/ci/openebs) with privileged (non-enforced)
    # rather than invent a third profile.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
