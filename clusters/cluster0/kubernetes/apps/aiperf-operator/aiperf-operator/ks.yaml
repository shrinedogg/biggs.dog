apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app aiperf-operator
  namespace: flux-system
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./clusters/cluster0/kubernetes/apps/aiperf-operator/aiperf-operator/app
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  interval: 3m
  retryInterval: 1m
  timeout: 5m
  dependsOn:
    # The operator creates JobSet CRs and relies on the JobSet controller; the
    # JobSet CRD + controller must be installed first.
    - name: jobset
