# The cluster0 management cluster: created by CAPT from the kind bootstrap
# cluster, moved into itself by `clusterctl move` (knr-bootstrap pivot), and
# from then on reconciled from GitHub by the Flux instance running inside it.
# Health check gates on the Cluster's Available condition (v1beta2 serves
# Available, not Ready).
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster0-management
  namespace: flux-system
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: cluster0-management
  interval: 5m
  retryInterval: 2m
  timeout: 5m
  prune: true
  wait: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./clusters/cluster0/capi/clusters/management
  dependsOn:
    - name: tinkerbell
    - name: cacppt-system
    - name: capt-system
    - name: cabpt-system
  healthChecks:
    - apiVersion: cluster.x-k8s.io/v1beta2
      kind: Cluster
      name: cluster0
      namespace: default
