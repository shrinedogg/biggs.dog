# Single-node Talos management cluster (biggs.dog cluster0), shape from
# knr-ops mgmt/local-talos (#105): imperative (explicit controlPlaneRef), one
# machine carrying the whole management plane. Site values are committed, per
# the knr-ops management-cluster convention.
#
# Deltas vs knr-ops local-talos:
# - CNI is Cilium (kube-proxy replacement), installed at create time by the
#   ClusterResourceSet in cilium-crs.yaml, so cni.name=none + proxy.disabled
#   are patched into the generated machine config.
# - No Tinkerbell Workflow: cluster1 (the planned PXE host) is offline, so the
#   node boots from a Talos ISO and pulls its config from Tootles (see
#   hardware.yaml); CAPT's default workflow template is Ubuntu/cloud-init and
#   could not install Talos anyway.
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  name: cluster0
  namespace: default
  labels:
    biggs.dog/cluster: cluster0
spec:
  clusterNetwork:
    pods:
      cidrBlocks:
        - 10.244.0.0/16
    services:
      cidrBlocks:
        - 10.96.0.0/12
    serviceDomain: cluster.local
  controlPlaneEndpoint:
    host: 192.168.2.31
    port: 6443
  controlPlaneRef:
    apiGroup: controlplane.cluster.x-k8s.io
    kind: TalosControlPlane
    name: cluster0
  infrastructureRef:
    apiGroup: infrastructure.cluster.x-k8s.io
    kind: TinkerbellCluster
    name: cluster0
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: TinkerbellCluster
metadata:
  name: cluster0
  namespace: default
# No workflow template: the Hardware carries the provisioned annotation, so
# CAPT never creates a Tinkerbell Workflow (ISO-boot flow, see hardware.yaml).
spec: {}
---
apiVersion: controlplane.cluster.x-k8s.io/v1beta1
kind: TalosControlPlane
metadata:
  name: cluster0
  namespace: default
spec:
  replicas: 1
  # renovate: datasource=github-releases depName=kubernetes/kubernetes
  version: "v1.36.0"
  # CACPPT v0.6.4 serves v1beta1 (storage) with the modern CAPI v1beta2 KCP
  # layout: the infra reference lives at machineTemplate.spec.infrastructureRef
  # (the v1alpha3 field infrastructureTemplate only exists on the v1alpha3
  # schema; knr-ops's v1beta1+v1alpha3 hybrid fails CRD validation).
  machineTemplate:
    spec:
      infrastructureRef:
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: TinkerbellMachineTemplate
        name: cluster0
  controlPlaneConfig:
    controlplane:
      generateType: controlplane
      # Major.minor contract version only (docs/extending.md Talos rule).
      # renovate: datasource=github-releases depName=siderolabs/talos
      talosVersion: v1.14
      strategicPatches:
        - |
          cluster:
            allowSchedulingOnControlPlanes: true
            apiServer:
              certSANs:
                - 192.168.2.31
            network:
              cni:
                name: none          # Cilium via ClusterResourceSet (cilium-crs.yaml)
            proxy:
              disabled: true        # Cilium kubeProxyReplacement
            # NOTE: the coredns edge-names hosts override (omni/dex/netbird/
            # factory/home.biggs.dog -> 192.168.2.31, the gateway VIP) is a
            # MANUAL post-bootstrap step, not an inlineManifest here: CABPT
            # v0.6.4 has no in-place rollout strategy, so any
            # controlPlaneConfig change replaces the control-plane machine.
            # On this single-node cluster that reinstalls the node from the
            # ISO. The live override is in the kube-system/coredns ConfigMap
            # (same coredns-custom pattern as cluster1's Omni template);
            # re-apply it after any node rebuild.
          machine:
            network:
              # DHCP on this VLAN hands out lan-dns (192.168.6.16, cluster1)
              # first; with cluster1 down the first resolver blackholes and
              # every lookup stalls ~4s. Pin working upstreams.
              nameservers:
                - 192.168.2.1
                - 45.90.28.232
            install:
              # The raw image is written to disk by the Tinkerbell workflow;
              # this value governs in-place upgrades (image from
              # status.installerImage via the CABPT handoff).
              disk: /dev/nvme0n1
            features:
              kubePrism:
                enabled: true
                port: 7445
            kubelet:
              # CAPI node matching: CAPT replaces PROVIDER_ID with
              # tinkerbell://<ns>/<hardware-name> when it stores the config on
              # Hardware.spec.userData, so the kubelet registers with the
              # providerID the Machine object carries. Without this the Machine
              # never gains a nodeRef and clusterctl move refuses to run.
              extraConfig:
                providerID: PROVIDER_ID
              extraMounts:
                - destination: /var/mnt/host-path
                  type: bind
                  source: /var/mnt/host-path
                  options: [rbind, rshared, rw]
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: TinkerbellMachineTemplate
metadata:
  name: cluster0
  namespace: default
spec:
  template:
    spec:
      # Direct hardware binding: the single management machine, by label (the
      # CAPT webhook forbids hardwareName in templates).
      hardwareAffinity:
        required:
          - labelSelector:
              matchLabels:
                biggs.dog/cluster0-machine: "true"
