# Installs Cilium on the new node before it can go Ready (TalosControlPlane
# disables the built-in CNI and kube-proxy). ApplyOnce: this is a bootstrap
# install only; ongoing lifecycle is owned by the Cilium HelmRelease
# (kubernetes/apps/kube-system/cilium), which adopts these objects via the
# meta.helm.sh ownership annotations rendered into the ConfigMap. Regenerate
# the ConfigMap on any Cilium version/values change with
# check-cilium-crs.sh.
apiVersion: addons.cluster.x-k8s.io/v1beta1
kind: ClusterResourceSet
metadata:
  name: cluster0-cilium
  namespace: default
spec:
  clusterSelector:
    matchLabels:
      biggs.dog/cluster: cluster0
  strategy: ApplyOnce
  resources:
    - kind: ConfigMap
      name: cluster0-cilium
