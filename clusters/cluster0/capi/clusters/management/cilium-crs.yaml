                - name: cilium-cgroup
                  mountPath: /sys/fs/cgroup
                - name: cilium-run
                  mountPath: /var/run/cilium
                - name: cilium-netns
                  mountPath: /var/run/cilium/netns
                  mountPropagation: HostToContainer
                - name: etc-cni-netd
