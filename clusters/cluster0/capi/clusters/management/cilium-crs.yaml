                    command:
                      - /cni-uninstall.sh
              ports:
                - name: health
                  containerPort: 9879
                  hostPort: 9879
                  protocol: TCP
                - name: peer-service
                  containerPort: 4244
                  hostPort: 4244
                  protocol: TCP
                - name: prometheus
                  containerPort: 9962
                  hostPort: 9962
                  protocol: TCP
              securityContext:
                seLinuxOptions:
                  level: s0
                  type: spc_t
                capabilities:
                  add:
                    - CHOWN
                    - KILL
                    - NET_ADMIN
                    - NET_RAW
                    - IPC_LOCK
                    - SYS_ADMIN
                    - SYS_RESOURCE
                    - PERFMON
                    - BPF
                    - DAC_OVERRIDE
                    - FOWNER
                    - SETGID
                    - SETUID
                  drop:
                    - ALL
              terminationMessagePolicy: FallbackToLogsOnError
              volumeMounts:
                - name: envoy-sockets
                  mountPath: /var/run/cilium/envoy/sockets
                  readOnly: false
                # Unprivileged containers need to mount /proc/sys/net from the host
                # to have write access
