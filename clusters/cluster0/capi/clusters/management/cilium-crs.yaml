---
apiVersion: v1
data:
  cilium.yaml: |
    ---
    # Source: cilium/templates/cilium-secrets-namespace.yaml
    apiVersion: v1
    kind: Namespace
    metadata:
      name: "cilium-secrets"
      labels:
        app.kubernetes.io/part-of: cilium
        helm.sh/chart: cilium-1.20.1
        app.kubernetes.io/managed-by: Helm
      annotations:
        meta.helm.sh/release-name: cilium
        meta.helm.sh/release-namespace: kube-system
    ---
    # Source: cilium/templates/cilium-agent/serviceaccount.yaml
    apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: "cilium"
      namespace: kube-system
      labels:
        app.kubernetes.io/managed-by: Helm
      annotations:
        meta.helm.sh/release-name: cilium
        meta.helm.sh/release-namespace: kube-system
    ---
    # Source: cilium/templates/cilium-envoy/serviceaccount.yaml
    apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: "cilium-envoy"
      namespace: kube-system
      labels:
        app.kubernetes.io/managed-by: Helm
      annotations:
        meta.helm.sh/release-name: cilium
        meta.helm.sh/release-namespace: kube-system
    ---
    # Source: cilium/templates/cilium-operator/serviceaccount.yaml
    apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: "cilium-operator"
      namespace: kube-system
      labels:
        app.kubernetes.io/managed-by: Helm
      annotations:
        meta.helm.sh/release-name: cilium
        meta.helm.sh/release-namespace: kube-system
    ---
    # Source: cilium/templates/cilium-ca-secret.yaml
    apiVersion: v1
    kind: Secret
    metadata:
      name: cilium-ca
      namespace: kube-system
      labels:
        cilium.io/helm-template-non-idempotent: "true"
        app.kubernetes.io/managed-by: Helm
      annotations:
        meta.helm.sh/release-name: cilium
        meta.helm.sh/release-namespace: kube-system
    data:
      ca.crt: 
      ca.key: 
    ---
    # Source: cilium/templates/hubble/tls-helm/server-secret.yaml
    apiVersion: v1
    kind: Secret
    metadata:
      name: hubble-server-certs
      namespace: kube-system
      labels:
        cilium.io/helm-template-non-idempotent: "true"
        app.kubernetes.io/managed-by: Helm
      annotations:
        meta.helm.sh/release-name: cilium
        meta.helm.sh/release-namespace: kube-system
    type: kubernetes.io/tls
    data:
      ca.crt: 
      tls.crt: 
      tls.key: 
    ---
    # Source: cilium/templates/cilium-configmap.yaml
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: cilium-config
      namespace: kube-system
      labels:
        app.kubernetes.io/managed-by: Helm
      annotations:
        meta.helm.sh/release-name: cilium
        meta.helm.sh/release-namespace: kube-system
    data:
      # Identity allocation mode selects how identities are shared between cilium
      # nodes by setting how they are stored. The options are "crd", "kvstore" or
      # "doublewrite-readkvstore" / "doublewrite-readcrd".
      # - "crd" stores identities in kubernetes as CRDs (custom resource definition).
      #   These can be queried with:
      #     kubectl get ciliumid
      # - "kvstore" stores identities in an etcd kvstore, that is
      #   configured below. Cilium versions before 1.6 supported only the kvstore
      #   backend. Upgrades from these older cilium versions should continue using
      #   the kvstore by commenting out the identity-allocation-mode below, or
      #   setting it to "kvstore".
      # - "doublewrite" modes store identities in both the kvstore and CRDs. This is useful
      #   for seamless migrations from the kvstore mode to the crd mode. Consult the
      #   documentation for more information on how to perform the migration.
      identity-allocation-mode: crd
      identity-heartbeat-timeout: "30m0s"
      identity-gc-interval: "15m0s"
      cilium-endpoint-gc-interval: "5m0s"
      nodes-gc-interval: "5m0s"
      # If you want to run cilium in debug mode change this value to true
      debug: "false"
      metrics-sampling-interval: "5m"
      # The agent can be put into the following three policy enforcement modes
      # default, always and never.
      # https://docs.cilium.io/en/latest/security/policy/intro/#policy-enforcement-modes
      enable-policy: "default"
      # If you want metrics enabled in all of your Cilium agents, set the port for
      # which the Cilium agents will have their metrics exposed.
      # This option deprecates the "prometheus-serve-addr" in the
      # "cilium-metrics-config" ConfigMap
      # NOTE that this will open the port on ALL nodes where Cilium pods are
      # scheduled.
      prometheus-serve-addr: ":9962"
      # A space-separated list of controller groups for which to enable metrics.
      # The special values of "all" and "none" are supported.
      controller-group-metrics: write-cni-file sync-host-ips sync-lb-maps-with-k8s-services
      # If you want metrics enabled in cilium-operator, set the port for
      # which the Cilium Operator will have their metrics exposed.
      # NOTE that this will open the port on the nodes where Cilium operator pod
      # is scheduled.
      operator-prometheus-serve-addr: ":9963"
      enable-metrics: "true"
      enable-policy-secrets-sync: "true"
      policy-secrets-only-from-secrets-namespace: "true"
      policy-secrets-namespace: "cilium-secrets"
      # Enable IPv4 addressing. If enabled, all endpoints are allocated an IPv4
      # address.
      enable-ipv4: "true"
      # Enable IPv6 addressing. If enabled, all endpoints are allocated an IPv6
      # address.
      enable-ipv6: "false"
      # Users who wish to specify their own custom CNI configuration file must set
      # custom-cni-conf to "true", otherwise Cilium may overwrite the configuration.
      custom-cni-conf: "false"
      enable-bpf-clock-probe: "false"
      # If you want cilium monitor to aggregate tracing for packets, set this level
      # to "low", "medium", or "maximum". The higher the level, the less packets
      # that will be seen in monitor output.
      monitor-aggregation: medium
      # The monitor aggregation interval governs the typical time between monitor
      # notification events for each allowed connection.
      #
      # Only effective when monitor aggregation is set to "medium" or higher.
      monitor-aggregation-interval: "5s"
      # The monitor aggregation flags determine which TCP flags which, upon the
      # first observation, cause monitor notifications to be generated.
      #
      # Only effective when monitor aggregation is set to "medium" or higher.
      monitor-aggregation-flags: all
      # Specifies the ratio (0.0-1.0] of total system memory to use for dynamic
      # sizing of the TCP CT, non-TCP CT, NAT and policy BPF maps.
      bpf-map-dynamic-size-ratio: "0.0025"
      # bpf-policy-map-max specifies the maximum number of entries in endpoint
      # policy map (per endpoint)
      bpf-policy-map-max: "16384"
      # bpf-policy-stats-map-max specifies the maximum number of entries in global
      # policy stats map
      bpf-policy-stats-map-max: "65536"
      # bpf-lb-map-max specifies the maximum number of entries in bpf lb service,
      # backend and affinity maps.
      bpf-lb-map-max: "65536"
      bpf-lb-external-clusterip: "false"
      bpf-lb-source-range-all-types: "false"
      # When Gateway API is enabled this is forced to "true" so per-backend weights
      # on TCPRoute/UDPRoute take effect (Maglev honors the LB algorithm annotation only
      # when enabled). Paired with `bpf-lb-sock-hostns-only`, which is forced "true"
      # for the same reason.
      bpf-lb-algorithm-annotation: "false"
      bpf-lb-mode-annotation: "false"
      bpf-distributed-lru: "false"
      bpf-events-drop-enabled: "true"
      bpf-events-policy-verdict-enabled: "true"
      bpf-events-trace-enabled: "true"
      # Pre-allocation of map entries allows per-packet latency to be reduced, at
      # the expense of up-front memory allocation for the entries in the maps. The
      # default value below will minimize memory usage in the default installation;
      # users who are sensitive to latency may consider setting this to "true".
      #
      # This option was introduced in Cilium 1.4. Cilium 1.3 and earlier ignore
      # this option and behave as though it is set to "true".
      #
      # If this value is modified, then during the next Cilium startup the restore
      # of existing endpoints and tracking of ongoing connections may be disrupted.
      # As a result, reply packets may be dropped and the load-balancing decisions
      # for established connections may change.
      #
      # If this option is set to "false" during an upgrade from 1.3 or earlier to
      # 1.4 or later, then it may cause one-time disruptions during the upgrade.
      preallocate-bpf-maps: "false"
      # Name of the cluster. Only relevant when building a mesh of clusters.
      cluster-name: "cluster0"
      # Unique ID of the cluster. Must be unique across all connected clusters and
      # in the range of 1 and 255. Only relevant when building a mesh of clusters.
      cluster-id: "2"
      # Encapsulation mode for communication between nodes
      # Possible values:
      #   - disabled
      #   - vxlan (default)
      #   - geneve
      routing-mode: "tunnel"
      tunnel-protocol: "vxlan"
      tunnel-source-port-range: "0-0"
      service-no-backend-response: "reject"
      policy-deny-response: "none"
      # Enables L7 proxy for L7 policy enforcement and visibility
      enable-l7-proxy: "true"
      enable-ipv4-masquerade: "true"
      enable-ipv4-big-tcp: "false"
      enable-ipv6-big-tcp: "false"
      enable-ipv6-masquerade: "true"
      enable-tcx: "true"
      datapath-mode: "veth"
      enable-masquerade-to-route-source: "false"
      enable-xt-socket-fallback: "true"
      install-no-conntrack-iptables-rules: "false"
      iptables-random-fully: "false"
      auto-direct-node-routes: "false"
      direct-routing-skip-unreachable: "false"
      enable-host-firewall: "false"
      # List of devices used to attach bpf_host.o (implements BPF NodePort,
      # host-firewall and BPF masquerading)
      devices: "eth+ enp+ enx+ eno+ ens+ bond+"
      kube-proxy-replacement: "true"
      kube-proxy-replacement-healthz-bind-address: "0.0.0.0:10256"
      enable-no-service-endpoints-routable: "true"
      bpf-lb-sock: "true"
      # When Gateway API is enabled this is forced to "true" so per-backend weights
      # on TCPRoute/UDPRoute take effect (socket LB stays in the host namespace,
      # letting the Maglev LB mode apply). Paired with `bpf-lb-mode-annotation`,
      # which is forced "true" for the same reason.
      bpf-lb-sock-hostns-only: "true"
      enable-health-check-nodeport: "true"
      enable-dynamic-source-lookup-nodeport: "false"
      enable-health-check-loadbalancer-ip: "false"
      node-port-bind-protection: "true"
      enable-auto-protect-node-port-range: "true"
      bpf-lb-acceleration: "disabled"
      enable-service-topology: "false"
      enable-l2-neigh-discovery: "false"
      k8s-require-ipv4-pod-cidr: "false"
      k8s-require-ipv6-pod-cidr: "false"
      enable-k8s-networkpolicy: "true"
      enable-endpoint-lockdown-on-policy-overflow: "false"
      # Tell the agent to generate and write a CNI configuration file
      write-cni-conf-when-ready: /host/etc/cni/net.d/05-cilium.conflist
      cni-exclusive: "true"
      cni-log-file: "/var/run/cilium/cilium-cni.log"
      enable-endpoint-health-checking: "true"
      enable-health-checking: "true"
      health-check-icmp-failure-threshold: "3"
      enable-well-known-identities: "false"
      enable-node-selector-labels: "false"
      synchronize-k8s-nodes: "true"
      operator-api-serve-addr: "127.0.0.1:9234"
      enable-hubble: "true"
      # UNIX domain socket for Hubble server to listen to.
      hubble-socket-path: "/var/run/cilium/hubble.sock"
      hubble-network-policy-correlation-enabled: "true"
      # An additional address for Hubble server to listen to (e.g. ":4244").
      hubble-listen-address: ":4244"
      hubble-disable-tls: "false"
      hubble-tls-cert-file: /var/lib/cilium/tls/hubble/server.crt
      hubble-tls-key-file: /var/lib/cilium/tls/hubble/server.key
      hubble-tls-client-ca-files: /var/lib/cilium/tls/hubble/client-ca.crt
      ipam: "kubernetes"
      ipam-cilium-node-update-rate: "15s"
      default-lb-service-ipam: "lbipam"
      egress-gateway-reconciliation-trigger-interval: "1s"
      enable-vtep: "false"
      vtep-endpoint: ""
      vtep-cidr: ""
      vtep-mask: ""
      vtep-mac: ""
      # Enable L2 announcements
      enable-l2-announcements: "true"
      packetization-layer-pmtud-mode: "blackhole"
      procfs: "/host/proc"
      bpf-root: "/sys/fs/bpf"
      cgroup-root: "/sys/fs/cgroup"
      identity-management-mode: "agent"
      enable-sctp: "false"
      remove-cilium-node-taints: "true"
      set-cilium-node-taints: "true"
      set-cilium-is-up-condition: "true"
      unmanaged-pod-watcher-interval: "15s"
      # default DNS proxy to transparent mode in non-chaining modes
      dnsproxy-enable-transparent-mode: "true"
      dnsproxy-socket-linger-timeout: "10"
      tofqdns-dns-reject-response-code: "refused"
      tofqdns-enable-dns-compression: "true"
      tofqdns-endpoint-max-ip-per-hostname: "1000"
      tofqdns-idle-connection-grace-period: "0s"
      tofqdns-max-deferred-connection-deletes: "10000"
      tofqdns-proxy-response-max-delay: "100ms"
      tofqdns-preallocate-identities: "true"
      agent-not-ready-taint-key: "node.cilium.io/agent-not-ready"
      mesh-auth-enabled: "false"
      mesh-auth-queue-size: "1024"
      mesh-auth-rotated-identities-queue-size: "1024"
      mesh-auth-gc-interval: "5m0s"
      proxy-xff-num-trusted-hops-ingress: "0"
      proxy-xff-num-trusted-hops-egress: "0"
      proxy-connect-timeout: "2"
      proxy-initial-fetch-timeout: "30"
      proxy-max-active-downstream-connections: "50000"
      proxy-max-requests-per-connection: "0"
      proxy-max-connection-duration-seconds: "0"
      proxy-idle-timeout-seconds: "60"
      proxy-max-concurrent-retries: "128"
      proxy-use-original-source-address: "true"
      proxy-cluster-max-connections: "1024"
      proxy-cluster-max-pending-requests: "1024"
      proxy-cluster-max-requests: "1024"
      http-retry-count: "3"
      http-stream-idle-timeout: "300"
      envoy-node-locality-enabled: "false"
      external-envoy-proxy: "true"
      envoy-base-id: "0"
      envoy-access-log-enabled: "true"
      envoy-access-log-buffer-size: "4096"
      envoy-keep-cap-netbindservice: "false"
      envoy-xds-mode: "ads"
      max-connected-clusters: "255"
      clustermesh-cache-ttl: "0s"
      clustermesh-enable-endpoint-sync: "false"
      clustermesh-enable-mcs-api: "false"
      clustermesh-mcs-api-install-crds: "true"
      clustermesh-default-global-namespace: "true"
      policy-default-local-cluster: "true"
      nat-map-stats-entries: "32"
      nat-map-stats-interval: "30s"
      enable-lb-ipam: "true"
      enable-non-default-deny-policies: "true"
      enable-source-ip-verification: "true"
      enable-dynamic-config: "true"
      enable-drift-checker: "true"
      enable-datapath-plugins: "false"
      datapath-plugins-state-dir: "/var/run/cilium/plugins"
    # Extra config allows adding arbitrary properties to the cilium config.
    # By putting it at the end of the ConfigMap, it's also possible to override existing properties.
    ---
    # Source: cilium/templates/cilium-envoy/configmap.yaml
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: cilium-envoy-config
      namespace: kube-system
      labels:
        app.kubernetes.io/managed-by: Helm
      annotations:
        meta.helm.sh/release-name: cilium
        meta.helm.sh/release-namespace: kube-system
    data:
      # Keep the key name as bootstrap-config.json to avoid breaking changes
      bootstrap-config.json: |
        {"admin":{"address":{"pipe":{"mode":432,"path":"/var/run/cilium/envoy/sockets/admin.sock"}}},"applicationLogConfig":{"logFormat":{"textFormat":"[%Y-%m-%d %T.%e][%t][%l][%n] [%g:%#] %v"}},"bootstrapExtensions":[{"name":"envoy.bootstrap.internal_listener","typedConfig":{"@type":"type.googleapis.com/envoy.extensions.bootstrap.internal_listener.v3.InternalListener"}}],"dynamicResources":{"adsConfig":{"apiType":"GRPC","grpcServices":[{"envoyGrpc":{"clusterName":"xds-grpc-cilium"}}],"setNodeOnFirstMessageOnly":true,"transportApiVersion":"V3"},"cdsConfig":{"ads":{},"initialFetchTimeout":"30s","resourceApiVersion":"V3"},"ldsConfig":{"ads":{},"initialFetchTimeout":"30s","resourceApiVersion":"V3"}},"node":{"cluster":"ingress-cluster","id":"host~127.0.0.1~no-id~localdomain"},"overloadManager":{"resourceMonitors":[{"name":"envoy.resource_monitors.global_downstream_max_connections","typedConfig":{"@type":"type.googleapis.com/envoy.extensions.resource_monitors.downstream_connections.v3.DownstreamConnectionsConfig","max_active_downstream_connections":"50000"}}]},"staticResources":{"clusters":[{"circuitBreakers":{"thresholds":[{"maxConnections":1024,"maxRequests":1024,"maxRetries":128}]},"cleanupInterval":"2.500s","connectTimeout":"2s","lbPolicy":"CLUSTER_PROVIDED","name":"ingress-cluster","type":"ORIGINAL_DST","typedExtensionProtocolOptions":{"envoy.extensions.upstreams.http.v3.HttpProtocolOptions":{"@type":"type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions","commonHttpProtocolOptions":{"idleTimeout":"60s","maxConnectionDuration":"0s","maxRequestsPerConnection":0},"useDownstreamProtocolConfig":{}}}},{"circuitBreakers":{"thresholds":[{"maxConnections":1024,"maxRequests":1024,"maxRetries":128}]},"cleanupInterval":"2.500s","connectTimeout":"2s","lbPolicy":"CLUSTER_PROVIDED","name":"egress-cluster-tls","transportSocket":{"name":"cilium.tls_wrapper","typedConfig":{"@type":"type.googleapis.com/cilium.UpstreamTlsWrapperContext"}},"type":"ORIGINAL_DST","typedExtensionProtocolOptions":{"envoy.extensions.upstreams.http.v3.HttpProtocolOptions":{"@type":"type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions","commonHttpProtocolOptions":{"idleTimeout":"60s","maxConnectionDuration":"0s","maxRequestsPerConnection":0},"upstreamHttpProtocolOptions":{},"useDownstreamProtocolConfig":{}}}},{"circuitBreakers":{"thresholds":[{"maxConnections":1024,"maxRequests":1024,"maxRetries":128}]},"cleanupInterval":"2.500s","connectTimeout":"2s","lbPolicy":"CLUSTER_PROVIDED","name":"egress-cluster","type":"ORIGINAL_DST","typedExtensionProtocolOptions":{"envoy.extensions.upstreams.http.v3.HttpProtocolOptions":{"@type":"type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions","commonHttpProtocolOptions":{"idleTimeout":"60s","maxConnectionDuration":"0s","maxRequestsPerConnection":0},"useDownstreamProtocolConfig":{}}}},{"circuitBreakers":{"thresholds":[{"maxConnections":1024,"maxRequests":1024,"maxRetries":128}]},"cleanupInterval":"2.500s","connectTimeout":"2s","lbPolicy":"CLUSTER_PROVIDED","name":"ingress-cluster-tls","transportSocket":{"name":"cilium.tls_wrapper","typedConfig":{"@type":"type.googleapis.com/cilium.UpstreamTlsWrapperContext"}},"type":"ORIGINAL_DST","typedExtensionProtocolOptions":{"envoy.extensions.upstreams.http.v3.HttpProtocolOptions":{"@type":"type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions","commonHttpProtocolOptions":{"idleTimeout":"60s","maxConnectionDuration":"0s","maxRequestsPerConnection":0},"upstreamHttpProtocolOptions":{},"useDownstreamProtocolConfig":{}}}},{"circuitBreakers":{"thresholds":[{"maxConnections":1024,"maxRequests":1024,"maxRetries":128}]},"connectTimeout":"2s","loadAssignment":{"clusterName":"xds-grpc-cilium","endpoints":[{"lbEndpoints":[{"endpoint":{"address":{"pipe":{"path":"/var/run/cilium/envoy/sockets/xds.sock"}}}}]}]},"name":"xds-grpc-cilium","type":"STATIC","typedExtensionProtocolOptions":{"envoy.extensions.upstreams.http.v3.HttpProtocolOptions":{"@type":"type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions","explicitHttpConfig":{"http2ProtocolOptions":{}}}}},{"connectTimeout":"2s","loadAssignment":{"clusterName":"/envoy-admin","endpoints":[{"lbEndpoints":[{"endpoint":{"address":{"pipe":{"path":"/var/run/cilium/envoy/sockets/admin.sock"}}}}]}]},"name":"/envoy-admin","type":"STATIC"}],"listeners":[{"address":{"socketAddress":{"address":"0.0.0.0","portValue":9964}},"filterChains":[{"filters":[{"name":"envoy.filters.network.http_connection_manager","typedConfig":{"@type":"type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager","httpFilters":[{"name":"envoy.filters.http.router","typedConfig":{"@type":"type.googleapis.com/envoy.extensions.filters.http.router.v3.Router"}}],"internalAddressConfig":{"cidrRanges":[{"addressPrefix":"10.0.0.0","prefixLen":8},{"addressPrefix":"172.16.0.0","prefixLen":12},{"addressPrefix":"192.168.0.0","prefixLen":16},{"addressPrefix":"127.0.0.1","prefixLen":32}]},"routeConfig":{"virtualHosts":[{"domains":["*"],"name":"prometheus_metrics_route","routes":[{"match":{"prefix":"/metrics"},"name":"prometheus_metrics_route","route":{"cluster":"/envoy-admin","prefixRewrite":"/stats/prometheus"}}]}]},"statPrefix":"envoy-prometheus-metrics-listener","streamIdleTimeout":"300s"}}]}],"name":"envoy-prometheus-metrics-listener"},{"address":{"socketAddress":{"address":"127.0.0.1","portValue":9878}},"filterChains":[{"filters":[{"name":"envoy.filters.network.http_connection_manager","typedConfig":{"@type":"type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager","httpFilters":[{"name":"envoy.filters.http.router","typedConfig":{"@type":"type.googleapis.com/envoy.extensions.filters.http.router.v3.Router"}}],"internalAddressConfig":{"cidrRanges":[{"addressPrefix":"10.0.0.0","prefixLen":8},{"addressPrefix":"172.16.0.0","prefixLen":12},{"addressPrefix":"192.168.0.0","prefixLen":16},{"addressPrefix":"127.0.0.1","prefixLen":32}]},"routeConfig":{"virtual_hosts":[{"domains":["*"],"name":"health","routes":[{"match":{"prefix":"/healthz"},"name":"health","route":{"cluster":"/envoy-admin","prefixRewrite":"/ready"}}]}]},"statPrefix":"envoy-health-listener","streamIdleTimeout":"300s"}}]}],"name":"envoy-health-listener"}]}}
    ---
    # Source: cilium/templates/cilium-agent/clusterrole.yaml
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRole
    metadata:
      name: cilium
      labels:
        app.kubernetes.io/part-of: cilium
        helm.sh/chart: cilium-1.20.1
        app.kubernetes.io/managed-by: Helm
      annotations:
        meta.helm.sh/release-name: cilium
        meta.helm.sh/release-namespace: kube-system
    rules:
      - apiGroups:
          - networking.k8s.io
        resources:
          - networkpolicies
        verbs:
          - get
          - list
          - watch
      - apiGroups:
          - discovery.k8s.io
        resources:
          - endpointslices
        verbs:
          - get
          - list
          - watch
      - apiGroups:
          - ""
        resources:
          - namespaces
          - services
          - pods
          - nodes
        verbs:
          - get
          - list
          - watch
      - apiGroups:
          - coordination.k8s.io
        resources:
          - leases
        verbs:
          - create
          - get
          - update
          - list
          - delete
      - apiGroups:
          - apiextensions.k8s.io
        resources:
          - customresourcedefinitions
        verbs:
          - list
          - watch
          # This is used when validating policies in preflight. This will need to stay
          # until we figure out how to avoid "get" inside the preflight, and then
          # should be removed ideally.
          - get
      - apiGroups:
          - cilium.io
        resources:
          - ciliumloadbalancerippools
          - ciliumbgpnodeconfigs
          - ciliumbgpadvertisements
          - ciliumbgppeerconfigs
          - ciliumclusterwideenvoyconfigs
          - ciliumclusterwidenetworkpolicies
          - ciliumegressgatewaypolicies
          - ciliumendpoints
          - ciliumendpointslices
          - ciliumenvoyconfigs
          - ciliumidentities
          - ciliumlocalredirectpolicies
          - ciliumnetworkpolicies
          - ciliumnodes
          - ciliumnodeconfigs
          - ciliumcidrgroups
          - ciliuml2announcementpolicies
          - ciliumpodippools
          - ciliumdatapathplugins
        verbs:
          - list
          - watch
      - apiGroups:
          - cilium.io
        resources:
          - ciliumidentities
          - ciliumendpoints
          - ciliumnodes
        verbs:
          - create
      - apiGroups:
