# CAPI operator. Release name and namespace MUST match knr-bootstrap's pivot
# Phase 3 imperative install (helm upgrade --install capi-operator ... --namespace
# capi-operator-system --set cert-manager.enabled=false) so Flux adopts the
# release instead of installing a duplicate. Chart version must stay equal to
# bootstrap.toml [charts] capi-operator for the same reason.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: capi-operator
  namespace: capi-operator-system
spec:
  interval: 10m
  chart:
    spec:
      chart: cluster-api-operator
      version: "0.28.0"
      sourceRef:
        kind: HelmRepository
        name: capi-operator
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    cert-manager:
      enabled: false
