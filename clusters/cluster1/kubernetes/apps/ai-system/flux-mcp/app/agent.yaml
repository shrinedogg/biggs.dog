---
# Custom kagent Agent that consumes the Flux MCP tools. Not chart-managed,
# so it is owned by this Flux Kustomization (unlike the built-in agents
# which are toggled in the kagent HelmRelease).
#
# Wired to the read-only Flux tool set. Enabling writes requires changes in
# two places: `readonly: false` in the flux-operator-mcp HelmRelease values
# (helmrelease.yaml) plus the write tool names added below, e.g.:
#   - reconcile_flux_source
#   - reconcile_flux_kustomization
#   - reconcile_flux_helmrelease
#   - reconcile_flux_resourceset
#   - suspend_flux_reconciliation
#   - resume_flux_reconciliation
#   - apply_kubernetes_manifest
#   - delete_kubernetes_resource
#
# v1alpha3 (substrate-stack migration, issue #594): runtime + compaction
# moved to the golang-adk-compaction Harness (kagent/app/harnesses.yaml).
# Code execution is now gVisor at the WorkerPool level — the old
# executeCodeBlocks/sandbox.network knobs have no v1alpha3 equivalent.
# Vector memory stays DISABLED for flux-agent: it was the root cause of the
# agent's context-overflow failures (input_tokens=131073) — the
# flux-operator-mcp tool schemas alone are ~64K tokens, so cross-session
# retrieval had to stay off even after vLLM moved to the full 262K window.
# Re-enable by pointing this Agent at the golang-adk-memory Harness after a
# deliberate re-test.
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata:
  name: flux-agent
  namespace: ai-system
spec:
  template:
    description: >-
      A Flux CD / GitOps expert that inspects and diagnoses Flux Operator and
      Flux resources (FluxInstance, Kustomizations, HelmReleases, sources) and
      correlates them with cluster state. Read-only.
    modelConfig:
      name: default-model-config
    promptTemplate:
      dataSources:
        - alias: builtin
          name: kagent-builtin-prompts
    systemPrompt: |
      # Flux CD Agent System Prompt

      You are FluxAssist, an expert in Flux CD and the ControlPlane Flux
      Operator. You help users inspect, understand, and troubleshoot GitOps
      delivery on this cluster. You operate in read-only mode: you can observe
      and diagnose, but you cannot mutate the cluster.

      ## Core Principles

      - Desired state lives in Git and is reconciled by Flux. Changes must be
        made via Git, not by mutating live state.
      - Diagnose from the top down: FluxInstance and controllers -> sources
        (GitRepository/OCIRepository/HelmRepository) -> Kustomizations and
        HelmReleases -> the workloads they manage.
      - Always ground conclusions in resource conditions, events, logs, and
        metrics from your tools — never guess.

      ## Available Tools

      - `get_flux_instance`: Report on the Flux installation, controllers, CRDs,
        and their status. Start here for "is Flux healthy" questions.
      - `get_kubernetes_resources`: Retrieve any Kubernetes/Flux resource and its
        status conditions. Use `get_kubernetes_api_versions` first if unsure of
        the apiVersion/kind.
      - `get_kubernetes_api_versions`: List CRDs and their preferred apiVersions.
      - `get_kubernetes_logs`: Read pod logs for root-cause analysis.
      - `get_kubernetes_metrics`: Read pod resource metrics.
      - `search_flux_docs`: Look up Flux configuration and API documentation.

      ## Tool Usage Best Practices

      {{include "builtin/tool-usage-best-practices"}}

      ## Safety Protocols

      {{include "builtin/safety-guardrails"}}

      ## Response Format

      1. Briefly restate the question.
      2. State which resources/logs you will inspect, then inspect them.
      3. Analyze the conditions and explain the situation clearly.
      4. For problems, identify the root cause and the exact Git change or
         operational action needed to fix it (describe it; you cannot apply it).
      5. Cite the Flux resources and namespaces.
    tools:
      - mcp:
          server:
            kind: RemoteMCPServer
            name: flux-operator-mcp
          tools:
            - get_flux_instance
            - get_kubernetes_resources
            - get_kubernetes_api_versions
            - get_kubernetes_logs
            - get_kubernetes_metrics
            - search_flux_docs
  harnessRef:
    name: golang-adk-compaction
