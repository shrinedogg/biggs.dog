---
apiVersion: v1
kind: Namespace
metadata:
  name: ai-system
  labels:
    # Privileged: the vLLM inference server runs on the nv-01 GPU node and
    # relies on NVIDIA CDI device injection (nvidia.com/gpu).
    #
    # All kagent agent-runner pods are hardened via spec.declarative.deployment
    # security contexts (runAsNonRoot: true, drop ALL capabilities). The
    # enforcement level stays at privileged to accommodate the vLLM runtime
    # which requires elevated isolation (CDI device injection).
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
