---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kagent
  namespace: ai-system
spec:
  interval: 3m
  chartRef:
    kind: OCIRepository
    name: kagent
    namespace: flux-system
  # 1.0.0-alpha11 renders 5 Deployments (kagent-controller, kagent-ui,
  # kagent-tools, kagent-kmcp-controller-manager, kagent-grafana-mcp); none
  # set nodeSelector or tolerations (verified by helm template), so op: add
  # is safe. Agents are no longer chart-managed (the built-in agent values
  # are gone from the 1.0 schema) — the fleet lives in git as v1alpha3 Agent
  # CRs on shared Harnesses (see harnesses.yaml), gVisor-sandboxed on the
  # substrate WorkerPool, so no per-agent scheduling patches are needed.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
            patch: |-
              - op: add
                path: /spec/template/spec/nodeSelector
                value:
                  nvidia.com/gpu.present: "true"
          - target:
              kind: Deployment
            patch: |-
              - op: add
                path: /spec/template/spec/tolerations
                value:
                  - key: nvidia.com/gpu
                    operator: Exists
                    effect: NoSchedule
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    # Override registry from chart default (cr.kagent.dev) to ghcr.io.
    # All kagent images (controller, agent runtime, skills-init) are
    # available at ghcr.io/kagent-dev/kagent/.* and are mirrored in the
    # cluster's OCI source. This avoids pulling from the external
    # cr.kagent.dev registry.
    registry: ghcr.io
    # ------------------------------------------------------------------
    # Grafana MCP: the 1.0.1 chart dropped the grafana-mcp subchart that
    # used to render the proxy Deployment/Service and the
    # kagent-grafana-mcp RemoteMCPServer (the 1.0.1 upgrade pruned the
    # release-owned objects; the alpha11-era image reference
    # ghcr.io/grafana/mcp-grafana never existed on GHCR, so the proxy
    # never ran). The proxy now lives as the static grafana-mcp app
    # (../grafana-mcp: deployment + service + RMP) pointed at the real
    # Grafana Service (observability ns, 80 -> grafana/3000; egress
    # allowed by the CNP 'allow-egress-to-observability'), with the token
    # from the kagent-grafana-mcp-token ExternalSecret (subchart's
    # grafana.secretRef). The old grafana-mcp: values block was inert on
    # the 1.0.1 chart (no subchart to receive it) and is removed.
    # ------------------------------------------------------------------
    # Default model provider -> local vLLM through agentgateway
    # (OpenAI-compatible). The chart renders a ModelConfig named
    # "default-model-config" (api.kagent.dev/v1alpha3) that the agents use.
    # The gateway route keeps model traffic local while centralizing routing,
    # authentication, and telemetry.
    # ------------------------------------------------------------------
    providers:
      default: openAI
      openAI:
        provider: OpenAI
        # Must match vLLM's --served-model-name (not the HuggingFace weights
        # path -- see vllm/app/deployment.yaml for why they differ).
        model: "qwen 3.8 - local"
        apiKeySecretRef: model-api-keys
        apiKeySecretKey: editor
        config:
          baseUrl: "http://internal-biggs-dog.networking.svc.cluster.local:8445/v1"
    # ------------------------------------------------------------------
    # BYO postgres via the cluster's CNPG operator (cnpg-kagent): the
    # 1.0.0-line chart takes two pre-created connection-string Secrets
    # (no credentials live in git; both are rendered by the ESOs in
    # kagent-postgres-secrets.yaml from the kagent-user-password
    # 1Password item — the same login the CNPG cluster bootstraps with).
    #
    # Single-login role design: the `kagent` login is a member of BOTH
    # the kagent_owner and kagent_readwrite NOLOGIN roles (created by the
    # cnpg-kagent-init ConfigMap's init.sql at cluster creation). The
    # owner connection runs the controller's startup migrations (SET ROLE
    # kagent_owner); the readwrite connection is the runtime pool (SET
    # ROLE kagent_readwrite, chart config.database defaults).
    #
    # schema: kagent — the controller creates/owns its 1.0 tables here;
    # the pre-1.0 tables (0.10.3 era) stay orphaned in the public schema
    # of the recreated database, untouched but unread by 1.0.
    # vectorEnabled=true + vectorSchema=public — long-term vector memory.
    # The Database CR cnpg-kagent-database.yaml installs the vector
    # extension with no schema key, so it lands in `public`; the chart
    # default (vectorSchema: extensions) would look in the wrong place.
    # If vector memory is ever dropped, leave vectorEnabled at its
    # default (false) and the Database CR's extension ensure becomes a
    # no-op.
    # ------------------------------------------------------------------
    database:
      postgres:
        readWriteConnectionStringSecretRef:
          name: kagent-postgres-readwrite
          key: readWriteConnectionString
        ownerConnectionStringSecretRef:
          name: kagent-postgres-owner
          key: ownerConnectionString
    config:
      database:
        schema: kagent
        vectorEnabled: true
        vectorSchema: public
      # ------------------------------------------------------------------
      # Substrate control plane wiring (1.0.0-line key paths; the
      # alpha11-era controller.substrate.* keys are unknown to this chart
      # and were silently ignored). The control plane lives in ai-system,
      # not the chart-default ate-system namespace.
      # apiEndpoint: the ate-api-server gRPC endpoint (mTLS, port 443).
      # routerUrl: the atenet-router Service in ai-system, mTLS frontend
      # (443 -> 8443). Must stay https: the http scheme makes
      # RouterTransport dial insecure (no SPIFFE client identity), and the
      # router's networkAuthorization allowlist (substrate values
      # atenetRouter.ingressAllowedSPIFFEIDs) rejects identity-less and
      # unlisted sources, so every session send then fails with "input was
      # not accepted". The https dial presents the substrate podcert client
      # identity (the substrateClientCertificate volumes set caFile /
      # clientCertFile in the controller config when enabled).
      # actorJwtIssuer: must match the substrate chart's actor-jwt-issuer
      # (verified in the ate-api-server boot log: https://idp.ai-system.svc).
      # ------------------------------------------------------------------
      substrate:
        apiEndpoint: "dns:///api.ai-system.svc:443"
        routerUrl: "https://atenet-router.ai-system.svc:443"
        actorJwtIssuer: "https://idp.ai-system.svc"
      # Standalone sandbox guest image (BYO; the chart default is "" which
      # disables sandbox prep). Digest-pinned: kagent-dev/kagent/
      # sandbox-guest:1.0.1 (verified in the 1.0.1 pairing; the registry
      # override mirrors the host to ghcr.io, the digest survives).
      # 1.0.0-line key: config.sandboxes (the alpha11-era
      # controller.sandbox.* keys are unknown to this chart and were
      # silently ignored).
      sandboxes:
        guestImage: "ghcr.io/kagent-dev/kagent/sandbox-guest@sha256:16e84a2285119ce02cc6ba45ea7f68181eb1527335de85477614fb9a6b5ecf03"
    controller:
      resources:
        limits:
          memory: "1024Mi"
      # ------------------------------------------------------------------
      # Agent Substrate integration (1.0.0 line). The controller dials
      # ate-api-server with mTLS PodCertificate credentials
      # (substrate-podidentity volume) plus the servicedns trust bundle
      # (substrate-servicedns volume) — the chart renders both only when
      # substrateClientCertificate is enabled (the 1.0.1 key that replaces
      # the alpha11-era controller.substrate.enabled flag). Requires the
      # PodCertificateRequest/ClusterTrustBundle feature gates (beta,
      # default-off in K8s 1.36), enabled 2026-09-08 via the Omni cluster
      # template, and the substrate-podcert signer (the CA/JWT pools are
      # bootstrapped imperatively — see the PR's "User-gated follow-ups").
      # ------------------------------------------------------------------
      substrateClientCertificate:
        enabled: true
    # ------------------------------------------------------------------
    # The kagent-default WorkerPool: substrate workers (gVisor actors)
    # that run the Harness workloads. The chart FAILS render if
    # workerImage is empty when create=true.
    #
    # Tracks the substrate release the image was built from (v1.0.1 is a
    # tooling/chart-only patch: no ateworker changes vs v1.0.0; the
    # control-plane chart is still 1.0.0). The 1.0 line
    # renamed the worker image ateom-gvisor -> ateworker-gvisor (v-prefix
    # tags). The worker MUST move in lockstep with
    # ate-controller/atelet/atenet-router (renovate.json groups the whole
    # substrate stack, automerge:false). Workers get their mTLS
    # credentials (atunnel credential bundle) projected automatically by
    # the ate-controller into every worker pod.
    # ------------------------------------------------------------------
    substrateWorkerPool:
      create: true
      name: kagent-default
      replicas: 1
      workerImage: ghcr.io/kagent-dev/substrate/ateworker-gvisor:v1.0.1
      sandboxClass: gvisor
      template:
        # Flat pod-template fragment (the chart pipes this verbatim into
        # WorkerPool.spec.template; the CRD takes nodeSelector/tolerations
        # directly under template).
        nodeSelector:
          nvidia.com/gpu.present: "true"
        tolerations:
          - key: nvidia.com/gpu
            operator: Exists
            effect: NoSchedule
