---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kagent
  namespace: ai-system
spec:
  interval: 3m
  chartRef:
    kind: OCIRepository
    name: kagent
    namespace: flux-system
  # 1.0.0-alpha11 renders 5 Deployments (kagent-controller, kagent-ui,
  # kagent-tools, kagent-kmcp-controller-manager, kagent-grafana-mcp); none
  # set nodeSelector or tolerations (verified by helm template), so op: add
  # is safe. Agents are no longer chart-managed (the built-in agent values
  # are gone from the 1.0 schema) — the fleet lives in git as v1alpha3 Agent
  # CRs on shared Harnesses (see harnesses.yaml), gVisor-sandboxed on the
  # substrate WorkerPool, so no per-agent scheduling patches are needed.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
            patch: |-
              - op: add
                path: /spec/template/spec/nodeSelector
                value:
                  nvidia.com/gpu.present: "true"
          - target:
              kind: Deployment
            patch: |-
              - op: add
                path: /spec/template/spec/tolerations
                value:
                  - key: nvidia.com/gpu
                    operator: Exists
                    effect: NoSchedule
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    # Override registry from chart default (cr.kagent.dev) to ghcr.io.
    # All kagent images (controller, agent runtime, skills-init) are
    # available at ghcr.io/kagent-dev/kagent/.* and are mirrored in the
    # cluster's OCI source. This avoids pulling from the external
    # cr.kagent.dev registry.
    registry: ghcr.io
    # ------------------------------------------------------------------
    # Grafana MCP subchart (mcp-grafana). The subchart already runs
    # --transport streamable-http with a correct -allowed-hosts list and
    # injects the token via envFrom secretRef, and renders its own
    # api.kagent.dev/v1alpha3 RemoteMCPServer (kagent-grafana-mcp).
    # Point it at the real Grafana Service (observability ns, port 80 ->
    # targetPort grafana/3000); egress from ai-system to observability is
    # allowed by the CNP 'allow-egress-to-observability'.
    #
    # The apiKey is NOT stored in git (GitHub secret scanning would block
    # the push): the runtime token is injected from the existing cluster
    # Secret kagent-grafana-mcp-token via grafana.secretRef (the subchart
    # skips creating its own secret when secretRef is set).
    # ------------------------------------------------------------------
    grafana-mcp:
      grafana:
        url: "http://grafana.observability:80/api"
        secretRef: kagent-grafana-mcp-token
    # ------------------------------------------------------------------
    # Default model provider -> our in-cluster vLLM (OpenAI-compatible).
    # The chart renders a ModelConfig named "default-model-config"
    # (api.kagent.dev/v1alpha3) that the agents use. Pointing it at vLLM
    # keeps everything local.
    # ------------------------------------------------------------------
    providers:
      default: openAI
      openAI:
        provider: OpenAI
        # Must match vLLM's --served-model-name (not the HuggingFace weights
        # path -- see vllm/app/deployment.yaml for why they differ).
        model: "qwen 3.8 - local"
        apiKeySecretRef: kagent-vllm
        apiKeySecretKey: OPENAI_API_KEY
        config:
          baseUrl: "http://vllm.ai-system.svc.cluster.local:8000/v1"
    # ------------------------------------------------------------------
    # Use the cluster's CNPG operator (cnpg-kagent) instead of a bundled
    # dev Postgres. The full connection URL (incl. password) comes from the
    # existing ExternalSecret kagent-database-url (key: url) — no
    # credentials live in git.
    #
    # role: "" — cnpg-kagent has no kagent_owner role; an empty role skips
    # SET ROLE after connecting (kagent connect.go).
    # schema: kagent — the controller runs CREATE SCHEMA IF NOT EXISTS at
    # migration. Clean 1.0 schema: 0.10.3's tables stay orphaned in the
    # public schema, untouched but unread by 1.0.
    # vectorEnabled=true + vectorSchema=public — long-term vector memory.
    # The Database CR cnpg-kagent-db installs pgvector in `public` (it has
    # no schema key), so the extensions schema must not be used.
    # ------------------------------------------------------------------
    database:
      postgres:
        connectionStringSecretRef:
          name: kagent-database-url
          key: url
        role: ""
        schema: kagent
        vectorEnabled: true
        vectorSchema: public
    controller:
      resources:
        limits:
          memory: "1024Mi"
      # ------------------------------------------------------------------
      # Agent Substrate integration. The controller dials ate-api-server
      # with an mTLS PodCertificate bundle (substrate-podidentity volume)
      # plus the servicedns ClusterTrustBundle CA (substrate-servicedns
      # volume) — both mounted by the chart when controller.substrate is
      # enabled. Requires the PodCertificateRequest/ClusterTrustBundle
      # feature gates (beta, default-off in K8s 1.36), enabled 2026-09-08
      # via the Omni cluster template, and the substrate-podcert signer
      # (the CA/JWT pools are bootstrapped imperatively — see the PR's
      # "User-gated follow-ups").
      # ------------------------------------------------------------------
      substrate:
        enabled: true
        ateApiEndpoint: "dns:///api.ai-system.svc:443"
        # Required: the atenet-router Service in ai-system, port 80.
        atenetRouterURL: "http://atenet-router.ai-system.svc:80"
      sandbox:
        guestImage:
          # kagent-dev/kagent/sandbox-guest:1.0.0-alpha11 (verified digest).
          # Without it KAGENT_SANDBOX_GUEST_IMAGE renders "" and standalone
          # sandbox prep is silently broken.
          digest: "sha256:fb1218d5bdc397ecb514c5aa81d7958843635ca090c1419b191051f7bb01a3e2"
    # ------------------------------------------------------------------
    # The kagent-default WorkerPool: substrate workers (gVisor actors)
    # that run the Harness workloads. The chart FAILS render if
    # workerImage is empty when create=true.
    #
    # PINNED to the substrate control-plane version (0.5.0-alpha2). The
    # ateom worker image MUST move in lockstep with
    # ate-controller/atelet/atenet-router (renovate.json groups the whole
    # substrate stack, automerge:false). Workers get their mTLS
    # credentials (atunnel credential bundle) projected automatically by
    # the ate-controller into every worker pod.
    # ------------------------------------------------------------------
    substrateWorkerPool:
      create: true
      name: kagent-default
      replicas: 1
      workerImage: ghcr.io/kagent-dev/substrate/ateom-gvisor:v0.5.0-alpha2
      sandboxClass: gvisor
      template:
        # Flat pod-template fragment (the chart pipes this verbatim into
        # WorkerPool.spec.template; the CRD takes nodeSelector/tolerations
        # directly under template).
        nodeSelector:
          nvidia.com/gpu.present: "true"
        tolerations:
          - key: nvidia.com/gpu
            operator: Exists
            effect: NoSchedule
