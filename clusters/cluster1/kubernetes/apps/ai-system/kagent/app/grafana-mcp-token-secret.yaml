# Materializes secret "kagent-grafana-mcp-token" in ai-system with the
# Grafana service-account token that kagent-grafana-mcp (mcp-grafana
# proxy) uses to discover datasources and serve the observability-agent's
# MCP toolset.
#
# 1Password item (biggs-dog vault): kagent-grafana-mcp-token
#   field GRAFANA_SERVICE_ACCOUNT_TOKEN — a Grafana service-account
#   token with an Admin role (the agent uses update_dashboard,
#   create_incident, and friends). If it ever goes dead again (Grafana
#   401s in the proxy's 5m discovery loop), regenerate the token in
#   Grafana (Admin -> Service accounts), update the 1Password item, and
#   restart the deployment — pods only see secret env at creation:
#   kubectl -n ai-system rollout restart deploy/kagent-grafana-mcp
#
# Replaces the temporary plaintext Secret that lived in this file before
# the 1Password item existed.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kagent-grafana-mcp-token
  namespace: ai-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: kagent-grafana-mcp-token
    creationPolicy: Owner
  data:
    - secretKey: GRAFANA_SERVICE_ACCOUNT_TOKEN
      remoteRef:
        key: kagent-grafana-mcp-token
        property: GRAFANA_SERVICE_ACCOUNT_TOKEN
