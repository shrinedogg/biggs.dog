# Materializes secret "kagent-mcp-api-keys" in ai-system with the Pocket-ID
# API token that agentgateway uses for apiKeyAuthentication on the MCP
# endpoint (kagent-mcp HTTPRoute).
#
# 1Password item required (biggs-dog vault): kagent-mcp-api-key
#   token — a Pocket-ID API token (simple token with date expiration).
#   Create in the Pocket-ID admin UI (id.biggs.dog) under API Tokens. Set
#   expiry comfortably in the future; rotate before it lapses (ExternalSecret
#   refresh picks up the new value automatically).
#
# The Secret data key "editor" is an arbitrary identifier consumed by
# agentgateway's apiKeyAuthentication. The VALUE is the raw API token.
# To store a hashed key instead, set the value to
# {"keyHash":"sha256:<hex>"} and compute the hash with
# `printf %s '<token>' | shasum -a 256`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kagent-mcp-api-keys
  namespace: ai-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: kagent-mcp-api-keys
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        editor: "{{ .token }}"
  data:
    - secretKey: token
      remoteRef:
        key: kagent-mcp-api-key
        property: token