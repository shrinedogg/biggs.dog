# 1Password: item kagent-user-password (username, password) — must match
# the CNPG bootstrap credentials of cnpg-kagent
# (clusters/cluster1/kubernetes/apps/cnpg/cnpg/secrets/kagent-user-password.yaml).
#
# The 1.0.0-line kagent chart takes BYO postgres as two pre-created
# connection-string Secrets (the controller mounts both; the owner
# connection runs the startup migrations as kagent_owner, the readwrite
# connection is the runtime pool that SET ROLEs to kagent_readwrite).
# Single-login design: one 1Password login is a member of both NOLOGIN
# roles (created by the cnpg-kagent-init ConfigMap's init.sql).
# Mirrors ai-system/substrate/app/external-secrets.yaml.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kagent-postgres-readwrite
  namespace: ai-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: kagent-postgres-readwrite
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        readWriteConnectionString: >-
          postgres://{{ .username | urlquery }}:{{ .password | urlquery }}@cnpg-kagent-rw.cnpg-system.svc.cluster.local:5432/kagent
  data:
    - secretKey: username
      remoteRef:
        key: kagent-user-password
        property: username
    - secretKey: password
      remoteRef:
        key: kagent-user-password
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kagent-postgres-owner
  namespace: ai-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: kagent-postgres-owner
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        ownerConnectionString: >-
          postgres://{{ .username | urlquery }}:{{ .password | urlquery }}@cnpg-kagent-rw.cnpg-system.svc.cluster.local:5432/kagent
  data:
    - secretKey: username
      remoteRef:
        key: kagent-user-password
        property: username
    - secretKey: password
      remoteRef:
        key: kagent-user-password
        property: password
