---
# v1alpha3 Agent CRs for the 5 former SandboxAgents (recreated in the
# substrate-stack migration, issue #594). kagent 1.0.0 dropped the
# kagent.dev/v1alpha2 SandboxAgent API; these agents now run as v1alpha3
# Agents on the shared golang-adk Harness (kagent/app/harnesses.yaml),
# i.e. gVisor actors on the kagent-default WorkerPool. Per-agent
# scheduling/deployment knobs are gone at v1alpha3 — the WorkerPool
# template owns placement, and isolation is gVisor at the actor level.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./k8s-agent.yaml
  - ./helm-agent.yaml
  - ./promql-agent.yaml
  - ./observability-agent.yaml
  - ./cilium-manager-agent.yaml
