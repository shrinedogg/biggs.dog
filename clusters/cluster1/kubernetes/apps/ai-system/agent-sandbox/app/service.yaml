# agent-sandbox controller Service (metrics on 8080), converted from the
# agent-sandbox HelmRelease (Wave 1 de-Helm).

apiVersion: v1
kind: Service
metadata:
  name: agent-sandbox-controller
  namespace: ai-system
  labels:
    app.kubernetes.io/name: agent-sandbox
    app.kubernetes.io/instance: agent-sandbox
    app.kubernetes.io/version: "v0.5.0"
spec:
  selector:
    app.kubernetes.io/name: agent-sandbox
    app.kubernetes.io/instance: agent-sandbox
  ports:
  - name: metrics
    port: 8080   # Change to 8443 when --metrics-secure-serving is enabled.
    targetPort: metrics
    protocol: TCP
