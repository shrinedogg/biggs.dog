---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app victoria-metrics-mcp
  namespace: flux-system
spec:
  dependsOn:
    # kagent provides the RemoteMCPServer/Agent CRDs, the default-model-config
    # ModelConfig, and the kagent-builtin-prompts ConfigMap referenced here.
    - name: kagent
  # No targetNamespace: each manifest sets its own namespace. All resources
  # currently live in ai-system (unlike flux-mcp which spans namespaces,
  # this app has no cluster RBAC and stays fully within ai-system).
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./clusters/cluster1/kubernetes/apps/ai-system/victoria-metrics-mcp/app
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  interval: 3m
  retryInterval: 1m
  timeout: 5m
