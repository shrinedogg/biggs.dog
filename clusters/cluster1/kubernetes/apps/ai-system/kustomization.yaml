---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Pre Flux-Kustomizations
  - ./namespace.yaml
  # Flux-Kustomizations (CRDs must come before agents that depend on them).
  # 2026-11-09 (issue #798): the CRD Kustomizations moved into the app
  # ks.yaml files — kagent-crds is now nested in ./kagent/ks.yaml and
  # substrate-crds in ./substrate/ks.yaml — so each CRD document applies
  # before its consuming app document within that file.
  - ./vllm/ks.yaml
  # The substrate-stack migration (2026-10-10, issue #594) re-added the
  # substrate control plane: CRDs first, then the podcertificate signer,
  # then the control plane itself (dependsOn substrate-crds,
  # substrate-podcert, cnpg-databases). 2026-11-09 (issue #798): the
  # substrate-crds Kustomization is nested in ./substrate/ks.yaml (before
  # the substrate document), so that ordering still holds.
  - ./substrate-podcert/ks.yaml
  - ./substrate/ks.yaml
  # One-shot ate.dev CRD storage-version migration (v1alpha1 -> v1): applied
  # its dual-version CRDs once (PR #806) and is now suspended (its KZ
  # object persists in-cluster — the root KZ is prune:false; see the
  # storage-migration/ks.yaml header for the optional housekeeping delete).
  - ./substrate/substrate-crds/storage-migration/ks.yaml
  - ./csi-driver/ks.yaml
  - ./agent-sandbox/ks.yaml
  - ./kagent/ks.yaml
  # v1alpha3 Agent CRs for the 5 former SandboxAgents; dependsOn kagent +
  # substrate (see ks.yaml inside the dir).
  - ./kagent/substrate-agents/ks.yaml
  - ./kagent/cilium-agents/ks.yaml
  - ./victoria-metrics-mcp/ks.yaml
  - ./flux-mcp/ks.yaml
  - ./exa-mcp/ks.yaml
  - ./embeddings/ks.yaml
  - ./codebase-memory-mcp/ks.yaml
  - ./mindwtr-mcp/ks.yaml
  - ./hister-mcp/ks.yaml
  - ./agentgateway-ai/ks.yaml
