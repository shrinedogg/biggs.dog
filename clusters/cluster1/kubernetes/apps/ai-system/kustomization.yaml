---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Pre Flux-Kustomizations
  - ./namespace.yaml
  # Flux-Kustomizations (CRDs must come before agents that depend on them)
  - ./vllm/ks.yaml
  - ./kagent-crds/ks.yaml
  # agent-substrate was torn down from cluster1 on 2026-10-09 (substrate
  # HelmRelease, the substrate-crds ate.dev CRDs, and kagent/substrate-agents
  # removed). The substrate/ dir + substrate-oci.yaml source are kept as the
  # re-enable starting point; the substrate-stack migration workstream
  # re-adds ./substrate/ks.yaml, ./substrate-crds/ks.yaml, and
  # ./kagent/substrate-agents/ks.yaml once the newer charts + rebased ateapi
  # fork + kagent 1.0 workerImage pin are in place.
  - ./csi-driver/ks.yaml
  - ./agent-sandbox/ks.yaml
  - ./kagent/ks.yaml
  - ./kagent/cilium-agents/ks.yaml
  - ./victoria-metrics-mcp/ks.yaml
  - ./flux-mcp/ks.yaml
  - ./exa-mcp/ks.yaml
  - ./embeddings/ks.yaml
  - ./codebase-memory-mcp/ks.yaml
  - ./mindwtr-mcp/ks.yaml
