---
# Route silo's recommendation embeddings to the Infinity server.
#
# Silo's embedding client (OpenAI-compatible) always POSTs to
# {base_url}/v1/embeddings for a versionless base URL, but this Infinity
# image serves the OpenAI endpoint at /embeddings only (/v1/* returns 404,
# verified live). The URLRewrite filter maps the request onto the path the
# server actually has.
#
# Base URL for silo (Admin > Integrations > Recommendations > Embedding
# Configuration, provider "OpenAI-compatible"):
#   https://embeddings.biggs.dog
# Auth token: the VLLM_API_KEY value of the ai-system/kagent-vllm secret
# (the same key Infinity enforces as INFINITY_API_KEY).
#
# No new egress policy needed: media's allow-egress-to-pocket-id already
# permits silo -> networking agentgateway pods on 443, which is the path
# every *.biggs.dog in-cluster name takes.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: embeddings
  namespace: ai-system
spec:
  hostnames:
    - embeddings.biggs.dog
  parentRefs:
    - name: internal-biggs-dog
      namespace: networking
  rules:
    - backendRefs:
        - name: embeddings
          port: 7997
      matches:
        - path:
            type: PathPrefix
            value: /v1/embeddings
      filters:
        # agentgateway's CRD inlines the filter value (no upstream `value:`
        # wrapper) and names the full-path field replaceFullPath.
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /embeddings
