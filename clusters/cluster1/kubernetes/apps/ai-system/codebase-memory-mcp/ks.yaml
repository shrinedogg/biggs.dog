---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app codebase-memory-mcp
  namespace: flux-system
spec:
  dependsOn:
    # kagent provides the RemoteMCPServer/Agent CRDs, the default-model-config
    # ModelConfig, and the kagent-builtin-prompts ConfigMap referenced in
    # agent.yaml.
    - name: kagent
    # agent-sandbox CRDs/controller must exist before agents that set
    # executeCodeBlocks (they create agents.x-k8s.io Sandbox objects).
    - name: agent-sandbox
  # No targetNamespace: each manifest sets its own namespace. All resources
  # live in ai-system (no cluster RBAC; the server only reads a git checkout
  # and writes a local SQLite index).
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./clusters/cluster1/kubernetes/apps/ai-system/codebase-memory-mcp/app
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  interval: 3m
  retryInterval: 1m
  timeout: 5m
