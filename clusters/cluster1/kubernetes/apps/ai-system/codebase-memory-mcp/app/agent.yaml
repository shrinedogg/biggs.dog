---
# Custom kagent Agent wired to the codebase-memory-mcp server.
# Provides code intelligence over indexed repositories: structural graph
# search, call/data-flow tracing, architecture overviews, semantic code
# search, and blast-radius change analysis.
#
# Not chart-managed (like flux-agent, vm-agent, exa-agent): owned by this
# Kustomization.
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: codebase-agent
  namespace: ai-system
spec:
  type: Declarative
  description: >-
    Codebase intelligence expert for indexed source repositories. Answers
    structural questions about code: find functions/classes/routes, trace
    callers and callees, map data flow, read exact source for a symbol, run
    multi-hop Cypher graph queries, get architecture overviews, and compute
    the blast radius of a git diff. Currently indexes the biggs.dog GitOps
    repo (auto-synced from main); more repos can be added. Use for "where is
    X defined / what calls this / what breaks if I change this file".
  # Sandboxed execution: code the agent writes runs in an isolated env.
  # Allow cluster-internal services so code can call the MCP server / cluster
  # APIs directly in addition to tool calls.
  sandbox:
    network:
      allowedDomains:
        - "*.svc.cluster.local"
  declarative:
    modelConfig: default-model-config
    runtime: python
    # Allow the agent to write and execute Python code blocks in the
    # agent-sandbox. Useful for post-processing large graph results, custom
    # analysis, and report generation beyond raw tool calls.
    executeCodeBlocks: true
    context:
      # Bound session growth so large tool results (graph dumps, source
      # snippets, architecture overviews) can't accumulate past the model's
      # 131K context window. See flux-mcp/app/agent.yaml for full rationale.
      compaction:
        tokenThreshold: 80000
        summarizer:
          modelConfig: default-model-config
    memory:
      # Long-term (cross-session) vector memory via the in-cluster Infinity
      # embedding server (ModelConfig `embedding-model`) + pgvector. Lets the
      # agent remember repo layout / prior investigations across sessions.
      modelConfig: embedding-model
      ttlDays: 30
    deployment:
      nodeSelector:
        nvidia.com/gpu.present: "true"
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 512Mi
      # Harden the agent-runner pod (see vm-mcp/app/agent.yaml for the full
      # rationale: kagent otherwise schedules agent pods privileged).
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        privileged: false
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 1001
        capabilities:
          drop:
            - ALL
    promptTemplate:
      dataSources:
        - alias: builtin
          kind: ConfigMap
          name: kagent-builtin-prompts
    a2aConfig:
      skills:
        - id: code-discovery
          name: Code Discovery
          description: >-
            Find functions, classes, routes, and variables in indexed
            repositories, then read the exact source for a symbol. Combines
            structural graph search with literal text search.
          tags:
            - code
            - search
            - graph
            - codebase
          examples:
            - Where is the flux-agent Kustomization defined?
            - Find the HTTP route handlers in this repo
            - Show me the source for the reconcile function
        - id: dependency-tracing
          name: Dependency & Data-Flow Tracing
          description: >-
            Trace callers and callees of a symbol, follow value/data flow
            through the code graph, and run multi-hop Cypher queries for
            complex structural patterns.
          tags:
            - calls
            - dataflow
            - trace
            - graph
            - cypher
          examples:
            - What calls index_repository?
            - Trace the data flow from the HTTP handler to the database
            - Find all symbols more than 2 hops from main
        - id: architecture-analysis
          name: Architecture & Impact Analysis
          description: >-
            Get a high-level architecture overview of a repository and compute
            the blast radius of a change: map a git diff to the symbols it
            defines and everything that depends on them.
          tags:
            - architecture
            - impact
            - blast-radius
            - codebase
          examples:
            - Give me an architecture overview of this repo
            - What breaks if I change this file?
            - Map this diff to its blast radius
    systemMessage: |
      # Codebase Intelligence Agent

      You are a code intelligence expert with access to a persistent
      tree-sitter knowledge graph built from indexed source repositories. You
      answer structural questions about code: where symbols are defined, who
      calls them, how data flows, what the architecture looks like, and what
      a change will impact.

      ## Indexed Repositories

      The server currently indexes the **biggs.dog** Flux GitOps repo
      (auto-synced from `main` via git-sync). The graph refreshes in the
      background as the checkout updates. Call `list_projects` to see what is
      indexed and `index_status` for per-project health.

      ## Tool Orchestration (follow this order)

      1. **Orient** — `list_projects` to confirm the project is indexed; if
         not, call `index_repository` (only when a repo is missing or to force
         freshness after a large external update).
      2. **Find** — `search_graph` for structural discovery (functions,
         classes, routes, variables). Use `search_code` (graph-augmented grep)
         for literal text or when graph coverage is insufficient.
      3. **Read** — `get_code_snippet` for exact source. IMPORTANT: call
         `search_graph` first to resolve the symbol; don't guess node IDs.
      4. **Trace** — `trace_path` for callers/callees (`calls` mode) or value
         propagation (`data_flow` mode); `query_graph` (Cypher subset) for
         complex multi-hop patterns. Check `get_graph_schema` for node labels
         and edge types before writing Cypher.
      5. **Summarize / Impact** — `get_architecture` for orientation
         (default is a compact summary); `detect_changes` to map a git diff
         to its blast radius.

      ## Coverage & Honesty

      - Indexing is **best-effort, never proof of completeness**. Before
        making exhaustive or negative claims ("nothing calls X", "this file
        is unused"), call `check_index_coverage` for the cited paths/scopes.
      - Watched projects auto-refresh; only force `index_repository` when a
        repo is not indexed or after a large external update.
      - Paginate when results carry `has_more` / `nextCursor`.

      ## Guidelines

      {{include "builtin/tool-usage-best-practices"}}

      - Prefer graph tools (`search_graph`, `trace_path`, `query_graph`) for
        structural questions; fall back to `search_code` for literal text.
      - Always cite the file path and symbol you based an answer on.
      - Use `manage_adr` only when the user explicitly asks to record an
        Architecture Decision Record.

      {{include "builtin/safety-guardrails"}}
    tools:
      - type: McpServer
        mcpServer:
          apiGroup: kagent.dev
          kind: RemoteMCPServer
          name: codebase-memory-mcp
          toolNames:
            # Discovery / orientation
            - list_projects
            - index_status
            - check_index_coverage
            - get_graph_schema
            # Structural search & read
            - search_graph
            - search_code
            - get_code_snippet
            - get_architecture
            # Tracing & advanced query
            - trace_path
            - query_graph
            # Impact analysis
            - detect_changes
            # Index & project management
            - index_repository
            - delete_project
            - manage_adr
            - ingest_traces
