---
# Git credential for the git-sync sidecar that clones biggs.dog into the pod.
#
# 1Password item required (biggs-dog vault): codebase-memory-git
#   username — the git auth username (for a GitHub token use "git" or "x-access-token")
#   password — a READ-ONLY GitHub personal access token (or fine-grained PAT)
#              with contents:read on shrinedogg/biggs.dog
#
# A dedicated read-only token is used (rather than reusing the flux-system
# deploy credential) so this server's blast radius is limited to read-only
# repo access. To index additional/private repos later, extend the token's
# scope or add more entries to the ExternalSecret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: codebase-memory-git
  namespace: ai-system
  labels:
    app.kubernetes.io/name: codebase-memory-mcp
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: codebase-memory-git
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: codebase-memory-git
        property: username
    - secretKey: password
      remoteRef:
        key: codebase-memory-git
        property: password
