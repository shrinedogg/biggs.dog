---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: substrate
  namespace: ai-system
spec:
  # 4m (was 3m): generation bump. After the contaminated helm release
  # secrets were deleted (their v1alpha1-era manifests can no longer be
  # built against the v1-only CRD, which wedged every upgrade/rollback
  # cycle), the HR's remediation went quiescent (RetriesExceeded does
  # not self-clear). This spec delta re-arms the release: the next
  # reconcile does a clean 0.7.0 install with no release history to
  # read.
  interval: 4m
  chartRef:
    kind: OCIRepository
    name: substrate
    namespace: flux-system
  postRenderers:
    - kustomize:
        patches:
          # Both API replicas are pinned to the single GPU node (nv-01).
          # The chart's maxUnavailable: 1 blocks the final eviction after
          # cordon because its replacement cannot schedule anywhere else.
          # Accept full Substrate API downtime during node maintenance;
          # revisit this budget if placement expands to multiple nodes.
          - target:
              group: policy
              version: v1
              kind: PodDisruptionBudget
              name: ate-api-server
            patch: |-
              - op: replace
                path: /spec/maxUnavailable
                value: "100%"
          # Pin every substrate Deployment to the GPU node (nv-01). The
          # Deployments rendered by the 0.5.0-alpha2 chart (ate-api-server,
          # ate-controller, atenet-router, atenet-egress,
          # k8s-credential-provider; rustfs is disabled below) set neither
          # nodeSelector nor tolerations (verified by helm template), so
          # op: add is safe.
          - target:
              kind: Deployment
            patch: |-
              - op: add
                path: /spec/template/spec/nodeSelector
                value:
                  nvidia.com/gpu.present: "true"
          - target:
              kind: Deployment
            patch: |-
              - op: add
                path: /spec/template/spec/tolerations
                value:
                  - key: nvidia.com/gpu
                    operator: Exists
                    effect: NoSchedule
          # 0.7.0 wiring: the S3 I/O (gVisor asset fetch on the node,
          # snapshot transfers) happens in the objectstore-plugin init
          # containers (node mode in the atelet DaemonSet, control mode in
          # the ate-api-server pod), not in the atelet or ate-api-server
          # containers. The chart renders those containers' env from the
          # objectStorePlugin.extraEnv value (the storage.env helper) plus
          # the rustfs branch (disabled), so with rustfs off the B2 AWS_*
          # vars go in values.objectStorePlugin.extraEnv below (issue
          # #598). The pre-0.7 wiring -- env pinned on the atelet container
          # (atelet.extraEnv) and on the ate-api-server container (an old
          # postRenderer env patch) -- no longer reaches the 0.7 S3 reader;
          # with rustfs disabled the chart rendered no AWS env anywhere, so
          # the s3:// gVisor asset URL was unservable.
          # Tolerate the nv-01 GPU taint for the atelet DaemonSet. The chart
          # already sets one toleration (ate.dev/sandboxClass Exists), so
          # APPEND instead of replacing the whole list.
          - target:
              kind: DaemonSet
            patch: |-
              - op: add
                path: /spec/template/spec/tolerations/-
                value:
                  key: nvidia.com/gpu
                  operator: Exists
                  effect: NoSchedule
          # The chart renders the cluster-scoped gvisor-default SandboxConfig
          # with an unreachable gs://gvisor asset URL (no GCS identity on
          # these nodes; the node plugin's S3 backend does not serve gs://).
          # Retarget the DEFAULT version's amd64 asset at the durable B2
          # store (issue #598) under the substrate/ prefix; the node's
          # objectstore-plugin downloads it (env from
          # values.objectStorePlugin.extraEnv). Since the 0.7.0-alpha2
          # chart (substrate 1.0 line) the asset lives under
          # spec.versions[].assets and pauseImage no longer exists in the
          # chart or the ate.dev/v1 SandboxConfig CRD, so the pre-0.7 ops
          # (/spec/assets/amd64/gvisor/url, /spec/pauseImage) stopped
          # applying: "replace operation does not apply: doc is missing
          # path".
          # 1.0.0 chart: defaultVersion = v7 (gVisor 20261102.0), which is
          # versions[1]; v6 (20261026.0) stays on gs:// and is never
          # fetched (not the default). The sha256 stays the chart's own
          # pin, so the B2 object must hold the 20261102.0 x86_64 tarball
          # (the pre-1.0 seed was the 20261019.0 build and no longer
          # matches). Reseed BEFORE the merge (cutover runbook in the PR
          # body): if the reseed is missed the upgrade still lands and
          # ate-api-server stays Ready, but the v7 asset prewarm fails on
          # the sha256 mismatch and no gVisor sandbox can start until the
          # reseed.
          #   curl -fsL -o /tmp/gvisor.tar.zstd \
          #     "https://storage.googleapis.com/gvisor/releases/release/20261102.0/x86_64/gvisor.tar.zstd"
          #   sha256sum /tmp/gvisor.tar.zstd
          #   # -> a1439ffbba7d212e0fde32ea79fa9bb51cbc4c5f6c16af1f047260290b861d42
          #   aws s3 cp /tmp/gvisor.tar.zstd s3://biggs-dog/substrate/gvisor.tar.zstd \
          #     --endpoint-url https://s3.eu-central-003.backblazeb2.com
          - target:
              kind: SandboxConfig
              name: gvisor-default
            patch: |-
              - op: replace
                path: /spec/versions/1/assets/amd64/gvisor/url
                value: "s3://biggs-dog/substrate/gvisor.tar.zstd"
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    # BYO postgres (the substrate chart has no bundled postgres and FAILS
    # render without these refs). The two Secrets are ExternalSecrets over
    # 1Password (app/external-secrets.yaml); the database itself is
    # cnpg-substrate (clusters/cluster1/kubernetes/apps/cnpg/cnpg/databases/
    # cnpg-substrate.yaml). Names match the chart defaults; set explicitly
    # for readability.
    #
    # 0.7.0 cutover: upstream squashed the postgres migrations through
    # v0.6.0 into 000001_initial.sql, and a database created before that
    # squash cannot be upgraded in place (chart README, PostgreSQL setup).
    # The live cnpg-substrate predates the squash, so recreate it BEFORE
    # this cutover (delete the CNPG Cluster + its PVCs; Flux re-applies the
    # manifest and initdb builds the fresh squashed schema). Cutover
    # runbook in the PR body.
    postgres:
      readWriteConnectionStringSecretRef:
        name: substrate-postgres-readwrite
        key: readWriteConnectionString
      ownerConnectionStringSecretRef:
        name: substrate-postgres-owner
        key: ownerConnectionString
      schema: substrate
    # OTLP export: disable. With no endpoint configured the Go OTel SDK
    # falls back to the SDK default (localhost:4317) and retries forever,
    # spamming "OpenTelemetry SDK error ... connection refused" WARNs from
    # ate-api-server (traces) and ate-controller (metrics). ai-system has no
    # OTLP collector; signals that matter (actor events) already go to stdout.
    otel:
      traces:
        enabled: false
      metrics:
        enabled: false
      logs:
        enabled: false
    # k8s-credential-provider enforces atespace->namespace authorization for
    # FetchSecret (default-deny; the chart default is an empty list, which
    # denies EVERY actor secret fetch: "credential request denied: atespace
    # not permitted for namespace"). Egress maps that denial to a 403 on the
    # actor's request, so every agent's LLM call to vllm fails. Grant the one
    # mapping the fleet needs: actors in atespace ai-system read secrets in
    # the ai-system namespace (kagent-vllm OPENAI_API_KEY is the only
    # credential binding across all runtime revisions).
    credentialProvider:
      namespacePolicies:
        - atespace: ai-system
          allowedNamespaces:
            - ai-system
    # Disable the in-cluster rustfs object store (issue #598). Substrate's
    # S3 backend (ATE_STORAGE_BACKEND=s3, the chart default) is pointed at
    # the durable Backblaze B2 endpoint via the AWS_* env in
    # values.objectStorePlugin.extraEnv below. The 0.7.0 chart does the
    # S3 I/O in the objectstore-plugin init containers, which take their
    # env from that value; with rustfs disabled the chart's rustfs env
    # branch renders nothing. Disabling rustfs removes its Deployment,
    # ephemeral host-path PVC, Service, and bucket-init Job -- the 1Gi PVC
    # on the shared OpenEBS local store and the manual asset upload it
    # implied both go away.
    rustfs:
      enabled: false
    # kagent 1.0.1 compiles BOTH of these fields into every Agent's
    # ActorTemplate unconditionally (snapshotConfig.storageLocation and
    # goldenEgressPolicy), while substrate 1.0.0 rejects a set value unless
    # the matching preview gate is on: CreateActorTemplate fails with
    # "actor_template.snapshot_config.storage_location: Forbidden,
    # actor_template.golden_egress_policy: Forbidden", and the kagent
    # controller drops that error and does not retry (reconciler.go:
    # InvalidArgument -> canned Ready=False message, return nil), so all 13
    # agents stay Ready=False. The chart renders this list as
    # --preview=<comma-joined> on ate-api-server (and shares it with the
    # controller/atelet, so the gates stay consistent across components).
    # GoldenEgressPolicy: admits the golden-actor egress grant kagent
    # compiles (kagent-controller:8083 actor-JWT replace-header) that the
    # harness bootstrap needs. PerTemplateSnapshotLocation: lets each
    # template's storageLocation (the B2 prefix) override the cluster
    # --snapshot-location flag.
    preview:
      - GoldenEgressPolicy
      - PerTemplateSnapshotLocation
    # substrate 0.7.0-alpha2 chart: when rustfs is disabled, the api server
    # requires an explicit snapshot location (previously implicit via the
    # bundled rustfs store). Every kagent harness already points its
    # snapshotPolicy at this durable B2 prefix (kagent/app/harnesses.yaml),
    # so the api-level default is the same store.
    ateApi:
      snapshotLocation: s3://biggs-dog/substrate/kagent/
      # kagent 1.0.x: the controller dials ate-api with its podcertificate
      # workload identity and ate-api's embedded OpenFGA authorizer denies it
      # (rpc PermissionDenied: principal user:spiffe://cluster.local/ns/
      # ai-system/sa/kagent-controller lacks can_get on actor_template:<ns>/<agent>-<hash>),
      # so every Agent's prepared-revision reconcile retries forever and all
      # agents stay Ready=False/ActorTemplatePending. An empty
      # bootstrapOwners list silently falls back to the chart's shared
      # ate-client principal, so make that default explicit and add the
      # kagent-controller's SPIFFE ID (upstream docs/guides/authorization.md:
      # bootstrap owners are read from config at startup, not from FGA
      # state, which also makes this survive cnpg-substrate DB recreates).
      # The --authz-bootstrap-owners arg change rolls the ate-api-server
      # replicas; the controller's ActorTemplate reconciles then succeed.
      authorization:
        bootstrapOwners:
          - system:serviceaccount:ai-system:ate-client
          - spiffe://cluster.local/ns/ai-system/sa/kagent-controller
    # The atelet binary defaults --ateapi-address/--ateapi-server-name to
    # api.ate-system.svc (the substrate canonical namespace). Substrate is
    # installed in ai-system here, so the node-local atelet (which brokers the
    # workers' capacity reports to ateapi) dials a service that does not exist
    # and never reports capacity; every golden ActorTemplate then fails with
    # "no worker has room for the actor" and agents stay
    # Ready=False/ActorTemplatePending. Point the atelet at the release-local
    # api Service, mirroring the chart's own override for ate-controller
    # (dns:///api.<ns>.svc:443 + the same servicedns CA bundle it already
    # mounts).
    atelet:
      extraArgs:
        - --ateapi-address=dns:///api.ai-system.svc:443
        - --ateapi-server-name=api.ai-system.svc
    # B2 object store (issue #598): the five AWS_* vars for the S3
    # endpoint, shared by BOTH objectstore-plugin containers through the
    # chart's storage.env helper (node init container in the atelet
    # DaemonSet: gVisor asset download + node-side snapshot transfers;
    # control init container in the ate-api-server pod: control-side
    # snapshot transfers). The 0.5.0-era wiring (atelet.extraEnv on the
    # atelet container + a postRenderer env patch on the ate-api-server
    # container) reached neither of the 0.7.0 S3 readers and is retired.
    # Path style is required (B2's S3 API wants bucket-in-path). The key
    # pair comes from the substrate-b2-object-store Secret
    # (app/external-secrets.yaml, same 1Password item as Barman's
    # object-store-secret in cnpg-system).
    objectStorePlugin:
      extraEnv:
        - name: AWS_REGION
          value: us-east-1
        - name: AWS_ENDPOINT_URL
          value: "https://s3.eu-central-003.backblazeb2.com"
        - name: AWS_S3_USE_PATH_STYLE
          value: "true"
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: substrate-b2-object-store
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: substrate-b2-object-store
              key: AWS_SECRET_ACCESS_KEY
