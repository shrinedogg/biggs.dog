---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: substrate
  namespace: ai-system
spec:
  interval: 3m
  chartRef:
    kind: OCIRepository
    name: substrate
    namespace: flux-system
  postRenderers:
    - kustomize:
        patches:
          # Pin every substrate Deployment to the GPU node (nv-01). The
          # Deployments rendered by the 0.5.0-alpha2 chart (ate-api-server,
          # ate-controller, atenet-router, atenet-egress,
          # k8s-credential-provider; rustfs is disabled below) set neither
          # nodeSelector nor tolerations (verified by helm template), so
          # op: add is safe.
          - target:
              kind: Deployment
            patch: |-
              - op: add
                path: /spec/template/spec/nodeSelector
                value:
                  nvidia.com/gpu.present: "true"
          - target:
              kind: Deployment
            patch: |-
              - op: add
                path: /spec/template/spec/tolerations
                value:
                  - key: nvidia.com/gpu
                    operator: Exists
                    effect: NoSchedule
          # B2 object store for substrate snapshots + the gVisor asset
          # (issue #598). With rustfs disabled the chart renders NO AWS env
          # for either S3 reader, and the ate-api-server Deployment has no
          # extraEnv value hook (only atelet does), so pin the endpoint here.
          # Path style is required (B2's S3 API wants bucket-in-path). The
          # key pair comes from the substrate-b2-object-store Secret
          # (app/external-secrets.yaml, same 1Password item as Barman's
          # object-store-secret in cnpg-system). The atelet DaemonSet gets
          # the identical five vars via values.atelet.extraEnv below -- the
          # two components must agree, or snapshot reads fail at restore.
          - target:
              kind: Deployment
              name: ate-api-server
            patch: |-
              - op: add
                path: /spec/template/spec/containers/0/env/-
                value:
                  name: AWS_REGION
                  value: us-east-1
              - op: add
                path: /spec/template/spec/containers/0/env/-
                value:
                  name: AWS_ENDPOINT_URL
                  value: "https://s3.eu-central-003.backblazeb2.com"
              - op: add
                path: /spec/template/spec/containers/0/env/-
                value:
                  name: AWS_S3_USE_PATH_STYLE
                  value: "true"
              - op: add
                path: /spec/template/spec/containers/0/env/-
                value:
                  name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: substrate-b2-object-store
                      key: AWS_ACCESS_KEY_ID
              - op: add
                path: /spec/template/spec/containers/0/env/-
                value:
                  name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: substrate-b2-object-store
                      key: AWS_SECRET_ACCESS_KEY
          # Tolerate the nv-01 GPU taint for the atelet DaemonSet. The chart
          # already sets one toleration (ate.dev/sandboxClass Exists), so
          # APPEND instead of replacing the whole list.
          - target:
              kind: DaemonSet
            patch: |-
              - op: add
                path: /spec/template/spec/tolerations/-
                value:
                  key: nvidia.com/gpu
                  operator: Exists
                  effect: NoSchedule
          # The chart always renders the cluster-scoped gvisor-default
          # SandboxConfig with an unreachable gs://gvisor asset URL and a
          # registry.k8s.io pause image. Retarget the asset at the durable
          # B2 store (issue #598) under the substrate/ prefix; the
          # sha256 is the chart's own pin, so the bytes must be the
          # upstream nightly 2026-09-02 tarball (seeded once into B2). The
          # pause digest stays at the proven gcr.io pin (renovate.json
          # excludes gcr.io/gke-release/pause from updates): all old actor
          # snapshots were deleted in the 2026-10-09 teardown, so there is
          # no snapshot-compatibility constraint, and gcr.io is the
          # pullable registry on these nodes.
          - target:
              kind: SandboxConfig
              name: gvisor-default
            patch: |-
              - op: replace
                path: /spec/assets/amd64/gvisor/url
                value: "s3://biggs-dog/substrate/gvisor.tar.zstd"
              - op: replace
                path: /spec/pauseImage
                value: "gcr.io/gke-release/pause@sha256:bcbd57ba5653580ec647b16d8163cdd1112df3609129b01f912a8032e48265da"
  # Drift correction: when the chart/values are unchanged, Flux no-ops the helm
  # upgrade, so out-of-band changes (a deleted resource, a `kubectl edit`)
  # silently persist while status stays Ready=True. `enabled` makes the
  # controller detect AND correct such drift on every reconcile via a
  # server-side dry-run apply (recreating deleted resources, reverting edits
  # to git state). Aligns with this repo's rule that persistent changes are
  # made in YAML here, not by mutating the cluster.
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    # BYO postgres (the 0.5.0 chart has no bundled postgres and FAILS render
    # without these refs). The two Secrets are ExternalSecrets over 1Password
    # (app/external-secrets.yaml); the database itself is cnpg-substrate
    # (clusters/cluster1/kubernetes/apps/cnpg/cnpg/databases/cnpg-substrate.yaml).
    # Names match the chart defaults; set explicitly for readability.
    postgres:
      readWriteConnectionStringSecretRef:
        name: substrate-postgres-readwrite
        key: readWriteConnectionString
      ownerConnectionStringSecretRef:
        name: substrate-postgres-owner
        key: ownerConnectionString
      schema: substrate
    # OTLP export: disable. With no endpoint configured the Go OTel SDK
    # falls back to the SDK default (localhost:4317) and retries forever,
    # spamming "OpenTelemetry SDK error ... connection refused" WARNs from
    # ate-api-server (traces) and ate-controller (metrics). ai-system has no
    # OTLP collector; signals that matter (actor events) already go to stdout.
    otel:
      traces:
        enabled: false
      metrics:
        enabled: false
      logs:
        enabled: false
    # Disable the in-cluster rustfs object store (issue #598). Substrate's
    # S3 backend (ATE_STORAGE_BACKEND=s3, already the chart default) is
    # pointed at the durable Backblaze B2 endpoint via the AWS_* env below
    # (atelet.extraEnv) and the postRenderer patch on the ate-api-server
    # Deployment. Disabling rustfs removes its Deployment, ephemeral
    # host-path PVC, Service, and bucket-init Job -- the 1Gi PVC on the
    # shared OpenEBS local store and the manual asset upload it implied
    # both go away.
    rustfs:
      enabled: false
    # The atelet binary defaults --ateapi-address/--ateapi-server-name to
    # api.ate-system.svc (the substrate canonical namespace). Substrate is
    # installed in ai-system here, so the node-local atelet (which brokers the
    # workers' capacity reports to ateapi) dials a service that does not exist
    # and never reports capacity; every golden ActorTemplate then fails with
    # "no worker has room for the actor" and agents stay
    # Ready=False/ActorTemplatePending. Point the atelet at the release-local
    # api Service, mirroring the chart's own override for ate-controller
    # (dns:///api.<ns>.svc:443 + the same servicedns CA bundle it already
    # mounts).
    atelet:
      extraArgs:
        - --ateapi-address=dns:///api.ai-system.svc:443
        - --ateapi-server-name=api.ai-system.svc
      # B2 object store (issue #598): the node daemon reads/writes sandbox
      # assets + snapshots, so it needs the same five AWS_* vars the
      # postRenderer pins on ate-api-server (the chart's rustfs.enabled
      # branch is the only other place these are set, and it is disabled).
      # extraEnv is appended verbatim to the DaemonSet container env.
      extraEnv:
        - name: AWS_REGION
          value: us-east-1
        - name: AWS_ENDPOINT_URL
          value: "https://s3.eu-central-003.backblazeb2.com"
        - name: AWS_S3_USE_PATH_STYLE
          value: "true"
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: substrate-b2-object-store
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: substrate-b2-object-store
              key: AWS_SECRET_ACCESS_KEY
