---
# 1Password: item substrate-user-password (username, password) — must match
# the CNPG bootstrap credentials of cnpg-substrate
# (clusters/cluster1/kubernetes/apps/cnpg/cnpg/secrets/substrate-user-password.yaml).
#
# The v0.5.0 substrate chart takes BYO postgres as two pre-created
# connection-string Secrets (the chart FAILS render without them). Single-login
# design: one 1Password login is a member of both the substrate_owner and
# substrate_readwrite NOLOGIN roles; each pool connection SET ROLEs to the
# matching role at startup (ateapi's --postgres-owner-role /
# --postgres-read-write-role, chart defaults substrate_owner /
# substrate_readwrite). Mirrors kagent/app/kagent-database-url.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: substrate-postgres-readwrite
  namespace: ai-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: substrate-postgres-readwrite
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        readWriteConnectionString: >-
          postgres://{{ .username | urlquery }}:{{ .password | urlquery }}@cnpg-substrate-rw.cnpg-system.svc.cluster.local:5432/substrate
  data:
    - secretKey: username
      remoteRef:
        key: substrate-user-password
        property: username
    - secretKey: password
      remoteRef:
        key: substrate-user-password
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: substrate-postgres-owner
  namespace: ai-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: substrate-postgres-owner
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        ownerConnectionString: >-
          postgres://{{ .username | urlquery }}:{{ .password | urlquery }}@cnpg-substrate-rw.cnpg-system.svc.cluster.local:5432/substrate
  data:
    - secretKey: username
      remoteRef:
        key: substrate-user-password
        property: username
    - secretKey: password
      remoteRef:
        key: substrate-user-password
        property: password
---
# S3 credentials for the substrate snapshot store, moved off in-cluster
# rustfs onto the durable Backblaze B2 endpoint shared with CNPG/Barman and
# volsync (issue #598). Same 1Password item as cnpg-system/object-store-secret
# (clusters/cluster1/kubernetes/apps/cnpg/cnpg/secrets/object-store-secret.yaml);
# rendered into ai-system because the substrate control plane (atelet +
# ate-api-server) lives here. The key is scoped to the biggs-dog bucket, so
# all substrate objects live under the substrate/ prefix (assets + the
# harness snapshot location in kagent/app/harnesses.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: substrate-b2-object-store
  namespace: ai-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: substrate-b2-object-store
    creationPolicy: Owner
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: b2-object-store-keys
        property: keyID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: b2-object-store-keys
        property: applicationKey
