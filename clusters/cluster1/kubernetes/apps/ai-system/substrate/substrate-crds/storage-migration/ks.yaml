---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: substrate-crds-storage-mig
  namespace: flux-system
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: substrate-crds-storage-mig
  # Suspended: its one-shot job is done (the ate.dev CRDs are dual-version,
  # v1 storage — verified live; the API-server storage gate is cleared and
  # the substrate-crds HelmRelease upgrades the CRDs to the chart's v1-only
  # spec). Suspended (not deleted) because the root flux-system KZ is
  # prune:false by house policy, so a repo-side removal would leave the KZ
  # object orphaned in-cluster; a suspended KZ stays quiet and inert.
  # Optional housekeeping to retire it fully: `kubectl -n flux-system delete
  # kustomization substrate-crds-storage-mig` (then drop this dir + the
  # kustomization list entry in a PR).
  suspend: true
  # 24h interval kept for history: while active, it could only re-apply once
  # per day, so it could not flap the CRDs back to dual-version.
  interval: 24h
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./clusters/cluster1/kubernetes/apps/ai-system/substrate/substrate-crds/storage-migration
  # The CRDs already exist (installed by the substrate-crds release), so force
  # is required for the versions-array update to win over the Helm owner
  # labels; prune: false keeps the CRDs when this KZ is deleted.
  force: true
  prune: false
  wait: false
  timeout: 5m
