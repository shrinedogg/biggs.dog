---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app substrate
  namespace: flux-system
spec:
  dependsOn:
    # The ate.dev CRDs must exist before the control plane can create
    # WorkerPools/SandboxConfigs.
    - name: substrate-crds
    # Workers and the control plane get their mTLS credentials signed by the
    # podcertificate-controller; the signer must be up first.
    - name: substrate-podcert
    # ate-api-server dials the cnpg-substrate cluster on startup (migrations);
    # the two connection-string ExternalSecrets (app/external-secrets.yaml)
    # point at cnpg-substrate-rw.cnpg-system.svc.
    - name: cnpg-databases
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./clusters/cluster1/kubernetes/apps/ai-system/substrate/app
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  interval: 3m
  retryInterval: 1m
  timeout: 10m
