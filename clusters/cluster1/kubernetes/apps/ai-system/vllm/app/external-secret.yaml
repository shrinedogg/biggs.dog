---
# Shared API key used both to secure vLLM's OpenAI-compatible endpoint
# (--api-key) and by kagent's default ModelConfig (apiKeySecret: kagent-vllm).
# Create a 1Password item "vllm-api-key" in the biggs-dog vault with a field
# "api-key" containing any random string of your choosing.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kagent-vllm
  namespace: ai-system
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: kagent-vllm
    creationPolicy: Owner
    template:
      data:
        # Consumed by kagent (OpenAI provider expects this key).
        OPENAI_API_KEY: "{{ .apiKey }}"
        # Consumed by the vLLM container via VLLM_API_KEY.
        VLLM_API_KEY: "{{ .apiKey }}"
  data:
    - secretKey: apiKey
      remoteRef:
        key: vllm-api-key
        property: "api-key"
