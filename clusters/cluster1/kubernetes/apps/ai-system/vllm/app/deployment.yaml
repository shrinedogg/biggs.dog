---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: ai-system
  labels:
    app: vllm
spec:
  # replicas is intentionally OMITTED: the gpu-arbiter-operator (gpu-arbiter CR
  # at clusters/cluster1/kubernetes/apps/dreamcast/gpu-arbiter-instance) owns this
  # Deployment's replica count, scaling it to 0 during Wolf gaming sessions and
  # back to 1 afterward. Declaring replicas here would make Flux fight the
  # arbiter on every reconcile. Unmanaged, a Deployment defaults to 1 replica,
  # so the idle state is a single vLLM.
  # Weights live on a RWO host-path volume on nv-01; never run two at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      # The Service is named "vllm", so Kubernetes injects legacy service-link
      # env vars (e.g. VLLM_PORT=tcp://<ip>:8000) that collide with vLLM's own
      # VLLM_PORT config and crash the engine. Disable the injection.
      enableServiceLinks: false
      # Pin to the GPU node (nv-01) by capability label rather than hostname,
      # matching the rest of the ai-system stack.
      nodeSelector:
        nvidia.com/gpu.present: "true"
      # Short grace so vLLM RELEASES VRAM fast when the gpu-arbiter-operator scales it to
      # 0 for a gaming session: the gaming pod is held by a scheduling gate until
      # VRAM is free, and direwolf reaps the session after 60s, so vLLM must let
      # go well before then. vLLM is stateless (weights on the PVC), so a quick
      # SIGTERM/SIGKILL is fine; it reloads on scale-up.
      terminationGracePeriodSeconds: 10
      containers:
        - name: vllm
          # CUDA 12.9 build supports the 5090 (Blackwell, sm_120).
          image: docker.io/vllm/vllm-openai:v0.27.1
          args:
            # ----------------------------------------------------------------
            # MODEL: unsloth's NVFP4 (compressed-tensors) quant of Alibaba's
            # dense Qwen3.6-27B:
            #   https://huggingface.co/unsloth/Qwen3.6-27B-NVFP4
            # A 27B DENSE model (all params active -> slower per-token than the
            # old 35B-A3B MoE, but strong agentic-coding quality), with a
            # Gated-DeltaNet / gated-attention hybrid (only 16 of 64 layers keep
            # paged KV, so long context stays cheap) and 262K native context.
            # NVFP4 needs Blackwell (nv-01's RTX 5090, sm_120).
            # We previously ran rdtand/Qwen3.6-27B-PrismaSCOUT-Blackwell-NVFP4-BF16-vllm,
            # which ALSO compresses the vision tower + 248K-vocab
            # embeddings/lm_head (~20GB disk / ~18GiB resident). THIS quant
            # keeps those in BF16 -> ~26GB on disk / ~23GiB RESIDENT, leaving
            # only ~3GiB for the fp8 KV pool (measured 2026-07-11). We still
            # serve TEXT-ONLY via --language-model-only (the vision tower's
            # weights load but are never used by kagent).
            # WARNING: every tuning number below (224K window, 8-way
            # concurrency, util 0.96 -> ~8.3GiB KV pool) was sized for the
            # rdtand quant's ~18GiB resident. With unsloth's ~23GiB resident
            # the pool shrinks to ~3GiB (~80K tokens was the practical
            # max-model-len ceiling on 2026-07-11), so the 224K
            # --max-model-len below will likely FAIL vLLM startup (KV pool
            # smaller than max-model-len). Args are intentionally IDENTICAL to
            # the rdtand config per request; if the pod crash-loops on the KV
            # check, drop --max-model-len toward 81920 and --max-num-seqs /
            # --max-cudagraph-capture-size toward 4 (the proven unsloth fit).
            # Quantization is compressed-tensors and AUTO-DETECTED from the
            # checkpoint's quantization_config -- do NOT pass --quantization
            # (the old --quantization=modelopt was for NVIDIA's 35B and is wrong
            # here).
            # NOTE: if v0.23.0 lacks the dense Qwen3_5ForConditionalGeneration
            # arch or the qwen3_coder tool parser, bump the image tag (or use
            # :nightly).
            # --served-model-name must match the kagent HelmRelease provider.
            # ----------------------------------------------------------------
            - --model=unsloth/Qwen3.6-27B-NVFP4
            # served-model-name is intentionally different from --model:
            # the slash in the HuggingFace path (unsloth/) gets stripped by some
            # clients (e.g. Zed), causing 404s. A slash-free alias fixes all
            # clients; kagent and Zed both use this name, not the weights path.
            - --served-model-name=qwen36-local
            # NOTE: --quantization is intentionally OMITTED. This checkpoint is
            # compressed-tensors NVFP4 and vLLM auto-detects it from the config;
            # forcing modelopt (the 35B's quant) would mis-load the weights.
            # fp8 KV cache + hybrid attention keep the KV pool small even at
            # long context.
            - --kv-cache-dtype=fp8
            # 224K context. (Pool math below assumes the rdtand quant; with
            # unsloth's ~23GiB resident this window likely fails startup, see
            # the MODEL block WARNING.) Sized to sit safely ABOVE the largest
            # observed
            # exa-agent tool-result history (~164K tokens; a multi-search
            # session once overflowed a 131K cap with HTTP 400
            # input_tokens=131073) with ~60K of headroom, and just BELOW the fp8
            # KV pool's capacity so vLLM still boots. At util 0.96 the fp8 KV
            # pool holds ~250K tokens (~8.3GiB); a 224K window leaves ~26K of
            # slack under that cap. The model's native max is 262K, but the pool
            # can't hold a full 262K sequence, so 262K would fail vLLM startup.
            # Do NOT exceed ~0.96 util (0.97 caused a full node lockup on
            # 2026-06-25). A single 224K sequence consumes ~7.4GiB of KV --
            # nearly the whole pool -- so concurrency is capped low (see
            # --max-num-seqs below); raising the window further requires more
            # VRAM, not more util.
            - --max-model-len=229376
            # nv-01's GPU is time-sliced (replicas=4) and shared with
            # GPU-operator validators and the DRA plugin. (The embeddings server
            # moved to CPU, so it no longer contends for VRAM here.) At 0.97 vLLM
            # reserved ~31.6GB, leaving ~1GB free, which contributed to a full
            # node lockup (2026-06-25) back when embeddings was ALSO on the GPU.
            # With the lighter ~18GiB-resident rdtand quant, 0.96 (~30.7GB
            # reserved) yields an ~8.3GiB fp8 KV pool (~250K tokens) -- the
            # headroom needed to hold the 224K window above. This is the
            # documented CEILING: 0.97 reserved ~31.6GB (~1GB free) and caused a
            # full node lockup on 2026-06-25. Do NOT push past 0.96.
            - --gpu-memory-utilization=0.96
            # Per-step token budget for (chunked) prefill + decode. Bumped from
            # 4096 to 8192 to handle medium-length tool-context prompts more
            # efficiently, reducing the number of prefill steps. Short prompts
            # are unaffected (they complete in one step). Long prompts benefit
            # from fewer scheduling rounds.
            - --max-num-batched-tokens=8192
            # Concurrency cap. Bumped from 64 to 32 after a vLLM stall/restart
            # under parallel kagent fan-out (6-9 agents firing long-context tool-
            # schema prompts simultaneously). At 64-way the GPU compute saturated
            # during prefill of multiple long prompts, stalling the async event
            # loop for 3+ min -- past even the generous 10s×6 liveness headroom --
            # and the pod restarted (exit 0, "Completed"). 32-way still matches or
            # exceeds realistic concurrent agent count, lets vLLM QUEUE excess
            # requests instead of compute-locking, and keeps /health responsive.
            # Keep capture-size == max-num-seqs. Dropped 32 -> 8 alongside the
            # max-model-len raise to 224K: a single 224K sequence consumes
            # ~7.4GiB of the ~8.3GiB fp8 KV pool, so the pool can only hold a
            # couple of full-length sequences at once. 8-way lets vLLM admit a
            # burst of short/medium agent prompts while QUEUEING (not
            # compute-locking) when several long-context sessions land together;
            # prefix caching + chunked prefill keep queued work moving. If agent
            # fan-out proves starved, the lever is more VRAM, not a higher
            # max-num-seqs at this window.
            - --max-num-seqs=8
            - --max-cudagraph-capture-size=8
            - --enable-prefix-caching
            # Qwen3.6's hybrid (Gated-DeltaNet) arch may ship custom modeling
            # code; the model card sets trust-remote-code. NOTE: executes repo
            # Python.
            - --trust-remote-code
            # Qwen3.6 tool-call + reasoning parsers, per the Qwen3.6-27B model
            # card (the dense 27B uses the qwen3_coder tool parser -- NOT the
            # 35B's qwen3_xml; reasoning parser stays qwen3).
            - --enable-auto-tool-choice
            - --tool-call-parser=qwen3_coder
            - --reasoning-parser=qwen3
            # Text-only kagent traffic: skip the vision encoder + multimodal
            # profiling entirely. REQUIRED for the VRAM fit -- loading the
            # vision tower would push resident weights to ~26GB and starve KV.
            - --language-model-only
            # Keep port 8000 to match the Service and the kagent provider baseUrl.
            - --host=0.0.0.0
            - --port=8000
          env:
            - name: HF_HOME
              value: /models
            # Secures the OpenAI-compatible endpoint; kagent sends the same key.
            - name: VLLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: kagent-vllm
                  key: VLLM_API_KEY
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          resources:
            requests:
              nvidia.com/gpu: 1
              memory: 22Gi
            limits:
              # Consumes the last of the 4 time-sliced nvidia.com/gpu replicas.
              nvidia.com/gpu: 1
              memory: 22Gi
          startupProbe:
            httpGet:
              path: /health
              port: http
            # First boot downloads weights; allow up to ~30 min.
            periodSeconds: 15
            failureThreshold: 120
            # /health can be briefly slow even once serving; default 1s is tight.
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            # Same rationale as liveness below: with a SINGLE replica, flapping
            # out of the Service endpoints on a slow-but-alive /health just fails
            # all traffic, so give the check headroom instead of the default 1s.
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            # vLLM serves /health from the SAME async event loop that runs
            # inference; under heavy concurrent load (e.g. agent fan-out) it can
            # blow past the default 1s probe timeout. The default 1s timeout + 3
            # failures was SIGTERM-killing the pod under load -- a clean exit 0
            # "Completed" restart, i.e. a self-inflicted restart storm, NOT a
            # real hang. Give it real headroom so liveness only fires on a
            # genuine deadlock: 10s timeout x 6 failures = ~3 min of sustained
            # unresponsiveness before a restart.
            timeoutSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - name: models
              mountPath: /models
            # vLLM needs a large shared-memory segment for NCCL/IPC.
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: vllm-models
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
