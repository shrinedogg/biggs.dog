---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: ai-system
  labels:
    app: vllm
spec:
  # replicas is intentionally OMITTED: the gpu-arbiter-operator (gpu-arbiter CR
  # at clusters/cluster1/kubernetes/apps/dreamcast/gpu-arbiter-instance) owns this
  # Deployment's replica count, scaling it to 0 during Wolf gaming sessions and
  # back to 1 afterward. Declaring replicas here would make Flux fight the
  # arbiter on every reconcile. Unmanaged, a Deployment defaults to 1 replica,
  # so the idle state is a single vLLM.
  # Weights live on a RWO host-path volume on nv-01; never run two at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      # The Service is named "vllm", so Kubernetes injects legacy service-link
      # env vars (e.g. VLLM_PORT=tcp://<ip>:8000) that collide with vLLM's own
      # VLLM_PORT config and crash the engine. Disable the injection.
      enableServiceLinks: false
      # Pin to the GPU node (nv-01) by capability label rather than hostname,
      # matching the rest of the ai-system stack.
      nodeSelector:
        nvidia.com/gpu.present: "true"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      # Short grace so vLLM RELEASES VRAM fast when the gpu-arbiter-operator scales it to
      # 0 for a gaming session: the gaming pod is held by a scheduling gate until
      # VRAM is free, and direwolf reaps the session after 60s, so vLLM must let
      # go well before then. vLLM is stateless (weights on the PVC), so a quick
      # SIGTERM/SIGKILL is fine; it reloads on scale-up.
      terminationGracePeriodSeconds: 10
      containers:
        - name: vllm
          # Untagged variant = CUDA 13.0 build (v0.33.0 dropped the -cu129
          # CUDA 12.9 images entirely); supports the 5090 (Blackwell, sm_120).
          image: docker.io/vllm/vllm-openai:v0.33.0
          args:
            # ----------------------------------------------------------------
            # MODEL: Minima NVFP4 W4A4 of Qwen3.8-27B (post-training quant
            # only; paper: https://huggingface.co/papers/2609.04098):
            #   https://huggingface.co/minima-ai/mnma_qwen3.8_27b_nvfp4
            # ALL 496 linear layers at NVFP4 (group 16, FP8 scales) -- all 48
            # Gated-DeltaNet layers including their gate projections -- plus
            # calibrated STATIC FP8 KV scales (k_scale/v_scale, 32 tensors).
            # BF16 parity within seed noise; fastest prefill of the recipes
            # the paper compares (+14-19% vs partial quants). Single
            # model.safetensors = 18,788,354,104 bytes (~17.5GiB) incl. the
            # MTP draft head; global scales are harmonized for vLLM's fused
            # in_proj GEMMs, so it serves correctly out of the box. Built
            # with llm-compressor (compressed-tensors, nvfp4-pack-quantized);
            # the card requires vLLM >= 0.27 on SM120/Blackwell -- this image
            # is v0.33.0 (CUDA 13.0), so no image bump is needed.
            #
            # WHY NVFP4 + TP=2 (2026-11-08): TP=2 is kept unchanged -- a 262K
            # sequence needs ~8.5GiB of fp8 KV, which does not fit a single
            # card's pool with room for concurrency, and the 262K window with
            # real long-context concurrency is the requirement (largest
            # observed session ~164K). NVFP4 roughly halves per-card weights
            # vs the old FP8 checkpoint: ~8.75GiB of weights per card (vs
            # ~14.4GiB) leaves an estimated ~15.5GiB fp8 KV pool PER CARD
            # (~31GiB total) at 0.92 util, up from ~20GiB total. Against
            # ~8.5GiB per max-length 262K sequence, ~3.5 full-length sessions
            # fit at once (was ~2.4). ESTIMATE, not measurement: re-read the
            # first-boot log -- "Available KV cache memory: N GiB" and "GPU
            # KV cache size: N tokens, Maximum concurrency for 262,144 tokens
            # per request: N.NNx" are the authoritative numbers; rewrite
            # these estimates to match.
            # KEPT, and why: --tensor-parallel-size=2 (KV math above),
            # --kv-cache-dtype=fp8 (now picks up the checkpoint's calibrated
            # static scales -- performance-free, no dynamic-scaling drift),
            # MTP speculative decode (the draft head is IN this checkpoint
            # too, mtp_num_hidden_layers=1; the main decode speedup for agent
            # traffic), qwen3_coder tool + qwen3 reasoning parsers (verified
            # for this family), the 262144 window, 0.92 util, 16-way batch
            # caps, prefix caching. Quantization is AUTO-DETECTED from the
            # checkpoint's quantization_config (compressed-tensors) -- do
            # NOT pass --quantization.
            # History: Qwen/Qwen3.8-27B-FP8 (previous config, 2026-09-09),
            # rdtand/Qwen3.6-27B-PrismaSCOUT NVFP4 (~18GiB resident),
            # unsloth/Qwen3.6-27B-NVFP4 (~23GiB), unsloth/Qwen3.8-27B-NVFP4
            # (~21.8GB on disk, 177184-token ceiling on one card). The old
            # FP8 weights stay cached on the PVC for rollback / single-card
            # fallback.
            # --served-model-name must match the kagent HelmRelease provider.
            # ----------------------------------------------------------------
            - --model=minima-ai/mnma_qwen3.8_27b_nvfp4
            # served-model-name is intentionally different from --model:
            # the slash in the HuggingFace path (Qwen/) gets stripped by some
            # clients (e.g. Zed), causing 404s. A slash-free alias fixes all
            # clients; kagent and Zed both use this name, not the weights path.
            # NOTE: the id literally contains spaces ("qwen 3.8 - local"), per
            # request; clients must send it exactly. Unchanged across the
            # FP8 -> NVFP4 swap so no client or kagent edit is needed.
            - --served-model-name=qwen 3.8 - local
            # Split the model across both 5090s. PCIe-only (PHB topology, no
            # NVLink, no GeForce P2P), so the per-layer allreduce rides host
            # memory via NCCL; the MTP speed-up below is what pays for it.
            # If NCCL hangs at startup on this consumer board, the first thing
            # to try is env NCCL_P2P_DISABLE=1 (forces the host-memory path
            # explicitly instead of letting NCCL probe P2P).
            - --tensor-parallel-size=2
            # fp8 KV cache + hybrid attention keep the KV pool small even at
            # long context. Unlike the old FP8 checkpoint (no static KV
            # scales -> dynamic fp8 KV scaling), this checkpoint ships
            # calibrated STATIC fp8 k/v scales (32 tensors) and this flag
            # picks them up -- performance-free, no dynamic-scaling drift.
            # The model card's serving command requires exactly this flag.
            - --kv-cache-dtype=fp8
            # FULL native 262K window. ESTIMATE, not measurement: a 262K
            # sequence needs ~8.5GiB of fp8 KV (measured 0.0323 GiB per 1K
            # tokens on v0.28.0 with this arch), against an estimated ~31GiB
            # pool across both cards. vLLM v1 HARD-FAILS startup if the pool
            # cannot hold one full max-model-len sequence; if that happens,
            # the EngineCore ValueError in `kubectl logs --previous` states the
            # measured ceiling -- set this to that number, do NOT raise util.
            # Largest observed exa-agent session was ~164K tokens.
            - --max-model-len=262144
            # 0.92 per card (~29.4GB reserved of 32.6GB, ~3GB free each).
            # Deliberately BELOW the old single-card 0.96 ceiling: with two
            # cards we do not need to ride the edge, and 0.97 (~1GB free)
            # caused a full node lockup on 2026-06-25. The ~3GB headroom per
            # card also keeps min(DCGM_FI_DEV_FB_FREE) well under the
            # gpu-arbiter's 8000MiB gate while vLLM runs, so gaming pods
            # correctly wait for the arbiter to scale vLLM to 0.
            # Re-read the startup log after the first boot:
            #   "Available KV cache memory: N GiB" and
            #   "GPU KV cache size: N tokens, Maximum concurrency for 262,144
            #   tokens per request: N.NNx" are the authoritative numbers;
            # rewrite the estimates in these comments to match.
            - --gpu-memory-utilization=0.92
            # Per-step token budget for (chunked) prefill + decode. 8192 handles
            # medium-length tool-context prompts in few prefill steps; short
            # prompts complete in one step.
            - --max-num-batched-tokens=8192
            # Concurrency cap. History: 64-way stalled the async loop under
            # kagent fan-out (prefill of many long prompts compute-locked
            # /health for 3+ min and the pod restarted); 32-way on the 131K
            # window was stable; 8-way was forced by the 5.91GiB single-card
            # pool at 177184. With an estimated ~31GiB pool and ~8.5GiB per
            # max-length sequence, ~3.5 full 262K sessions fit at once and
            # 16-way lets vLLM admit a burst of short/medium agent prompts
            # while QUEUEING (not compute-locking) when several long sessions
            # land together. Keep capture-size == max-num-seqs; a capture size
            # larger than the Mamba (GDN) cache lines trips
            # "assert num_cache_lines >= batch" at startup on this arch.
            - --max-num-seqs=16
            - --max-cudagraph-capture-size=16
            - --enable-prefix-caching
            # MTP speculative decoding using the draft head shipped IN the
            # checkpoint (no separate draft model). Method string per the vLLM
            # Qwen3.5/3.6/3.8 recipes: "mtp" (NOT qwen3_next_mtp, that is the
            # Qwen3-Next MoE). The recipe default is 3 speculative tokens; we
            # start at 2 as a balance: each speculative token costs KV/batch
            # capacity and the recipes note MTP lowers throughput under high
            # concurrency while cutting per-token latency at low concurrency,
            # which matches agent traffic (few long sessions). Measure
            # acceptance rate in the vLLM metrics before moving to 3 or 1.
            - --speculative-config={"method":"mtp","num_speculative_tokens":2}
            # Kept from the previous checkpoint for this model family. The
            # Minima config.json does NOT set trust_remote_code (natively
            # supported as Qwen3_5ForCausalLM), so nothing executes here --
            # a harmless no-op. NOTE: if a future checkpoint DID ship remote
            # code, this flag would execute repo Python.
            - --trust-remote-code
            # Qwen3.8 tool-call + reasoning parsers, verified against the vLLM
            # recipe for Qwen/Qwen3.8-27B (recipes.vllm.ai/Qwen/Qwen3.8-27B):
            # the dense 27B uses the qwen3_coder tool parser (NOT the 35B's
            # qwen3_xml) and the qwen3 reasoning parser.
            - --enable-auto-tool-choice
            - --tool-call-parser=qwen3_coder
            - --reasoning-parser=qwen3
            # Text-only kagent traffic: skip the vision encoder + multimodal
            # profiling entirely. This checkpoint is a text-only
            # Qwen3_5ForCausalLM extraction (no vision tower), so the flag is
            # a no-op safeguard here; keep it so a future vision checkpoint
            # cannot silently cost ~1.5GiB of KV per card.
            - --language-model-only
            # Keep port 8000 to match the Service and the kagent provider baseUrl.
            - --host=0.0.0.0
            - --port=8000
          env:
            - name: HF_HOME
              value: /models
            # Persist torch.compile artifacts; the default ~/.cache/vllm is
            # lost whenever the pod is replaced, forcing recompilation.
            - name: VLLM_CACHE_ROOT
              value: /models/.cache/vllm
            # Secures the OpenAI-compatible endpoint; kagent sends the same key.
            - name: VLLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: kagent-vllm
                  key: VLLM_API_KEY
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          resources:
            requests:
              nvidia.com/gpu: 5
              memory: 36Gi
            limits:
              # WHY 5 (verified 2026-09-09 with throwaway pods): the device
              # plugin runs in CDI mode with time-slicing (4 nvidia.com/gpu
              # replicas per card, 8 on the node). CDI injects ONLY the
              # allocated card's /dev/nvidiaN and ignores a pod-level
              # NVIDIA_VISIBLE_DEVICES=all (the toolkit rewrites it to "void";
              # an unprivileged gpu:1 pod saw exactly one card). Requesting 5
              # replicas pigeonholes across both cards (4 per card), so TP=2
              # always gets two DISTINCT GPUs, and 3 replicas stay free for
              # the operator validators / DRA plugin. This REQUIRES the
              # device plugin's failRequestsGreaterThanOne to stay false
              # (the default); setting it true rejects this pod. A gpu:8
              # request also works but starves every other GPU pod.
              nvidia.com/gpu: 5
              # Two TP worker processes + an 18.8GB safetensors load (page
              # cache is charged to the cgroup during the mmap read). 22Gi
              # was enough for the single 21.8GB NVFP4 worker; 36Gi was sized
              # up for the larger 28.7GB FP8 checkpoint and still covers this
              # 18.8GB one. Node has 64GB.
              memory: 36Gi
          startupProbe:
            httpGet:
              path: /health
              port: http
            # First boot downloads the weights (~18.8GB) and compiles the
            # NVFP4 kernels (a quantization change means no warm compile
            # cache despite VLLM_CACHE_ROOT); allow up to ~30 min. If the
            # startup probe kills the pod on the very first boot, the
            # restart is faster -- the weights are already on the PVC.
            periodSeconds: 15
            failureThreshold: 120
            # /health can be briefly slow even once serving; default 1s is tight.
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            # Same rationale as liveness below: with a SINGLE replica, flapping
            # out of the Service endpoints on a slow-but-alive /health just fails
            # all traffic, so give the check headroom instead of the default 1s.
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            # vLLM serves /health from the SAME async event loop that runs
            # inference; under heavy concurrent load (e.g. agent fan-out) it can
            # blow past the default 1s probe timeout. The default 1s timeout + 3
            # failures was SIGTERM-killing the pod under load -- a clean exit 0
            # "Completed" restart, i.e. a self-inflicted restart storm, NOT a
            # real hang. Give it real headroom so liveness only fires on a
            # genuine deadlock: 10s timeout x 6 failures = ~3 min of sustained
            # unresponsiveness before a restart.
            timeoutSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - name: models
              mountPath: /models
            # vLLM needs a large shared-memory segment for NCCL/IPC; with TP=2
            # over PCIe the allreduce traffic itself goes through here.
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: vllm-models
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
