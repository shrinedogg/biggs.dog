---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app vllm
  namespace: flux-system
spec:
  dependsOn:
    # GPU resource (nvidia.com/gpu) must be advertised by the device plugin.
    - name: nv-gpu-operator
    # ClusterSecretStore (onepassword-connect) must exist for the ExternalSecret.
    - name: secretstore
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./clusters/cluster1/kubernetes/apps/ai-system/vllm/app
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  interval: 3m
  retryInterval: 1m
  # Pulling a multi-GB model image + downloading weights on first start is slow.
  timeout: 10m
