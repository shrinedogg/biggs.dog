---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kagent-grafana-mcp
  namespace: ai-system
  labels:
    app.kubernetes.io/name: kagent-grafana-mcp
---
# kagent-grafana-mcp — the mcp-grafana proxy (Grafana org's mcp-grafana
# image): serves the observability-agent's RemoteMCPServer
# "kagent-grafana-mcp" (dashboards, Prometheus, Loki, on-call tools) over
# streamable-HTTP MCP at :8000/mcp.
#
# 1.0.0-line note: the kagent 1.0.1 chart dropped the grafana-mcp subchart
# that used to render this deployment, its Service, and the RMP (the 1.0.1
# upgrade pruned the release-owned objects). The alpha11-era image
# reference was also unpullable: global registry ghcr.io + repo
# grafana/mcp-grafana = ghcr.io/grafana/mcp-grafana, which does not exist
# on GHCR (ghcr token-scope probe: DENIED). The proxy therefore never
# ran, and the observability-agent sat Ready=False on the missing RMP.
# This static app restores all three.
#
# Image pinned to docker.io/grafana/mcp-grafana:1.4.1 — the same tag the
# subchart pinned (verified pullable on Docker Hub), docker.io direct pull
# (same pattern as exa-mcp).
#
# The Grafana service-account token (Admin role; the agent uses
# update_dashboard, create_incident, and friends) comes from the
# ExternalSecret kagent-grafana-mcp-token (see
# kagent/app/grafana-mcp-token-secret.yaml; 1Password item
# kagent-grafana-mcp-token, field GRAFANA_SERVICE_ACCOUNT_TOKEN). If it
# ever goes dead again (Grafana 401s in the proxy's 5m discovery loop),
# regenerate the token in Grafana (Admin -> Service accounts), update the
# 1Password item, and restart:
#   kubectl -n ai-system rollout restart deploy/kagent-grafana-mcp
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kagent-grafana-mcp
  namespace: ai-system
  labels:
    app.kubernetes.io/name: kagent-grafana-mcp
    app.kubernetes.io/version: "1.4.1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana-mcp
        app.kubernetes.io/version: "1.4.1"
    spec:
      serviceAccountName: kagent-grafana-mcp
      # Pin to the GPU node (nv-01), matching the rest of the ai-system
      # stack (the kagent release's postRenderers applied this same pin to
      # the subchart deployment it replaces).
      nodeSelector:
        nvidia.com/gpu.present: "true"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: grafana-mcp
          image: docker.io/grafana/mcp-grafana:1.4.1
          imagePullPolicy: IfNotPresent
          # --transport streamable-http matches the RemoteMCPServer protocol.
          # -allowed-hosts "*" is required: workers dial this service
          # through atenet-egress, which dials the pod IP directly and
          # rewrites the Host header to the IP form; mcp-grafana's
          # DNS-rebinding guard would otherwise 403 the handshake
          # ("forbidden: host not allowed") and the agent would see zero
          # tools. The Service is ClusterIP with no external ingress, and the
          # Grafana token is server-side, so the Host check adds no
          # protection here (the chart documents "*" for exactly this
          # proxy case).
          args:
            - --transport
            - streamable-http
            - -allowed-hosts
            - "*"
          env:
            # Bare base URL: mcp-grafana appends "/api/..." to GRAFANA_URL
            # itself, so a trailing "/api" would double up and 404.
            - name: GRAFANA_URL
              value: "http://grafana.observability:80"
          envFrom:
            - secretRef:
                name: kagent-grafana-mcp-token
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 999
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 100Mi
