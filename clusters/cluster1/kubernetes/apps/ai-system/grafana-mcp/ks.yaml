---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app grafana-mcp
  namespace: flux-system
spec:
  dependsOn:
    # kagent provides the RemoteMCPServer CRD that remotemcpserver.yaml
    # applies against.
    - name: kagent
  # All resources live in ai-system.
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./clusters/cluster1/kubernetes/apps/ai-system/grafana-mcp/app
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  interval: 3m
  retryInterval: 1m
  timeout: 5m
