---
# Minimal dedicated identity. No cluster RBAC: the server only talks to the
# Mindwtr Cloud API and serves MCP tools over HTTP; it never touches the
# Kubernetes API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mindwtr-mcp
  namespace: ai-system
  labels:
    app.kubernetes.io/name: mindwtr-mcp
---
# Mindwtr MCP Server — self-hosted Model Context Protocol server for
# GTD task management via mcp-proxy bridge (stdio → streamable HTTP).
#
# Uses the official mindwtr-mcp npm package (v1.1.3) in Cloud mode, wrapped
# by mcp-proxy so kagent can connect over the network. The package is baked
# into the shrinedogg/mindwtr-mcp:1.1.3-node26 image (node 26 + node_modules
# installed at image-build time); an init container stages node + the two
# shared libs the node binary needs + node_modules into the shared emptyDir
# the mcp-proxy server reads. No apk toolchain, no npm, and no network egress
# at pod start (the old node:26-alpine + npm-install init is gone).
#
# Data source: the live Mindwtr Cloud sync endpoint
# (http://mindwtr-cloud.mindwtr:8787, /v1 + /v1/data) — the same store the
# desktop/mobile clients sync against. Read + write (--write). The bearer
# token comes from the mindwtr-mcp-cloud-token ExternalSecret (same
# 1Password item as the cloud deployment) and is injected as
# MINDWTR_MCP_CLOUD_TOKEN; mcp-proxy forwards it to the node child via
# --pass-environment. Plain HTTP is cluster-internal (LAN-only), so
# --cloud-allow-insecure-http=true is required.
#
# Requires Cilium policy: ai-system mindwtr-mcp -> mindwtr mindwtr-cloud:8787
# (see network-policies/policies/infra/ai-system.yaml + apps/mindwtr.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mindwtr-mcp
  namespace: ai-system
  labels:
    app.kubernetes.io/name: mindwtr-mcp
    app.kubernetes.io/version: "1.1.3"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mindwtr-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mindwtr-mcp
        app.kubernetes.io/version: "1.1.3"
    spec:
      serviceAccountName: mindwtr-mcp
      terminationGracePeriodSeconds: 10
      # Pin to the GPU node (nv-01), matching the rest of the ai-system stack.
      nodeSelector:
        nvidia.com/gpu.present: "true"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/os
                    operator: In
                    values:
                      - linux
      initContainers:
        # Stage node + mindwtr-mcp package into shared emptyDir. The
        # shrinedogg/mindwtr-mcp image bakes the npm install in at image-build
        # time, so this init only copies the staged layout (no apk, no npm,
        # no egress). node is musl-linked (matching the mcp-proxy base image)
        # but still depends on libstdc++.so.6 + libgcc_s.so.1; those are copied
        # next to the binary so the server container can run it via
        # LD_LIBRARY_PATH.
        - name: mindwtr-stage
          image: docker.io/shrinedogg/mindwtr-mcp:1.1.3-node26
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              set -eu
              mkdir -p /staged/bin
              cp /usr/local/bin/node /staged/bin/
              cp /usr/lib/libstdc++.so.6 /staged/bin/
              cp /usr/lib/libgcc_s.so.1 /staged/bin/
              cp -a /opt/mindwtr/node_modules /staged/
              chmod -R a+rx /staged
              echo "staged: node=$(ls /staged/bin/node), mcp=$(ls /staged/node_modules/mindwtr-mcp/dist/index.js), libs=$(ls /staged/bin/lib*)"
          volumeMounts:
            - name: mindwtr-bin
              mountPath: /staged
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
      containers:
        # stdio → streamable HTTP bridge. Spawns the mindwtr-mcp child process
        # (node + mindwtr-mcp/dist/index.js in Cloud mode) and serves it at
        # :8080/mcp. This is the only network endpoint; the mindwtr-mcp process
        # itself listens on nothing (pure stdio).
        #
        # Uses mcp-proxy (Python MCP SDK) instead of supergateway: mcp-proxy
        # answers the notifications/initialized 202 and its session layer
        # answers initialize without a cold child spawn, so kagent registers
        # tools cleanly (see codebase-memory-mcp deployment comments).
        - name: server
          image: ghcr.io/sparfenyuk/mcp-proxy:v0.13.0
          imagePullPolicy: IfNotPresent
          # The image ENTRYPOINT is ["catatonit","--"] with CMD ["mcp-proxy"].
          # catatonit execs mcp-proxy (CMD) and appends these args. mcp-proxy's
          # argparse parses flags up to "--", then treats the rest as
          # command_or_url + args. The cloud flags are plain token args for the
          # node child; the bearer token is NOT passed on the command line — it
          # rides MINDWTR_MCP_CLOUD_TOKEN, which --pass-environment forwards.
          args:
            - --host=0.0.0.0
            - --port=8080
            - --transport=streamablehttp
            - --pass-environment
            - --
            - /staged/bin/node
            - /staged/node_modules/mindwtr-mcp/dist/index.js
            - --cloud-url=http://mindwtr-cloud.mindwtr:8787
            - --cloud-allow-insecure-http=true
            - --write
          env:
            - name: NODE_ENV
              value: "production"
            # Cloud bearer token (same value the Mindwtr desktop/mobile clients
            # use in Settings → Sync). Materialized by the
            # mindwtr-mcp-cloud-token ExternalSecret.
            - name: MINDWTR_MCP_CLOUD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mindwtr-mcp-cloud-token
                  key: token
            # node (copied from the mindwtr-mcp image) needs libstdc++.so.6 +
            # libgcc_s.so.1, which the init container stages next to the binary.
            - name: LD_LIBRARY_PATH
              value: "/staged/bin"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          # TCP probe: mcp-proxy's session layer binds the listener as soon as
          # it starts; the mindwtr-mcp child is spawned lazily per session.
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: mindwtr-bin
              mountPath: /staged
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        # Staged Node.js + mindwtr-mcp package, populated by the mindwtr-stage
        # init container. Survives pod restarts within the same pod.
        # ~161MB staged (node binary 141MB + node_modules 19MB + libs).
        - name: mindwtr-bin
          emptyDir:
            sizeLimit: 250Mi
        - name: tmp
          emptyDir:
            sizeLimit: 100Mi
