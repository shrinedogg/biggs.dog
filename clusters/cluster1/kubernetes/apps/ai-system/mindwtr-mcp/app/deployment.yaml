---
# Minimal dedicated identity. No cluster RBAC: the server only reads a SQLite
# DB and serves MCP tools over HTTP; it never touches the Kubernetes API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mindwtr-mcp
  namespace: ai-system
  labels:
    app.kubernetes.io/name: mindwtr-mcp
---
# Mindwtr MCP Server — self-hosted Model Context Protocol server for
# GTD task management. Exposes streamable HTTP at :8080/mcp, connecting to
# a mounted Mindwtr SQLite database. Provides 15+ tools for task CRUD,
# inbox processing, project management, focus view, and GTD workflows.
#
# Uses the upstream mindwtr-mcp npm package (v1.1.3) in HTTP mode with
# bearer token auth. The SQLite DB is mounted read-only from a host-path
# PVC containing an exported Mindwtr database.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mindwtr-mcp
  namespace: ai-system
  labels:
    app.kubernetes.io/name: mindwtr-mcp
    app.kubernetes.io/version: "1.1.3"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mindwtr-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mindwtr-mcp
        app.kubernetes.io/version: "1.1.3"
    spec:
      serviceAccountName: mindwtr-mcp
      terminationGracePeriodSeconds: 10
      # Pin to the GPU node (nv-01), matching the rest of the ai-system stack.
      nodeSelector:
        nvidia.com/gpu.present: "true"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/os
                    operator: In
                    values:
                      - linux
      containers:
        - name: server
          image: docker.io/shrinedogg/mindwtr-mcp:1.1.3
          imagePullPolicy: Always
          args:
            - node
            - dist/index.js
            - --http
            - --http-host=0.0.0.0
            - --http-port=8080
            - --db-path=/data/mindwtr.db
          env:
            # Bearer token for HTTP auth (from ExternalSecret).
            - name: MINDWTR_MCP_HTTP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mindwtr-mcp-token
                  key: token
            - name: NODE_ENV
              value: "production"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - "ALL"
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: db
              mountPath: /data
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        # Persistent Mindwtr SQLite database.
        - name: db
          persistentVolumeClaim:
            claimName: mindwtr-data
        - name: tmp
          emptyDir:
            sizeLimit: 100Mi
