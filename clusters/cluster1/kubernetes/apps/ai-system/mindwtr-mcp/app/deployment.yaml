---
# Minimal dedicated identity. No cluster RBAC: the server only reads a SQLite
# DB and serves MCP tools over HTTP; it never touches the Kubernetes API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mindwtr-mcp
  namespace: ai-system
  labels:
    app.kubernetes.io/name: mindwtr-mcp
---
# Mindwtr MCP Server — self-hosted Model Context Protocol server for
# GTD task management via mcp-proxy bridge (stdio → streamable HTTP).
#
# Uses the official mindwtr-mcp npm package (v1.1.3) in stdio mode, wrapped
# by mcp-proxy so kagent can connect over the network. No custom container
# image — a node:24-alpine init container installs the package from npm and
# stages it into a shared emptyDir that mcp-proxy reads.
#
# Data seeding: the Mindwtr SQLite database is provided via a Kubernetes
# Secret (mindwtr-db). A db-seed init container copies it into an emptyDir.
# No host-path PVC — fully compatible with Talos.
#
# To seed the DB:
#   1. Export mindwtr.db from Mindwtr desktop (Settings → Advanced → Export)
#   2. Run: sqlite3 mindwtr.db VACUUM
#   3. Create the secret:
#        kubectl create secret generic mindwtr-db \
#          --from-file=mindwtr.db=./mindwtr.db \
#          -n ai-system --dry-run=client -o yaml | kubectl apply -f -
#   4. Pod auto-restarts and picks up the new DB
#
# To update the DB later, re-apply the secret (kubectl apply) and the pod
# will restart automatically on secret change (RollingUpdate with
# podReplacementPolicy=Always is default for Secrets).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mindwtr-mcp
  namespace: ai-system
  labels:
    app.kubernetes.io/name: mindwtr-mcp
    app.kubernetes.io/version: "1.1.3"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mindwtr-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mindwtr-mcp
        app.kubernetes.io/version: "1.1.3"
    spec:
      serviceAccountName: mindwtr-mcp
      terminationGracePeriodSeconds: 10
      # Pin to the GPU node (nv-01), matching the rest of the ai-system stack.
      nodeSelector:
        nvidia.com/gpu.present: "true"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/os
                    operator: In
                    values:
                      - linux
      initContainers:
        # Stage node + mindwtr-mcp package into shared emptyDir. node:24-alpine
        # is musl-linked (matching the mcp-proxy base image) but still depends on
        # libstdc++.so.6 + libgcc_s.so.1 from the g++ apk; those are copied next
        # to the binary so the server container can run it via LD_LIBRARY_PATH.
        # better-sqlite3 ships prebuilt binaries; if not available for node:24,
        # compilation tools are installed by apk.
        - name: mindwtr-install
          image: docker.io/library/node:24-alpine
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              set -eu
              apk add --no-cache gcc g++ make python3 linux-headers
              cd /staged && npm install mindwtr-mcp@1.1.3 --no-audit --no-fund
              mkdir -p /staged/bin && cp /usr/local/bin/node /staged/bin/
              # node needs libstdc++.so.6 + libgcc_s.so.1 (from the g++ apk);
              # copy them next to the staged binary so the musl-based mcp-proxy
              # image can run it via RPATH=$ORIGIN.
              cp /usr/lib/libstdc++.so.6 /staged/bin/ 2>/dev/null || true
              cp /usr/lib/libgcc_s.so.1 /staged/bin/ 2>/dev/null || true
              chmod -R a+rx /staged
              echo "staged: node=$(ls /staged/bin/node), mcp=$(ls /staged/node_modules/mindwtr-mcp/dist/index.js), libs=$(ls /staged/bin/lib*)"
          volumeMounts:
            - name: mindwtr-bin
              mountPath: /staged
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 2Gi
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
        # Seed the Mindwtr SQLite database from the mindwtr-db Secret into the
        # shared emptyDir. The Secret is created manually (see top comment).
        # Kubernetes decodes the base64 Secret automatically when mounted.
        - name: db-seed
          image: docker.io/library/alpine:3.24
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              set -eu
              cp /secret/mindwtr.db /data/mindwtr.db
              chmod 0444 /data/mindwtr.db
              echo "seeded: $(ls -la /data/mindwtr.db)"
          volumeMounts:
            - name: mindwtr-db
              mountPath: /secret
              readOnly: true
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
      containers:
        # stdio → streamable HTTP bridge. Spawns the mindwtr-mcp child process
        # (node + mindwtr-mcp/dist/index.js) and serves it at :8080/mcp. This is
        # the only network endpoint; the mindwtr-mcp process itself listens on
        # nothing (pure stdio).
        #
        # Uses mcp-proxy (Python MCP SDK) instead of supergateway: mcp-proxy
        # answers the notifications/initialized 202 and its session layer
        # answers initialize without a cold child spawn, so kagent registers
        # tools cleanly (see codebase-memory-mcp deployment comments).
        - name: server
          image: ghcr.io/sparfenyuk/mcp-proxy:v0.12.0
          imagePullPolicy: IfNotPresent
          # The image ENTRYPOINT is ["catatonit","--"] with CMD ["mcp-proxy"].
          # catatonit execs mcp-proxy (CMD) and appends these args. mcp-proxy's
          # argparse parses flags up to "--", then treats the rest as
          # command_or_url + args. The node command + its --db-path flag must
          # be wrapped in a single shell string so argparse sees only ONE
          # positional (the shell), not a "--db-path" it tries to parse.
          args:
            - --host=0.0.0.0
            - --port=8080
            - --transport=streamablehttp
            - --pass-environment
            - --
            - /staged/bin/node
            - /staged/node_modules/mindwtr-mcp/dist/index.js
            - --db-path=/data/mindwtr.db
          env:
            - name: NODE_ENV
              value: "production"
            # node (copied from node:24-alpine) needs libstdc++.so.6 +
            # libgcc_s.so.1, which the init container stages next to the binary.
            - name: LD_LIBRARY_PATH
              value: "/staged/bin"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          # TCP probe: mcp-proxy's session layer binds the listener as soon as
          # it starts; the mindwtr-mcp child is spawned lazily per session.
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: mindwtr-bin
              mountPath: /staged
              readOnly: true
            - name: data
              mountPath: /data
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        # Staged Node.js + mindwtr-mcp package, populated by the mindwtr-install
        # init container. Survives pod restarts within the same pod.
        - name: mindwtr-bin
          emptyDir:
            sizeLimit: 200Mi
        # Mindwtr SQLite database, seeded from the mindwtr-db Secret by the
        # db-seed init container. Re-seeded on each pod restart.
        - name: data
          emptyDir:
            sizeLimit: 100Mi
        - name: tmp
          emptyDir:
            sizeLimit: 100Mi
        # Mindwtr database Secret — created manually via kubectl (see top comment).
        # The init container reads this once at startup; subsequent updates
        # require a pod restart (kubectl rollout restart or delete the pod).
        - name: mindwtr-db
          secret:
            secretName: mindwtr-db
