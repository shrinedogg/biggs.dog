---
# Minimal dedicated identity. No cluster RBAC: the server only reads a SQLite
# DB and serves MCP tools over HTTP; it never touches the Kubernetes API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mindwtr-mcp
  namespace: ai-system
  labels:
    app.kubernetes.io/name: mindwtr-mcp
---
# Mindwtr MCP Server — self-hosted GTD task management via mcp-proxy bridge.
#
# Uses the official mindwtr-mcp npm package (v1.1.3) in stdio mode, wrapped
# by mcp-proxy (stdio -> streamable HTTP) so kagent can connect over the
# network. No custom container image required — node:24-alpine init container
# installs mindwtr-mcp from npm and stages node + node_modules into a shared
# emptyDir that mcp-proxy reads.
#
# The Mindwtr SQLite database is seeded from a Kubernetes Secret (mounted
# read-only by the db-seed init container) into an emptyDir. No host-path
# PVC — works on Talos.
#
# DB seeding process:
#   1. Export from Mindwtr desktop: Settings → Advanced → Export (.db file)
#   2. Run: sqlite3 mindwtr.db VACUUM  (compacts free pages)
#   3. Create secret:
#        kubectl create secret generic mindwtr-db \
#          --from-file=mindwtr.db=./mindwtr.db \
#          -n ai-system --dry-run=client -o yaml | kubectl apply -f -
#   4. Pod restarts with the new DB automatically.
#
# For ongoing updates, repeat step 3. The pod will reconcile and pick up
# the new DB on restart. For a faster update, delete the pod to force
# immediate restart.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mindwtr-mcp
  namespace: ai-system
  labels:
    app.kubernetes.io/name: mindwtr-mcp
    app.kubernetes.io/version: "1.1.3"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mindwtr-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mindwtr-mcp
        app.kubernetes.io/version: "1.1.3"
    spec:
      serviceAccountName: mindwtr-mcp
      terminationGracePeriodSeconds: 10
      # Pin to the GPU node (nv-01), matching the rest of the ai-system stack.
      nodeSelector:
        nvidia.com/gpu.present: "true"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/os
                    operator: In
                    values:
                      - linux
      initContainers:
        # Install mindwtr-mcp from npm and stage node + node_modules into the
        # shared emptyDir. mcp-proxy (main container) spawns the child process
        # via stdio; it needs node and the mindwtr-mcp package in its filesystem.
        - name: mindwtr-install
          image: docker.io/library/node:24-alpine
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              set -eu
              cd /app && npm install --production mindwtr-mcp@1.1.3
              # Stage the node binary so mcp-proxy can spawn it.
              cp /usr/local/bin/node /app/node
              echo "staged: $(ls /app/node /app/node_modules/mindwtr-mcp/dist/index.js)"
          volumeMounts:
            - name: mindwtr-bin
              mountPath: /app
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
        # Seed the mindwtr.db SQLite database from the mindwtr-db Secret into
        # the shared emptyDir. The Secret is created manually (see top comment
        # for the kubectl command). The init container copies the raw bytes
        # (Kubernetes decodes the base64 Secret automatically).
        - name: db-seed
          image: docker.io/library/alpine:3.24
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              set -eu
              cp /secret/mindwtr.db /data/mindwtr.db
              echo "seeded: $(ls -la /data/mindwtr.db)"
          volumeMounts:
            - name: mindwtr-db
              mountPath: /secret
              readOnly: true
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
      containers:
        # stdio -> streamable HTTP bridge. Spawns node + mindwtr-mcp in stdio
        # mode and serves it at :8080/mcp. This is the only network endpoint;
        # the mindwtr-mcp process itself listens on nothing.
        - name: server
          image: ghcr.io/sparfenyuk/mcp-proxy:v0.12.0
          imagePullPolicy: IfNotPresent
          args:
            - --host=0.0.0.0
            - --port=8080
            - --transport=streamablehttp
            - --pass-environment
            - --
            - /app/node
            - /app/node_modules/mindwtr-mcp/dist/index.js
            - --db-path=/data/mindwtr.db
          env:
            - name: NODE_ENV
              value: "production"
            # Fallback: mindwtr-mcp may also read the DB path from this env var.
            - name: MINDWTR_DB_PATH
              value: "/data/mindwtr.db"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: mindwtr-bin
              mountPath: /app
              readOnly: true
            - name: data
              mountPath: /data
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        # Staged Node.js + mindwtr-mcp package, populated by the mindwtr-install
        # init container. Survives pod restarts within the same pod.
        - name: mindwtr-bin
          emptyDir:
            sizeLimit: 200Mi
        # Mindwtr SQLite database, seeded by the db-seed init container from
        # the mindwtr-db Secret. Updated via kubectl create secret.
        - name: data
          emptyDir:
            sizeLimit: 100Mi
        - name: tmp
          emptyDir:
            sizeLimit: 100Mi
        # The mindwtr.db Secret, mounted read-only for the db-seed init container.
        # Created manually: kubectl create secret generic mindwtr-db
        #   --from-file=mindwtr.db=./mindwtr.db -n ai-system
        - name: mindwtr-db
          secret:
            secretName: mindwtr-db
