---
# Bearer token for the Mindwtr Cloud API (mindwtr-cloud /v1 + /v1/data).
#
# Reuses the SAME 1Password item the mindwtr/mindwtr-cloud deployment consumes
# (mindwtr-cloud-auth-token — the token in each client's Settings → Sync →
# Self-Hosted). No new secret material is introduced; the cloud deployment
# keeps its own copy in the mindwtr namespace.
#
# Materializes secret "mindwtr-mcp-cloud-token" (key: token), consumed by the
# mindwtr-mcp Deployment as MINDWTR_MCP_CLOUD_TOKEN.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mindwtr-mcp-cloud-token
  namespace: ai-system
  labels:
    app.kubernetes.io/name: mindwtr-mcp
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: mindwtr-mcp-cloud-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: mindwtr-cloud-auth-token
        property: password
