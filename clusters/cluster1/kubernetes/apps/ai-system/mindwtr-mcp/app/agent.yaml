---
# Custom kagent Agent wired to the Mindwtr MCP server.
# Provides GTD task management: inbox processing, next actions, project
# management, Waiting For tracking, and weekly review workflows.
#
# Not chart-managed: owned by this Kustomization.
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: mindwtr-agent
  namespace: ai-system
spec:
  type: Declarative
  description: >-
    GTD task management expert with full access to the Mindwtr task system.
    Creates, lists, updates, and completes tasks; processes inbox items with
    the 2-minute rule; manages projects with sections and next actions;
    tracks Waiting For items; and runs weekly review workflows. Reads and
    writes the live self-hosted Mindwtr Cloud sync store — the same data the
    desktop and mobile clients sync against.
  # Sandboxed execution: code the agent writes runs in an isolated env.
  # No outbound network needed — all tools are cluster-internal.
  sandbox:
    network:
      allowedDomains:
        - "*.svc.cluster.local"
  declarative:
    modelConfig: default-model-config
    runtime: python
    executeCodeBlocks: true
    context:
      compaction:
        tokenThreshold: 80000
        summarizer:
          modelConfig: default-model-config
    memory:
      modelConfig: embedding-model
      ttlDays: 30
    deployment:
      nodeSelector:
        nvidia.com/gpu.present: "true"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 512Mi
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        privileged: false
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 1001
        capabilities:
          drop:
            - ALL
    promptTemplate:
      dataSources:
        - alias: builtin
          kind: ConfigMap
          name: kagent-builtin-prompts
    a2aConfig:
      skills:
        - id: task-management
          name: Task Management
          description: >-
            Create, list, update, and complete tasks in the Mindwtr system.
            Process inbox items, schedule tasks, and manage task properties.
          tags:
            - tasks
            - gtd
            - mindwtr
            - inbox
          examples:
            - What is in my inbox?
            - Create a task to review the quarterly budget
            - Complete the task "Update deployment docs"
        - id: project-management
          name: Project Management
          description: >-
            Manage projects with sections, set next actions, and organize
            multi-step outcomes.
          tags:
            - projects
            - gtd
            - mindwtr
          examples:
            - Show me all active projects and their next actions
            - Create a project for the home renovation
            - What are the next actions for the migration project?
        - id: review-workflow
          name: Review & Focus
          description: >-
            Run daily focus checks, weekly reviews, and summarize pending
            Waiting For items.
          tags:
            - review
            - focus
            - gtd
            - waiting-for
          examples:
            - What should I focus on today?
            - Run a weekly review of my tasks
            - What am I waiting on from others?
    systemMessage: |
      # Mindwtr GTD Agent

      You are a GTD (Getting Things Done) expert with full access to the
      Mindwtr task management system via MCP tools. You help users manage
      their tasks, projects, inbox, and review workflows.

      ## Available Tools

      - Task CRUD: create, list, update, and delete tasks
      - Inbox: process inbox items, apply the 2-minute rule
      - Projects: manage projects, sections, and next actions
      - Focus: show next actions, scheduled items, and today's agenda
      - Waiting For: track delegated items and follow-ups
      - Search: find tasks by keyword, context, or filter

      ## GTD Workflow

      1. **Capture** — Tasks go to the Inbox first
      2. **Clarify** — Process inbox: do it (2-min), delegate, or defer
      3. **Organize** — Assign to projects, contexts, and schedules
      4. **Engage** — Focus on next actions, one at a time
      5. **Reflect** — Weekly review to catch loose ends

      ## Guidelines

      {{include "builtin/tool-usage-best-practices"}}

      - Always cite task IDs and project names in responses
      - For inbox processing, suggest concrete next actions
      - For weekly reviews, summarize across all categories
      - Respect the user's context and project organization

      {{include "builtin/safety-guardrails"}}
    tools:
      - type: McpServer
        mcpServer:
          apiGroup: kagent.dev
          kind: RemoteMCPServer
          name: mindwtr-mcp
          # Tool names as exposed by mindwtr-mcp v1.1.3 (Cloud mode, --write):
          # the server prefixes every tool with "mindwtr_". An earlier revision
          # of this list used the unprefixed names (create_task, list_tasks,
          # ...) which do not exist — kagent matched nothing and the agent ran
          # with zero tools.
          toolNames:
            - mindwtr_list_tasks
            - mindwtr_get_task
            - mindwtr_add_task
            - mindwtr_update_task
            - mindwtr_complete_task
            - mindwtr_delete_task
            - mindwtr_restore_task
            - mindwtr_list_projects
            - mindwtr_get_project
            - mindwtr_add_project
            - mindwtr_update_project
            - mindwtr_delete_project
            - mindwtr_list_sections
            - mindwtr_get_section
            - mindwtr_add_section
            - mindwtr_update_section
            - mindwtr_delete_section
            - mindwtr_list_areas
            - mindwtr_add_area
            - mindwtr_update_area
            - mindwtr_delete_area
            - mindwtr_list_people
            - mindwtr_get_person
            - mindwtr_add_person
            - mindwtr_update_person
            - mindwtr_rename_person
            - mindwtr_delete_person
