---
# Bearer token for mindwtr-mcp HTTP authentication.
#
# 1Password item required (biggs-dog vault): mindwtr-mcp-token
#   token — a random 32+ hex chars, e.g. from: openssl rand -hex 32
#
# This token is used by the RemoteMCPServer to authenticate with the
# mindwtr-mcp server. Mindwtr's HTTP mode enforces bearer token auth
# with timing-safe SHA-256 comparison (see http-server.ts).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mindwtr-mcp-token
  namespace: ai-system
  labels:
    app.kubernetes.io/name: mindwtr-mcp
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: mindwtr-mcp-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: mindwtr-mcp-token
        property: token
