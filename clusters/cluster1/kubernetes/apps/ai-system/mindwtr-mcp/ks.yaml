---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app mindwtr-mcp
  namespace: flux-system
spec:
  dependsOn:
    # kagent provides the RemoteMCPServer/Agent CRDs, the default-model-config
    # ModelConfig, and the kagent-builtin-prompts ConfigMap referenced in agent.yaml.
    - name: kagent
  # No targetNamespace: each manifest sets its own namespace. All resources
  # live in ai-system (no cluster RBAC; the server only reads a SQLite DB
  # and serves MCP over HTTP).
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./clusters/cluster1/kubernetes/apps/ai-system/mindwtr-mcp/app
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  interval: 3m
  retryInterval: 1m
  timeout: 5m
