---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: substrate-podcert
  namespace: podcertificate-controller-system
spec:
  interval: 3m
  chartRef:
    kind: OCIRepository
    name: substrate-podcert
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    # The chart defaults both to ate-system (upstream's namespace). The
    # substrate control plane runs in ai-system: the signer must sign the
    # postgres .podcert.ate.dev/identity credentials for the
    # ate-api-server ServiceAccount in ai-system when
    # postgres.clientCertificates is enabled.
    postgresClientNamespace: ai-system
    postgresClientServiceAccount: ate-api-server
