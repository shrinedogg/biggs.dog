---
# Mistral API key for the agentgateway Mistral AI backend.
# Source: 1Password item "mistral-api-key" (field "api-key") in the biggs-dog
# vault (the onepassword-connect ClusterSecretStore only reads biggs-dog).
# Rendered as Secret "mistral-api-key" with key "Authorization" — the key
# name agentgateway's auth policy expects for OpenAI-compatible providers.
#
# Human gate: the 1Password item must exist before the ExternalSecret can
# sync; until then the route serves 401 (client auth fails closed) and the
# backend cannot authenticate upstream.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mistral-api-key
  namespace: ai-system
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: mistral-api-key
    creationPolicy: Owner
    template:
      data:
        Authorization: "{{ .apiKey }}"
  data:
    - secretKey: apiKey
      remoteRef:
        key: mistral-api-key
        property: "api-key"
