---
# Machine OIDC client credentials for the PocketID model-routes M2M client
# (client "model-routes", created in the PocketID admin console at
# id.biggs.dog). Materializes Secret "pocketid-model-routes" in ai-system
# with keys client-id / client-secret; consumed ONLY by the
# pocketid-model-jwt-refresher CronJob (env) to mint short-lived
# client_credentials JWTs for the hosted model routes' audiences
# (https://minimax.biggs.dog, https://mistral.biggs.dog,
# https://glm.biggs.dog).
#
# 1Password item required (biggs-dog vault): pocketid-model-routes-client
#   client-id — the OIDC client id (shown at client creation)
#   client-secret — the OIDC client secret (shown once at creation; rotate
#     it in 1Password, the 1h refresh picks it up automatically)
# Until the item exists the ExternalSecret stays unsynced and the
# refresher Jobs fail (harmless: the routes keep serving on the legacy
# static key during the PR-1 dual-accept window). Operator gate: create
# the console client + API grants + this 1Password item before merging
# PR-2 (plan, "PocketID side" steps 1-4).
#
# Ownership note (plan): this ESO targets the CLIENT CREDENTIALS Secret
# (pocketid-model-routes), which is read-only for the refresher. The
# refresher's OUTPUT Secret (pocketid-model-jwt) is owned exclusively by
# the refresher ServiceAccount — no ExternalSecret may ever target it (an
# ESO 1h refresh would clobber freshly-minted tokens).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pocketid-model-routes
  namespace: ai-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: pocketid-model-routes
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        client-id: "{{ .clientId }}"
        client-secret: "{{ .clientSecret }}"
  data:
    - secretKey: clientId
      remoteRef:
        key: pocketid-model-routes-client
        property: client-id
    - secretKey: clientSecret
      remoteRef:
        key: pocketid-model-routes-client
        property: client-secret
