---
# MiniMax API key for the agentgateway MiniMax AI backend.
# Source: 1Password item "minimax-api-key" (field "api-key") in the biggs-dog
# vault (the onepassword-connect ClusterSecretStore only reads biggs-dog).
# Rendered as Secret "minimax-api-key" with key "Authorization" — the key
# name agentgateway's auth policy expects for OpenAI-compatible providers.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: minimax-api-key
  namespace: ai-system
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: minimax-api-key
    creationPolicy: Owner
    template:
      data:
        Authorization: "{{ .apiKey }}"
  data:
    - secretKey: apiKey
      remoteRef:
        key: minimax-api-key
        property: "api-key"
