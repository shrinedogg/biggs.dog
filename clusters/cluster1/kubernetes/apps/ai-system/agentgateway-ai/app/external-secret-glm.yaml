---
# Z.ai API key for the agentgateway GLM AI backend.
# Source: 1Password item "zai-api-key" (field "api-key") in the biggs-dog
# vault (the onepassword-connect ClusterSecretStore only reads biggs-dog).
# The same item the kritika chart reads via kritika-credentials (ns kritika,
# Ready=True/SecretSynced); this is a second, independent sync into
# ai-system and does not touch kritika.
# Rendered as Secret "zai-api-key" with key "Authorization" - the key name
# agentgateway's auth policy expects for OpenAI-compatible providers.
#
# Human gate: the 1Password item must exist before the ExternalSecret can
# sync; until then the route serves 401 (client auth fails closed) and the
# backend cannot authenticate upstream.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zai-api-key
  namespace: ai-system
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: zai-api-key
    creationPolicy: Owner
    template:
      data:
        Authorization: "{{ .apiKey }}"
  data:
    - secretKey: apiKey
      remoteRef:
        key: zai-api-key
        property: "api-key"
