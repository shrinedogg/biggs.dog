---
# Materializes secret "model-api-keys" in ai-system with the cluster-internal
# client token for the hosted-model routes (minimax now; glm once its
# backend lands). agentgateway validates bearer tokens against it
# (model-api-key AgentgatewayPolicy); kagent ModelConfigs will present it
# via apiKeySecret / apiKeySecretKey.
#
# Retirement (PocketID model-routes migration): this Secret keeps
# authenticating through PR-1 (dual-accept) and stops working after PR-2
# (Strict JWT) cuts the static path on the hosted routes. PR-3 (follow-up
# F1) rotates out and deletes the 1Password item agentgateway-model-api-key
# and removes this ExternalSecret — only after the vLLM route (F3) and the
# hermes M2M client (F2) stop using model-api-keys.
#
# 1Password item required (biggs-dog vault): agentgateway-model-api-key
#   api-key — a fresh high-entropy token (>= 32 chars), distinct from the
#   MiniMax and Z.ai provider keys. Until the item exists the ExternalSecret
#   stays unsynced and the model routes are UNAUTHENTICATED (fail-open) on
#   agentgateway 0.12.0 / controller v2.2.1 (issue #704); they fail closed
#   (401) from agentgateway controller v1.0.1+ (agentgateway#1245).
#   Rotate the token in 1Password; the ExternalSecret refresh picks up the
#   new value automatically.
#
# The Secret data key "editor" is an arbitrary identifier consumed by
# agentgateway's apiKeyAuthentication and by kagent ModelConfig
# apiKeySecretKey. The VALUE is the raw token.
#
# This mirrors kagent/app/external-secret.yaml (kagent-mcp-api-keys),
# including the 1h refresh rotation story.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: model-api-keys
  namespace: ai-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: model-api-keys
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        editor: "{{ .apiKey }}"
  data:
    - secretKey: apiKey
      remoteRef:
        key: agentgateway-model-api-key
        property: api-key
