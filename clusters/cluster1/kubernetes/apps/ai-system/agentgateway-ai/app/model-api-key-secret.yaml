---
# Materializes secret "model-api-keys" in ai-system with the cluster-internal
# client token for the hosted-model routes (minimax now; glm once its
# backend lands). agentgateway validates bearer tokens against it
# (model-api-key AgentgatewayPolicy); kagent ModelConfigs will present it
# via apiKeySecret / apiKeySecretKey.
#
# 1Password item required (biggs-dog vault): agentgateway-model-api-key
#   api-key — a fresh high-entropy token (>= 32 chars), distinct from the
#   MiniMax and Z.ai provider keys. Until the item exists the ExternalSecret
#   stays unsynced and the route fails closed with 401. Rotate the token in
#   1Password; the ExternalSecret refresh picks up the new value
#   automatically.
#
# The Secret data key "editor" is an arbitrary identifier consumed by
# agentgateway's apiKeyAuthentication and by kagent ModelConfig
# apiKeySecretKey. The VALUE is the raw token.
#
# This mirrors kagent/app/external-secret.yaml (kagent-mcp-api-keys),
# including the 1h refresh rotation story.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: model-api-keys
  namespace: ai-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: model-api-keys
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        editor: "{{ .apiKey }}"
  data:
    - secretKey: apiKey
      remoteRef:
        key: agentgateway-model-api-key
        property: api-key
