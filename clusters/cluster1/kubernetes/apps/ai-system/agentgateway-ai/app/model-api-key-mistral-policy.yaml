---
# Dual-accept client auth + rate limit in front of the hosted Mistral model
# route (HTTPRoute mistral). Part of the PocketID model-routes migration
# (PR-1, dual-accept window):
#
#   - jwtAuthentication mode Permissive: a valid PocketID OIDC JWT (issuer
#     https://id.biggs.dog, audience https://mistral.biggs.dog)
#     authenticates; an invalid/missing JWT is ignored while the static
#     key path is still available. The gateway validates iss, JWKS
#     signature, per-route audience, and exp in-process.
#   - apiKeyAuthentication mode Permissive: the legacy static token from
#     the model-api-keys Secret (1Password item agentgateway-model-api-key,
#     shared with the minimax route) still authenticates during the window.
#   - authorization CEL rule (fail-closed): a request must have validated
#     AT LEAST ONE credential (has(jwt.sub) || has(apiKey.key)) or it is
#     rejected (403). Two Permissive modes without this rule would pass
#     everything through.
#   - PR-2 flips jwtAuthentication to Strict and removes the
#     apiKeyAuthentication block + the authorization rule; after that the
#     static token no longer works on this route. PR-3 (follow-up F1)
#     retires the 1Password item agentgateway-model-api-key.
#
# preserveToken stays at its default (false): the validated client token is
# stripped before the backend's auth policy injects the upstream Mistral
# provider key, so client credentials never leak to the provider.
#
# JWKS wiring: jwks.remote.backendRef -> the pocket-id Service (auth ns,
# port 1411), cross-namespace, allowed by the ReferenceGrant in
# auth/pocket-id/app/referencegrant.yaml. jwks.remote.url is a 1.x-train
# addition; on the pinned legacy train (controller v2.2.1 / data plane
# 0.12.0) backendRef is the supported wiring (plan decision D1).
#
# Carried from the pre-migration policy: on the pinned train a missing
# model-api-keys Secret drops the apiKey block from xDS (fail-open, issue
# #704, 401 only once the Secret exists). During the dual-accept window
# that fail-open path is bounded: the CEL authorization rule still
# rejects unauthenticated requests. Fixed upstream by agentgateway#1245
# semantics (controller >= v1.0.1).
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: model-api-key-mistral
  namespace: ai-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: mistral
  traffic:
    jwtAuthentication:
      mode: Permissive
      providers:
        - issuer: https://id.biggs.dog
          audiences:
            - https://mistral.biggs.dog
          jwks:
            remote:
              backendRef:
                # group "" = core API group; kind defaults to Service.
                name: pocket-id
                namespace: auth
                port: 1411
              jwksPath: .well-known/jwks.json
              cacheDuration: 5m
    apiKeyAuthentication:
      mode: Permissive
      # location omitted — defaults to Authorization header with "Bearer " prefix
      secretRef:
        name: model-api-keys
    authorization:
      # Fail-closed dual-accept: Permissive auth modes alone would pass
      # unauthenticated requests through. The CEL Allow rule matches only
      # when at least one credential validated: a valid PocketID JWT
      # (jwt.sub set) or the legacy static API key (apiKey.key set).
      # Neither -> rejected (403).
      action: Allow
      policy:
        matchExpressions:
          - 'has(jwt.sub) || has(apiKey.key)'
    rateLimit:
      # Bound spend on the paid upstream: 120 requests/min, burst 40.
      local:
        - requests: 120
          unit: Minutes
          burst: 40
