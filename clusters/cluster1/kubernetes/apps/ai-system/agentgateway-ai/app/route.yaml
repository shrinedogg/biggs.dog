---
# External HTTPS route for the MiniMax OpenAI-compatible API via agentgateway.
# Endpoint: https://minimax.biggs.dog/v1 (internal LAN-only gateway, TLS at
# the edge). Placed on internal-biggs-dog, NOT wildcard-biggs-dog: the WAN
# VIP 192.168.6.7 is the only UDM-forwarded address, so the public path 404s
# while k8s-gateway answers minimax.biggs.dog with 192.168.6.15 for LAN
# clients (the split-horizon answer is derived from this route's parent
# Gateway).
#
# Client authentication is required (model-api-key AgentgatewayPolicy,
# dual-accept since the PocketID model-routes migration PR-1): send EITHER
#   - a PocketID OIDC JWT for this route's audience (mint via
#     client_credentials at https://id.biggs.dog/api/oidc/token with
#     resource=https://minimax.biggs.dog; the gateway validates iss/JWKS/
#     aud/exp in-process), or
#   - the legacy static model-route token from the model-api-keys Secret
#     (ExternalSecret from the 1Password item agentgateway-model-api-key;
#     retired by migration PR-3 after PR-2).
# Both are distinct from the MiniMax provider key, which the backend uses
# upstream and never reaches clients.
#
# Usage:
#   curl https://minimax.biggs.dog/v1/chat/completions \
#     -H 'Content-Type: application/json' \
#     -H 'Authorization: Bearer <pocketid-jwt-or-static-token>' \
#     -d '{"model":"MiniMax-M3","messages":[{"role":"user","content":"hi"}]}'
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: minimax
  namespace: ai-system
spec:
  hostnames:
    - minimax.biggs.dog
  parentRefs:
    - name: internal-biggs-dog
      namespace: networking
  rules:
    - backendRefs:
        - name: minimax
          group: agentgateway.dev
          kind: AgentgatewayBackend
      matches:
        - path:
            type: PathPrefix
            value: /
      # LLM requests can run for minutes; same generous timeouts as the
      # vllm route.
      timeouts:
        request: 600s
        backendRequest: 600s
