---
# External HTTPS route for the MiniMax OpenAI-compatible API via agentgateway.
# Endpoint: https://minimax.biggs.dog/v1 (wildcard gateway, TLS at the edge).
#
# Usage:
#   curl https://minimax.biggs.dog/v1/chat/completions \
#     -H 'Content-Type: application/json' \
#     -d '{"model":"MiniMax-M3","messages":[{"role":"user","content":"hi"}]}'
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: minimax
  namespace: ai-system
spec:
  hostnames:
    - minimax.biggs.dog
  parentRefs:
    - name: wildcard-biggs-dog
      namespace: networking
  rules:
    - backendRefs:
        - name: minimax
          group: agentgateway.dev
          kind: AgentgatewayBackend
      matches:
        - path:
            type: PathPrefix
            value: /
      # LLM requests can run for minutes; same generous timeouts as the
      # vllm route.
      timeouts:
        request: 600s
        backendRequest: 600s
