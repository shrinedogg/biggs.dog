---
# External HTTPS route for the Mistral OpenAI-compatible API via agentgateway.
# Endpoint: https://mistral.biggs.dog/v1 (internal LAN-only gateway, TLS at
# the edge). Placed on agentgateway1x-canary (the 1.7.0 canary Gateway),
# NOT wildcard-biggs-dog: the WAN VIP 192.168.6.7 is the only UDM-forwarded
# address, so the public path 404s while k8s-gateway answers
# mistral.biggs.dog with the canary Service's UDM-assigned VIP for LAN
# clients (the split-horizon answer is derived from this route's parent
# Gateway; the canary Gateway has no pinned spec.addresses, so read the VIP
# from the canary Service EXTERNAL-IP after reconcile).
#
# Client authentication is required (model-api-key-mistral AgentgatewayPolicy,
# dual-accept since the PocketID model-routes migration PR-1): send EITHER
#   - a PocketID OIDC JWT for this route's audience (mint via
#     client_credentials at https://id.biggs.dog/api/oidc/token with
#     resource=https://mistral.biggs.dog; the gateway validates iss/JWKS/
#     aud/exp in-process), or
#   - the legacy static model-route token from the model-api-keys Secret
#     (ExternalSecret from the 1Password item agentgateway-model-api-key,
#     shared with the minimax route; retired by migration PR-3 after PR-2).
# Both are distinct from the Mistral provider key, which the backend uses
# upstream and never reaches clients.
#
# Usage:
#   curl https://mistral.biggs.dog/v1/chat/completions \
#     -H 'Content-Type: application/json' \
#     -H 'Authorization: Bearer <pocketid-jwt-or-static-token>' \
#     -d '{"model":"mistral-small-latest","messages":[{"role":"user","content":"hi"}]}'
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mistral
  namespace: ai-system
spec:
  hostnames:
    - mistral.biggs.dog
  parentRefs:
    # Attached to the 1.7.0 canary Gateway (issues #821/#748) because the legacy
    # 0.12.0 data plane on internal-biggs-dog cannot execute the dual-accept
    # jwtAuthentication + apiKeyAuthentication CEL policy. Single parentRef so
    # k8s-gateway answers mistral.biggs.dog exclusively with the 1.x VIP.
    - name: agentgateway1x-canary
      namespace: networking
  rules:
    - backendRefs:
        - name: mistral
          group: agentgateway.dev
          kind: AgentgatewayBackend
      matches:
        - path:
            type: PathPrefix
            value: /
      # LLM requests can run for minutes; same generous timeouts as the
      # minimax route.
      timeouts:
        request: 600s
        backendRequest: 600s
