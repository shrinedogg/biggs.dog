---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app vllm-omni
  namespace: flux-system
spec:
  dependsOn:
    # Owns the kagent-vllm Secret (the VLLM_API_KEY this app references).
    - name: vllm
    # Owns the HTTPRoute parent (the internal-biggs-dog data plane).
    - name: agentgateway
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./clusters/cluster1/kubernetes/apps/ai-system/vllm-omni/app
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  interval: 3m
  retryInterval: 1m
  # Pulling the multi-GB vLLM-Omni image + downloading the Wan2.1-T2V-1.3B
  # weights (~27.6 GiB) on first start is slow.
  timeout: 10m
