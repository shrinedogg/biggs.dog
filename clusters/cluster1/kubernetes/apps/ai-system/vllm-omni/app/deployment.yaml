---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-omni
  namespace: ai-system
  labels:
    app: vllm-omni
spec:
  # On-demand text-to-video generator, not an always-on service: dormant at
  # 0 replicas by default so it never contends with vLLM for the GPU cards.
  #
  # Ops flow (run on the cluster host; the video pod can only schedule while
  # vLLM is at 0 replicas, because vLLM's 5-GPU request spans both cards):
  #   1. kubectl -n ai-system scale deploy vllm --replicas=0
  #   2. kubectl -n ai-system scale deploy vllm-omni --replicas=1
  #   3. kubectl -n ai-system wait --for=condition=available deploy/vllm-omni --timeout=45m
  #   4. Generate: curl -X POST https://vllm-omni.biggs.dog/v1/videos/sync
  #        -H "Authorization: Bearer <key from kagent-vllm>"
  #        -F prompt=A corgi surfing a wave at sunset -F size=832x480
  #        -F num_frames=33 -F fps=16 -o out.mp4
  #   5. kubectl -n ai-system scale deploy vllm-omni --replicas=0
  #      kubectl -n ai-system scale deploy vllm --replicas=1
  #
  # HAZARD: the gpu-arbiter operator (GPUArbiter CR in
  # dreamcast/gpu-arbiter-instance) restores vLLM to 1 replica after gaming
  # sessions; if it does so while vllm-omni is still running, vLLM cannot
  # reschedule (vllm-omni holds a whole card) and the text endpoint stays
  # down until vllm-omni is scaled back to 0. Fit video sessions between
  # gaming sessions.
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm-omni
  template:
    metadata:
      labels:
        app: vllm-omni
    spec:
      # The Service is named "vllm-omni", so Kubernetes injects legacy
      # service-link env vars (e.g. VLLM_OMNI_PORT) that collide with vLLM's
      # own config; disable the injection (mirrors the vllm deployment).
      enableServiceLinks: false
      # Pin to the GPU node (nv-01) by capability label rather than hostname,
      # matching the rest of the ai-system stack.
      nodeSelector:
        nvidia.com/gpu.present: "true"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      # Short grace so VRAM is released fast on scale-down; the model is
      # stateless (weights on the PVC), so a quick SIGTERM/SIGKILL is fine
      # and it reloads on scale-up (mirrors the vllm deployment).
      terminationGracePeriodSeconds: 10
      containers:
        - name: vllm-omni
          # tag v0.32.0-x86_64 = vLLM-Omni v0.32.0, the latest stable release,
          # aligned with vLLM 0.32.0; amd64 single-arch manifest. The node
          # driver already runs CUDA 13.0 builds for the vLLM deployment, so
          # the runtime is forward-compatible. ASSUMPTION: the image's torch
          # build supports sm_120 (RTX 5090, Blackwell consumer); the
          # first-boot pod log is the authority (CUDA capability errors
          # surface there if not).
          image: docker.io/vllm/vllm-omni@sha256:6b44ee504a0dc3a21eacf72e7dc5da318b7bcc8ed0e349dc928e67278414430c
          args:
            # vLLM-Omni serve for the Wan2.1-T2V 1.3B diffusers checkpoint;
            # effective command line:
            #   vllm serve Wan-AI/Wan2.1-T2V-1.3B-Diffusers --omni
            #     --host=0.0.0.0 --port=8000 --flow-shift=3.0 --boundary-ratio=0.0
            # Per-model flags for the Wan2.1 family (per vLLM-Omni docs /
            # PR #1920): flow-shift 3.0 and boundary-ratio 0.0 (the Wan2.2
            # defaults 5.0/0.875 are wrong for Wan2.1). Text-to-video API
            # surface: POST /v1/videos (async: returns a job id, poll
            # GET /v1/videos/{id}, download GET /v1/videos/{id}/content) and
            # POST /v1/videos/sync (blocks and returns raw mp4 bytes).
            # Port 8000 matches the Service and the route.
            - vllm
            - serve
            - Wan-AI/Wan2.1-T2V-1.3B-Diffusers
            - --omni
            - --host=0.0.0.0
            - --port=8000
            - --flow-shift=3.0
            - --boundary-ratio=0.0
          env:
            # Weights cache on the shared vllm-models PVC (defined in
            # vllm/app/pvc.yaml; do NOT create a new PVC). First boot
            # downloads Wan-AI/Wan2.1-T2V-1.3B-Diffusers, ~27.6 GiB:
            # ~21.7 GiB umT5 text encoder + ~5.4 GiB DiT transformer + VAE.
            - name: HF_HOME
              value: /models
            # Persist torch.compile artifacts (lost when the pod is replaced);
            # separate from the vLLM app's /models/.cache/vllm so the two
            # apps' compile caches do not collide.
            - name: VLLM_CACHE_ROOT
              value: /models/.cache/vllm-omni
            # Existing Secret owned by the vllm app's ExternalSecret (from the
            # 1Password item vllm-api-key); NO new 1Password item, NO new
            # ExternalSecret. vLLM enforces this key on all /v1/* endpoints.
            - name: VLLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: kagent-vllm
                  key: VLLM_API_KEY
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          resources:
            requests:
              nvidia.com/gpu: 4
              memory: 32Gi
            limits:
              # WHOLE-CARD TRICK (deliberate): the GPU device plugin runs
              # time-sliced CDI (4 virtual nvidia.com/gpu per physical card,
              # 8 on nv-01). The Qwen vLLM deployment requests 5, spanning
              # both cards and reserving ~29.4 GiB of each 32.6 GiB card
              # (gpu-memory-utilization 0.92). While vLLM runs, only 3
              # virtual GPUs remain, so this 4-GPU request stays Pending and
              # only schedules when vLLM is at 0 replicas: then one whole
              # physical card (32.6 GiB VRAM) is free and the ~13.7 GiB
              # runtime footprint of the 1.3B model fits with headroom. A
              # 1-GPU request would instead schedule on a shared card and
              # OOM (only ~3 GiB free per card), so 4 is deliberate.
              nvidia.com/gpu: 4
              # ~13.7 GiB BF16 runtime footprint of the 1.3B model plus
              # headroom for the weight download (page cache is charged to
              # the cgroup during the mmap read).
              memory: 32Gi
          startupProbe:
            httpGet:
              path: /health
              port: http
            # 45 min: 27.6 GiB weight download plus first-boot compile; on
            # restart the weights are already on the PVC.
            periodSeconds: 15
            failureThreshold: 180
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            # /health shares the inference event loop; give real headroom so
            # liveness only fires on a genuine deadlock (mirror the vllm
            # deployment rationale): 10s timeout x 6 failures = ~3 min of
            # sustained unresponsiveness before a restart.
            timeoutSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - name: models
              mountPath: /models
            - name: shm
              mountPath: /dev/shm
      volumes:
        # Shared with the vllm app (see vllm/app/pvc.yaml): 100Gi host-path,
        # RWO, WaitForFirstConsumer on nv-01. Do NOT create a new PVC.
        - name: models
          persistentVolumeClaim:
            claimName: vllm-models
        # Large shared-memory segment for the diffusion runtime; 8Gi keeps
        # the memory-backed mount well inside the node's RAM while the pod
        # runs.
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
