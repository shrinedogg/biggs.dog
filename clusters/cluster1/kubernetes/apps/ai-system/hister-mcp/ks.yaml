---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app hister-mcp
  namespace: flux-system
spec:
  dependsOn:
    # kagent provides the RemoteMCPServer/Agent CRDs, the default-model-config
    # ModelConfig (the local vLLM), and the kagent-builtin-prompts ConfigMap.
    - name: kagent
    # The hister app (Deployment + Service in the hister namespace) must be
    # up for the RemoteMCPServer's URL to resolve.
    - name: hister
  # All resources live in ai-system.
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./clusters/cluster1/kubernetes/apps/ai-system/hister-mcp/app
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  interval: 3m
  retryInterval: 1m
  timeout: 5m
