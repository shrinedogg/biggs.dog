---
# The RemoteMCPServer lives in ai-system, so its Secret-backed
# Authorization header must reference a secret IN ai-system: this
# ExternalSecret mirrors the same 1Password item (hister-access-token /
# access-token) that the hister namespace's secret uses, rendering the
# Bearer header the kagent egress gateway injects.
#
# The hister-access-token 1Password item does not exist at PR time (see
# hister/hister/app/external-secret.yaml); until it is created, this
# ExternalSecret will not sync and hister-mcp stays unaccepted for the
# missing secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hister-mcp-auth
  namespace: ai-system
  labels:
    app.kubernetes.io/name: hister-mcp
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: hister-mcp-auth
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        authorization: "Bearer {{ .access-token }}"
  data:
    - secretKey: access-token
      remoteRef:
        key: hister-access-token
        property: access-token
