---
# Mirrors the hister-access-token 1Password item into ai-system for the
# RemoteMCPServer header: the Secret-backed Authorization header must
# reference a secret in the SAME namespace as the RemoteMCPServer (ai-system),
# so this ExternalSecret produces "hister-mcp-auth" (key: authorization)
# here, templated from the same item the hister-namespace ExternalSecret
# consumes.
#
# 1Password item required (biggs-dog vault): hister-access-token /
# access-token (created by the operator post-merge — same item as the hister
# namespace).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hister-mcp-auth
  namespace: ai-system
  labels:
    app.kubernetes.io/name: hister-mcp
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: hister-mcp-auth
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        authorization: "Bearer {{ .access-token }}"
  data:
    - secretKey: access-token
      remoteRef:
        key: hister-access-token
        property: access-token
