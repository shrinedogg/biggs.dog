apiVersion: apps/v1
kind: Deployment
metadata:
  name: omni
  namespace: omni
  labels:
    app.kubernetes.io/name: omni
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: omni
  template:
    metadata:
      labels:
        app.kubernetes.io/name: omni
    spec:
      hostNetwork: false
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      volumes:
        - name: tun
          hostPath:
            path: /dev/net/tun
        - name: omni-etcd
          persistentVolumeClaim:
            claimName: omni-etcd
        - name: omni-sqlite
          persistentVolumeClaim:
            claimName: omni-sqlite
        - name: omni-key
          secret:
            secretName: omni-etcd-key
        - name: omni-tls
          secret:
            secretName: omni-biggs-dog-tls
      containers:
        - name: omni
          image: ghcr.io/siderolabs/omni:v1.10.0
          imagePullPolicy: Always
          securityContext:
            privileged: true
            capabilities:
              add:
                - NET_ADMIN
          args:
            - --cert=/tls/tls.crt
            - --key=/tls/tls.key
            - --machine-api-cert=/tls/tls.crt
            - --machine-api-key=/tls/tls.key
            - --machine-api-bind-addr=0.0.0.0:8090
            - --event-sink-port=8091
            - --bind-addr=0.0.0.0:443
            - --k8s-proxy-bind-addr=0.0.0.0:8100
            - --private-key-source=file:///etc/omni/omni.asc
            - --advertised-api-url=https://omni.biggs.dog/
            - --siderolink-api-advertised-url=https://omni.biggs.dog:8090/
            - --siderolink-wireguard-advertised-addr=CHANGE_ME_VM_IP:50180
            - --advertised-kubernetes-proxy-url=https://omni.biggs.dog:8100/
            - --auth-auth0-enabled=false
            - --auth-oidc-enabled=true
            - --auth-oidc-provider-url=https://dex.biggs.dog
            - --auth-oidc-client-id=omni
            - --auth-oidc-client-secret=$(OMNI_DEX_CLIENT_SECRET)
            - --auth-oidc-scopes=openid
            - --auth-oidc-scopes=profile
            - --auth-oidc-scopes=email
            - --initial-users=jshriner@protonmail.com
            - --eula-accept-name="Shrinedogg"
            - --eula-accept-email=jshriner@protonmail.com
          env:
            - name: OMNI_DEX_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: omni-dex-client-secret
                  key: client-secret
          ports:
            - name: https
              containerPort: 443
              protocol: TCP
            - name: machine-api
              containerPort: 8090
              protocol: TCP
            - name: event-sink
              containerPort: 8091
              protocol: TCP
            - name: k8s-proxy
              containerPort: 8100
              protocol: TCP
            - name: wireguard
              containerPort: 50180
              protocol: UDP
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi
          volumeMounts:
            - name: tun
              mountPath: /dev/net/tun
            - name: omni-etcd
              mountPath: /_out/omni-etcd
            - name: omni-sqlite
              mountPath: /_out/sqlite
            - name: omni-key
              mountPath: /etc/omni/omni.asc
              subPath: omni.asc
            - name: omni-tls
              mountPath: /tls
