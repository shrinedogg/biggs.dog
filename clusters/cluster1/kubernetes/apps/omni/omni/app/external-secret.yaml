# Materializes secret "omni-etcd-key" (key: omni.asc) — the GPG private key
# for Omni's etcd encryption.
#
# 1Password items required (biggs-dog vault):
#   - omni-etcd-key (key) — GPG private key for etcd encryption.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: omni-etcd-key
  namespace: omni
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: omni-etcd-key
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        omni.asc: "{{ .key }}"
  data:
    - secretKey: key
      remoteRef:
        key: omni-etcd-key
        property: key
---
# Materializes secret "omni-dex-client-secret" (key: client-secret) —
# the OIDC client secret for Omni authenticating against Dex.
#
# 1Password items required (biggs-dog vault):
#   - dex-omni-client-secret (secret) — OIDC client secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: omni-dex-client-secret
  namespace: omni
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: omni-dex-client-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        client-secret: "{{ .secret }}"
  data:
    - secretKey: secret
      remoteRef:
        key: dex-omni-client-secret
        property: secret
