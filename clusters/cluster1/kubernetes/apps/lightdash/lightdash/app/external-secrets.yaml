---
# Strict-mode application Secret: LIGHTDASH_SECRET (session cookie signing),
# LIGHTDASH_LICENSE_KEY (enterprise license) and PGPASSWORD (external-DB
# credential).
#
# 1Password items (biggs-dog vault):
#   lightdash-license      - license: the enterprise license key
#   lightdash-user-password - password: the CNPG bootstrap password (the same
#                             item the cnpg-lightdash Cluster consumes for
#                             initdb, via the ClusterExternalSecret in
#                             clusters/cluster1/kubernetes/apps/cnpg/cnpg/secrets/)
#
# LIGHTDASH_SECRET reuses the random lightdash-user-password token instead of
# a dedicated item: it is a strong random value with no user knowledge, and it
# keeps this app to exactly two 1P items. Tradeoff: rotating the DB password
# also rotates the cookie-signing secret (everyone logs out once). To decouple
# later, add a `secret` field to the lightdash-license item and point the
# LIGHTDASH_SECRET remoteRef at it.
#
# Injected into the backend and worker pods with envFrom, so every key becomes
# an environment variable of the same name. The PGPASSWORD key doubles as the
# strict-mode database credential (secretRefs.database.passwordKey). The
# migration Job does NOT envFrom this Secret (migrationJob.enabled: false),
# matching the chart's default that the backend performs its own boot-time
# migrations.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lightdash-app-secret
  namespace: lightdash
  labels:
    app.kubernetes.io/name: lightdash
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: lightdash-app-secret
    creationPolicy: Owner
  data:
    - secretKey: LIGHTDASH_SECRET
      remoteRef:
        key: lightdash-user-password
        property: password
    - secretKey: LIGHTDASH_LICENSE_KEY
      remoteRef:
        key: lightdash-license
        property: license
    - secretKey: PGPASSWORD
      remoteRef:
        key: lightdash-user-password
        property: password
---
# S3 credentials for the Lightdash object store.
#
# 1Password item (biggs-dog vault): b2-object-store-keys - the Backblaze B2
# key scoped to the biggs-dog bucket, shared with the CNPG/Barman object store
# and substrate. Lightdash keys are org-UUID prefixed, so they cannot collide
# with barman/ or substrate/ prefixes.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lightdash-s3-secret
  namespace: lightdash
  labels:
    app.kubernetes.io/name: lightdash
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: lightdash-s3-secret
    creationPolicy: Owner
  data:
    - secretKey: S3_ACCESS_KEY
      remoteRef:
        key: b2-object-store-keys
        property: keyID
    - secretKey: S3_SECRET_KEY
      remoteRef:
        key: b2-object-store-keys
        property: applicationKey
