---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
# Lightdash (BI tooling, enterprise license) on the cluster1 wildcard edge:
# lightdash.biggs.dog -> wildcard-biggs-dog -> lightdash.lightdash.svc:8080.
#
# Chart: lightdash from https://lightdash.github.io/helm-charts (HelmRepository
# lightdash). Version pinned here; Renovate's flux manager (helm datasource)
# opens chart-bump PRs.
#
# Postgres: external, CNPG cluster cnpg-lightdash (3 replicas, host-path,
# pgvector enabled) - see clusters/cluster1/kubernetes/apps/cnpg/cnpg/databases/.
# Credentials arrive via 1P item lightdash-user-password (CES in cnpg-system)
# and are read by the pods straight from the CNPG-provisioned secret.
#
# S3: the shared Backblaze B2 biggs-dog bucket (same key as the CNPG/Barman
# object store). Lightdash keys are org-UUID prefixed, so they cannot collide
# with barman/ or substrate/ prefixes.
#
# Secrets are external (secretRefs strict mode) via 1Password items
# lightdash-license (LIGHTDASH_SECRET + LIGHTDASH_LICENSE_KEY) and
# b2-object-store-keys (S3_ACCESS_KEY/S3_SECRET_KEY); see
# app/external-secrets.yaml. The chart creates NO application secrets.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lightdash
  namespace: lightdash
spec:
  interval: 3m
  chart:
    spec:
      chart: lightdash
      version: 2.16.1076
      sourceRef:
        kind: HelmRepository
        name: lightdash
        namespace: flux-system
  install:
    createNamespace: false
    # The pre-install migration hook Job runs inside the install action and
    # inherits this timeout. A cold first-run migration set needs more than the
    # default 5m.
    timeout: 10m
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    # The pre-upgrade migration hook Job runs inside the upgrade action too.
    timeout: 10m
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    # External DB: the CNPG cluster (read-write service hostname; CNPG exposes
    # both -rw and -ro, Lightdash needs the RW one for migrations).
    postgresql:
      enabled: false
    externalDatabase:
      host: cnpg-lightdash-rw.cnpg-system.svc.cluster.local
      port: 5432
      user: lightdash
      database: lightdash
      existingSecret: lightdash-user-password
      secretKeys:
        passwordKey: password
    # Strict, least-privilege secret wiring: the chart skips all of its own
    # Secret creation and reads only the keys it needs from the ESO-managed
    # Secrets below.
    secretRefs:
      enabled: true
      application:
        name: lightdash-app-secret   # LIGHTDASH_SECRET, LIGHTDASH_LICENSE_KEY
      database:
        name: lightdash-app-secret
        passwordKey: PGPASSWORD
      # The migration hook Job envFrom's this Secret (needs LIGHTDASH_SECRET to
      # load its config); same Secret as the application ref, per the chart's
      # documented default.
      migration:
        name: lightdash-app-secret
      s3:
        name: lightdash-s3-secret
        accessKey: S3_ACCESS_KEY
        secretKey: S3_SECRET_KEY
    s3:
      # Backblaze B2 is S3-compatible but only over path-style URLs.
      endpoint: https://s3.eu-central-003.backblazeb2.com
      publicEndpoint: https://s3.eu-central-003.backblazeb2.com
      bucket: biggs-dog
      region: eu-central-003
      forcePathStyle: "true"
    image:
      tag: "2.547.0"
    # cluster1 same-node ClusterIP hairpin workaround (cilium/cilium#47913):
    # a pod cannot reach a ClusterIP when a selected endpoint of that Service
    # sits on its own node. The lightdash backend/worker dials the -rw ClusterIP
    # of cnpg-lightdash, whose single endpoint is the CNPG primary pod. Keep the
    # lightdash callers off whichever node hosts the primary so the dial always
    # goes cross-node. Label-based (cnpg.io/instanceRole=primary), so it tracks
    # failovers automatically. The chart renders top-level affinity onto both
    # the backend and every worker Deployment. Drop once the Cilium socketLB
    # hostNamespaceOnly fix lands and its probes pass.
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
                - key: cnpg.io/cluster
                  operator: In
                  values:
                    - cnpg-lightdash
                - key: cnpg.io/instanceRole
                  operator: In
                  values:
                    - primary
            namespaces:
              - cnpg-system
            topologyKey: kubernetes.io/hostname
    configMap:
      # Public URL (links in emails/exported assets) + cookie/proxy hardening
      # for the HTTPS-terminating wildcard gateway.
      SITE_URL: "https://lightdash.biggs.dog"
      SECURE_COOKIES: "true"
      TRUST_PROXY: "true"
    # Headless browser (image previews, PDF export, Slack unfurls) is a second
    # container fleet that needs its own tuning + egress; off for the first
    # bring-up, flip to enabled once lightdash.biggs.dog is verified.
    browserless-chrome:
      enabled: false
    migrationJob:
      # Migrations run in a dedicated pre-install/pre-upgrade hook Job, not
      # in the backend's startup-probe budget. Lightdash's full migration set
      # against a fresh 0-table database exceeds the backend's ~185s startup
      # window, so the backend-as-migrator path (enabled: false) crash-looped
      # through Knex pool timeouts. The Job is the sole migrator; the backend
      # starts without migrating (image.command override in the chart), so the
      # install readiness gate (Deployment) is what the 10m install timeout
      # below waits on, not the migration itself.
      enabled: true
      # Same hairpin workaround as the backend/workers: the Job pod also dials
      # the -rw ClusterIP, so it must not land on the primary's node.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: cnpg.io/cluster
                    operator: In
                    values:
                      - cnpg-lightdash
                  - key: cnpg.io/instanceRole
                    operator: In
                    values:
                      - primary
              namespaces:
                - cnpg-system
              topologyKey: kubernetes.io/hostname
      # The hook Job runs inside the install action, which inherits this
      # timeout. A full cold first-run migration set can exceed the default
      # 5m; 10m is headroom (not a measurement) for the 0-table DB.
      backoffLimit: 10
