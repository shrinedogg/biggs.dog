---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app lightdash
  namespace: flux-system
spec:
  dependsOn:
    # ClusterSecretStore (onepassword-connect) must exist for the ExternalSecrets.
    - name: secretstore
    # CNPG Postgres (cnpg-lightdash) + the lightdash-user-password secret must be ready.
    - name: cnpg-databases
  # No targetNamespace: each manifest sets its own namespace. All resources
  # live in lightdash (chart-managed pods + the app ExternalSecrets).
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./clusters/cluster1/kubernetes/apps/lightdash/lightdash/app
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  interval: 3m
  retryInterval: 1m
  timeout: 5m
