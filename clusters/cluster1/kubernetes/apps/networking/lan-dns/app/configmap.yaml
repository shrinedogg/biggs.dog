---
# CoreDNS config for the LAN resolver. Two responsibilities:
#  1. biggs.dog -> forward to k8s-gateway (192.168.6.6), which is authoritative
#     and returns the internal split-horizon VIPs (.6.7 gateway apps, .6.15
#     internal gateway, etc.). k8s-gateway listens on 1053 behind the .6.6 VIP.
#  2. Everything else -> NextDNS over DoT (encrypted upstream), so no plaintext
#     DNS leaves the network. The NextDNS profile (5c51ae) is selected via the
#     TLS SNI; the 45.90.28.0 / 45.90.30.0 anycast IPs are NextDNS's endpoints.
# CoreDNS runs non-root and binds 1053; the Service maps 53 -> 1053.
apiVersion: v1
kind: ConfigMap
metadata:
  name: lan-dns
  namespace: networking
data:
  Corefile: |
    biggs.dog:1053 {
        errors
        cache 30
        # Forward to k8s-gateway's ClusterIP (NOT its .6.6 LB VIP): a pod reaching
        # a LoadBalancer VIP whose backend is on the SAME node hits a Cilium
        # hairpin failure, so the lan-dns replica co-located with k8s-gateway got
        # empty answers. The ClusterIP path works regardless of co-location.
        #
        # max_fails 0: the ClusterIP is the ONLY upstream, so the default
        # max_fails 2 ejection turns a momentary blip (a couple of dropped UDP
        # health probes against the single k8s-gateway backend) into a LAN-wide
        # SERVFAIL storm plus a `. IN NS` re-probe flood. Never ejecting keeps us
        # forwarding through transient hiccups; k8s-gateway now runs 2 backends
        # behind this ClusterIP, so Cilium load-balances away from a bad pod.
        forward . 10.105.74.41 {
            max_fails 0
        }
        reload
    }
    .:1053 {
        errors
        health {
            lameduck 5s
        }
        ready
        prometheus :9153
        cache 300
        forward . tls://45.90.28.0 tls://45.90.30.0 {
            tls_servername 5c51ae.dns.nextdns.io
            health_check 5s
        }
        loadbalance
        reload
    }
