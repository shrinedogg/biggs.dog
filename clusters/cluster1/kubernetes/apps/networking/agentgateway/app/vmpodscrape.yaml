---
# Scrape the internal agentgateway data plane directly for LLM token metrics.
# vmagent selectAllByDefault=true discovers this resource automatically.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: agentgateway-internal
  namespace: networking
spec:
  selector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: internal-biggs-dog
  namespaceSelector:
    matchNames:
      - networking
  podTargetLabels:
    - gateway.networking.k8s.io/gateway-name
  podMetricsEndpoints:
    - port: "15020"
      path: /metrics
      interval: 30s
