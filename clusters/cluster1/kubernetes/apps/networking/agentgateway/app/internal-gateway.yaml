---
# Internal, LAN-only ingress. Identical to wildcard-biggs-dog (same agentgateway
# class, same *.biggs.dog wildcard cert) EXCEPT its VIP (192.168.6.15) is NOT
# part of the UDM WAN port-forward (only the public gateway's .6.7:80/443 is
# forwarded), so this gateway is reachable from LAN/VPN only.
#
# Use it for services that must have TLS at <name>.biggs.dog but must NOT be
# exposed to the internet (e.g. the kagent MCP server). Route a host
# here by pointing its HTTPRoute parentRef at this Gateway instead of
# wildcard-biggs-dog; k8s-gateway then answers that hostname with .6.15 for LAN
# clients (split-horizon), while public DNS still points at Cloudflare -> the
# public gateway, which has no such route (404), so external access is denied.
#
# IMPORTANT: this LAN-only guarantee assumes the UDM forwards WAN :80/:443 only
# to 192.168.6.7. If a DMZ/range forward also covers .6.15, add source-IP
# filtering or narrow the port-forward.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: internal-biggs-dog
  namespace: networking
spec:
  addresses:
    - type: IPAddress
      value: 192.168.6.15
  gatewayClassName: agentgateway
  listeners:
    - hostname: "*.biggs.dog"
      name: internal-wildcard-http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
    - hostname: "*.biggs.dog"
      name: internal-wildcard-https
      port: 443
      protocol: HTTPS
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: biggs-dog-tls
    # In-cluster actor path (issue #661): hostname-less HTTP listeners for the
    # kagent substrate actors. The actors reach this gateway through the
    # substrate egress path (atenet-egress), which dials the destination
    # address directly and rewrites the Host header to the IP form, so a
    # hostname-matched listener/route would never match; the hostname-less
    # listeners pair with hostname-less catch-all HTTPRoutes (model-actors,
    # model-actors-glm) that accept any Host.
    #
    # Plain HTTP, no TLS: the substrate egress leg uses the system trust
    # store, and the in-cluster vLLM/embeddings ModelConfigs already run
    # plaintext http://. The Bearer token therefore travels in cleartext on
    # the pod network, consistent with the existing kagent-vllm key.
    #
    # Two ports (not two hostnames) because Gateway API forbids two listeners
    # on one port with overlapping hostnames and the existing listeners own
    # *.biggs.dog on 80/443.
    #
    # kgateway syncs the LoadBalancer Service's ports from these listeners
    # (port name listener-<name>; see the Service's ownerReference). 8443/8444
    # therefore also appear on the .6.15 VIP — no WAN exposure: the UDM does
    # not forward .6.15 at all (see the header note on the LAN-only guarantee).
    - name: model-actors-minimax
      port: 8443
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
    - name: model-actors-glm
      port: 8444
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
