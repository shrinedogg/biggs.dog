---
# Public HTTPS entry for cluster0's management plane. The existing wildcard
# Gateway terminates client TLS on cluster1, then re-encrypts to the cluster0
# Gateway. The cluster0 HTTPRoutes retain their existing hostname routing to
# Omni and Dex. BackendTLSPolicy supplies the SNI/CA validation needed for the
# second TLS hop; the backend address itself is only an IP.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: cluster0-omni
  namespace: networking
  labels:
    app.kubernetes.io/name: omni
    app.kubernetes.io/part-of: cluster0-edge
spec:
  static:
    host: 192.168.2.31
    port: 443
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: cluster0-omni
  namespace: networking
  labels:
    app.kubernetes.io/name: omni
    app.kubernetes.io/part-of: cluster0-edge
spec:
  targetRefs:
    - group: agentgateway.dev
      kind: AgentgatewayBackend
      name: cluster0-omni
  validation:
    hostname: omni.biggs.dog
    wellKnownCACertificates: System
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cluster0-omni
  namespace: networking
  labels:
    app.kubernetes.io/name: omni
    app.kubernetes.io/part-of: cluster0-edge
spec:
  hostnames:
    - omni.biggs.dog
  parentRefs:
    - name: wildcard-biggs-dog
      namespace: networking
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: cluster0-omni
---
# Dex is Omni's OIDC provider and must be reachable through the same public
# path for browser logins to complete while LAN DNS is unavailable.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: cluster0-dex
  namespace: networking
  labels:
    app.kubernetes.io/name: dex
    app.kubernetes.io/part-of: cluster0-edge
spec:
  static:
    host: 192.168.2.31
    port: 443
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: cluster0-dex
  namespace: networking
  labels:
    app.kubernetes.io/name: dex
    app.kubernetes.io/part-of: cluster0-edge
spec:
  targetRefs:
    - group: agentgateway.dev
      kind: AgentgatewayBackend
      name: cluster0-dex
  validation:
    hostname: dex.biggs.dog
    wellKnownCACertificates: System
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cluster0-dex
  namespace: networking
  labels:
    app.kubernetes.io/name: dex
    app.kubernetes.io/part-of: cluster0-edge
spec:
  hostnames:
    - dex.biggs.dog
  parentRefs:
    - name: wildcard-biggs-dog
      namespace: networking
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: cluster0-dex
