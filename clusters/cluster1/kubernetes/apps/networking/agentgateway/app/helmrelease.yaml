apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: agentgateway
  namespace: networking
spec:
  chartRef:
    kind: OCIRepository
    name: agentgateway
    namespace: flux-system
  interval: 3m
  values:
    controller:
      extraEnv:
        KGW_ENABLE_GATEWAY_API_EXPERIMENTAL_FEATURES: "true"
      # The controller is not hardened by default. We apply the user-agnostic
      # hardening (drop ALL capabilities, no privilege escalation, RuntimeDefault
      # seccomp). runAsNonRoot and readOnlyRootFilesystem are omitted because the
      # controller image's default user and rootfs write paths are not verified.
      podSecurityContext:
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault
    horizontalPodAutoscaler:
      minReplicas: 1
      maxReplicas: 5
      metrics:
        - type: Resource
          resource:
            name: cpu
            target:
              type: Utilization
              averageUtilization: 80
