apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8s-gateway
  namespace: networking
spec:
  interval: 3m
  chartRef:
    kind: OCIRepository
    name: k8s-gateway
    namespace: flux-system
  maxHistory: 3
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    # Run two replicas so the biggs.dog zone authority is not a single point of
    # failure. lan-dns AND the in-cluster Talos CoreDNS both forward biggs.dog to
    # this Service's ClusterIP (10.101.183.97); with one backend, any brief pod
    # blip dropped a couple of UDP probes, tripped CoreDNS forward's max_fails
    # ejection, and produced LAN-wide SERVFAIL storms until recovery. Two backends
    # behind the ClusterIP keep the upstream healthy through a single-pod hiccup.
    replicaCount: 2
    # Spread the replicas across nodes so losing one node can't take the zone down.
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: k8s-gateway
    # Chart 4.x defaults to 100m/128Mi CPU/memory; the live 3.x release has none.
    # Keep the no-limits behavior: CFS-throttling a LAN-wide DNS authority during
    # a query burst is exactly what the fallthrough design cannot afford.
    resources: {}
    # The server listens on container port 1053, so it can run fully non-root
    # with no added capabilities (NET_BIND_SERVICE is not required).
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault
    # nodeSelector:
    #   kubernetes.io/hostname: control-01
    # Service added so k8s-gateway creates DNS for annotated LoadBalancer services (e.g. turn.biggs.dog → Coturn)
    # Chart 4.x schema: the 3.x `domain` / `watchedResources` / `fallthrough` /
    # `ttl` / `dnsChallenge` / `extraZonePlugins` values are gone; the Corefile is
    # a list of server blocks. use_tcp keeps TCP DNS alongside UDP (the 3.x
    # service.useTcp: true). The 3.x dnsChallenge `_acme-challenge` CNAME shim is
    # dropped: cert-manager uses the Cloudflare DNS-01 solver (TXT written
    # straight into Cloudflare), so nothing on the issuance path consults it.
    servers:
      - zones:
          - zone: biggs.dog.
            use_tcp: true
        # Non-root UID 1000 cannot bind :53, so the listener stays on 1053.
        port: 1053
        # Publish the Service on 53 (the 3.x service.port) instead of the
        # listener port: lan-dns and the Talos-managed CoreDNS both forward
        # biggs.dog to port 53, and without this the Service would publish 1053
        # and break both.
        servicePort: 53
        plugins:
          - name: errors
          # Serves a /health endpoint on :8080, required for livenessProbe
          - name: health
            configBlock: |-
              lameduck 5s
          # Serves a /ready endpoint on :8181, required for readinessProbe
          - name: ready
          # 3.x rendered `apex k8s-gateway.networking` (the release FQDN) from
          # the chart's apex default; chart 4.x renders no apex, so the directive
          # must be explicit or the zone SOA/NS records fall back to the binary
          # default (dns1.kube-system).
          - name: k8s_gateway
            parameters: biggs.dog
            configBlock: |-
              apex k8s-gateway.networking
              ttl 60
              resources HTTPRoute Service
              fallthrough biggs.dog
          # cluster0 edge names. k8s_gateway only knows cluster1 routes, so
          # without this they fall through to public DNS, which returns the
          # Cloudflare proxy IP; Cloudflare's edge answers gRPC with a 403
          # challenge page and omnictl / the Omni-proxied kubeconfig break for
          # every LAN client whose resolver conditionally forwards biggs.dog
          # here. The hosts plugin runs before forward in CoreDNS plugin order.
          - name: hosts
            configBlock: |-
              192.168.2.31 omni.biggs.dog dex.biggs.dog netbird.biggs.dog factory.biggs.dog
              fallthrough
          # NextDNS resolvers ONLY -- NOT /etc/resolv.conf (see docs/NOTES.md):
          # the chart 4.x default forward is `forward . /etc/resolv.conf`, which
          # points at in-cluster kube-dns, which forwards biggs.dog BACK here;
          # with it, fallthrough loops and SERVFAILs. These are the homelab's
          # NextDNS IPs (filtering/logging); the k8s-gateway CNP allows egress
          # world:53 so they're reachable from the pod.
          - name: forward
            parameters: . 45.90.28.232 45.90.30.232
          - name: loop
          - name: reload
          - name: loadbalance
          # Serves a /metrics endpoint on :9153, required for scraping
          - name: prometheus
            parameters: 0.0.0.0:9153
    # The 3.x service.type moved to top level in chart 4.x.
    serviceType: LoadBalancer
    service:
      # Pinned to the live ClusterIP so it survives a Service recreate. lan-dns
      # and the Talos-managed kube-dns both forward biggs.dog to this address
      # (NOT the .6.6 LB VIP, which fails the same-node Cilium LB hairpin when a
      # resolver pod is co-located with the k8s-gateway pod). Was 10.105.74.41 on the pre-2026-09-07 cluster and 10.97.206.83 before that,
      # which never applied because ClusterIP is immutable once assigned.
      clusterIP: 10.101.183.97
      loadBalancerIP: 192.168.6.6
      externalTrafficPolicy: Cluster # Allow any node to forward traffic
      # Chart 4.x no longer hard-codes the scrape annotations.
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9153"
    serviceAccount:
      create: true
      name: ""
      annotations: {}
