apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8s-gateway
  namespace: networking
spec:
  interval: 3m
  chart:
    spec:
      chart: k8s-gateway
      version: 3.7.1
      sourceRef:
        kind: HelmRepository
        name: k8s-gateway
        namespace: flux-system
  maxHistory: 3
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    # Run two replicas so the biggs.dog zone authority is not a single point of
    # failure. lan-dns AND the in-cluster Talos CoreDNS both forward biggs.dog to
    # this Service's ClusterIP (10.105.74.41); with one backend, any brief pod
    # blip dropped a couple of UDP probes, tripped CoreDNS forward's max_fails
    # ejection, and produced LAN-wide SERVFAIL storms until recovery. Two backends
    # behind the ClusterIP keep the upstream healthy through a single-pod hiccup.
    replicaCount: 2
    # Spread the replicas across nodes so losing one node can't take the zone down.
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: k8s-gateway
    # CoreDNS listens on container port 1053 (the Service maps 53 -> 1053), so it
    # can run fully non-root with no added capabilities (NET_BIND_SERVICE is not
    # required). The chart already forces runAsUser 1000 while secure: true.
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault
    # nodeSelector:
    #   kubernetes.io/hostname: control-01
    # Service added so k8s-gateway creates DNS for annotated LoadBalancer services (e.g. turn.biggs.dog → Coturn)
    watchedResources: ["HTTPRoute", "Service"]
    domain: biggs.dog
    # Fall through to upstream (forward . /etc/resolv.conf -> public DNS) for
    # biggs.dog names NOT served by this k8s_gateway (i.e. not cluster1
    # HTTPRoute/Service resources). Without this, k8s_gateway is authoritative
    # for biggs.dog and returns NXDOMAIN for anything it doesn't know -- which
    # breaks resolution of services hosted on OTHER clusters (e.g. omni/netbird/
    # dex on cluster0) for LAN/VPN clients whose UDM conditionally forwards
    # *.biggs.dog here. With fallthrough, those resolve via public DNS instead
    # (e.g. omni.biggs.dog -> 87.58.147.51), while cluster1 services keep
    # resolving to their LAN IPs.
    fallthrough:
      enabled: true
      zones: [biggs.dog]
    dnsChallenge:
      enabled: true
      domain: dns01.clouddns.com
    ttl: 60
    service:
      type: LoadBalancer
      # Pinned to the live ClusterIP so it survives a Service recreate. lan-dns
      # and the Talos-managed kube-dns both forward biggs.dog to this address
      # (NOT the .6.6 LB VIP, which fails the same-node Cilium LB hairpin when a
      # resolver pod is co-located with the k8s-gateway pod). Was 10.97.206.83,
      # which never applied because ClusterIP is immutable once assigned.
      clusterIP: 10.105.74.41
      loadBalancerIP: 192.168.6.6
      port: 53
      externalTrafficPolicy: Cluster # Allow any node to forward traffic
      useTcp: true
    serviceAccount:
      create: true
      name: ""
      annotations: {}
