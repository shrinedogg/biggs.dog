---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: capt-remote
  namespace: tinkerbell
---
# Hardware requires cluster-wide access: CAPT lists Hardware across all
# namespaces before a target namespace is known.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: capt-remote-hardware
rules:
  - apiGroups: ["tinkerbell.org"]
    resources: ["hardware"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: capt-remote-hardware
subjects:
  - kind: ServiceAccount
    name: capt-remote
    namespace: tinkerbell
roleRef:
  kind: ClusterRole
  name: capt-remote-hardware
  apiGroup: rbac.authorization.k8s.io
---
# Templates/Workflows/Jobs are created in the Hardware's namespace (default).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: capt-remote
  namespace: default
rules:
  - apiGroups: ["tinkerbell.org"]
    resources: ["templates"]
    verbs: ["get", "create", "delete"]
  - apiGroups: ["tinkerbell.org"]
    resources: ["workflows"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["bmc.tinkerbell.org"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: capt-remote
  namespace: default
subjects:
  - kind: ServiceAccount
    name: capt-remote
    namespace: tinkerbell
roleRef:
  kind: Role
  name: capt-remote
  apiGroup: rbac.authorization.k8s.io
