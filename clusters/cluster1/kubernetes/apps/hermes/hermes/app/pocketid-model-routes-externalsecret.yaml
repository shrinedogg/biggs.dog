---
# Machine OIDC client credentials for the PocketID model-routes M2M client
# (client "model-routes" at id.biggs.dog). Materializes Secret
# "pocketid-model-routes" in namespace hermes (keys client-id / client-secret),
# consumed ONLY by the pocketid-model-jwt-refresher CronJob via secretKeyRef.
# Never added to Deployment/hermes envFrom (same blast-radius split as
# hermes-vault-token in issue #790).
#
# Ownership rule: this ExternalSecret owns ONLY the input client-credentials
# Secret (pocketid-model-routes). The output JWT Secret (pocketid-model-jwt) is
# owned exclusively by the refresher ServiceAccount so ESO's 1h refresh never
# clobbers freshly minted 24h tokens.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pocketid-model-routes
  namespace: hermes
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: pocketid-model-routes
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        client-id: "{{ .clientId }}"
        client-secret: "{{ .clientSecret }}"
  data:
    - secretKey: clientId
      remoteRef:
        key: pocketid-model-routes-client
        property: client-id
    - secretKey: clientSecret
      remoteRef:
        key: pocketid-model-routes-client
        property: client-secret
