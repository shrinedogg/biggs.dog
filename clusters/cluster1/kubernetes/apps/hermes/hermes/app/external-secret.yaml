# Materializes secret "hermes-gateway" (keys below), consumed via envFrom by
# the gateway container and via secretKeyRef by the initContainers.
#
# 1Password items (biggs-dog vault):
#   - hermes-gateway — created during this PR's cutover (human_gated, op CLI
#       not signed in on the Mac). Properties: the 32 .env key names below
#       (1:1 with the Mac ~/.hermes/.env key names; SUDO_PASSWORD excluded —
#       Mac-only), plus `oidc-client-id` and `vault-github-token`.
#   - hermes-memory-user-password (username, password) — OWNED BY SIBLING
#       #774 (same item the CNPG ClusterExternalSecret consumes). If it is
#       not there yet, this ESO stays out-of-sync and the pod boots without
#       the memory DSN (provider fails soft — acceptable per issue).
#   - vllm-api-key (apiKey) — existing; the same key the Infinity embeddings
#       service uses as INFINITY_API_KEY (kagent-vllm secret).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-gateway
  namespace: hermes
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: hermes-gateway
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Full DSN for the pgvector memory plugin; injected into
        # /opt/data/config.yaml by the patch-config initContainer.
        HERMES_MEMORY_PGVECTOR_DSN: >-
          postgres://{{ .memoryDbUser | urlquery }}:{{ .memoryDbPass | urlquery }}@cnpg-hermes-memory-rw.cnpg-system.svc.cluster.local:5432/hermesmemory?connect_timeout=5
  data:
    - secretKey: memoryDbUser
      remoteRef:
        key: hermes-memory-user-password
        property: username
    - secretKey: memoryDbPass
      remoteRef:
        key: hermes-memory-user-password
        property: password
    - secretKey: HERMES_DASHBOARD_OIDC_CLIENT_ID
      remoteRef:
        key: hermes-gateway
        property: oidc-client-id
    - secretKey: vault-github-token
      remoteRef:
        key: hermes-gateway
        property: vault-github-token
    - secretKey: EMBED_API_KEY
      remoteRef:
        key: vllm-api-key
        property: apiKey
    # 1:1 with the Mac ~/.hermes/.env key names (property = key name).
    - secretKey: ANTHROPIC_API_KEY
      remoteRef: { key: hermes-gateway, property: ANTHROPIC_API_KEY }
    - secretKey: BROWSERBASE_ADVANCED_STEALTH
      remoteRef: { key: hermes-gateway, property: BROWSERBASE_ADVANCED_STEALTH }
    - secretKey: BROWSERBASE_PROXIES
      remoteRef: { key: hermes-gateway, property: BROWSERBASE_PROXIES }
    - secretKey: BROWSER_INACTIVITY_TIMEOUT
      remoteRef: { key: hermes-gateway, property: BROWSER_INACTIVITY_TIMEOUT }
    - secretKey: BROWSER_SESSION_TIMEOUT
      remoteRef: { key: hermes-gateway, property: BROWSER_SESSION_TIMEOUT }
    - secretKey: EXA_API_KEY
      remoteRef: { key: hermes-gateway, property: EXA_API_KEY }
    - secretKey: GEMINI_API_KEY
      remoteRef: { key: hermes-gateway, property: GEMINI_API_KEY }
    - secretKey: GITHUB_TOKEN
      remoteRef: { key: hermes-gateway, property: GITHUB_TOKEN }
    - secretKey: GLM_API_KEY
      remoteRef: { key: hermes-gateway, property: GLM_API_KEY }
    - secretKey: GOOGLE_API_KEY
      remoteRef: { key: hermes-gateway, property: GOOGLE_API_KEY }
    - secretKey: HERMES_CUSTOM_BIGGS_DOG_API_KEY
      remoteRef: { key: hermes-gateway, property: HERMES_CUSTOM_BIGGS_DOG_API_KEY }
    - secretKey: HERMES_CUSTOM_MISTRAL_API_KEY
      remoteRef: { key: hermes-gateway, property: HERMES_CUSTOM_MISTRAL_API_KEY }
    - secretKey: IMAGE_TOOLS_DEBUG
      remoteRef: { key: hermes-gateway, property: IMAGE_TOOLS_DEBUG }
    - secretKey: KIMI_API_KEY
      remoteRef: { key: hermes-gateway, property: KIMI_API_KEY }
    - secretKey: MATRIX_ACCESS_TOKEN
      remoteRef: { key: hermes-gateway, property: MATRIX_ACCESS_TOKEN }
    - secretKey: MATRIX_ALLOWED_USERS
      remoteRef: { key: hermes-gateway, property: MATRIX_ALLOWED_USERS }
    - secretKey: MATRIX_DEVICE_ID
      remoteRef: { key: hermes-gateway, property: MATRIX_DEVICE_ID }
    - secretKey: MATRIX_HOMESERVER
      remoteRef: { key: hermes-gateway, property: MATRIX_HOMESERVER }
    - secretKey: MATRIX_HOME_ROOM
      remoteRef: { key: hermes-gateway, property: MATRIX_HOME_ROOM }
    - secretKey: MATRIX_HOME_ROOM_THREAD_ID
      remoteRef: { key: hermes-gateway, property: MATRIX_HOME_ROOM_THREAD_ID }
    - secretKey: MATRIX_PASSWORD
      remoteRef: { key: hermes-gateway, property: MATRIX_PASSWORD }
    - secretKey: MATRIX_USER_ID
      remoteRef: { key: hermes-gateway, property: MATRIX_USER_ID }
    - secretKey: MOA_TOOLS_DEBUG
      remoteRef: { key: hermes-gateway, property: MOA_TOOLS_DEBUG }
    - secretKey: OPENAI_API_KEY
      remoteRef: { key: hermes-gateway, property: OPENAI_API_KEY }
    - secretKey: SLACK_ALLOWED_USERS
      remoteRef: { key: hermes-gateway, property: SLACK_ALLOWED_USERS }
    - secretKey: SLACK_APP_TOKEN
      remoteRef: { key: hermes-gateway, property: SLACK_APP_TOKEN }
    - secretKey: SLACK_BOT_TOKEN
      remoteRef: { key: hermes-gateway, property: SLACK_BOT_TOKEN }
    - secretKey: TERMINAL_LIFETIME_SECONDS
      remoteRef: { key: hermes-gateway, property: TERMINAL_LIFETIME_SECONDS }
    - secretKey: TERMINAL_MODAL_IMAGE
      remoteRef: { key: hermes-gateway, property: TERMINAL_MODAL_IMAGE }
    - secretKey: TERMINAL_TIMEOUT
      remoteRef: { key: hermes-gateway, property: TERMINAL_TIMEOUT }
    - secretKey: VISION_TOOLS_DEBUG
      remoteRef: { key: hermes-gateway, property: VISION_TOOLS_DEBUG }
    - secretKey: WEB_TOOLS_DEBUG
      remoteRef: { key: hermes-gateway, property: WEB_TOOLS_DEBUG }
