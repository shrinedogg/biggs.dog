# Pattern: auth/pocket-id/app/route.yaml. wildcard-biggs-dog Gateway
# (networking ns) allows *.biggs.dog from all namespaces, LE cert
# biggs-dog-tls, VIP 192.168.6.7 (LAN MetalLB pool).
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hermes
  namespace: hermes
spec:
  hostnames:
    - hermes.biggs.dog
  parentRefs:
    - name: wildcard-biggs-dog
      namespace: networking
  rules:
    - backendRefs:
        - name: hermes
          port: 9119
      matches:
        - path:
            type: PathPrefix
            value: /
