# Single RWO RBD volume = the migrated ~/.hermes ($HERMES_HOME=/opt/data).
# 30Gi for the ~2.9GiB migrated durable subset + headroom (logs, uploads,
# future state). Block device (rook RBD) => SQLite WAL-safe.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes-data
  namespace: hermes
  # Flux prune protection: this Kustomization keeps prune: true (issue
  # #773); ceph-block reclaimPolicy is Delete, so a pruned PVC would delete
  # the RBD and the migrated state. Pattern:
  # clusters/cluster1/kubernetes/apps/renovate/namespace.yaml.
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ceph-block
  resources:
    requests:
      storage: 30Gi
