# Materializes secret "hermes-vault-token" (single key: vault-github-token),
# consumed ONLY by the vault-clone init container via secretKeyRef (issue
# #790). The long-lived read-only GitHub PAT for the private Obsidian vault
# repo must not ride the gateway container's envFrom surface
# (hermes-gateway secret); this init-only split removes it from the gateway
# process env (Kritika P2 on PR #789).
#
# 1Password item (biggs-dog vault):
#   - hermes-gateway — property `vault-github-token`. Same item/property the
#     hermes-gateway ExternalSecret used before the split; the item itself
#     is unchanged.
#
# deletionPolicy Retain: if the provider property disappears (1Password
# item hermes-gateway, property vault-github-token), keep the last
# materialized secret so the init-critical vault clone still boots (the
# ESO reports SecretSyncedError until the property returns). It does NOT
# keep the secret through deletion of the ExternalSecret itself:
# creationPolicy Owner sets an ownerReference, so the Secret is
# garbage-collected with the ExternalSecret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-vault-token
  namespace: hermes
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: hermes-vault-token
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: vault-github-token
      remoteRef:
        key: hermes-gateway
        property: vault-github-token
