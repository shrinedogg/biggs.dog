# Hermes gateway (issue #773). The image's entrypoint-dispatch.sh runs the
# s6 supervision tree that supervises `gateway run` + the dashboard
# (HERMES_DASHBOARD=1) — NO command override; overriding it breaks s6.
# HERMES_HOME=/opt/data is baked into the image.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes
  namespace: hermes
  labels:
    app.kubernetes.io/name: hermes
spec:
  replicas: 1
  # RWO PVC: never let two pods attach during a rollout.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes
    spec:
      hostUsers: false
      automountServiceAccountToken: false
      initContainers:
        # 1) Vault: clone/pull the private Obsidian vault repo into
        #    $HERMES_HOME/vaults/Shrinedoggs using a dedicated read-only
        #    GitHub PAT (1Password item hermes-gateway, prop
        #    vault-github-token) from the init-only hermes-vault-token
        #    secret (issue #790: the PAT is NOT in the gateway container's
        #    envFrom surface).
        #    Token is stripped from the stored remote URL afterwards.
        - name: vault-clone
          image: docker.io/alpine/git:v2.54.0
          command:
            - /bin/sh
            - -c
            - |
              set -e
              DEST=/opt/data/vaults/Shrinedoggs
              if [ -d "$DEST/.git" ]; then
                git -C "$DEST" fetch "https://x-access-token:${GITHUB_VAULT_TOKEN}@github.com/shrinedogg/Shrinedoggs.git"
                git -C "$DEST" reset --hard FETCH_HEAD
              else
                mkdir -p "$(dirname "$DEST")"
                git clone "https://x-access-token:${GITHUB_VAULT_TOKEN}@github.com/shrinedogg/Shrinedoggs.git" "$DEST"
                git -C "$DEST" remote set-url origin "https://github.com/shrinedogg/Shrinedoggs.git"
              fi
          env:
            - name: GITHUB_VAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-vault-token
                  key: vault-github-token
          volumeMounts:
            - name: data
              mountPath: /opt/data
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              # DAC_OVERRIDE: the gateway's s6 stage2 chowns /opt/data (PVC
              # root) to the hermes user on first boot (non-recursive
              # top-level chown; `vaults` is not in the recursive chown
              # list), so a cap-less root init cannot create
              # /opt/data/vaults on any pod start after the first gateway
              # boot: `mkdir: can't create directory '/opt/data/vaults':
              # Permission denied`. Init-only, seconds-lived container;
              # same accepted tradeoff as the gateway container (see its
              # NOTE below).
              drop: ["ALL"]
              add: ["DAC_OVERRIDE"]
            seccompProfile:
              type: RuntimeDefault
      containers:
        - name: gateway
          # Custom build from github.com/shrinedogg/hermes-agent branch
          # build/dockerhub-catalog-harness2 @ e7f73467 (catalog-harness2
          # tree = upstream main 2026-11-08, i.e. v0.23.0 + 1 commit):
          # 0.23.0-generation core + the harness2 plugin catalog entry
          # (plugin-catalog/harness2.yaml) + harness2 vendored
          # (plugins-vendor/harness2 @ shrinedogg/harness2-hermes 51acf02,
          # the catalog pin) which the image seeds into $HERMES_HOME/plugins
          # on first boot (never overwriting an existing install).
          # Digest pin to be added once the first GH build publishes
          # (watchdog: hermes-0.23-cutover-watchdog).
          image: docker.io/shrinedogg/hermes-agent:catalog-harness2-e7f73467
          env:
            # Dashboard on, bound 0.0.0.0 by image default; public URL pinned
            # so the OIDC redirect URI = https://hermes.biggs.dog/auth/callback.
            - name: HERMES_DASHBOARD
              value: "1"
            - name: HERMES_DASHBOARD_PUBLIC_URL
              value: "https://hermes.biggs.dog"
            # PocketID (live discovery verified 2026-11-06). Confidential
            # client: id + secret come from the secret (envFrom); the
            # self-hosted OIDC provider layers the secret on top of PKCE
            # (v2026.9.24 supports public and confidential clients).
            - name: HERMES_DASHBOARD_OIDC_ISSUER
              value: "https://id.biggs.dog"
            # Obsidian skill resolved vault path (issue #773).
            - name: OBSIDIAN_VAULT_PATH
              value: "/opt/data/vaults/Shrinedoggs"
          envFrom:
            - secretRef:
                name: hermes-gateway
          ports:
            - name: http-dashboard
              containerPort: 9119
              protocol: TCP
          # tcpSocket probes: every /api/ route is session-token gated, so an
          # HTTP probe would fight the auth gate; s6 restarts the gateway if
          # the process dies, liveness only catches a wedged listener.
          readinessProbe:
            tcpSocket:
              port: http-dashboard
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http-dashboard
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["SETUID", "SETGID", "CHOWN", "DAC_OVERRIDE"]
            seccompProfile:
              type: RuntimeDefault
          # NOTE: image boots as root and drops privileges in the entrypoint
          # (s6 + setuid), so runAsNonRoot is NOT set (would break boot).
          # Boot contract for the pinned image (hermes-agent v2026.9.24;
          # all caps PSA-baseline-legal, verified vs k8s v1.36.0):
          #   SETUID/SETGID - s6 entrypoint drops root -> hermes (setuidgid)
          #   CHOWN         - stage2 hands /opt/data (PVC) to hermes and the
          #                   supervise-perms hook grants hermes access to
          #                   the supervise/ trees s6 creates root-owned
          #                   under /run
          #   DAC_OVERRIDE  - root s6-supervise/s6-svlisten operate the
          #                   hermes-owned trees and PVC state
          # Tradeoff: container root can bypass file perms on mounted
          # volumes (can read hermes-owned 0600 runtime state). Accepted
          # 2026-11-07 for this single-user LAN cluster. The container env
          # carries the hermes-gateway secret set, which no longer includes
          # the long-lived vault-github-token PAT; the PAT lives in the
          # init-only hermes-vault-token secret consumed solely by the
          # vault-clone init container (split per issue #790). Root still
          # acts on hermes-owned files at boot (stage2 chmod 600 on
          # .env/auth.json), so DAC_OVERRIDE cannot be dropped
          # independently of CHOWN. Upstream ask: non-privileged boot
          # without these caps.
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: tmp
              mountPath: /tmp
            - name: run
              mountPath: /run
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hermes-data
        - name: tmp
          emptyDir: {}
        - name: run
          emptyDir: {}
