# Hermes gateway (issue #773). The image's entrypoint-dispatch.sh runs the
# s6 supervision tree that supervises `gateway run` + the dashboard
# (HERMES_DASHBOARD=1) — NO command override; overriding it breaks s6.
# HERMES_HOME=/opt/data is baked into the image.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes
  namespace: hermes
  labels:
    app.kubernetes.io/name: hermes
spec:
  replicas: 1
  # RWO PVC: never let two pods attach during a rollout.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes
    spec:
      hostUsers: false
      initContainers:
        # 1) Vault: clone/pull the private Obsidian vault repo into
        #    $HERMES_HOME/vaults/Shrinedoggs using a dedicated read-only
        #    GitHub PAT (1Password item hermes-gateway, prop vault-github-token).
        #    Token is stripped from the stored remote URL afterwards.
        - name: vault-clone
          image: docker.io/library/alpine/git:v2.54.0
          command:
            - /bin/sh
            - -c
            - |
              set -e
              DEST=/opt/data/vaults/Shrinedoggs
              if [ -d "$DEST/.git" ]; then
                git -C "$DEST" pull --ff-only
              else
                mkdir -p "$(dirname "$DEST")"
                git clone "https://x-access-token:${GITH...git" "$DEST"
                git -C "$DEST" remote set-url origin "https://github.com/shrinedogg/Shrinedoggs.git"
              fi
          env:
            - name: GITHUB_VAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-gateway
                  key: vault-github-token
          volumeMounts:
            - name: data
              mountPath: /opt/data
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
        # 2) Config patch: inject the pgvector memory provider block into
        #    /opt/data/config.yaml from the ESO-materialized DSN env var, on
        #    every boot (idempotent; the DSN never lands in the PVC file).
        #    If the DSN env is empty (1Password item hermes-memory-user-password
        #    not yet created by sibling #774) the block is still written with
        #    an empty dsn -> plugin fails soft (documented, AC6).
        - name: patch-config
          image: docker.io/nousresearch/hermes-agent:v2026.9.24
          command:
            - python3
            - -c
            - |
              import os, pathlib
              import yaml
              p = pathlib.Path("/opt/data/config.yaml")
              cfg = yaml.safe_load(p.read_text()) or {} if p.exists() else {}
              dsn = os.environ.get("HERMES_MEMORY_PGVECTOR_DSN", "").strip()
              mem = cfg.setdefault("memory", {})
              mem["provider"] = "pgvector"
              pl = cfg.setdefault("plugins", {}).setdefault("pgvector", {})
              if dsn:
                  pl["dsn"] = dsn
              pl.setdefault("embed_url", "http://embeddings.ai-system.svc.cluster.local:7997")
              pl.setdefault("embed_model", "bge-m3")
              pl.setdefault("embed_dim", 1024)
              pl.setdefault("embed_protocol", "auto")
              pl.setdefault("embed_api_key_env", "EMBED_API_KEY")
              if p.parent.exists():
                  p.write_text(yaml.safe_dump(cfg, sort_keys=False))
          env:
            - name: HERMES_MEMORY_PGVECTOR_DSN
              valueFrom:
                secretKeyRef:
                  name: hermes-gateway
                  key: HERMES_MEMORY_PGVECTOR_DSN
          volumeMounts:
            - name: data
              mountPath: /opt/data
      containers:
        - name: gateway
          image: docker.io/nousresearch/hermes-agent:v2026.9.24
          # amd64 manifest digest (verified via crane, 2026-11-06):
          # sha256:2fd023efbb8d3d2b0ce1a73d028b07370cff34f567cfe0e999553e8c327ea283
          env:
            # Dashboard on, bound 0.0.0.0 by image default; public URL pinned
            # so the OIDC redirect URI = https://hermes.biggs.dog/auth/callback.
            - name: HERMES_DASHBOARD
              value: "1"
            - name: HERMES_DASHBOARD_PUBLIC_URL
              value: "https://hermes.biggs.dog"
            # PocketID (live discovery verified 2026-11-06). Public PKCE
            # client; client id comes from the secret (envFrom), no secret key.
            - name: HERMES_DASHBOARD_OIDC_ISSUER
              value: "https://id.biggs.dog"
            # Obsidian skill resolved vault path (issue #773).
            - name: OBSIDIAN_VAULT_PATH
              value: "/opt/data/vaults/Shrinedoggs"
          envFrom:
            - secretRef:
                name: hermes-gateway
          ports:
            - name: http-dashboard
              containerPort: 9119
              protocol: TCP
          # tcpSocket probes: every /api/ route is session-token gated, so an
          # HTTP probe would fight the auth gate; s6 restarts the gateway if
          # the process dies, liveness only catches a wedged listener.
          readinessProbe:
            tcpSocket:
              port: http-dashboard
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http-dashboard
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          # NOTE: image starts as root and drops privileges in the entrypoint
          # (s6 + setuid), so runAsNonRoot is NOT set (would break boot).
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: tmp
              mountPath: /tmp
            - name: run
              mountPath: /run
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hermes-data
        - name: tmp
          emptyDir: {}
        - name: run
          emptyDir: {}
