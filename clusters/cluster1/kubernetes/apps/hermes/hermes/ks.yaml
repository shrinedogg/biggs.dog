---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app hermes
  namespace: flux-system
spec:
  dependsOn:
    # ClusterSecretStore (onepassword-connect) must exist for the ExternalSecret.
    # cnpg-databases is NOT a dependency: the pgvector memory cluster
    # (cnpg-hermes-memory) lands via sibling #774 and the gateway tolerates
    # its absence (memory provider reports connection failure, fail-soft).
    - name: secretstore
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./clusters/cluster1/kubernetes/apps/hermes/hermes/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  interval: 3m
  retryInterval: 1m
  timeout: 5m
