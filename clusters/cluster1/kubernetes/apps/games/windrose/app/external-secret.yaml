---
# Renders the full ServerDescription.json (the windroseserver/windroseserver
# image's sole configuration source) with the server password injected from
# 1Password. The non-secret fields (server name, region, invite code, direct-
# connection settings, ...) are versioned here in the template, so desired
# state still lives in Git; only the password value is sourced from the secret
# store. The rendered Secret is mounted read-only into the pod as the
# ServerDescription.json the server reads on startup.
#
# The official image is NOT configured via env vars (unlike the pfeiffermax
# wrapper the HelmRelease used before); per the dedicated server guide
# (https://playwindrose.com/dedicated-server-guide/) it reads this JSON file,
# so the HelmRelease values are carried over as JSON fields here.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: windrose-secret
  namespace: games
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    creationPolicy: Owner
    template:
      data:
        ServerDescription.json: |
          {
            "Version": 1,
            "DeploymentId": "0.10.0.7.33-372c3516",
            "ServerDescription_Persistent": {
              "PersistentServerId": "1EDB437B925C493C86998DADB3D5CA90",
              "InviteCode": "1769AD",
              "IsPasswordProtected": true,
              "Password": "{{ .password }}",
              "ServerName": "The_Bridge",
              "WorldIslandId": "1EDB437B925C493C86998DADB3D5CA90",
              "MaxPlayerCount": 4,
              "UserSelectedRegion": "EU",
              "P2pProxyAddress": "127.0.0.1",
              "UseDirectConnection": true,
              "DirectConnectionServerAddress": "",
              "DirectConnectionServerPort": 28050,
              "DirectConnectionProxyAddress": "0.0.0.0",
              "AutoLoadLatestBackupIfHasBroken": true,
              "CanLaunchMultipleServerInstances": false
            }
          }
  data:
    - secretKey: password
      remoteRef:
        key: windrose-password
        property: "password"
