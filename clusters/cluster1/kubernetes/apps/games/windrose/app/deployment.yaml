---
# Windrose dedicated server (official windroseserver/windroseserver image).
#
# Replaces the windrose HelmRelease. The chart wrapped the
# pfeiffermax/windrose-dedicated-server image, which generated
# ServerDescription.json at runtime from env-style config files; the official
# image instead reads a mounted ServerDescription.json directly (see
# https://playwindrose.com/dedicated-server-guide/).
#
# IMPORTANT: the official image does NOT treat ServerDescription.json as
# immutable. On first boot it generates a world, then writes the resolved
# WorldIslandId / PersistentServerId back into ServerDescription.json. Mounting
# the file read-only (e.g. directly from a Secret) crashes the server with
# "Cannot save ServerDescription file ... Permission denied" during coop init.
# So the rendered config (windrose-secret ExternalSecret) is staged into a
# writable emptyDir by the init container, and the main container reads/writes
# it from there. Non-secret fields stay in Git (ExternalSecret template); only
# the password comes from 1Password.
#
# Single replica with a dedicated PVC: game-server saves are stateful, so
# replicas is pinned at 1 (strategy Recreate to avoid two pods contending for
# the RWO save volume during rollouts).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: windrose
  namespace: games
  labels:
    app.kubernetes.io/name: windrose
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: windrose
  template:
    metadata:
      labels:
        app.kubernetes.io/name: windrose
    spec:
      # The UE server flushes its RocksDB island stores on graceful exit; give
      # the preStop hook time to signal the server and let it finish writing
      # before the kubelet escalates to SIGKILL.
      terminationGracePeriodSeconds: 120
      securityContext:
        # windroseserver/windroseserver runs as ue_user (uid/gid 1000,
        # confirmed from the image: useradd --uid 1000 ue_user). Match it so
        # the saves PVC (chowned to fsGroup) and the staged config are writable.
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Stage ServerDescription.json into the writable config volume. The
        # server mutates this file on first boot (writing back the world id it
        # generates), so it cannot live on the read-only Secret. Reusing the
        # server image avoids pulling a second image and guarantees the file is
        # owned by uid 1000 (same as the main container).
        #
        # Self-heal step: the server mints a NEW world island whenever the
        # configured WorldIslandId has no store on the saves PVC (observed
        # 2026-09: an unclean shutdown leaves stores flagged "Save is not
        # checked", the island scan reports Worlds count: 0, and a fresh
        # island replaces the old world from the players' perspective). Old
        # stores are never deleted, so when the configured id is missing but
        # other stores exist, adopt the most recently written one instead of
        # letting the server fork an empty world. Normal path (configured id
        # present on the PVC, or an empty/fresh PVC) is unchanged.
        - name: stage-config
          image: docker.io/windroseserver/windroseserver:0.10.0.9.32-22d39a16@sha256:2ccfe3319d0b4f9637ba08dbefb44f8c64c97309ba1b5e4c152e418ef63755d7
          command:
            - /bin/bash
            - -c
            - |
              set -eu
              cp /secret-rendered/ServerDescription.json /config/ServerDescription.json
              CFG_ID=$(grep -oE '"WorldIslandId":[[:space:]]*"[^"]*"' /config/ServerDescription.json | cut -d'"' -f4)
              WORLDS=/saved-worlds/SaveProfiles/Default/RocksDB_v2/0.10.0/Worlds
              if [ -n "$CFG_ID" ] && [ ! -d "$WORLDS/$CFG_ID" ]; then
                NEWEST=$(ls -1t "$WORLDS" 2>/dev/null | head -1 || true)
                if [ -n "$NEWEST" ]; then
                  echo "stage-config: WorldIslandId $CFG_ID has no store on the PVC; adopting $NEWEST"
                  sed -i -E "s/\"WorldIslandId\":[[:space:]]*\"[^\"]*\"/\"WorldIslandId\": \"$NEWEST\"/" /config/ServerDescription.json
                fi
              fi
          volumeMounts:
            - name: secret-rendered
              mountPath: /secret-rendered
              readOnly: true
            - name: config
              mountPath: /config
            - name: saved
              mountPath: /saved-worlds
              readOnly: true
      containers:
        - name: windrose
          # Pin by digest so Renovate can track and bump it. The tag is kept so
          # Renovate has a version to propose updates against.
          image: docker.io/windroseserver/windroseserver:0.10.0.9.32-22d39a16@sha256:2ccfe3319d0b4f9637ba08dbefb44f8c64c97309ba1b5e4c152e418ef63755d7
          imagePullPolicy: IfNotPresent
          ports:
            # Direct-connection game port (DirectConnectionServerPort in
            # ServerDescription.json). The server binds both TCP and UDP.
            - name: game-tcp
              containerPort: 28050
              protocol: TCP
            - name: game-udp
              containerPort: 28050
              protocol: UDP
          # The UE dedicated server is slow to boot and exposes no HTTP health
          # endpoint; use a TCP socket probe against the game port. Mirrors the
          # chart's generous startup window (periodSeconds * failureThreshold).
          lifecycle:
            # PID 1 is `bash -c ./WindroseServer.sh`, which does NOT forward
            # the kubelet's SIGTERM to the server process: a plain pod delete
            # escalates to SIGKILL after the grace period and leaves the
            # island stores dirty ("Save is not checked. Inconsistent version"
            # at next boot, which previously forked the world). Signal the
            # server binary directly and wait for it to flush and exit. If it
            # has not exited after ~105s the hook ends and the kubelet's
            # normal TERM/KILL sequence proceeds against the grace period.
            preStop:
              exec:
                command:
                  - /bin/bash
                  - -c
                  - |
                    PID=$(pgrep -f WindroseServer-Linux-Shipping | head -1 || true)
                    if [ -n "$PID" ]; then
                      kill -TERM "$PID" 2>/dev/null || true
                      for i in $(seq 1 105); do
                        kill -0 "$PID" 2>/dev/null || exit 0
                        sleep 1
                      done
                    fi
                    exit 0
          startupProbe:
            tcpSocket:
              port: 28050
            periodSeconds: 10
            failureThreshold: 100
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: 28050
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              # 4-player dedicated server needs ~12 GiB per the official guide;
              # bumped to 20 Gi for a 6-player cap. No CPU limit (repo policy:
              # avoid CFS throttling on bursty game workloads).
              memory: 20Gi
            limits:
              memory: 20Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            # Server config — writable copy staged by the init container. The
            # server reads this on startup and writes back resolved ids.
            - name: config
              mountPath: /home/ue_user/app/R5/ServerDescription.json
              subPath: ServerDescription.json
            # World / save state, persisted across restarts.
            - name: saved
              mountPath: /home/ue_user/app/R5/Saved
      volumes:
        # Rendered ServerDescription.json (with password injected) — read-only
        # source for the init container's staging copy.
        - name: secret-rendered
          secret:
            secretName: windrose-secret
        # Writable scratch holding the working ServerDescription.json.
        - name: config
          emptyDir: {}
        - name: saved
          persistentVolumeClaim:
            claimName: windrose-saved
