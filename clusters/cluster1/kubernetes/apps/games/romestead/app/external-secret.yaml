---
# Server password from 1Password (item romestead-password, field "password",
# biggs-dog vault). Injected as the PASSWORD env var; the entrypoint renders
# it into /home/steam/server-files/config.json on every boot.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: romestead-secret
  namespace: games
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    creationPolicy: Owner
  data:
    - secretKey: PASSWORD
      remoteRef:
        key: romestead-password
        property: "password"
