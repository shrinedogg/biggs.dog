apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jitsi-coturn-auth
  namespace: jitsi
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    creationPolicy: Owner
  data:
    - secretKey: TURN_CREDENTIALS
      remoteRef:
        key: jitsi-coturn-auth
        property: secret
