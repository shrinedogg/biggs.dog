---
# Expose JVB Prometheus metrics port for VMServiceScrape.
# JVB serves /metrics on port 8080 internally but the chart doesn't expose
# it as a Kubernetes port. Create a headless Service targeting port 8080.
apiVersion: v1
kind: Service
metadata:
  name: jvb-metrics
  namespace: jitsi
  labels:
    app.kubernetes.io/component: jvb-metrics
spec:
  clusterIP: None
  ports:
    - name: metrics
      port: 8080
      targetPort: 8080
      protocol: TCP
  selector:
    app.kubernetes.io/component: jvb
