---
# zot.biggs.dog on the wildcard-biggs-dog gateway: TLS terminates there with
# the existing *.biggs.dog certificate; registry API under PathPrefix /.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zot
  namespace: zot
  labels:
    app.kubernetes.io/name: zot
spec:
  hostnames:
    - zot.biggs.dog
  parentRefs:
    - name: wildcard-biggs-dog
      namespace: networking
    # Temporary canary attachment for the agentgateway 1.x cutover
    # (issues #745/#748): the route is ALSO served by the 1.7.0 canary
    # gateway while both listen on zot.biggs.dog. Production traffic keeps
    # hitting wildcard-biggs-dog; the canary attachment is removed in the
    # cutover commit.
    - name: agentgateway-canary
      namespace: networking
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: zot
          port: 8080
