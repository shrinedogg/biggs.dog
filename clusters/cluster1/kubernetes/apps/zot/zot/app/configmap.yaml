apiVersion: v1
kind: ConfigMap
metadata:
  name: zot-config
  namespace: zot
  labels:
    app.kubernetes.io/name: zot
data:
  config.json: |
    {
      "distSpecVersion": "1.0.1",
      "storage": {
        "rootDirectory": "/data",
        "dedupe": true,
        "gc": true
      },
      "http": {
        "address": "0.0.0.0",
        "port": "8080"
      },
      "log": {
        "level": "info"
      },
      "extensions": {
        "sync": {
          "enable": true,
          "registries": [
            {
              "urls": ["https://ghcr.io"],
              "content": [
                {
                  "destination": "/ghcr",
                  "prefix": "**"
                }
              ],
              "onDemand": true,
              "tlsVerify": true,
              "maxRetries": 3,
              "retryDelay": "1m"
            }
          ]
        }
      }
    }
