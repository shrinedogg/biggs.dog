apiVersion: v1
kind: ConfigMap
metadata:
  name: zot-config
  namespace: zot
  labels:
    app.kubernetes.io/name: zot
data:
  # On-demand (pull-through) sync, transparent path: content is stored under
  # the SAME path as the upstream (destination ""), so clients pull the
  # upstream ref with only the registry host swapped:
  #   ghcr.io/siderolabs/bldr:v0.6.5  ->  zot.biggs.dog/siderolabs/bldr:v0.6.5
  # That is what makes the runner-side mirror configs (buildkitd
  # [registry."ghcr.io"] mirrors, dockerd registry-mirrors) transparent.
  #
  # Sources:
  #   ghcr.io - bldr syntax image, the pkgs build graph (tools, llvm, glibc,
  #             extensions-validator), the talos imager inputs.
  #   cgr.dev - chainguard/wolfi-base digest ref in the toolkit pkg.yaml.
  #   docker.io - buildkit builder image (moby/buildkit), crane, and the
  #               repo's own pushed images. dockerd registry-mirrors only
  #               applies to docker.io, so this is what the runner's
  #               /etc/docker daemon.json mirror actually caches.
  #
  # gcDelay: 24h. zot GC prunes a tag from the repo index when its child
  # manifests are not in storage yet (the normal state right after an
  # on-demand manifest sync, before layers are pulled) and deletes
  # orphaned blobs after gcDelay. 24h keeps evicted-but-recent blobs
  # around so a pruned tag re-syncs the manifest only (blobs stay local),
  # while the 30Gi PVC still reclaims genuinely abandoned content.
  #
  # http.compat docker2s2: part of the pkgs build graph (e.g.
  # siderolabs/stagex/* stage images) still ships legacy Docker media
  # types (manifest.list.v2). Without this, on-demand sync rejects them
  # and clients fall back to the origin on every build.
  config.json: |
    {
      "distSpecVersion": "1.0.1",
      "storage": {
        "rootDirectory": "/data",
        "dedupe": true,
        "gc": true,
        "gcDelay": "24h"
      },
      "http": {
        "address": "0.0.0.0",
        "port": "8080",
        "compat": ["docker2s2"]
      },
      "log": {
        "level": "info"
      },
      "extensions": {
        "sync": {
          "enable": true,
          "registries": [
            {
              "urls": ["https://ghcr.io"],
              "content": [
                {
                  "destination": "",
                  "prefix": "**"
                }
              ],
              "onDemand": true,
              "tlsVerify": true,
              "maxRetries": 3,
              "retryDelay": "1m"
            },
            {
              "urls": ["https://cgr.dev"],
              "content": [
                {
                  "destination": "",
                  "prefix": "**"
                }
              ],
              "onDemand": true,
              "tlsVerify": true,
              "maxRetries": 3,
              "retryDelay": "1m"
            },
            {
              "urls": ["https://registry-1.docker.io"],
              "content": [
                {
                  "destination": "",
                  "prefix": "**"
                }
              ],
              "onDemand": true,
              "tlsVerify": true,
              "maxRetries": 3,
              "retryDelay": "1m"
            }
          ]
        }
      }
    }
