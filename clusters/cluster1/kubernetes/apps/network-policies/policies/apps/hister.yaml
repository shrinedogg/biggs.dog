# Namespace: hister  (Hister personal search engine)
#
# hister: Go server on :4433 (HTTP only; TLS terminates at the
# internal-biggs-dog gateway), 2 stateless replicas: index + previews in
# the CNPG postgres (cnpg-hister, cnpg-system), /hister/data an emptyDir
# scratch. Dials three in-cluster destinations: the Infinity embeddings
# service (ai-system, :7997) for opt-in semantic search, the cnpg-hister
# Postgres (cnpg-system, :5432) for storage, and PocketID (auth, via the
# wildcard-biggs-dog gateway VIP) for OIDC sign-in discovery/token/userinfo.
# The kagent controller (ai-system) dials Hister's /mcp endpoint
# (RemoteMCPServer hister-mcp).
---
# NOTE: No standalone default-deny policy — Cilium rejects an empty deny-all
# (VALID: False, "rule must have at least one of Ingress/Egress"). Default-deny
# is implicit: the allow policies below all select endpointSelector: {} for
# ingress and/or egress, so any traffic not explicitly allowed is dropped.
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-egress-dns
  namespace: hister
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          # L7 DNS proxy — Cilium injects replies directly to the pod, avoiding
          # the conntrack reply-drop that breaks Go resolvers behind default-deny
          # ingress, and enables toFQDNs.
          rules:
            dns:
              - matchPattern: "*"
---
# Hister semantic search dials the Infinity embedding service (ClusterIP in
# ai-system, :7997). Forward direction: egress to the embeddings pods.
# (The return path is allowed by allow-ingress-from-embeddings below; the
# ingress grant on the ai-system side is in policies/infra/ai-system.yaml.)
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-egress-to-embeddings
  namespace: hister
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ai-system
            app.kubernetes.io/name: embeddings
      toPorts:
        - ports:
            - port: "7997"
              protocol: TCP
---
# hister serves at hister.biggs.dog via the internal-biggs-dog gateway
# (agentgateway data plane in networking).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-ingress-from-gateway
  namespace: hister
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: networking
            app.kubernetes.io/name: agentgateway
        # 1.x train data plane: gateway-class-name agentgateway-canary (canary
        # now; the production planes carry it after the #748 cutover).
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: networking
          matchExpressions:
            - key: gateway.networking.k8s.io/gateway-class-name
              operator: In
              values:
                - agentgateway
                - agentgateway-canary
      toPorts:
        - ports:
            - port: "4433"
              protocol: TCP
---
# kubelet health/readiness probes.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-ingress-from-host
  namespace: hister
spec:
  endpointSelector: {}
  ingress:
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "4433"
              protocol: TCP
---
# Return path for the embeddings dial. Like the flux-mcp and mindwtr-cloud
# precedents in policies/infra/ai-system.yaml, the embeddings ClusterIP
# reverse-NATs SYN,ACK, so the reply arrives at the hister pod attributed to
# the embeddings pod identity and would be dropped by the implicit
# default-deny here after the first round-trip. No toPorts: the reply lands
# on the client's ephemeral port (see allow-ingress-from-flux /
# allow-ingress-from-mindwtr-cloud, which are port-unrestricted).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-ingress-from-embeddings
  namespace: hister
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ai-system
            app.kubernetes.io/name: embeddings
---
# The kagent controller (ai-system) reconciles the hister-mcp
# RemoteMCPServer and dials Hister's MCP endpoint (initialize + tools/list,
# the Accepted gate) at http://hister.hister.svc.cluster.local:4433/mcp.
# Cross-namespace ClusterIP precedent (allow-ingress-from-kritika,
# allow-ingress-from-mindwtr-cloud in policies/infra/ai-system.yaml): the
# forward request into the hister pods is granted here, scoped to the kagent
# controller pods; the reverse-NAT'd reply lands at the kagent controller
# pods attributed to the hister pods and is allowed by
# allow-ingress-from-hister-mcp in policies/infra/ai-system.yaml.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-ingress-from-kagent
  namespace: hister
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ai-system
            app.kubernetes.io/name: kagent
            app.kubernetes.io/component: controller
      toPorts:
        - ports:
            - port: "4433"
              protocol: TCP
---
# Hister stores its index in the cnpg-hister Postgres cluster (cnpg-system,
# the cnpg-hister-rw Service, :5432). Forward direction: egress to the
# instance pods (they carry the cnpg.io/cluster label, matched here like
# the ai-system precedent).
# (The return path is allowed by allow-ingress-from-postgres below; the
# cnpg-system-side ingress grant is the hister entry in
# allow-ingress-from-apps in policies/infra/cnpg-system.yaml.)
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-egress-to-postgres
  namespace: hister
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cnpg-system
            cnpg.io/cluster: cnpg-hister
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
---
# Return path for the postgres dial. Like the CNPG precedent in
# policies/infra/ai-system.yaml, the cnpg-hister-rw Service VIP
# reverse-NATs SYN,ACK, so the reply arrives at the hister pods attributed
# to the cnpg pod identity and would be dropped by the implicit
# default-deny here after the first round-trip. No toPorts: the reply lands
# on the client's ephemeral port.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-ingress-from-postgres
  namespace: hister
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cnpg-system
            cnpg.io/cluster: cnpg-hister
---
# PocketID OIDC sign-in: hister's generic "oidc" OAuth provider dials the
# public IdP FQDN https://id.biggs.dog for discovery
# (/.well-known/openid-configuration) and the token + userinfo endpoints.
# In-cluster the FQDN resolves via split-horizon DNS to the
# wildcard-biggs-dog gateway VIP, which forwards to pocket-id (auth, :1411).
# The egress triad copies the proven selectors from allow-egress-oidc in
# policies/apps/auth.yaml (the oauth2-proxy PocketID dial); the direct-svc
# leg also covers a future in-cluster configuration_url.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-egress-oidc
  namespace: hister
spec:
  endpointSelector: {}
  egress:
    - toFQDNs:
        - matchName: id.biggs.dog
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: networking
            app.kubernetes.io/name: wildcard-biggs-dog
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: auth
            app: pocket-id
      toPorts:
        - ports:
            - port: "1411"
              protocol: TCP
---
# Return path for the OIDC dial: the wildcard-biggs-dog VIP reverse-NATs
# SYN,ACK, so replies arrive at the hister pods attributed to the gateway
# data-plane pod identity and would be dropped by the implicit default-deny
# here after the first round-trip. No toPorts: the reply lands on the
# hister pod's ephemeral port (same shape as allow-ingress-from-embeddings).
# Leg 1 is the legacy data plane (the app.kubernetes.io/name:
# wildcard-biggs-dog selector proven in policies/apps/auth.yaml egress);
# leg 2 is the 1.x train (gateway-class-name, mirrored from
# allow-ingress-from-gateway in policies/apps/auth.yaml).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-ingress-from-oidc-gateway
  namespace: hister
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: networking
            app.kubernetes.io/name: wildcard-biggs-dog
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: networking
          matchExpressions:
            - key: gateway.networking.k8s.io/gateway-class-name
              operator: In
              values:
                - agentgateway
                - agentgateway-canary
