# Namespace: hister  (Hister personal search engine)
#
# Hister: single-pod server on :4433 (HTTP only; TLS terminates at the
# internal-biggs-dog gateway), data on a ceph-block PVC. Semantic search
# dials the Infinity embeddings service (ai-system) on :7997.
#
# NOTE: No standalone default-deny policy — Cilium rejects an empty
# deny-all ("rule must have at least one of Ingress/Egress"). Default-deny
# is implicit: the allow policies below all select endpointSelector: {},
# so any traffic not explicitly allowed is dropped.
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-egress-dns
  namespace: hister
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          # L7 DNS proxy — Cilium injects replies directly to the pod, avoiding
          # the conntrack reply-drop that breaks Go resolvers behind default-deny
          # ingress, and enables toFQDNs.
          rules:
            dns:
              - matchPattern: "*"
---
# Hister semantic search -> Infinity embeddings (BAAI/bge-m3) in ai-system.
# The return path is granted by allow-ingress-from-hister in
# policies/infra/ai-system.yaml (cross-namespace ClusterIP reverse-NAT).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-egress-to-embeddings
  namespace: hister
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ai-system
            app.kubernetes.io/name: embeddings
      toPorts:
        - ports:
            - port: "7997"
              protocol: TCP
---
# Hister serves at hister.biggs.dog via the gateway.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-ingress-from-gateway
  namespace: hister
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: networking
            app.kubernetes.io/name: agentgateway
        # 1.x train data plane: gateway-class-name agentgateway-canary (canary
        # now; the production planes carry it after the #748 cutover).
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: networking
          matchExpressions:
            - key: gateway.networking.k8s.io/gateway-class-name
              operator: In
              values:
                - agentgateway
                - agentgateway-canary
      toPorts:
        - ports:
            - port: "4433"
              protocol: TCP
---
# kubelet health/readiness probes.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-ingress-from-host
  namespace: hister
spec:
  endpointSelector: {}
  ingress:
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "4433"
              protocol: TCP
