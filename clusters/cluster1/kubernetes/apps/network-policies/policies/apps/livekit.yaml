# Cilium network policies for livekit namespace (privileged, hostNetwork)
---
# Allow ingress from gateway
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-ingress-from-gateway
  namespace: livekit
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: networking
            app.kubernetes.io/name: agentgateway
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: networking
            gateway.networking.k8s.io/gateway-class-name: agentgateway
---
# Allow lk-jwt-service to reach LiveKit SFU on port 7880
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-livekit-ingress-from-lk-jwt
  namespace: livekit
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: livekit
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: lk-jwt-service
      toPorts:
        - ports:
            - port: "7880"
              protocol: TCP
---
# Allow egress for DNS
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-egress-dns
  namespace: livekit
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
