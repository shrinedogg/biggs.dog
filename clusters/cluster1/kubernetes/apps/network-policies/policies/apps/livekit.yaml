# Cilium network policies for livekit namespace (privileged, hostNetwork)
---
# Allow ingress from gateway
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-ingress-from-gateway
  namespace: livekit
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: networking
            app.kubernetes.io/name: agentgateway
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: networking
            gateway.networking.k8s.io/gateway-class-name: agentgateway
---
# Allow egress for DNS
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-egress-dns
  namespace: livekit
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          # L7 DNS proxy — Cilium injects replies directly to the pod, avoiding
          # the conntrack reply-drop that breaks Go resolvers behind default-deny
          # ingress (see auth.yaml), and enables toFQDNs.
          rules:
            dns:
              - matchPattern: "*"
---
# lk-jwt-service verifies OpenID tokens against the homeserver: it resolves the
# matrix:// server name via https://biggs.dog/.well-known/matrix/server
# (delegates to matrix.biggs.dog:443), then fetches
# /_matrix/federation/v1/openid/userinfo. Both names resolve to the gateway
# LoadBalancer IP (192.168.6.7). Without this egress the lookup hangs ~20s
# ("context canceled") and Element Call never gets a LiveKit JWT.
#
# Three complementary rules (belt and suspenders):
#  - toCIDR 192.168.6.7/32: the deterministic path. Both FQDNs resolve to this
#    stable VIP; allowing it directly removes any dependency on the FQDN DNS
#    proxy having learned the mapping (the per-agent FQDN cache GCs idle entries
#    aggressively — tofqdns-idle-connection-grace-period=0s — which made the
#    toFQDNs-only path flaky and caused "dial tcp: lookup ...: i/o timeout").
#  - toEndpoints wildcard-biggs-dog: the gateway dataplane pods, in case the
#    VIP hairpin from the pod network is unreachable and Cilium DNATs to a pod.
#  - toFQDNs: kept as a fallback if the VIP ever changes.
#
# The toCIDR + toEndpoints rules here also carry the lk-jwt -> LiveKit
# control channel: LIVEKIT_URL is wss://livekit.biggs.dog, which resolves
# in-cluster to the same VIP:443. See allow-egress-lk-jwt-to-livekit.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-egress-lk-jwt-to-matrix
  namespace: livekit
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: lk-jwt-service
  egress:
    - toCIDR:
        - 192.168.6.7/32
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: networking
            app.kubernetes.io/name: wildcard-biggs-dog
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toFQDNs:
        - matchName: biggs.dog
        - matchName: matrix.biggs.dog
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
# lk-jwt-service auto-creates LiveKit rooms for full-access users (biggs.dog)
# by dialing the LiveKit SFU control channel. LIVEKIT_URL is
# wss://livekit.biggs.dog — the SAME public URL handed to clients in the
# /get_token response (lk-jwt-service v0.5.0 uses one LIVEKIT_URL for both).
# In-cluster, k8s-gateway resolves livekit.biggs.dog to the
# wildcard-biggs-dog gateway VIP (192.168.6.7), so the room-create call
# hairpins through the gateway to livekit-service:7880. The deterministic
# :443 paths (toCIDR 192.168.6.7/32 + toEndpoints wildcard-biggs-dog) are
# already granted by allow-egress-lk-jwt-to-matrix; this policy adds the
# toFQDNs fallback for livekit.biggs.dog:443 and keeps the old direct path
# (ClusterIP -> hostNetwork remote-node:7880) so LIVEKIT_URL can be pointed
# back at the ClusterIP service without a policy change. (The dead
# allow-livekit-ingress-from-lk-jwt policy was removed: its app=livekit
# endpointSelector never matched the hostNetwork pod anyway.)
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-egress-lk-jwt-to-livekit
  namespace: livekit
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: lk-jwt-service
  egress:
    - toFQDNs:
        - matchName: livekit.biggs.dog
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toEntities:
        - remote-node
        - host
      toPorts:
        - ports:
            - port: "7880"
              protocol: TCP
