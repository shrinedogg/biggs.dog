# Namespace: renovate  (gateway-fronted, cnpg-renovate Postgres, GitHub via FQDN)
---
# NOTE: No standalone default-deny policy — Cilium rejects an empty deny-all
# (VALID: False, "rule must have at least one of Ingress/Egress"). Default-deny
# is implicit: the allow policies below all select endpointSelector: {} for
# ingress and/or egress, so any traffic not explicitly allowed is dropped.
---
# DNS MUST carry the L7 dns rule so Cilium's DNS proxy observes lookups and can
# populate the toFQDNs policy below. Without this, GitHub egress silently fails.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-egress-dns
  namespace: renovate
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-egress-kube-apiserver
  namespace: renovate
spec:
  endpointSelector: {}
  egress:
    - toEntities:
        - kube-apiserver
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-egress-to-postgres
  namespace: renovate
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cnpg-system
            cnpg.io/cluster: cnpg-renovate
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
---
# CNPG's -rw Service is a ClusterIP; with bpf-LB + default-deny ingress the
# Postgres reply arrives reverse-NAT'd from the VIP and misses egress conntrack,
# so it's dropped as new ingress. Allow the DB return path (see ai-system.yaml).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-ingress-from-postgres
  namespace: renovate
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cnpg-system
            cnpg.io/cluster: cnpg-renovate
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-egress-github
  namespace: renovate
spec:
  endpointSelector:
    matchLabels:
      app: renovate
  egress:
    - toFQDNs:
        - matchName: github.com
        - matchName: api.github.com
        - matchPattern: "*.githubusercontent.com"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
# Renovate resolves and updates dependencies from many package registries
# (npm, PyPI, container/Helm/Maven registries, release CDNs, etc.), not just
# GitHub, so it needs broad outbound HTTPS. Scoped to the renovate app only.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-egress-https
  namespace: renovate
spec:
  endpointSelector:
    matchLabels:
      app: renovate
  egress:
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "80"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-ingress-from-gateway
  namespace: renovate
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: networking
            app.kubernetes.io/name: agentgateway
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: networking
            gateway.networking.k8s.io/gateway-class-name: agentgateway
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-prometheus-scraping
  namespace: renovate
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
