# Namespace: games  (windrose)
# NOTE: if a game server is exposed directly via a LoadBalancer (not the HTTP
# gateway), add an explicit world-ingress rule for its UDP/TCP game ports.
---
# Windrose direct-connection game port (LB 192.168.6.11:28050, TCP+UDP).
# Clients are (a) Windrose running inside dreamcast session pods (pod-to-pod,
# e.g. joey/stacie steam sessions) and (b) LAN machines connecting to the
# Cilium LB-IPAM address (reserved:world entity). Without this rule the
# namespace default-deny drops their SYNs at the windrose pod (verified via
# Hubble: "Policy denied DROPPED (TCP Flags: SYN)" from dreamcast session
# pods). Scopes: only pods labeled app.kubernetes.io/name=windrose, only
# port 28050, TCP and UDP.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-ingress-windrose-game-port
  namespace: games
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: windrose
  ingress:
    - fromEntities:
        - world
      toPorts:
        - ports:
            - port: "28050"
              protocol: TCP
            - port: "28050"
              protocol: UDP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: dreamcast
      toPorts:
        - ports:
            - port: "28050"
              protocol: TCP
            - port: "28050"
              protocol: UDP
---
# NOTE: No standalone default-deny policy — Cilium rejects an empty deny-all
# (VALID: False, "rule must have at least one of Ingress/Egress"). Default-deny
# is implicit: the allow policies below all select endpointSelector: {} for
# ingress and/or egress, so any traffic not explicitly allowed is dropped.
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-egress-dns
  namespace: games
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          # L7 DNS proxy — Cilium injects replies directly to the pod, avoiding
          # the conntrack reply-drop that breaks Go resolvers behind default-deny
          # ingress (see auth.yaml), and enables toFQDNs.
          rules:
            dns:
              - matchPattern: "*"
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-ingress-from-gateway
  namespace: games
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: networking
            app.kubernetes.io/name: agentgateway
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: networking
            gateway.networking.k8s.io/gateway-class-name: agentgateway
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-prometheus-scraping
  namespace: games
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
