# Namespace: games  (windrose, romestead)
# NOTE: if a game server is exposed directly via a LoadBalancer (not the HTTP
# gateway), add an explicit world-ingress rule for its UDP/TCP game ports.
---
# Windrose direct-connection game port (LB 192.168.6.11:28050, TCP+UDP).
# Clients are (a) Windrose running inside dreamcast session pods (pod-to-pod,
# e.g. joey/stacie steam sessions), (b) LAN machines connecting to the Cilium
# LB-IPAM address (reserved:world entity), and (c) external players via the
# UDM port-forward. The service uses externalTrafficPolicy: Cluster, so any
# client whose traffic is forwarded through a non-backend node (BGP ECMP
# spread, NodePort hops) is SNAT'd to that node's IP and arrives at the pod
# with the host/remote-node identity instead of world — without the
# host/remote-node entities below those flows are denied at the pod (verified
# via Hubble: "Policy denied DROPPED (TCP Flags: SYN)" from node IPs; the
# same signature broke the UDM port-forward for all external players).
# Scopes: only pods labeled app.kubernetes.io/name=windrose, only
# port 28050, TCP and UDP.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-ingress-windrose-game-port
  namespace: games
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: windrose
  ingress:
    - fromEntities:
        - world
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "28050"
              protocol: TCP
            - port: "28050"
              protocol: UDP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: dreamcast
      toPorts:
        - ports:
            - port: "28050"
              protocol: TCP
            - port: "28050"
              protocol: UDP
---
# Romestead game port (LB 192.168.6.13:8050, UDP only).
# Same rationale as the windrose policy above: clients are LAN/external
# machines hitting the LB-IPAM address (world) and any traffic SNAT'd by a
# node under externalTrafficPolicy Cluster (host/remote-node) — without the
# host/remote-node entities those flows are denied at the pod.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-ingress-romestead-game-port
  namespace: games
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: romestead
  ingress:
    - fromEntities:
        - world
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "8050"
              protocol: UDP
---
# Romestead DepotDownloader (runs on every boot: UPDATE_ON_START=true,
# -app 4763510 -validate) needs the Steam3 connection managers
# (cm*.steampowered.com), the web login (login.steamcommunity.com, anonymous
# dedicated-server subscription), the ISteamUser API, and the content CDN,
# and the game links GameAnalytics. Without these, first boot fails under
# default-deny egress (2026-10-20: exact-name-only list -> "Connection to
# Steam failed" x10 -> "InitializeSteam failed" -> Server.dll missing).
# If first-boot logs show connection failures to other Steam hosts, add them
# here.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-egress-romestead-steam
  namespace: games
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: romestead
  egress:
    - toFQDNs:
        # Steam3 CM (cm*.steampowered.com) + ISteamUser API + store
        - matchName: steampowered.com
        - matchPattern: "*.steampowered.com"
        # web login (login.steamcommunity.com) + community
        - matchName: steamcommunity.com
        - matchPattern: "*.steamcommunity.com"
        # DepotDownloader content CDNs
        - matchName: steamcdn-a.akamaihd.net
        - matchName: steamcommunity-a.akamaihd.net
        - matchPattern: "*.steamcontent.com"
        # telemetry
        - matchPattern: "*.gameanalytics.com"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # Steam3 Connection Manager protocol (the SteamKit "Connecting to Steam3"
    # phase of DepotDownloader) runs on 27017, not 443. Verified 2026-10-20
    # with an in-pod probe: api.steampowered.com:27017 dropped while :443 and
    # :80-control behaved per policy, and the pod crashlooped with
    # "Connection to Steam failed" x10.
    - toFQDNs:
        - matchName: steampowered.com
        - matchPattern: "*.steampowered.com"
      toPorts:
        - ports:
            - port: "27017"
              protocol: TCP
    # SteamKit dials the CM hosts it gets from ICMList by RAW IP (verified
    # 27017/27018 SYN drops to 155.133.248.38 / 162.254.192.99 via cilium
    # monitor; no ipcache/DNS-proxy attribution exists for those IPs), so an
    # FQDN rule can never cover the common path. Scope: exactly the two CM
    # ports to world.
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "27017"
              protocol: TCP
            - port: "27018"
              protocol: TCP
---
# NOTE: No standalone default-deny policy — Cilium rejects an empty deny-all
# (VALID: False, "rule must have at least one of Ingress/Egress"). Default-deny
# is implicit: the allow policies below all select endpointSelector: {} for
# ingress and/or egress, so any traffic not explicitly allowed is dropped.
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-egress-dns
  namespace: games
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          # L7 DNS proxy — Cilium injects replies directly to the pod, avoiding
          # the conntrack reply-drop that breaks Go resolvers behind default-deny
          # ingress (see auth.yaml), and enables toFQDNs.
          rules:
            dns:
              - matchPattern: "*"
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-ingress-from-gateway
  namespace: games
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: networking
            app.kubernetes.io/name: agentgateway
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: networking
            gateway.networking.k8s.io/gateway-class-name: agentgateway
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-prometheus-scraping
  namespace: games
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
