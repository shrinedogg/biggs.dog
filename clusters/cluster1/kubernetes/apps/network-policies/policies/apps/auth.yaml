# Namespace: auth  (pocket-id: gateway-fronted, cnpg-pocket-id Postgres + dragonfly redis)
# NOTE: No standalone default-deny policy — Cilium rejects an empty deny-all
# (VALID: False, "rule must have at least one of Ingress/Egress"). Default-deny
# is implicit: the allow policies below all select endpointSelector: {} for
# ingress and/or egress, so any traffic not explicitly allowed is dropped.
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-egress-dns
  namespace: auth
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          # L7 DNS proxy. Without this, Cilium relies on plain UDP conntrack for
          # DNS replies. Go's resolver (oauth2-proxy/go-redis) fires rapid
          # parallel A/AAAA queries whose replies arrive from the kube-dns
          # service VIP un-reverse-translated, so they miss the egress conntrack
          # entry and get dropped by the default-deny ingress ("Policy denied",
          # identity kube-dns -> app). Routing DNS through the L7 proxy makes
          # Cilium inject replies directly to the pod, fixing the drop.
          rules:
            dns:
              - matchPattern: "*"
---
# oauth2-proxy performs OIDC discovery / token / JWKS / userinfo against the
# public issuer https://id.biggs.dog. CoreDNS resolves this to the gateway
# LoadBalancer IP (192.168.6.7) which is unreachable from pods, so we also
# allow egress directly to the gateway dataplane pods via their Cilium labels.
#
# Also allow egress to the internal Pocket ID service on port 1411 so that
# oauth2-proxy can do OIDC discovery directly in-cluster without hitting
# the external gateway IP (which is unreachable from the pod network).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-egress-oidc
  namespace: auth
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: oauth2-proxy
  egress:
    - toFQDNs:
        - matchName: id.biggs.dog
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: networking
            app.kubernetes.io/name: wildcard-biggs-dog
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: auth
            app: pocket-id
      toPorts:
        - ports:
            - port: "1411"
              protocol: TCP
# Pocket ID egress: needs DNS already covered by allow-egress-dns, Postgres by
# allow-egress-to-postgres, and Dragonfly by allow-egress-to-dragonfly.
# Also needs to reach itself on port 1411 so the Kubernetes ClusterIP service
# works (Cilium's implicit default-deny blocks all egress not explicitly
# allowed).
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-egress-pocket-id
  namespace: auth
spec:
  endpointSelector:
    matchLabels:
      app: pocket-id
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: auth
            app: pocket-id
      toPorts:
        - ports:
            - port: "1411"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-egress-to-postgres
  namespace: auth
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cnpg-system
            cnpg.io/cluster: cnpg-pocket-id
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
---
# CNPG's -rw Service is a ClusterIP; with bpf-LB + default-deny ingress the
# Postgres reply arrives reverse-NAT'd from the VIP and misses egress conntrack,
# so it's dropped as new ingress. Allow the DB return path (see ai-system.yaml).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-ingress-from-postgres
  namespace: auth
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cnpg-system
            cnpg.io/cluster: cnpg-pocket-id
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-egress-to-dragonfly
  namespace: auth
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: dragonfly
            app: dragonfly-db
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
---
# Allow ingress to pocket-id from oauth2-proxy and from pocket-id itself
# (required for self-loop via ClusterIP — when pocket-id reaches its own
# ClusterIP, Cilium routes through the service LB which checks ingress rules).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-ingress-to-pocket-id
  namespace: auth
spec:
  endpointSelector:
    matchLabels:
      app: pocket-id
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: oauth2-proxy
        - matchLabels:
            app: pocket-id
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-ingress-from-gateway
  namespace: auth
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: networking
            app.kubernetes.io/name: agentgateway
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: networking
            gateway.networking.k8s.io/gateway-class-name: agentgateway
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-prometheus-scraping
  namespace: auth
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
