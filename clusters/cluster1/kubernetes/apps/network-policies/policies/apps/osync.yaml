# Namespace: osync  (osync-api sync coordinator; blobs live on Ceph RGW)
#
# osync-api: REST + WebSocket coordinator on :3000, Postgres in cnpg-system,
# S3 against the osync RGW (CephObjectStore) in rook-ceph. HTTPRoute-backed on
# the PUBLIC wildcard-biggs-dog gateway (osync.biggs.dog); the
# objects.biggs.dog presigned blob route terminates on RGW in rook-ceph.
---
# NOTE: No standalone default-deny policy — Cilium rejects an empty deny-all
# (VALID: False, "rule must have at least one of Ingress/Egress"). Default-deny
# is implicit: the allow policies below all select endpointSelector: {} for
# ingress and/or egress, so any traffic not explicitly allowed is dropped.
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-egress-dns
  namespace: osync
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          # L7 DNS proxy — Cilium injects replies directly to the pod, avoiding
          # the conntrack reply-drop that breaks Go resolvers behind default-deny
          # ingress, and enables toFQDNs.
          rules:
            dns:
              - matchPattern: "*"
---
# Public gateway -> api (:3000).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-ingress-from-gateway
  namespace: osync
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: networking
            app.kubernetes.io/name: agentgateway
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: networking
            gateway.networking.k8s.io/gateway-class-name: agentgateway
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
---
# kubelet health/readiness probes.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-ingress-from-host
  namespace: osync
spec:
  endpointSelector: {}
  ingress:
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
---
# osync-api -> Ceph RGW (osync CephObjectStore, rook-ceph) for bucket checks
# and S3 metadata (blob bodies bypass the API via presigned URLs). The Service is
# port 80 -> container 8080; allow both because Cilium evaluates egress L4
# rules post-socket-LB translation (see the k8s-gateway note in
# infra/networking.yaml). The matching ingress side is
# allow-ingress-rgw-from-osync in infra/rook-ceph.yaml.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-egress-to-rgw
  namespace: osync
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: osync
      app.kubernetes.io/component: api
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: rook-ceph
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "8080"
              protocol: TCP
---
# osync-api -> CNPG Postgres (cnpg-osync, cnpg-system:5432). The matching
# ingress side is allow-ingress-from-apps in infra/cnpg-system.yaml.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-egress-to-cnpg
  namespace: osync
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: osync
      app.kubernetes.io/component: api
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cnpg-system
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
---
# CNPG's -rw Service is a ClusterIP. With bpf-LB + default-deny ingress, the
# Postgres SYN,ACK reply arrives reverse-NAT'd from the service VIP and misses
# the egress conntrack entry, so Cilium treats it as new ingress to osync and
# drops it ("Policy denied", cnpg pod identity -> app) -- verified via Hubble:
# osync-api -> cnpg-osync-1:5432 SYN FORWARDED, then cnpg-osync-rw:5432 ->
# osync-api SYN,ACK Policy denied DROPPED. Without this, osync-api's DB
# migrations fail with `write CONNECT_TIMEOUT cnpg-osync-rw:5432` mid-run.
# Mirrors allow-ingress-from-postgres in infra/ai-system.yaml.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-ingress-from-cnpg
  namespace: osync
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: osync
      app.kubernetes.io/component: api
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cnpg-system
            cnpg.io/cluster: cnpg-osync
