---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app network-policies-infra
  namespace: flux-system
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  # Higher-risk infrastructure namespaces (ingress edge, storage, Postgres,
  # monitoring). Suspend this Kustomization to pause/roll back independently:
  #   flux suspend kustomization network-policies-infra
  path: ./clusters/cluster1/kubernetes/apps/network-policies/policies/infra
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: false
  interval: 3m
  retryInterval: 1m
  timeout: 2m
