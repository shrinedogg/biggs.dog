---
# Secrets for the hister release.
#
# 1Password items (biggs-dog vault):
#   - hister-access-token / access-token — NEW, created by the operator
#     post-merge: a long random string, e.g.
#     `cat /dev/urandom | LC_ALL=C tr -dc 'a-zA-Z0-9' | fold -w 50 | head -n 1`
#   - vllm-api-key / api-key — existing shared kagent-vllm credential (the
#     key the Infinity embeddings server enforces as INFINITY_API_KEY)
#   - hister-oidc (client-id, client-secret, session-key) — created by the
#     operator: the PocketID OIDC confidential client for hister (console:
#     id.biggs.dog -> OIDC Clients, redirect URI exactly
#     https://hister.biggs.dog/api/oauth/callback?provider=oidc — the exact
#     redirect_uri hister's generic "oidc" provider sends) plus a 64-char
#     random alphanumeric session-signing key, e.g.
#     `cat /dev/urandom | LC_ALL=C tr -dc 'a-zA-Z0-9' | fold -w 64 | head -n 1`
#
# The hister-access-token item does not exist at PR time; this ExternalSecret
# will not sync until the operator creates it (kritika precedent).
#
# Keys in the resulting secret "hister-access-token":
#   access-token      — Hister app.access_token (HTTP API + MCP bearer token)
#   authorization     — templated "Bearer <token>" for the kagent
#                       RemoteMCPServer header (hister-mcp-auth in ai-system)
#   embedding-api-key — the shared vllm-api-key, fed to
#                       HISTER__SEMANTIC_SEARCH__API_KEY
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hister-access-token
  namespace: hister
  labels:
    app.kubernetes.io/name: hister
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: hister-access-token
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        authorization: "Bearer {{ index . \"access-token\" }}"
  data:
    - secretKey: access-token
      remoteRef:
        key: hister-access-token
        property: access-token
    - secretKey: embedding-api-key
      remoteRef:
        key: vllm-api-key
        property: api-key
---
# Materializes secret "hister-oidc" (keys: client-id, client-secret,
# session-key) consumed by the hister Deployment for PocketID OIDC sign-in
# (the HISTER__SERVER__OAUTH__OIDC__* env and the /hister/data/.secret_key
# mount).
#
# The 1Password item hister-oidc does not exist at PR time; this
# ExternalSecret will not sync until the operator creates it (same
# precedent as hister-access-token), and the deployment's pods stay
# pending on the missing secret until then.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hister-oidc
  namespace: hister
  labels:
    app.kubernetes.io/name: hister
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: hister-oidc
    creationPolicy: Owner
  data:
    - secretKey: client-id
      remoteRef:
        key: hister-oidc
        property: client-id
    - secretKey: client-secret
      remoteRef:
        key: hister-oidc
        property: client-secret
    - secretKey: session-key
      remoteRef:
        key: hister-oidc
        property: session-key
