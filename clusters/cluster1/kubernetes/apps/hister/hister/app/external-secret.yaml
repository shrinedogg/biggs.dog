---
# Secrets for the hister release.
#
# The 1Password item hister-access-token (property access-token, a long
# random string) does not exist at PR time: this ExternalSecret will not
# sync until the item is created in the biggs-dog vault post-merge
# (operator gate).
#
# embedding-api-key mirrors the shared vllm-api-key item (property
# api-key) the local LLM stack uses: the Infinity embeddings server
# enforces the same key as INFINITY_API_KEY, so Hister's semantic search
# reuses it.
#
# The authorization key is rendered from access-token ("Bearer ..."),
# so the same token can back the kagent MCP header wiring in ai-system
# (hister-mcp-auth).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hister-access-token
  namespace: hister
  labels:
    app.kubernetes.io/name: hister
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: hister-access-token
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        authorization: "Bearer {{ .access-token }}"
  data:
    - secretKey: access-token
      remoteRef:
        key: hister-access-token
        property: access-token
    - secretKey: embedding-api-key
      remoteRef:
        key: vllm-api-key
        property: "api-key"
