---
# ASSUMPTION: 5Gi is a generous starting size — Hister stores roughly
# 100 KB/page (Bleve index + HTML preview + favicon + metadata). Expand if
# the library outgrows it.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hister-data
  namespace: hister
  labels:
    app.kubernetes.io/name: hister
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ceph-block
  resources:
    requests:
      storage: 5Gi
