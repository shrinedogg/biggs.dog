---
# Persistent store for the Hister index (Bleve index.db files, HTML
# previews, favicons, sqlite databases, embedding vectors, rules).
# ~100 KB per page.
#
# ASSUMPTION: 5Gi is a generous starting size for a single-user engine;
# grow the PVC when the index outgrows it. ceph-block is the dominant RWO
# storage class in this cluster.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hister-data
  namespace: hister
  labels:
    app.kubernetes.io/name: hister
spec:
  storageClassName: ceph-block
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
