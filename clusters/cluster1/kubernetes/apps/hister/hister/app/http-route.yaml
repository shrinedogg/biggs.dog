---
# HTTPS route for hister.biggs.dog, LAN-only via the internal-biggs-dog
# gateway (TLS terminates there with the *.biggs.dog wildcard cert):
#   /  -> hister (search UI, terminal client, and the /mcp endpoint)
# k8s-gateway picks up this hostname and answers hister.biggs.dog for
# LAN/VPN clients (split-horizon). The Hister server itself is HTTP-only;
# TLS terminates at the gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hister
  namespace: hister
  labels:
    app.kubernetes.io/name: hister
spec:
  hostnames:
    - hister.biggs.dog
  parentRefs:
    - name: internal-biggs-dog
      namespace: networking
  rules:
    - backendRefs:
        - name: hister
          port: 4433
