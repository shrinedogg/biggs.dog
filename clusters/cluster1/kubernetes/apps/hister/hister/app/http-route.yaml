---
# LAN-only route for hister.biggs.dog via the internal-biggs-dog gateway
# (TLS terminates there with the *.biggs.dog wildcard cert). Hister has no
# built-in TLS. k8s-gateway answers hister.biggs.dog with the LAN VIP for
# LAN/VPN clients (split-horizon), like mindwtr.biggs.dog.
# The browser extension and MCP clients use this host; the MCP origin checks
# accept it (it matches HISTER__SERVER__BASE_URL).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hister
  namespace: hister
  labels:
    app.kubernetes.io/name: hister
spec:
  hostnames:
    - hister.biggs.dog
  parentRefs:
    - name: internal-biggs-dog
      namespace: networking
  rules:
    - backendRefs:
        - name: hister
          port: 4433
