# HTTPS route for the Osync API on the PUBLIC wildcard-biggs-dog gateway
# (Cloudflare -> public gateway) because Obsidian sync has to work from mobile
# and off-LAN devices:
#   osync.biggs.dog    -> osync-api:3000 (REST + WebSocket coordinator)
#   objects.biggs.dog -> Ceph RGW (presigned blob upload/download) — that
#     second route is managed by the rook-ceph-cluster chart
#     (cephObjectStores[].route in apps/rook-ceph/rook-ceph/cluster/helmrelease.yaml)
#     and lives in the rook-ceph namespace next to the RGW service.
#
# Two sibling hostnames are required by upstream Osync (2.1.7+): the API signs
# presigned URLs that point at the S3 hostname, and the plugin transfers
# encrypted blobs directly with RGW. S3_PUBLIC_ENDPOINT (api) is
# https://objects.biggs.dog; the gateway preserves the Host header, so
# signatures match. Do NOT front this route with SSO — the plugin is a machine
# client and cannot complete an interactive OIDC login; Osync enforces its own
# auth (Better Auth + invite codes, zero-knowledge vault keys).
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: osync
  namespace: osync
  labels:
    app.kubernetes.io/name: osync
spec:
  hostnames:
    - osync.biggs.dog
  parentRefs:
    - name: wildcard-biggs-dog
      namespace: networking
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: osync-api
          port: 3000
