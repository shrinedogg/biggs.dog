# ObjectBucketClaim for the Osync vault blobs. Rook's bucket provisioner
# creates bucket "osync-bucket" on the osync CephObjectStore (RGW, see
# cephObjectStores in apps/rook-ceph/rook-ceph/cluster/helmrelease.yaml) and
# materializes:
#   Secret osync-bucket    — AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
#   ConfigMap osync-bucket — BUCKET_NAME / BUCKET_HOST / BUCKET_PORT / ...
# The osync-api Deployment consumes the Secret keys as S3_ACCESS_KEY /
# S3_SECRET_KEY. No S3 credentials live in 1Password — they are provisioned
# and owned entirely in-cluster.
apiVersion: objectbucket.io/v1alpha1
kind: ObjectBucketClaim
metadata:
  name: osync-bucket
  namespace: osync
  labels:
    app.kubernetes.io/name: osync
    app.kubernetes.io/component: s3
spec:
  bucketName: osync-bucket
  storageClassName: ceph-bucket
