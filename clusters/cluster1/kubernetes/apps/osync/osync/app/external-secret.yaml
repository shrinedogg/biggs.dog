# Materializes secret "osync" consumed by the osync-api Deployment (envFrom).
# S3 credentials are NOT here — the ObjectBucketClaim (bucket.yaml)
# provisions them in-cluster as secret "osync-bucket".
#
# 1Password items required (biggs-dog vault):
#   - osync-user-password  (username, password) — the CNPG Postgres role.
#       username MUST equal the CNPG owner "osync" (see cnpg-osync.yaml in
#       apps/cnpg/cnpg/databases). Same item the osync-user-password
#       ClusterExternalSecret syncs into cnpg-system for bootstrap.
#   - osync (fields):
#       better-auth-secret    — Better Auth session secret, `openssl rand -hex 32`
#       sync-token-secret     — sync token HMAC secret, `openssl rand -hex 32`
#                               (use a DIFFERENT value than better-auth-secret)
#       admin-email           — first-run admin account email
#       admin-password        — first-run admin account password. Clear this
#                               field after first sign-in (upstream guidance);
#                               leaving it set just re-asserts the account.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: osync
  namespace: osync
  labels:
    app.kubernetes.io/name: osync
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: osync
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DATABASE_URL: >-
          postgres://{{ .username | urlquery }}:{{ .password | urlquery }}@cnpg-osync-rw.cnpg-system.svc.cluster.local:5432/osync
        BETTER_AUTH_SECRET: "{{ .betterAuthSecret }}"
        SYNC_TOKEN_SECRET: "{{ .syncTokenSecret }}"
        ADMIN_EMAIL: "{{ .adminEmail }}"
        ADMIN_PASSWORD: "{{ .adminPassword }}"
  data:
    - secretKey: username
      remoteRef:
        key: osync-user-password
        property: username
    - secretKey: password
      remoteRef:
        key: osync-user-password
        property: password
    - secretKey: betterAuthSecret
      remoteRef:
        key: osync
        property: better-auth-secret
    - secretKey: syncTokenSecret
      remoteRef:
        key: osync
        property: sync-token-secret
    - secretKey: adminEmail
      remoteRef:
        key: osync
        property: admin-email
    - secretKey: adminPassword
      remoteRef:
        key: osync
        property: admin-password
