---
# Osync — self-hosted end-to-end encrypted Obsidian vault sync
# (https://github.com/KORThomasJeong/Osync-p). Components:
#   osync-api    — REST + WebSocket coordinator (thomasjeong/osync)
#   Ceph RGW     — osync CephObjectStore (apps/rook-ceph) stores the
#                  encrypted vault blobs; clients upload/download directly via
#                  presigned URLs, so RGW gets its own public hostname
#                  (objects.biggs.dog, chart-managed route)
#   osync-bucket — ObjectBucketClaim provisions the bucket + S3 creds on RGW
#   cnpg-osync   — CNPG Postgres (apps/cnpg/cnpg/databases/cnpg-osync.yaml)
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app osync
  namespace: flux-system
spec:
  dependsOn:
    # CNPG Postgres (cnpg-osync) + the osync-user-password secret must be ready.
    - name: cnpg-databases
    # osync CephObjectStore + the ceph-bucket StorageClass come from the
    # rook-ceph-cluster HelmRelease; the ObjectBucketClaim needs both.
    - name: rook-ceph-cluster
    # ClusterSecretStore (onepassword-connect) must exist for the ExternalSecret.
    - name: secretstore
    # Gateway (wildcard-biggs-dog) for the HTTPRoute.
    - name: agentgateway
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./clusters/cluster1/kubernetes/apps/osync/osync/app
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  interval: 3m
  retryInterval: 1m
  timeout: 2m
