---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: silo
  namespace: media
spec:
  hostnames:
  - silo.biggs.dog
  parentRefs:
  - name: wildcard-biggs-dog
    namespace: networking
  rules:
  - backendRefs:
    - name: silo-service
      port: 8080
    matches:
    - path:
        type: PathPrefix
        value: /
