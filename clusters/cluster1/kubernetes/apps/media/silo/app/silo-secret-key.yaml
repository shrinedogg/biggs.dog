# 1Password: item silo-secret-key (password property → SECRET_KEY).
# Master key for silo's at-rest credential encryption; back it up separately
# from DB dumps.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: silo-secret-key
  namespace: media
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: silo-secret-key
    creationPolicy: Owner
  data:
    - secretKey: SECRET_KEY
      remoteRef:
        key: silo-secret-key
        property: password
