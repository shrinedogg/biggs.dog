# 1Password: item silo-user-password (username, password) — must match CNPG bootstrap credentials.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: silo-database-url
  namespace: media
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: silo-database-url
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DATABASE_URL: >-
          postgres://{{ .username | urlquery }}:{{ .password | urlquery }}@cnpg-silo-rw.cnpg-system.svc.cluster.local:5432/silo
  data:
    - secretKey: username
      remoteRef:
        key: silo-user-password
        property: username
    - secretKey: password
      remoteRef:
        key: silo-user-password
        property: password
