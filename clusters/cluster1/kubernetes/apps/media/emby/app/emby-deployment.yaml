apiVersion: apps/v1
kind: Deployment
metadata:
  name: emby
  namespace: media
  labels:
    app: emby
spec:
  replicas: 1
  # Single replica backed by an RWO (ceph-block) config PVC. RollingUpdate can
  # surge a second pod that deadlocks on a Multi-Attach error for the RWO
  # volume; Recreate terminates the old pod first.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: emby
  template:
    metadata:
      labels:
        app: emby
    spec:
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      nodeSelector:
        intel.feature.node.kubernetes.io/gpu: "true"
      # Keep emby and ersatz off the same node: both are GPU/transcode-heavy and
      # the nodeSelector pins them to the same GPU-capable pool. Preferred (not
      # required) so a single remaining GPU node doesn't leave a pod Pending.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: ersatz
                topologyKey: kubernetes.io/hostname
      containers:
        - name: emby
          image: emby/embyserver:4.10.0.21
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
              add:
                - SETUID
                - SETGID
                - CHOWN
                - DAC_OVERRIDE
          ports:
            - containerPort: 8096
              name: emby
          env:
            - name: GID
              value: "1000"
            - name: UID
              value: "1000"
          volumeMounts:
            - name: emby-config
              mountPath: /config
            - name: media-nfs
              mountPath: /nfs-share
            - name: emby-transcode
              mountPath: /transcode
            - name: run
              mountPath: /run
            - name: tmp
              mountPath: /tmp
          resources:
            limits:
              gpu.intel.com/i915: "1"
              memory: 4.5Gi
            requests:
              gpu.intel.com/i915: "1"
              memory: 4.5Gi
      volumes:
        - name: emby-transcode
          emptyDir:
            sizeLimit: 80Gi
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: emby-config
          persistentVolumeClaim:
            claimName: emby-config
        - name: media-nfs
          persistentVolumeClaim:
            claimName: media-nfs-pvc
