apiVersion: apps/v1
kind: Deployment
metadata:
  name: emby
  namespace: media
  labels:
    app: emby
spec:
  replicas: 1
  # Single replica backed by an RWO (ceph-block) config PVC. RollingUpdate can
  # surge a second pod that deadlocks on a Multi-Attach error for the RWO
  # volume; Recreate terminates the old pod first.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: emby
  template:
    metadata:
      labels:
        app: emby
    spec:
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      nodeSelector:
        intel.feature.node.kubernetes.io/gpu: "true"
      # Never share a node with silo/ersatz: all three are GPU/transcode-heavy and
      # the nodeSelector pins them to the same GPU-capable pool. Required (not
      # preferred) enforces this at scheduling time; the cost is that emby goes
      # Pending if fewer than three GPU nodes are available. The silo and ersatz
      # deployments carry matching rules so the guarantee holds no matter which
      # pod is scheduled last.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: silo
              topologyKey: kubernetes.io/hostname
            - labelSelector:
                matchLabels:
                  app: ersatz
              topologyKey: kubernetes.io/hostname
      containers:
        - name: emby
          image: emby/embyserver:4.11.0.10
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
              add:
                - SETUID
                - SETGID
                - CHOWN
                - DAC_OVERRIDE
          ports:
            - containerPort: 8096
              name: emby
          env:
            - name: GID
              value: "1000"
            - name: UID
              value: "1000"
          volumeMounts:
            - name: emby-config
              mountPath: /config
            - name: media-nfs
              mountPath: /nfs-share
            - name: emby-transcode
              mountPath: /transcode
            - name: run
              mountPath: /run
            - name: tmp
              mountPath: /tmp
          resources:
            limits:
              gpu.intel.com/i915: "1"
              memory: 4.5Gi
            requests:
              gpu.intel.com/i915: "1"
              memory: 4.5Gi
      volumes:
        - name: emby-transcode
          emptyDir:
            sizeLimit: 80Gi
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: emby-config
          persistentVolumeClaim:
            claimName: emby-config
        - name: media-nfs
          persistentVolumeClaim:
            claimName: media-nfs-pvc
