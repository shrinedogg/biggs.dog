---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bookboss
  namespace: media
spec:
  hostnames:
  - bookboss.biggs.dog
  parentRefs:
  - name: wildcard-biggs-dog
    namespace: networking
  rules:
  - backendRefs:
    - name: bookboss-service
      port: 8080
    matches:
    - path:
        type: PathPrefix
        value: /
---
# BookBoss's own OIDC SSO endpoints must NOT pass through the oauth2-proxy
# forward-auth policy (bookboss-forward-auth targets the `bookboss` route):
# the ext-authz redirect drops the ?code&state from the OIDC callback, so
# BookBoss fails with "missing state parameter" ("invalid username or password"
# in the UI). This dedicated route serves the same backend but is not targeted
# by the policy, and its longer path prefix wins for /auth/oidc/*, so those
# requests reach BookBoss directly while everything else stays gated.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bookboss-oidc
  namespace: media
spec:
  hostnames:
  - bookboss.biggs.dog
  parentRefs:
  - name: wildcard-biggs-dog
    namespace: networking
  rules:
  - backendRefs:
    - name: bookboss-service
      port: 8080
    matches:
    - path:
        type: PathPrefix
        value: /auth/oidc
---
# Kobo device sync (all /kobo/{sync_token}/... endpoints). Like /auth/oidc
# above, this must NOT pass through the oauth2-proxy forward-auth policy
# (bookboss-forward-auth targets the `bookboss` route): the Kobo firmware is a
# minimal HTTP client that cannot complete an interactive SSO login, so it gets
# the 302 to auth.biggs.dog and sync fails before reaching BookBoss. The sync
# token in the path is the credential (BookBoss's KoboDevice extractor validates
# it), so the path is safe to expose ungated. Its longer path prefix wins for
# /kobo/*, so those requests reach BookBoss directly while everything else stays
# gated.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bookboss-kobo
  namespace: media
spec:
  hostnames:
  - bookboss.biggs.dog
  parentRefs:
  - name: wildcard-biggs-dog
    namespace: networking
  rules:
  - backendRefs:
    - name: bookboss-service
      port: 8080
    matches:
    - path:
        type: PathPrefix
        value: /kobo
