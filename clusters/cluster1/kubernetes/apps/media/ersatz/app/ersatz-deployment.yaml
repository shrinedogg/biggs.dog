apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: ersatz
  name: ersatz
  namespace: media
spec:
  replicas: 1
  # Single replica backed by an RWO (ceph-block) config PVC. RollingUpdate can
  # surge a second pod that deadlocks on a Multi-Attach error for the RWO
  # volume; Recreate terminates the old pod first.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: ersatz
    spec:
      # ErsatzTV (jasongdove/ersatztv) is built to run as root (config lives under
      # /root/.local/share/ersatztv and there is no PUID/PGID support), so
      # runAsNonRoot/readOnlyRootFilesystem are not set. All other hardening that
      # the image supports is applied: no privilege escalation, all capabilities
      # dropped, RuntimeDefault seccomp, and no service-account token mounted.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      nodeSelector:
        intel.feature.node.kubernetes.io/gpu: "true"
      # Keep ersatz and emby off the same node: both are GPU/transcode-heavy and
      # the nodeSelector pins them to the same GPU-capable pool. Preferred (not
      # required) so a single remaining GPU node doesn't leave a pod Pending.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: emby
                topologyKey: kubernetes.io/hostname
      containers:
        # Tracks the rolling `develop` (nightly) channel. Renovate pins and bumps the
        # digest (see pinDigests rule in renovate.json) so updates land in-place
        # without rolling back to an older stable vXX.Y.Z build, which could downgrade
        # the database schema.
        - image: ersatztv/legacy:develop@sha256:b9a79152f2b57b2968b37224d7149f37d5c4c2b9dc14d07f47e5c0f409170d96
          imagePullPolicy: Always
          name: ersatz
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: TZ
              value: "Europe/Helsinki"
            # Native OIDC login via Pocket ID. Enabling this gates the entire
            # Blazor web UI behind an OIDC login (Startup.cs AuthorizeFolder("/"))
            # but deliberately exempts the IPTV/streaming paths (/iptv/*,
            # /discover.json, /device.xml, /lineup*.json) so media players that
            # can't do OIDC keep working. Callback is /callback (not /signin-oidc).
            # OIDC__ClientSecret comes from the ersatz-oidc ExternalSecret below.
            - name: OIDC__Authority
              value: "https://id.biggs.dog"
            # OIDC__ClientId must be the Pocket ID client UUID, not the
            # client name ("ersatz"). Pocket ID looks up clients by UUID;
            # using the name returns "Client not found" (404).
            - name: OIDC__ClientId
              value: "07e77c2a-bbca-4096-9e0e-704366d0a8f0"
            - name: OIDC__LogoutUri
              value: "https://id.biggs.dog/logout"
          envFrom:
            - secretRef:
                name: ersatz-oidc
          ports:
            - name: ersatz-port
              containerPort: 8409
              protocol: TCP
          volumeMounts:
            - name: ersatz-config
              mountPath: /root/.local/share/ersatztv
            - name: ersatz-media
              mountPath: /nfs-share
          resources:
            limits:
              gpu.intel.com/i915: "1"
              memory: 8Gi
            requests:
              gpu.intel.com/i915: "1"
              memory: 8Gi
              # Guarantee CPU for FFmpeg's single-threaded transcode pipeline
              # (-threads 1 + loudnorm audio filter is CPU-bound). Without a
              # request the pod is BestEffort QoS and gets starved under node
              # pressure from Ceph OSDs, CNPG, etc. on worker-01. No CPU limit
              # is set so the pod can burst when multiple streams transcode.
              cpu: "2"
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      volumes:
        - name: ersatz-config
          persistentVolumeClaim:
            claimName: ersatz-config-pvc
        - name: ersatz-media
          persistentVolumeClaim:
            claimName: media-nfs-pvc
  selector:
    matchLabels:
      app: ersatz
