apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: ersatz
  name: ersatz
  namespace: media
spec:
  replicas: 1
  # Single replica backed by an RWO (ceph-block) config PVC. RollingUpdate can
  # surge a second pod that deadlocks on a Multi-Attach error for the RWO
  # volume; Recreate terminates the old pod first.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: ersatz
    spec:
      # ErsatzTV (jasongdove/ersatztv) is built to run as root (config lives under
      # /root/.local/share/ersatztv and there is no PUID/PGID support), so
      # runAsNonRoot/readOnlyRootFilesystem are not set. All other hardening that
      # the image supports is applied: no privilege escalation, all capabilities
      # dropped, RuntimeDefault seccomp, and no service-account token mounted.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      nodeSelector:
        intel.feature.node.kubernetes.io/gpu: "true"
      containers:
        # Tracks the rolling `develop` (nightly) channel. Renovate pins and bumps the
        # digest (see pinDigests rule in renovate.json) so updates land in-place
        # without rolling back to an older stable vXX.Y.Z build, which could downgrade
        # the database schema.
        - image: ersatztv/legacy:develop@sha256:336320774c27d5f5820bfbef0060582473888a9a90cb5eb80f60e5ae4a13405f
          imagePullPolicy: Always
          name: ersatz
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: TZ
              value: "Europe/Helsinki"
            # Native OIDC login via Pocket ID. Enabling this gates the entire
            # Blazor web UI behind an OIDC login (Startup.cs AuthorizeFolder("/"))
            # but deliberately exempts the IPTV/streaming paths (/iptv/*,
            # /discover.json, /device.xml, /lineup*.json) so media players that
            # can't do OIDC keep working. Callback is /callback (not /signin-oidc).
            # OIDC__ClientSecret comes from the ersatz-oidc ExternalSecret below.
            - name: OIDC__Authority
              value: "https://id.biggs.dog"
            - name: OIDC__ClientId
              value: "ersatz"
            - name: OIDC__LogoutUri
              value: "https://id.biggs.dog/logout"
          envFrom:
            - secretRef:
                name: ersatz-oidc
          ports:
            - name: ersatz-port
              containerPort: 8409
              protocol: TCP
          volumeMounts:
            - name: ersatz-config
              mountPath: /root/.local/share/ersatztv
            - name: ersatz-media
              mountPath: /nfs-share
          resources:
            limits:
              gpu.intel.com/i915: "1"
              memory: 8Gi
            requests:
              gpu.intel.com/i915: "1"
              memory: 8Gi
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      volumes:
        - name: ersatz-config
          persistentVolumeClaim:
            claimName: ersatz-config-pvc
        - name: ersatz-media
          persistentVolumeClaim:
            claimName: media-nfs-pvc
  selector:
    matchLabels:
      app: ersatz
