---
# Materializes secret "ersatz-oidc" with key OIDC__ClientSecret, consumed by the
# ersatz Deployment (envFrom) for native OIDC login against Pocket ID.
#
# 1Password item required (biggs-dog vault): ersatz-oidc
#   OIDC__ClientSecret  — client secret from the Pocket ID OIDC client whose
#                         callback URL is https://ersatz.biggs.dog/callback.
#
# ErsatzTV's OIDC client is configured via env vars (see OidcHelper.cs /
# Startup.cs): OIDC__Authority, OIDC__ClientId, OIDC__ClientSecret,
# OIDC__LogoutUri. Only the secret is stored in 1Password; the rest are plain
# env vars on the Deployment. When OIDC is enabled ErsatzTV gates the entire
# Blazor UI (AuthorizeFolder("/")) but explicitly exempts the IPTV/streaming
# paths (/iptv/*, /discover.json, /device.xml, /lineup*.json) from auth, so
# media players keep working without an OIDC login.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ersatz-oidc
  namespace: media
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: ersatz-oidc
    creationPolicy: Owner
  data:
    - secretKey: OIDC_ClientSecret
      remoteRef:
        key: ersatz-oidc
        # The 1Password item field is misspelled "OICD_ClientSecret" (OICD
        # instead of OIDC). The 1Password Connect API token is read-only for
        # this vault, so the label can't be fixed programmatically — update
        # it in the 1Password app to "OIDC__ClientSecret" and restore this
        # property to match.
        property: OICD_ClientSecret
