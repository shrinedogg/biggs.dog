# kritika Deployment (the "kritika" agent), converted from the HelmRelease
# (Wave 1 de-Helm).
#
# Mounts ConfigMap/kritika (generated by the app kustomization from
# kritika-config.txt, with the tools image line driven by the IAC-setters
# bump of CM/kritika-runner-image -> $imagepolicy kritika-tools).
# KRITIKA_DATABASE_URL/_OWNER_URL come from the kritika-postgres ESO secrets;
# the IAC image marker is the kritika policy (>=0.0.119 <1.0.0).

apiVersion: apps/v1
kind: Deployment
metadata:
  name: kritika
  namespace: kritika
  labels:
    app.kubernetes.io/name: kritika
    app.kubernetes.io/instance: kritika
    app.kubernetes.io/version: "0.0.120"
    app.kubernetes.io/component: server
spec:
  replicas: 2
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: kritika
      app.kubernetes.io/instance: kritika
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kritika
        app.kubernetes.io/instance: kritika
        app.kubernetes.io/version: "0.0.120"
        app.kubernetes.io/component: server
    spec:
      # The Service is named after the release. The kubelet's legacy link
      # variables otherwise inject KRITIKA_PORT and collide with the configuration.
      enableServiceLinks: false
      serviceAccountName: "kritika"
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 200
      securityContext:
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kritika
          image: ghcr.io/home-operations/kritika:0.0.120 # {"$imagepolicy": "flux-system:kritika"}
          imagePullPolicy: IfNotPresent
          args:
            - serve
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          env:
            - name: KRITIKA_CONFIG_FILE
              value: /etc/kritika/config.yaml
            - name: KRITIKA_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: KRITIKA_POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: KRITIKA_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  key: uri
                  name: kritika-postgres-app
            - name: KRITIKA_DATABASE_OWNER_URL
              valueFrom:
                secretKeyRef:
                  key: uri
                  name: kritika-postgres-credentials
          envFrom:
            - secretRef:
                name: kritika-credentials
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 8081
              protocol: TCP
            - name: gateway
              containerPort: 8082
              protocol: TCP

          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            periodSeconds: 10
          startupProbe:
            failureThreshold: 30
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 2
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /etc/kritika
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: "kritika"
      topologySpreadConstraints:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/instance: 'kritika'
              app.kubernetes.io/name: 'kritika'
          maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
