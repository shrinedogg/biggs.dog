---
# Secrets for the kritika release (issue #643).
#
# Three DB uri secrets (kritika-postgres-credentials / -app / -runner),
# basic-auth as CNPG expects, each with username / password / uri keys. The
# chart reads only the `uri` key. Each sources the same 1Password item its
# cnpg-system ClusterExternalSecret counterpart reads:
# kritika-user-password, kritika-app-password, kritika-runner-password.
#
# kritika-credentials (envFrom'd by the serve pods): 1Password items
# kritika-admin-password (ADMIN_PASSWORD), openrouter-api-key
# (OPENROUTER_API_KEY), kritika-github-app (GITHUB_APP_PRIVATE_KEY +
# GITHUB_APP_WEBHOOK_SECRET). The OPENROUTER_API_KEY remoteRef points at
# item openrouter-api-key / property credential; if an existing OpenRouter
# item exists in the biggs-dog vault, repoint it (op CLI is not signed in in
# the worker environment, so this was not verifiable at PR time; check in
# issue #643).
#
# All four items do not exist at PR time; the ExternalSecrets will not sync
# until they are created post-merge (tracked in issue #643).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kritika-postgres-credentials
  namespace: kritika
  labels:
    app.kubernetes.io/name: kritika
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: kritika-postgres-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
        uri: >-
          postgres://{{ .username | urlquery }}:{{ .password | urlquery }}@cnpg-kritika-rw.cnpg-system.svc.cluster.local:5432/kritika?sslmode=require&connect_timeout=10
  data:
    - secretKey: username
      remoteRef:
        key: kritika-user-password
        property: username
    - secretKey: password
      remoteRef:
        key: kritika-user-password
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kritika-postgres-app
  namespace: kritika
  labels:
    app.kubernetes.io/name: kritika
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: kritika-postgres-app
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
        uri: >-
          postgres://{{ .username | urlquery }}:{{ .password | urlquery }}@cnpg-kritika-rw.cnpg-system.svc.cluster.local:5432/kritika?sslmode=require&connect_timeout=10
  data:
    - secretKey: username
      remoteRef:
        key: kritika-app-password
        property: username
    - secretKey: password
      remoteRef:
        key: kritika-app-password
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kritika-postgres-runner
  namespace: kritika
  labels:
    app.kubernetes.io/name: kritika
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: kritika-postgres-runner
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
        uri: >-
          postgres://{{ .username | urlquery }}:{{ .password | urlquery }}@cnpg-kritika-rw.cnpg-system.svc.cluster.local:5432/kritika?sslmode=require&connect_timeout=10
  data:
    - secretKey: username
      remoteRef:
        key: kritika-runner-password
        property: username
    - secretKey: password
      remoteRef:
        key: kritika-runner-password
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kritika-credentials
  namespace: kritika
  labels:
    app.kubernetes.io/name: kritika
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: kritika-credentials
    creationPolicy: Owner
  data:
    - secretKey: ADMIN_PASSWORD
      remoteRef:
        key: kritika-admin-password
        property: password
    - secretKey: OPENROUTER_API_KEY
      remoteRef:
        key: openrouter-api-key
        property: credential
    - secretKey: GITHUB_APP_PRIVATE_KEY
      remoteRef:
        key: kritika-github-app
        property: private-key
    - secretKey: GITHUB_APP_WEBHOOK_SECRET
      remoteRef:
        key: kritika-github-app
        property: webhook-secret
