---
# Public route for kritika.biggs.dog on the wildcard-biggs-dog gateway (TLS
# terminates there with the *.biggs.dog cert): webhooks (POST /hooks/github)
# and the dashboard share the one port. No forward-auth on this route: GitHub
# webhook deliveries cannot complete an interactive login, and the dashboard
# has its own sign-in (local admin; OIDC can be layered later).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kritika
  namespace: kritika
  labels:
    app.kubernetes.io/name: kritika
spec:
  hostnames:
    - kritika.biggs.dog
  parentRefs:
    - name: wildcard-biggs-dog
      namespace: networking
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: kritika
          port: 8080
