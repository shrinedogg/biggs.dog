---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app kritika
  namespace: flux-system
spec:
  dependsOn:
    # ClusterSecretStore (onepassword-connect) must exist for the ExternalSecrets.
    - name: secretstore
    # CNPG Postgres (cnpg-kritika) + the role secrets must be ready.
    - name: cnpg-databases
    # Public gateway for the HTTPRoute.
    - name: agentgateway
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./clusters/cluster1/kubernetes/apps/kritika/kritika/app
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  interval: 3m
  retryInterval: 1m
  timeout: 5m
