---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: krops-web
  namespace: biggs
  labels:
    app: krops-web
    app.kubernetes.io/name: krops-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: krops-web
  template:
    metadata:
      labels:
        app: krops-web
        app.kubernetes.io/name: krops-web
    spec:
      automountServiceAccountToken: false
      securityContext:
        # nginx-unprivileged runs as uid/gid 101.
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: krops-web
          # Base image of the retired ghcr.io/polarsquad/krops-web site image
          # (its stage-2 FROM, same digest), serving the redirect configmap.
          image: docker.io/nginxinc/nginx-unprivileged:1.31-alpine@sha256:2ddec616f1cb58bcac057aa388f28cb81e35137641ef4226d321714499329bd1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            # nginx-unprivileged writes its pid file and temp dirs under /tmp.
            - name: tmp
              mountPath: /tmp
            # Redirect config replaces the site's default.conf.
            - name: conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: redirect.conf
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
      volumes:
        - name: tmp
          emptyDir: {}
        - name: conf
          configMap:
            name: krops-web
