apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: biggs
  name: biggs
  namespace: biggs
spec:
  template:
    metadata:
      labels:
        app: biggs
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      containers:
        - image: szkud/biggslanding:latest@sha256:e066618fe25a9b655749ea56f26ba2da0ce82f866d22954546e0883d76c2163d
          imagePullPolicy: Always
          name: biggs
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
          - name: biggs-port
            containerPort: 8080
            protocol: TCP
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
            - name: nginx-run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              memory: 350Mi
              cpu: 10m
            limits:
              memory: 450Mi
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-conf
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  selector:
    matchLabels:
      app: biggs  