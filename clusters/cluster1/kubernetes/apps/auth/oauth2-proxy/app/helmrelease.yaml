---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: oauth2-proxy
  namespace: auth
spec:
  interval: 3m
  chart:
    spec:
      chart: oauth2-proxy
      version: 10.7.1
      sourceRef:
        kind: HelmRepository
        name: oauth2-proxy
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3

  values:
    # client-id / client-secret / cookie-secret come from the oauth2-proxy
    # ExternalSecret (1Password item oauth2-proxy).
    config:
      existingSecret: oauth2-proxy
      configFile: |-
        provider = "oidc"
        provider_display_name = "Pocket ID"
        # The Gateway terminates TLS at id.biggs.dog and routes to pocket-id:1411.
        # Pocket ID's APP_URL is set to https://id.biggs.dog, so that's the
        # issuer it returns. Direct internal egress to pocket-id's ClusterIP works
        # (Cilium policy allow-egress-oidc), but the issuer would then be
        # http://pocket-id.auth.svc.cluster.local:1411 which doesn't match — so we
        # go through the Gateway instead.
        oidc_issuer_url = "https://id.biggs.dog"
        redirect_url = "https://auth.biggs.dog/oauth2/callback"
        # Auth-only forward-auth: return 202 to authenticated probes from the
        # gateway/other apps rather than proxying a real upstream.
        upstreams = ["static://202"]
        email_domains = ["*"]
        scope = "openid email profile groups"
        code_challenge_method = "S256"
        # Behind the agentgateway (TLS terminated upstream); share cookies across
        # every *.biggs.dog service so it can guard them.
        reverse_proxy = "true"
        # Only the in-cluster agentgateway (pod CIDR) may set X-Forwarded-* —
        # prevents direct callers from spoofing forwarded headers.
        trusted_proxy_ips = ["10.244.0.0/16"]
        cookie_domains = [".biggs.dog"]
        whitelist_domains = [".biggs.dog"]
        cookie_secure = "true"
        cookie_samesite = "lax"
        # Expose identity to protected upstreams via X-Auth-Request-* headers.
        set_xauthrequest = "true"
        pass_access_token = "true"
    # Redis-backed sessions (via Dragonfly). Keeps the browser cookie a small
    # session ticket instead of a chunked multi-KB cookie holding the access /
    # id / refresh tokens — the large cookie didn't survive the agentgateway
    # ext-authz subrequest to /oauth2/auth, causing a forward-auth redirect loop.
    sessionStorage:
      type: redis
      redis:
        clientType: standalone
        standalone:
          connectionUrl: redis://dragonfly-db.dragonfly.svc.cluster.local:6379
    # Cluster-wide Cilium hairpin bug: a pod cannot reach its own Service's
    # ClusterIP when the endpoint sits on the same node (verified 3/3 dial
    # timeouts from worker-03 to the dragonfly-db ClusterIP 10.99.95.103
    # while the pod-IP and cross-node dials PONG; reproduced from worker-04
    # against cert-manager). The dragonfly-db Service only carries the
    # role=master endpoint, so an oauth2 pod co-located with the master
    # cannot reach its redis session store and exits on boot. This is why
    # the v7.15.5 rollout repeatedly failed on worker-03 (exit 2, no logs).
    # Keep oauth2 off the dragonfly master's node until the hairpin is fixed
    # at the Cilium layer (tracked as a separate workstream).
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
                - key: role
                  operator: In
                  values: ["master"]
            namespaces:
              - dragonfly
            topologyKey: kubernetes.io/hostname
    # The chart's built-in waitForRedis init container only renders for the
    # bundled redis subchart (it watches the redis master pod via the API), so
    # it does nothing for our external Dragonfly. Keep it disabled.
    initContainers:
      waitForRedis:
        enabled: false

    podDisruptionBudget:
      enabled: false
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 128Mi
