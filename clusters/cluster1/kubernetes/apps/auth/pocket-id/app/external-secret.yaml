# Materializes secret "pocket-id" (keys: DB_CONNECTION_STRING, ENCRYPTION_KEY)
# consumed by the pocket-id Deployment via envFrom.
#
# 1Password items required (biggs-dog vault):
#   - pocket-id-user-password  (username, password) — the CNPG Postgres role.
#       username MUST equal the CNPG owner "pocketid" (see cnpg-pocket-id.yaml).
#   - pocket-id                (encryption-key)      — app data encryption key,
#       e.g. `openssl rand -base64 32`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pocket-id
  namespace: auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: pocket-id
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DB_CONNECTION_STRING: >-
          postgres://{{ .username | urlquery }}:{{ .password | urlquery }}@cnpg-pocket-id-rw.cnpg-system.svc.cluster.local:5432/pocketid
        ENCRYPTION_KEY: "{{ .encryptionKey }}"
  data:
    - secretKey: username
      remoteRef:
        key: pocket-id-user-password
        property: username
    - secretKey: password
      remoteRef:
        key: pocket-id-user-password
        property: password
    - secretKey: encryptionKey
      remoteRef:
        key: pocket-id
        property: encryption-key
