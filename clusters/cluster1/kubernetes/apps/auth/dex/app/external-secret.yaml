# Materializes secret "dex-config" (key: config.yaml) consumed by the
# dex Deployment.
#
# 1Password items required (biggs-dog vault):
#   - dex-admin-password    (hash)       — bcrypt password hash for static admin.
#   - dex-omni-client-secret (secret)    — OIDC client secret for Omni.
#   - dex-netbird-client-secret (secret) — OIDC client secret for NetBird.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dex-config
  namespace: auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: dex-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        config.yaml: |
          issuer: https://dex.biggs.dog
          web:
            http: 0.0.0.0:5556
          staticClients:
            - id: omni
              redirectURIs:
                - https://omni.biggs.dog/Callback
                - https://omni.biggs.dog/callback
              secret: "{{ .omniSecret }}"
              name: Omni
            - id: netbird
              redirectURIs:
                - https://netbird.biggs.dog/oauth2/callback
              secret: "{{ .netbirdSecret }}"
              name: NetBird
          staticPasswords:
            - email: admin
              hash: "{{ .hash }}"
              username: admin
              connectorId: local
          connectors: []
          frontend:
            logo: /logo.png
  data:
    - secretKey: hash
      remoteRef:
        key: dex-admin-password
        property: hash
    - secretKey: omniSecret
      remoteRef:
        key: dex-omni-client-secret
        property: secret
    - secretKey: netbirdSecret
      remoteRef:
        key: dex-netbird-client-secret
        property: secret
