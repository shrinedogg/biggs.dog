---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-cluster
  namespace: rook-ceph
spec:
  interval: 5m
  chart:
    spec:
      chart: rook-ceph-cluster
      version: v1.20.2
      sourceRef:
        kind: HelmRepository
        name: rook-ceph
        namespace: flux-system
  values:
    monitoring:
      enabled: true
      # createPrometheusRules: true
    toolbox:
      enabled: true
    cephClusterSpec:
      cephConfig:
        global:
          bdev_enable_discard: "true" # quote
          bdev_async_discard_threads: "1" # quote
          osd_class_update_on_start: "false" # quote
          device_failure_prediction_mode: local # requires mgr module
      # TODO: Enable the following options whenever deploying to a new cluster
      # cleanupPolicy:
      #   wipeDevicesFromOtherClusters: true
      crashCollector:
        disable: false
        daysToRetain: 30
      csi:
        readAffinity:
          enabled: true
      dashboard:
        enabled: true
        urlPrefix: /
        ssl: false
        prometheusEndpoint: http://vmsingle-stack.observability.svc.cluster.local:8428
      mgr:
        count: 1
        modules:
          - name: pg_autoscaler
            enabled: true
          - name: rook
            enabled: true
          - name: telemetry
            enabled: false
      mon:
        count: 3
        allowMultiplePerNode: false
      network:
        provider: host
        connections:
          requireMsgr2: true
      resources:
        mon:
          requests:
            cpu: 35m
            memory: "768Mi"
          limits:
            memory: "768Mi"
        osd:
          requests:
            cpu: 100m
            memory: "2Gi"
          limits:
            memory: "2Gi"
      storage:
        useAllNodes: false
        useAllDevices: false
        nodes:
          - name: worker-01
            devices:
              - name: /dev/nvme0n1
          - name: worker-02
            devices:
              - name: /dev/nvme0n1
          - name: worker-03
            devices:
              - name: /dev/nvme0n1
          - name: worker-04
            devices:
              - name: /dev/nvme0n1
        config:
          osdsPerDevice: "1"

    # ingress:
    #   dashboard:
    #     host:
    #       name: "rook-ceph.biggs.dog"
    #       path: "/"
    #       pathType: Prefix
    #     ingressClassName: nginx
    #     tls:
    #     - hosts:
    #       - rook-ceph.biggs.dog
    #       secretName: biggs-dog-tls

    cephBlockPools:
      - name: ceph-blockpool
        spec:
          failureDomain: host
          replicated:
            size: 3
        storageClass:
          enabled: true
          name: ceph-block
          isDefault: false
          reclaimPolicy: Delete
          allowVolumeExpansion: true
          volumeBindingMode: Immediate
          mountOptions: ["discard"]
          parameters:
            imageFormat: "2"
            imageFeatures: layering,fast-diff,object-map,deep-flatten,exclusive-lock
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: rook-ceph
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: rook-ceph
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
            csi.storage.k8s.io/node-stage-secret-namespace: rook-ceph
            csi.storage.k8s.io/fstype: ext4

    # cephBlockPoolsVolumeSnapshotClass:
    #   enabled: true
    #   name: csi-ceph-blockpool
    #   isDefault: false
    #   deletionPolicy: Delete

    # NOTE: After disabling the filesystem, the filesystem can be removed with the following commands:
    # ceph fs fail ceph-filesystem && ceph fs rm ceph-filesystem --yes-i-really-mean-it
    cephFileSystems: []

    cephObjectStores: []
      # S3 store for Osync (apps/osync): holds the client-side-encrypted
      # Obsidian vault blobs. The Osync API hands Obsidian plugins presigned
      # URLs that point directly at RGW via the public objects.biggs.dog
      # HTTPRoute (route below), so blob traffic never proxies through the API.
      # hostNetwork:false keeps RGW on the pod SDN (cluster-wide
      # network.provider=host would otherwise put it on the host network) so it
      # stays a Cilium-managed endpoint and namespace CNPs apply. On SDN the
      # RGW container listens on 8080 internally; the Service port is
      # gateway.port (80).
      # - name: osync
      #   spec:
      #     metadataPool:
      #       failureDomain: host
      #       replicated:
      #         size: 3
      #     dataPool:
      #       failureDomain: host
      #       replicated:
      #         size: 3
      #     preservePoolsOnDelete: true
      #     gateway:
      #       port: 80
      #       hostNetwork: false
      #       instances: 1
      #       resources:
      #         requests:
      #           cpu: 100m
      #           memory: 512Mi
      #         limits:
      #           memory: 1Gi
      #   storageClass:
      #     enabled: true
      #     name: ceph-bucket
      #     reclaimPolicy: Delete
      #     volumeBindingMode: "Immediate"
      #   route:
      #     # Public presigned blob endpoint. TLS terminates at the gateway with
      #     # the *.biggs.dog wildcard cert; RGW sees Host: objects.biggs.dog,
      #     # which is exactly what the Osync API signs against
      #     # (S3_PUBLIC_ENDPOINT), so v4 signatures validate. Path-style URLs
      #     # only — the wildcard cert cannot cover <bucket>.objects.biggs.dog.
      #     enabled: true
      #     host:
      #       name: objects.biggs.dog
      #       path: /
      #       pathType: PathPrefix
      #     parentRefs:
      #       - name: wildcard-biggs-dog
      #         namespace: networking
