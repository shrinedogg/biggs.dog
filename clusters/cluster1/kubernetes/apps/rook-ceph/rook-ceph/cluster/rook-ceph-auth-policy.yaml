---
# Forward-auth (SSO) in front of the Ceph mgr dashboard via oauth2-proxy.
# agentgateway calls oauth2-proxy's /oauth2/auth as an HTTP ext-authz check:
#   - 2xx  -> request is allowed and the x-auth-request-* identity headers are
#            copied onto the request sent to the dashboard.
#   - else -> the browser is redirected to oauth2-proxy's sign-in, which sends
#            the user through Pocket ID and drops a `.biggs.dog` session cookie.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: rook-ceph-forward-auth
  namespace: rook-ceph
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: rook-ceph
  traffic:
    extAuth:
      backendRef:
        group: ""
        kind: Service
        name: oauth2-proxy
        namespace: auth
        port: 80
      http:
        path: '"/oauth2/auth"'
        allowedRequestHeaders:
          - cookie
          - authorization
        allowedResponseHeaders:
          - authorization
          - x-auth-request-user
          - x-auth-request-email
          - x-auth-request-groups
          - x-auth-request-preferred-username
        redirect: '"https://auth.biggs.dog/oauth2/start?rd=https://rook-ceph.biggs.dog" + request.path'
