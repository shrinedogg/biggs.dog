---
apiVersion: v1
kind: ConfigMap
metadata:
  name: livekit-config
  namespace: livekit
  labels:
    app.kubernetes.io/name: livekit
data:
  livekit.yaml: |
    port: 7880
    bind_addresses:
      - 0.0.0.0
    keys:
      "Z7hKgDuff5SvvKhNYG4wQ": "gUqkxxeeE2GG5JpZMtwbkidRzoW0rsxPvI5s8N7y8aw7Awc2SipdQ6URqPpTqWe"
    rtc:
      tcp_port: 7881
      # Single UDP port shared by ALL peer connections via pion's UDPMux.
      # udp_port (mux), NOT port_range_*: a 1-port ephemeral range gives each
      # PeerConnection its own socket, so the second concurrent participant
      # fails to bind 50100 and silently drops to ICE-TCP. Matches the JVB
      # single-UDP-port model and the 1:1 UDM WAN forward below.
      udp_port: 50100
      # Dual-advertise for internet + LAN/VPN clients. Cloudflare proxies
      # livekit.biggs.dog and only forwards HTTP/HTTPS, so media must reach
      # the WAN IP directly: use_external_ip STUN-detects 87.92.82.45 and
      # advertises it as a host candidate. REQUIRES UDM forwards UDP 50100 +
      # TCP 7881 -> nv-01 (192.168.2.25), plus outbound STUN from the host
      # network at boot (the external IP is resolved once at startup —
      # restart this pod if the WAN IP changes).
      use_external_ip: true
      # Also advertise the node LAN IP alongside the WAN IP (pion address
      # rewrite Append mode) so LAN/VPN clients connect directly — they
      # cannot hairpin the WAN IP (no NAT hairpin on the UDM). v1.13.5 has
      # no nat_1_to_1_ips key, so advertising the media VIP (192.168.6.17)
      # alongside the WAN IP is not expressible; the VIP is no longer in the
      # candidate set (livekit-media Service kept as a rollback path).
      advertise_internal_ip: true
      # Skip the built-in self-check: it dials external:50100 and expects the
      # packet back, which needs the very NAT hairpin the UDM lacks. On
      # failure LiveKit falls back to advertising ONLY the external IP and
      # LAN clients lose their candidate until restart.
      skip_external_ip_validation: true
      # Gather host candidates from the node LAN NIC only — otherwise every
      # host interface (tailscale0, cilium_*, docker0, ...) is advertised
      # too, since the pod is hostNetwork.
      ips:
        includes:
          - 192.168.2.0/24
      enable_loopback_candidate: false
