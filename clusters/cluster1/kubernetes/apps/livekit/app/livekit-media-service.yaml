---
# LoadBalancer for LiveKit WebRTC MEDIA (not signaling — that stays on the
# wildcard-biggs-dog gateway via HTTPRoute -> livekit-service:7880).
#
# STANDBY / rollback path. LiveKit no longer advertises this VIP: with
# internet clients it advertises the WAN IP (87.92.82.45, UDM-forwarded to
# nv-01) plus the node LAN IP 192.168.2.25 (see livekit-configmap.yaml —
# v1.13.5 can't advertise an arbitrary VIP alongside the STUN external IP;
# nat_1_to_1_ips was removed from the config schema). Kept so reverting to
# the LAN-only design (use_external_ip: false + node_ip: 192.168.6.17) is a
# configmap-only change, and so the VIP keeps answering on 50100/7881 for
# anything still pinned to it.
apiVersion: v1
kind: Service
metadata:
  name: livekit-media
  namespace: livekit
  labels:
    app.kubernetes.io/name: livekit
  annotations:
    io.cilium/lb-ipam-ips: "192.168.6.17"
spec:
  type: LoadBalancer
  # Cluster (not Local) so the media VIP keeps working regardless of which node
  # a client hairpins through; the hostNetwork backend is reached via the
  # cluster datapath. Matches the JVB service setting.
  externalTrafficPolicy: Cluster
  selector:
    app.kubernetes.io/name: livekit
  ports:
    - name: rtc-tcp
      port: 7881
      protocol: TCP
      targetPort: 7881
    - name: rtc-udp
      port: 50100
      protocol: UDP
      targetPort: 50100
      # LiveKit is configured with a single multiplexed RTC UDP port shared
      # by all peer connections (udp_port: 50100 -> pion UDPMux, see
      # livekit-configmap), so this 1:1 Service mapping exposes the entire
      # media path through the VIP — same model as the Jitsi JVB (single UDP
      # 10000).
