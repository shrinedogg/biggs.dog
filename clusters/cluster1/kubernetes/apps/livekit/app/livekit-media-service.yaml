---
# LoadBalancer for LiveKit WebRTC MEDIA (not signaling — that stays on the
# wildcard-biggs-dog gateway via HTTPRoute -> livekit-service:7880).
#
# Why this exists: the livekit server pod is hostNetwork on nv-01
# (192.168.2.25) and binds UDP 50100-50200 (RTC) + TCP 7881 (RTC-over-TCP).
# Clients are all on the LAN/VPN and need a hairpin-safe, stable IP to send
# media to. This Service pins 192.168.6.17 from the Cilium LB-IPAM pool and
# LiveKit advertises it via rtc.node_ip (see livekit-configmap.yaml), mirroring
# the working Jitsi JVB pattern (jvb = 192.168.6.9). Without it LiveKit
# advertised the unreachable WAN IP and calls had no remote audio/video.
apiVersion: v1
kind: Service
metadata:
  name: livekit-media
  namespace: livekit
  labels:
    app.kubernetes.io/name: livekit
  annotations:
    io.cilium/lb-ipam-ips: "192.168.6.17"
spec:
  type: LoadBalancer
  # Cluster (not Local) so the media VIP keeps working regardless of which node
  # a client hairpins through; the hostNetwork backend is reached via the
  # cluster datapath. Matches the JVB service setting.
  externalTrafficPolicy: Cluster
  selector:
    app.kubernetes.io/name: livekit
  ports:
    - name: rtc-tcp
      port: 7881
      protocol: TCP
      targetPort: 7881
    - name: rtc-udp
      port: 50100
      protocol: UDP
      targetPort: 50100
      # LiveKit is configured with a single multiplexed RTC UDP port
      # (port_range_start == port_range_end == 50100, see livekit-configmap),
      # so this 1:1 Service mapping exposes the entire media path through the
      # VIP. One multiplexed UDP port serves the few concurrent calls this SFU
      # handles — same model as the Jitsi JVB (single UDP 10000).
