---
# LiveKit SFU — uses hostNetwork for UDP media relay (ports 50100-50200)
# and TCP port 7881. HTTP/WS on 7880 is proxied via the gateway.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: livekit
  namespace: livekit
  labels:
    app.kubernetes.io/name: livekit
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: livekit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: livekit
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: livekit
          image: livekit/livekit-server:v1.13.5
          imagePullPolicy: IfNotPresent
          args:
            - --config
            - /etc/livekit/livekit.yaml
          env:
            - name: LIVEKIT_KEY
              valueFrom:
                secretKeyRef:
                  name: livekit-credentials
                  key: LIVEKIT_KEY
            - name: LIVEKIT_SECRET
              valueFrom:
                secretKeyRef:
                  name: livekit-credentials
                  key: LIVEKIT_SECRET
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 7880
              protocol: TCP
            - name: tcp
              containerPort: 7881
              protocol: TCP
            - name: udp
              containerPort: 50100
              endPort: 50200
              protocol: UDP
          readinessProbe:
            httpGet:
              path: /healthz
              port: 7880
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 7880
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            limits:
              memory: 4Gi
            requests:
              memory: 1Gi
              cpu: "1"
          volumeMounts:
            - name: config
              mountPath: /etc/livekit
      volumes:
        - name: config
          configMap:
            name: livekit-config
