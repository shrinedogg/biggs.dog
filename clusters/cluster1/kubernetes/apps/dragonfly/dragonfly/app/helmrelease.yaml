---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app dragonfly
  namespace: dragonfly
spec:
  interval: 3m
  chartRef:
    kind: OCIRepository
    name: dragonfly
    namespace: flux-system
  values:
    crds:
      install: true
      keep: false
    # The operator chart already ships runAsNonRoot + drop ALL + no privilege
    # escalation; we add the seccomp profile and a read-only root filesystem to
    # reach the restricted Pod Security Standard.
    podSecurityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    manager:
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1 # Skew of 1 allows for rolling updates
          topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app.kubernetes.io/instance: *app
          whenUnsatisfiable: DoNotSchedule
    replicaCount: 2
    grafanaDashboard:
      enabled: true
    rbacProxy:
      enabled: false
