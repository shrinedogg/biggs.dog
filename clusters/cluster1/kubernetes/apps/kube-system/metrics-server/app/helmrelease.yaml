---
# metrics-server: feeds the metrics.k8s.io API (kubectl top, HPA).
# Chart 3.14.0 ships image v0.9.0 (supports k8s 1.34+; cluster runs 1.37.2).
# Defaults are used: self-signed TLS (tls.type: metrics-server), APIService
# with insecureSkipTLSVerify, RBAC + ServiceAccount created by the chart.
# Talos signs kubelet serving certs per node with hostname-only SANs (no IP
# SANs), so the chart default InternalIP-first address preference fails x509
# name validation and every node scrape is rejected. Override the
# --kubelet-preferred-address-types default (appended after defaultArgs; last
# occurrence wins) so nodes are dialed by hostname.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metrics-server
  namespace: kube-system
spec:
  interval: 3m
  chart:
    spec:
      chart: metrics-server
      version: 3.14.0
      sourceRef:
        kind: HelmRepository
        name: metrics-server
        namespace: flux-system
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    args:
      - --kubelet-preferred-address-types=Hostname
