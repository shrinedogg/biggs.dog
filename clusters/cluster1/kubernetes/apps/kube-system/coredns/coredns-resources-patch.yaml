---
# Bump CoreDNS resources beyond Talos defaults (100m/70Mi request, 170Mi memory limit).
# Applied as a Strategic Merge Patch on the coredns Deployment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coredns
  namespace: kube-system
spec:
  template:
    spec:
      containers:
        - name: coredns
          resources:
            requests:
              cpu: 200m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
