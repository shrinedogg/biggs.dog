---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 3m
  chart:
    spec:
      chart: cilium
      version: 1.20.0
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: flux-system
  maxHistory: 3
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    autoDirectNodeRoutes: true
    bandwidthManager:
      enabled: true
      bbr: true
    bpf:
      datapathMode: netkit # netkit can have issues with external LB traffic
      lbExternalClusterIP: true
      # Allow per-Service forwarding mode via the
      # service.cilium.io/forwarding-mode annotation. Default stays SNAT
      # (loadBalancer.mode below); only annotated Services (the dreamcast
      # Moonlight Services) opt into DSR so the high-bitrate host->client
      # video egresses directly from nv-01 instead of hairpinning back
      # through the ECMP ingress node + SNAT.
      lbModeAnnotation: true
      masquerade: true
      preallocateMaps: true
      # Kernel-side BPF perf event ring (bpf-flow-map-size). Distinct from
      # hubble.eventBufferCapacity (userspace flow ring shown in `hubble status`).
      # Larger value gives the kernel more buffering headroom before userspace
      # drains events.
      mapSizeFlows: 65536
    bgpControlPlane:
      enabled: true
    cgroup:
      automount:
        enabled: false
      hostRoot: /sys/fs/cgroup
    cluster:
      id: 1
      name: main
    cni:
      exclusive: true
    dashboards:
      enabled: true
    devices: "eth+ enp+ enx+ eno+ ens+ bond+"
    endpointRoutes:
      enabled: true
    endpointSlicePolicy: true
    envoy:
      enabled: true
      prometheus:
        enabled: true
        # serviceMonitor:
        #   enabled: true
    gatewayAPI:
      enabled: false
    hubble:
      enabled: true
      # Hubble userspace flow ring capacity (the "Max Flows" in `hubble status`).
      # Chart v1.19.4 exposes this ONLY as hubble.eventBufferCapacity (a string,
      # must be one of 2^n - 1: 1, 3, ... 4095, 8191, 16383, 32767, 65535).
      # Defaults to 4095, which was causing 100% flow-table exhaustion.
      # NOTE: bpf.mapSizeFlows / bpf-flow-map-size is a SEPARATE thing (the BPF
      # perf event ring in the kernel) and does NOT affect this counter.
      eventBufferCapacity: "65535"
      metrics:
        # Namespace source/destination context is added to flow/drop/tcp so the
        # metrics carry source_namespace / destination_namespace labels -- enough
        # to render an aggregate "which namespace talks to which" service map
        # (and see *where* drops happen) from VictoriaMetrics via vm-agent.
        # Kept at namespace (not pod) granularity to bound cardinality. For
        # exact per-port peers (precise policy authoring) use `hubble observe`.
        enabled:
          - dns:query
          - drop:sourceContext=namespace;destinationContext=namespace
          - tcp:sourceContext=namespace;destinationContext=namespace
          - flow:sourceContext=namespace;destinationContext=namespace
          - port-distribution
          - icmp
          - http
        # serviceMonitor left disabled to match the rest of this release --
        # scraping is via vmagent, not Prometheus-operator ServiceMonitors.
        # serviceMonitor:
        #   enabled: true
        dashboards:
          enabled: true
      relay:
        enabled: true
        rollOutPods: true
        # prometheus:
        #   serviceMonitor:
        #     enabled: true
      ui:
        enabled: true
        rollOutPods: true
        ingress:
          enabled: false
    ipam:
      mode: kubernetes
    ipv4NativeRoutingCIDR: 10.244.0.0/16
    k8sServiceHost: 192.168.2.30
    k8sServicePort: 6443
    kubeProxyReplacement: true
    kubeProxyReplacementHealthzBindAddr: 0.0.0.0:10256
    l2announcements:
      enabled: false
    loadBalancer:
      acceleration: disabled
      algorithm: maglev
      mode: snat
      # Required when bpf.lbModeAnnotation is enabled. "opt" carries the
      # service IP/port in an IPv4 option and is the dispatch mode for
      # native routing (geneve dispatch requires geneve tunnel mode, which
      # this cluster is not in -> agent crashloop). It needs all nodes on the
      # same L2 segment, which they are (192.168.2.0/24). Dispatch only applies
      # to the forward (client->pod) path when a packet lands on a non-backend
      # node -- for Moonlight that is small control/input packets, so the IP
      # option overhead never approaches MTU. The heavy video return path is
      # sent natively (no encap) direct from the backend node under DSR.
      dsrDispatch: opt
    localRedirectPolicy: true
    # nodePort:
    #   enabled: true
    #   bindProtection: true
    operator:
      dashboards:
        enabled: true
        annotations:
          grafana_folder: Cilium
      prometheus:
        enabled: true
        # serviceMonitor:
        #   enabled: true
      replicas: 2
      rollOutPods: true
    prometheus:
      enabled: true
      # serviceMonitor:
      #   enabled: true
      trustCRDsExist: true
    rollOutCiliumPods: true
    routingMode: native
    securityContext:
      capabilities:
        ciliumAgent:
          - CHOWN
          - KILL
          - NET_ADMIN
          - NET_RAW
          - IPC_LOCK
          - SYS_ADMIN
          - SYS_RESOURCE
          - PERFMON
          - BPF
          - DAC_OVERRIDE
          - FOWNER
          - SETGID
          - SETUID
        cleanCiliumState:
          - NET_ADMIN
          - SYS_ADMIN
          - SYS_RESOURCE
    socketLB:
      enabled: true
      hostNamespaceOnly: true
