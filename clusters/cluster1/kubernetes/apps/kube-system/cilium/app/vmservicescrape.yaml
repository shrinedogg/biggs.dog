---
# Scrape Hubble's Prometheus /metrics endpoint into Victoria Metrics.
# Hubble was enabled in helmrelease.yaml (hubble.metrics.enabled), which enables
# Hubble-specific metrics on :9965 (the `hubble-metrics` port of cilium-agent).
# The generic cilium-agent metrics (cilium_*) are on :9962 (the `prometheus` port).
# The VM Operator's vmagent runs selectAllByDefault=true, so this VMServiceScrape
# is auto-discovered with no vmagent config change.
#
# The `k8s-app: hubble` selector targets the Helm-managed `hubble-metrics`
# headless Service, which maps to port 9965 on all cilium-agent pods.
#
# Metrics exported (per hubble.metrics.enabled):
#   - hubble_flows_processed_total
#   - hubble_drop_total (with source_namespace/destination_namespace labels)
#   - hubble_tcp_flags_total
#   - hubble_dns_queries_total / hubble_dns_responses_total
#   - hubble_port_distribution_total
#   - hubble_icmp_total
#   - hubble_http_*
#
# With the current context config these carry namespace labels.
# For namespace-aware flows use source_namespace/destination_namespace labels
# available on hubble_drop_total, hubble_tcp_flags_total, and hubble_flow_total.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: hubble-metrics
  namespace: kube-system
  labels:
    app.kubernetes.io/name: hubble
spec:
  selector:
    matchLabels:
      k8s-app: hubble
  namespaceSelector:
    matchNames:
      - kube-system
  endpoints:
    - port: hubble-metrics
      path: /metrics
      interval: 30s
