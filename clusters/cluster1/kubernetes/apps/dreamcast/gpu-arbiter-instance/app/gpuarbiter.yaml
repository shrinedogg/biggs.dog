apiVersion: gpu.biggs.dog/v1alpha1
kind: GPUArbiter
metadata:
  name: cluster1
  labels:
    app.kubernetes.io/name: gpu-arbiter
    app.kubernetes.io/part-of: dreamcast
spec:
  vllm:
    namespace: ai-system
    name: vllm
  game:
    namespace: dreamcast
    labelSelector:
      matchExpressions:
        - key: app
          operator: In
          values:
            - direwolf-worker
  gateName: gpu.biggs.dog/await-vram
  metrics:
    url: http://vmsingle-stack.observability.svc:8428
    # min, not max: nv-01 has two RTX 5090s and vLLM holds BOTH (TP=2). With
    # max() the gate is always open while any card is idle, so gaming pods
    # were admitted into a card vLLM still owned. A session needs the wolf
    # sidecar AND the app to land on free VRAM, so gate on the emptiest
    # card's WORST case: only pass when every card has freeMiB available.
    query: min(DCGM_FI_DEV_FB_FREE)
    timeoutSeconds: 4
  freeMiB: 8000
  timeoutSeconds: 45
  intervalSeconds: 2
