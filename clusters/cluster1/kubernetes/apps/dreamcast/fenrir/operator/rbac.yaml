# direwolf-operator + moonlight-proxy RBAC (converted from the HelmRelease,
# Wave 1 de-Helm). All objects live in dreamcast.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: direwolf-operator
  labels:
    app.kubernetes.io/instance: fenrir
    app.kubernetes.io/name: fenrir
    app.kubernetes.io/version: 0.0.1
  namespace: dreamcast

---

apiVersion: v1
kind: ServiceAccount
metadata:
  name: moonlight-proxy
  labels:
    app.kubernetes.io/instance: fenrir
    app.kubernetes.io/name: fenrir
    app.kubernetes.io/version: 0.0.1
  namespace: dreamcast

---

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: direwolf-operator
  labels:
    app.kubernetes.io/instance: fenrir
    app.kubernetes.io/name: fenrir
    app.kubernetes.io/version: 0.0.1
  namespace: dreamcast
rules:
  - apiGroups:
    - coordination.k8s.io
    resources:
    - leases
    verbs:
    - get
    - list
    - watch
    - create
    - update
    - patch
    - delete
  - apiGroups:
    - direwolf.games-on-whales.github.io
    resources:
    - '*'
    verbs:
    - '*'
  - apiGroups:
    - apps
    resources:
    - deployments
    verbs:
    - get
    - list
    - watch
    - create
    - update
    - patch
    - delete
  - apiGroups:
    - ""
    resources:
    - services
    - persistentvolumeclaims
    - configmaps
    verbs:
    - get
    - list
    - watch
    - create
    - update
    - patch
    - delete

---

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: moonlight-proxy
  labels:
    app.kubernetes.io/instance: fenrir
    app.kubernetes.io/name: fenrir
    app.kubernetes.io/version: 0.0.1
  namespace: dreamcast
rules:
  - apiGroups:
    - direwolf.games-on-whales.github.io
    resources:
    - '*'
    verbs:
    - get
    - list
    - watch
  - apiGroups:
    - ""
    resources:
    - pods
    verbs:
    - get
    - list
    - watch
  - apiGroups:
    - direwolf.games-on-whales.github.io
    resources:
    - pairings
    - sessions
    verbs:
    - create
    - delete
    - patch
    - update
    - get
    - list
    - watch

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: direwolf-operator
  labels:
    app.kubernetes.io/instance: fenrir
    app.kubernetes.io/name: fenrir
    app.kubernetes.io/version: 0.0.1
  namespace: dreamcast
roleRef:
  kind: Role
  name: direwolf-operator
  apiGroup: rbac.authorization.k8s.io
subjects:
  - kind: ServiceAccount
    name: direwolf-operator
    namespace: dreamcast

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: moonlight-proxy
  labels:
    app.kubernetes.io/instance: fenrir
    app.kubernetes.io/name: fenrir
    app.kubernetes.io/version: 0.0.1
  namespace: dreamcast
roleRef:
  kind: Role
  name: moonlight-proxy
  apiGroup: rbac.authorization.k8s.io
subjects:
  - kind: ServiceAccount
    name: moonlight-proxy
    namespace: dreamcast

