# ConfigMap/direwolf: the 99-fix-home-perms.sh init script consumed by the
# App/User CRs (mounted into session pods). Converted from the HelmRelease
# (Wave 1 de-Helm).

apiVersion: v1
kind: ConfigMap
metadata:
  name: direwolf
  labels:
    app.kubernetes.io/instance: fenrir
    app.kubernetes.io/name: fenrir
    app.kubernetes.io/version: 0.0.1
  namespace: dreamcast
data:
  99-fix-home-perms.sh: |
    #!/usr/bin/env bash
    set -e

    # Log helper
    gow_log() { echo "$(date +"[%Y-%m-%d %H:%M:%S]") $*"; }

    gow_log "Fixing permissions for $HOME recursively at depth 1"
    find $HOME -mindepth 1 -maxdepth 1 -exec chown ${UNAME}:${UNAME} {} \;

    gow_log "Done fixing home ownership/permissions"
