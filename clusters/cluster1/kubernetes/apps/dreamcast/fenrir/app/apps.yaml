---
# yaml-language-server: $schema=https://github.com/games-on-whales/fenrir/raw/refs/heads/main/schemas/direwolf.games-on-whales.github.io/app_v1alpha1.json
# Adapted from upstream examples/nvidia_devices/firefox.yaml. appAssetWebP is
# required by the CRD; the upstream ~370KB poster is replaced with a tiny
# generated 300x400 solid-color WebP placeholder.
apiVersion: direwolf.games-on-whales.github.io/v1alpha1
kind: App
metadata:
  name: firefox
  namespace: dreamcast
spec:
  appAssetWebP: 
  id: 1
  isHDRSupported: true
  title: Firefox
  # Operator defaults: RWO, 5Gi. Local openebs host-path keeps the Firefox
  # profile on the node. The earlier "failed to create subPath directory"
  # error on this SC was solved by making the openebs BasePath writable for
  # kubelet (see the "host path and perms fixes" commit); ceph-block also
  # works if this ever regresses.
  volumeClaimTemplate:
    spec:
      storageClassName: host-path
  wolfConfig:
    runtimeVariables:
      # DRM nodes carry host numbering: renderD128 is the AMD iGPU, renderD129
      # the RTX 5090 in slot 1, renderD130 the RTX 5090 in slot 2. Pinning
      # renderD129 keeps the whole session on one card: wolf's compositor and
      # NVENC run there and the nested Sway follows wolf's dmabuf device.
      # Which 5090 Steam/Proton render on is up to the Vulkan loader (both
      # cards are visible to the privileged app container); cross-card dmabuf
      # imports would show up as black windows or CPU copies, not verified
      # either way yet. Both the wolf sidecar and the app container
      # are privileged, so the node is always present whatever the device
      # plugin allocated; if it ever is not (unprivileged sidecar), the
      # wolf-root-entrypoint ConfigMap re-points WOLF_RENDER_NODE at the
      # injected NVIDIA node. A wrong/missing node means wolf can't detect
      # the GPU vendor, falls back to software encoding, and the Wayland
      # display never starts (no video in Moonlight).
      renderNode: /dev/dri/renderD129
  template:
    spec:
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: app
          image: ghcr.io/games-on-whales/firefox:fedora
          resources:
            limits:
              nvidia.com/gpu: "1"
            requests:
              nvidia.com/gpu: "1"
          command:
            - /bin/bash
            - -c
            - |
              cleanup() {
                echo "Cleaning up..." >&2
                exit 0
              }
              trap cleanup SIGINT SIGTERM

              # Wait for wayland display to be available
              while [ ! -S $XDG_RUNTIME_DIR/$WAYLAND_DISPLAY ]; do
                echo "Waiting for wayland display..." >&2
                sleep 1
              done

              while [ ! -S $XDG_RUNTIME_DIR/pulse-socket ]; do
                echo "Waiting for pulse socket..." >&2
                sleep 1
              done

              export PULSE_SINK="$(pactl list sinks short | awk '$2 ~ /^virtual_sink/ {print $2; exit}')"
              export PULSE_SOURCE="${PULSE_SINK}.monitor"
              exec /entrypoint.sh
---
# Adapted from upstream examples/testball.yaml; same placeholder poster as
# above (appAssetWebP is required). Synthetic GStreamer test source; useful
# for verifying streaming without a real app container.
apiVersion: direwolf.games-on-whales.github.io/v1alpha1
kind: App
metadata:
  name: testball
  namespace: dreamcast
spec:
  appAssetWebP: 
  id: 3
  isHDRSupported: true
  title: Test Ball
  # Since volumeClaimTemplate is not defined, an ephemeral EmptyDir volume will be used.
  # Template carries only the nv-01 GPU-taint toleration: this app
  # has no app container (the operator assembles the sidecars), and
  # an empty template.spec preserves that default assembly.
  # containers: [] is required by the CRD whenever a template is set.
  template:
    spec:
      containers: []
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
  wolfConfig:
    runtimeVariables:
      # See the firefox app above: pins the session to the slot-1 5090.
      renderNode: /dev/dri/renderD129
    startAudioServer: false
    startVirtualCompositor: false
    audio:
      source: "audiotestsrc wave=ticks is-live=true"
    video:
      source: |
        videotestsrc pattern=ball flip=true is-live=true !
        video/x-raw, framerate={fps}/1
---
apiVersion: direwolf.games-on-whales.github.io/v1alpha1
kind: App
metadata:
  name: steam
  namespace: dreamcast
spec:
  appAssetWebP: 
  id: 2
  isHDRSupported: true
  title: Steam
  # Persists /home/retro (Steam login, library, installed games) across
  # sessions; without it the operator uses an ephemeral emptyDir. Local
  # host-path keeps game data on the GPU node. Note: openebs host-path does
  # not enforce the capacity request, it is bounded by the node's disk.
  volumeClaimTemplate:
    spec:
      storageClassName: host-path
      resources:
        requests:
          storage: 200Gi
  template:
    spec:
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      hostIPC: true
      # DLSS: restore the NVIDIA "wine" NGX bridge DLLs that the Talos
      # nonfree-kmod-nvidia extension strips. Proton looks for nvngx.dll /
      # _nvngx.dll under realpath(libGLX_nvidia.so)/../nvidia/wine (the CDI
      # spec roots driver libs at /usr/local/lib) and copies them into each
      # prefix's system32 when PROTON_ENABLE_NVAPI=1. Without them the in-game
      # DLSS toggle stays greyed out. This initContainer fetches the DLLs from
      # the matching NVIDIA driver .run (cached on the nvngx-cache PVC so the
      # download happens at most once) and stages them for the app container.
      initContainers:
        - name: nvngx-bridge
          image: ghcr.io/games-on-whales/steam:fedora-43
          securityContext:
            # Write to the fresh cache PVC / scratch emptyDir (root-owned).
            runAsUser: 0
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              # Must match the host NVIDIA driver shipped by the Talos extension.
              # Bump this when the node's nvidia driver/extension is upgraded.
              VER=615.78.08
              DEST=/cache
              mkdir -p "$DEST"
              if [ -f "$DEST/_nvngx.dll" ] && [ -f "$DEST/nvngx.dll" ] \
                 && [ "$(cat "$DEST/.driver-version" 2>/dev/null || true)" = "$VER" ]; then
                echo "nvngx cache hit for driver $VER"
                exit 0
              fi
              echo "nvngx cache miss; downloading NVIDIA $VER to extract wine NGX DLLs"
              cd /work
              url="https://us.download.nvidia.com/XFree86/Linux-x86_64/$VER/NVIDIA-Linux-x86_64-$VER.run"
              if command -v curl >/dev/null 2>&1; then
                curl -fsSL -o nv.run "$url"
              else
                wget -qO nv.run "$url"
              fi
              sh nv.run -x
              main="$(find . -name nvngx.dll -type f | head -n1)"
              bridge="$(find . -name _nvngx.dll -type f | head -n1)"
              if [ -z "$main" ] || [ -z "$bridge" ]; then
                echo "ERROR: nvngx.dll/_nvngx.dll not found in extracted driver" >&2
                exit 1
              fi
              install -m 0644 "$main" "$DEST/nvngx.dll"
              install -m 0644 "$bridge" "$DEST/_nvngx.dll"
              echo "$VER" > "$DEST/.driver-version"
              echo "staged nvngx bridge DLLs:"
              ls -l "$DEST"
          volumeMounts:
            - name: nvngx-cache
              mountPath: /cache
            - name: nvngx-work
              mountPath: /work
      containers:
        - name: app
          image: ghcr.io/games-on-whales/steam:fedora-43
          # Without a GPU allocation the container gets no /dev/dri node and no
          # driver libs (CDI injection is per-allocated-container), so Sway and
          # Steam render nothing onto the Wayland display -> black video.
          # nv-01 exposes 4 time-sliced nvidia.com/gpu replicas, so the wolf
          # sidecar and the app each requesting one is fine.
          resources:
            limits:
              nvidia.com/gpu: "1"
              # Hard RAM cap for the Steam container (Sway + Steam + game
              # process). nv-01 has ~61Gi total; 24Gi leaves headroom for a
              # second concurrent session plus vLLM and system.
              memory: 24Gi
            requests:
              nvidia.com/gpu: "1"
          securityContext:
            # Privileged is required for controller input: wolf hotplugs
            # uinput devices mid-session and the container's device cgroup
            # denies open() on /dev/input/event* ("Operation not permitted").
            # Kubernetes has no equivalent of Docker's device_cgroup_rules
            # (c 13:* rmw), so privileged is the only way to admit devices
            # that do not exist at container start.
            privileged: true
            capabilities:
              add:
                [
                  "SYS_ADMIN",
                  "SYS_NICE",
                  "SYS_PTRACE",
                  "NET_RAW",
                  "MKNOD",
                  "NET_ADMIN",
                ]
            seccompProfile:
              type: Unconfined
            appArmorProfile:
              type: Unconfined
            allowPrivilegeEscalation: true
            runAsUser: 0
            runAsGroup: 0
          env:
            # Gamescope on driver 615.78.08 is BROKEN (biggs.dog#622): every
            # gamescope output buffer fails EGL import in wolf's compositor
            # (EGL_BAD_ALLOC, app crashloop, black stream). Not 10-bit, not
            # cross-GPU; driver rejects gamescope's exact Vulkan allocation
            # (physically 12288-pitch, declared 12096). Kept enabled only for
            # re-testing when the driver moves; revert to RUN_SWAY for a
            # working stream.
            # Older context: gamescope's WSI offers games an HDR10 swapchain
            # directly, bypassing the compositor color management sway 1.11
            # lacks (no wp_color_management_v1). The 2026-10-11 gamescope
            # rejection was the missing /dev/nvidia-modeset root cause; Xid 109
            # risk under the pre-615 driver is what the gpu-arbiter mitigates.
            - name: RUN_SWAY
              value: "true"
            # NOTE: RUN_GAMESCOPE must stay ABSENT (the gow startup scripts
            # test -n, so "false" still enables gamescope). Keep the
            # GAMESCOPE_MODE env below for the next re-test; it is inert
            # under sway.
            # --hdr-enabled: offer an HDR10 swapchain to the game (needs
            # gamescope 3.14+ in the image). -b: borderless (the game's own
            # exclusive-fullscreen path is what stalled under Xwayland).
            # --prefer-vk-device: pin the slot-1 5090 (10de:2b85), kept from
            # the 2026-10-11 test.
            # NOTE (2026-10-14): with wolf < v0.2.4 gamescope crashlooped under
            # wolf regardless of --hdr-enabled: its Wayland backend picks
            # XBGR2101010 output whenever the host advertises it and NVIDIA
            # 615 EGL rejects Vulkan-allocated XB30 imports. wolf v0.2.4 hides
            # 10-bit RGB from clients, so gamescope now outputs XR24 (8-bit).
            # --hdr-enabled is kept for the game-facing HDR10 swapchain offer;
            # the gamescope->wolf hop is 8-bit until the NVIDIA import works.
            - name: GAMESCOPE_MODE
              value: "--hdr-enabled -b --prefer-vk-device 10de:2b85"
            - name: PROTON_LOG
              value: "1"
            # Same fix as the wolf sidecar (user.yaml): the CDI hook drops the
            # NVIDIA GBM backend in /usr/local/lib/gbm but Mesa's libgbm only
            # searches its own backend dir: /usr/lib64/gbm on the Fedora base
            # (steam:fedora-43), /usr/lib/x86_64-linux-gnu/gbm on the old
            # Ubuntu base. Without it Sway falls back to dumb buffers
            # (rejected by NVIDIA render nodes), no output gets created, and
            # Steam never launches -> black stream.
            - name: GBM_BACKENDS_PATH
              value: /usr/local/lib/gbm:/usr/lib64/gbm
            # Pin the Vulkan loader to the NVIDIA ICD only. The privileged
            # container sees both of nv-01's GPUs (/dev/dri/renderD128 = AMD
            # 7800X3D iGPU via Mesa's radeon_icd.json, and renderD129 = RTX 5090
            # via nvidia_icd.json). The Mesa ICD sorts first, so the Vulkan
            # loader enumerates AMD as device 0 and NVIDIA as device 1. Games
            # still pick the 5090 (UE5 chooses the dedicated adapter), but Steam's
            # Hardware page reports the first enumerated device (AMD) and every
            # app wastes effort skipping the phantom iGPU. VK_DRIVER_FILES
            # restricts the loader to only nvidia_icd.json so Vulkan exposes just
            # the RTX 5090 everywhere (Steam UI, DXVK, vkd3d, gamescope). This
            # also makes the gamescope --prefer-vk-device above a redundant
            # safety net (kept anyway).
            - name: VK_DRIVER_FILES
              value: /etc/vulkan/icd.d/nvidia_icd.json
            # DLSS under Proton is gated behind NVAPI: the game queries NVIDIA's
            # NGX/DLSS support through DXVK-NVAPI (Proton's nvapi64.dll), which is
            # only loaded when PROTON_ENABLE_NVAPI is set. Without it the in-game
            # DLSS option stays greyed out regardless of the RTX GPU. These are
            # Proton-side toggles consumed by the entrypoint, so they take effect
            # even though the GPU is injected via CDI. NOTE: the staged
            # nvngx.dll/_nvngx.dll bridge (nvngx-bridge initContainer) crashes
            # Windrose during DLSS NGX Vulkan RHI pre-init under Proton 10, but
            # works on Proton Experimental -- so keep DLSS on while on Experimental.
            - name: PROTON_ENABLE_NVAPI
              value: "1"
            - name: DXVK_ENABLE_NVAPI
              value: "1"
          # NOTE: do not set NVIDIA_DRIVER_CAPABILITIES here. The operator
          # already appends NVIDIA_DRIVER_CAPABILITIES=all to the app container
          # (session.go), and a duplicate env key makes the server-side-apply
          # patch invalid -> the Deployment is never created and the session
          # reaper kills the session after 60s.
          command:
            - /bin/bash
            - -c
            - |
              cleanup() {
                echo "Cleaning up..." >&2
                exit 0
              }
              trap cleanup SIGINT SIGTERM

              # Wait for wayland display to be available
              while [ ! -S $XDG_RUNTIME_DIR/$WAYLAND_DISPLAY ]; do
                echo "Waiting for wayland display..." >&2
                sleep 1
              done

              while [ ! -S $XDG_RUNTIME_DIR/pulse-socket ]; do
                echo "Waiting for pulse socket..." >&2
                sleep 1
              done

              # Sway config hook: the GOW base sway config (see launch-comp.sh)
              # includes /home/retro/.config/sway/custom-cfg at the top, and
              # launch-comp's cp does NOT overwrite it, so it lives on the state
              # PVC. It used to carry `for_window [class="steam_app_*"]` and
              # `[class="steam"]` fullscreen rules. Those were wrong twice over:
              # sway criteria are unanchored regexes (both match EVERY window of
              # the Proton prefix, whose WM_CLASS is always steam_app_<appid>),
              # and for_window fires at map time, before Xwayland windows set
              # WM_CLASS. The fullscreen watcher below is now the only place that
              # fullscreens. Truncate the file so the old rules on existing state
              # PVCs stop loading.
              mkdir -p /home/retro/.config/sway
              : > /home/retro/.config/sway/custom-cfg

              # Do NOT export PULSE_SINK/PULSE_SOURCE here: this image has no
              # pactl, so the old lookup exported PULSE_SINK="" and
              # PULSE_SOURCE=".monitor". libpulse treats a set-but-bogus device
              # name as an explicit request and fails the stream instead of
              # falling back, leaving Steam silent. The wolf pulseaudio server
              # already makes the session's virtual sink the default sink.

              # NOTE: in-pod systemd-udevd + udevadm trigger REMOVED (was here
              # for Steam Input's emulated pads). With the pod-private
              # /dev/input (operator v0.1.3+) session input discovery is the
              # wolf-agent's job alone: it writes the udev db entries and
              # broadcasts the netlink events for THIS session's devices.
              # The old `udevadm trigger` replayed HOST-wide sysfs, which
              # re-created nodes for every other session's pads inside this
              # pod (the exact leak the private /dev/input exists to stop).
              # Steam Input's own uinput pads are kernel-global with no
              # creator identity in their uevents, so they can never be
              # scoped per session: they get no node here by design. Games
              # must read the wolf pad directly -> set the game's controller
              # override to "Disable Steam Input" (BPM: game > gear icon >
              # Controller Options), otherwise Steam grabs the wolf pad and
              # re-emits it as a pad this pod cannot see (menu works, game
              # sees no controller).

              # Focus guard (sway only): Steam's steamwebhelper maps an
              # invisible, unnamed, class-less notification popup (role
              # "popup", _NET_WM_WINDOW_TYPE_NOTIFICATION) that grabs X input
              # focus away from the running game. Gamescope pins focus to the
              # game so it is immune; sway honors the client-side
              # XSetInputFocus and keyboard + Steam Input controller routing
              # both break (input lands in the popup, Steam thinks BPM is
              # foreground). The guard polls X focus and, while a viewable
              # titled steam_app_* window exists, returns focus to it whenever
              # an unnamed/class-less window holds it. Legitimate focus changes
              # (BPM has WM_CLASS steamwebhelper) are untouched.
              # Raw libX11 through ctypes, so the guard does not depend on the
              # image shipping python3-xlib: on biggs-sz's steam:edge image the
              # old `from Xlib import ...` version died on import at every
              # session start and never ran. The X error handler is a no-op
              # because windows vanish between calls.
              cat > /tmp/focus-guard.py <<'PYEOF'
              import ctypes
              import sys
              import time

              DEBUG = "--debug" in sys.argv  # manual runs only
              x = ctypes.CDLL("libX11.so.6")
              Window = ctypes.c_ulong
              IS_VIEWABLE = 2
              REVERT_TO_PARENT = 2


              class XClassHint(ctypes.Structure):
                  _fields_ = [("res_name", ctypes.c_void_p), ("res_class", ctypes.c_void_p)]


              class XWindowAttributes(ctypes.Structure):
                  _fields_ = [
                      ("x", ctypes.c_int), ("y", ctypes.c_int),
                      ("width", ctypes.c_int), ("height", ctypes.c_int),
                      ("border_width", ctypes.c_int), ("depth", ctypes.c_int),
                      ("visual", ctypes.c_void_p), ("root", Window),
                      ("class_", ctypes.c_int), ("bit_gravity", ctypes.c_int),
                      ("win_gravity", ctypes.c_int), ("backing_store", ctypes.c_int),
                      ("backing_planes", ctypes.c_ulong), ("backing_pixel", ctypes.c_ulong),
                      ("save_under", ctypes.c_int), ("colormap", ctypes.c_ulong),
                      ("map_installed", ctypes.c_int), ("map_state", ctypes.c_int),
                      ("all_event_masks", ctypes.c_long), ("your_event_mask", ctypes.c_long),
                      ("do_not_propagate_mask", ctypes.c_long),
                      ("override_redirect", ctypes.c_int), ("screen", ctypes.c_void_p),
                  ]


              ERROR_HANDLER = ctypes.CFUNCTYPE(ctypes.c_int, ctypes.c_void_p, ctypes.c_void_p)
              ignore_errors = ERROR_HANDLER(lambda d, e: 0)
              x.XSetErrorHandler(ignore_errors)
              x.XOpenDisplay.restype = ctypes.c_void_p
              x.XOpenDisplay.argtypes = [ctypes.c_char_p]
              x.XDefaultRootWindow.restype = Window
              x.XDefaultRootWindow.argtypes = [ctypes.c_void_p]
              x.XQueryTree.argtypes = [ctypes.c_void_p, Window, ctypes.POINTER(Window),
                                       ctypes.POINTER(Window),
                                       ctypes.POINTER(ctypes.POINTER(Window)),
                                       ctypes.POINTER(ctypes.c_uint)]
              x.XGetClassHint.argtypes = [ctypes.c_void_p, Window, ctypes.POINTER(XClassHint)]
              x.XFetchName.argtypes = [ctypes.c_void_p, Window, ctypes.POINTER(ctypes.c_void_p)]
              x.XGetWindowAttributes.argtypes = [ctypes.c_void_p, Window,
                                                 ctypes.POINTER(XWindowAttributes)]
              x.XGetInputFocus.argtypes = [ctypes.c_void_p, ctypes.POINTER(Window),
                                           ctypes.POINTER(ctypes.c_int)]
              x.XSetInputFocus.argtypes = [ctypes.c_void_p, Window, ctypes.c_int, ctypes.c_ulong]
              x.XSync.argtypes = [ctypes.c_void_p, ctypes.c_int]
              x.XFree.argtypes = [ctypes.c_void_p]


              def take(ptr):
                  if not ptr:
                      return ""
                  s = ctypes.string_at(ptr).decode(errors="replace")
                  x.XFree(ptr)
                  return s


              def wm_class(d, w):
                  hint = XClassHint()
                  if not x.XGetClassHint(d, w, ctypes.byref(hint)):
                      return None
                  return take(hint.res_name), take(hint.res_class)


              def wm_name(d, w):
                  p = ctypes.c_void_p()
                  if not x.XFetchName(d, w, ctypes.byref(p)):
                      return ""
                  return take(p.value)


              def game_window(d):
                  # The largest viewable, titled steam_app_* window. Every window of the
                  # Proton prefix shares the steam_app_* class (the untitled Wine system
                  # tray, "Default IME" helpers, launchers), so the class alone would
                  # often pick the tray instead of the game.
                  root, parent = Window(), Window()
                  children = ctypes.POINTER(Window)()
                  n = ctypes.c_uint()
                  if not x.XQueryTree(d, x.XDefaultRootWindow(d), ctypes.byref(root),
                                      ctypes.byref(parent), ctypes.byref(children),
                                      ctypes.byref(n)):
                      return None
                  best, best_area = None, 0
                  for i in range(n.value):
                      w = children[i]
                      cls = wm_class(d, w)
                      if not cls or not cls[0].startswith("steam_app_"):
                          continue
                      name = wm_name(d, w)
                      if not name or name == "Default IME":
                          continue
                      attrs = XWindowAttributes()
                      if not x.XGetWindowAttributes(d, w, ctypes.byref(attrs)):
                          continue
                      area = attrs.width * attrs.height
                      if attrs.map_state == IS_VIEWABLE and area > best_area:
                          best, best_area = w, area
                  if children:
                      x.XFree(children)
                  return best


              while True:
                  d = x.XOpenDisplay(b":0")
                  if not d:
                      time.sleep(5)
                      continue
                  while True:
                      game = game_window(d)
                      if game is not None:
                          focus, revert = Window(), ctypes.c_int()
                          x.XGetInputFocus(d, ctypes.byref(focus), ctypes.byref(revert))
                          f = focus.value
                          if DEBUG:
                              print("game", hex(game), repr(wm_name(d, game)),
                                    "focus", hex(f), flush=True)
                          # 0 = None, 1 = PointerRoot: nothing to steal back from.
                          if f not in (0, 1, game.value) and not wm_class(d, f) and not wm_name(d, f):
                              x.XSetInputFocus(d, game, REVERT_TO_PARENT, 0)
                              x.XSync(d, 0)
                              if DEBUG:
                                  print("refocused", hex(game), flush=True)
                      time.sleep(1)
              PYEOF
              if [ "$RUN_SWAY" = "true" ]; then
                (
                  while [ ! -S /tmp/.X11-unix/X0 ]; do sleep 2; done
                  exec runuser -u ${UNAME:-retro} -- env DISPLAY=:0 python3 /tmp/focus-guard.py
                ) &
              fi

              # Fullscreen watcher (sway only): GOW's sway config tiles every
              # window, so without this Steam Big Picture and the game sit
              # side-by-side. Rules, all keyed on sway con ids:
              # - A game window (X11: class exactly steam_app_<digits>, a
              #   non-empty title, type normal, not transient; Wayland
              #   (PROTON_ENABLE_WAYLAND): app_id *.exe with a title) is
              #   fullscreened ONCE, when it first appears. Every Wine window
              #   carries the steam_app_* class, including the untitled Wine
              #   system tray (explorer.exe /desktop, 160x20) and launcher
              #   dialogs. The old loop fullscreened every match every 2s, so
              #   with RDR2 the tray (holding the Rockstar tray icon) was
              #   stretched over the Rockstar Games Launcher (white screen,
              #   tiny logo top-left), and launcher dialogs such as the cloud
              #   save prompt were covered again within 2s. Once-per-window
              #   lets dialogs and popups that open later stay on top.
              # - Whenever nothing is fullscreen, the newest surviving game
              #   window is re-fullscreened, else Steam Big Picture (class
              #   exactly "steam"). Games can drop their own fullscreen after
              #   start (NieR:Automata in windowed mode does): without the
              #   game-first fallback BPM took the screen and the game was
              #   left tiled and hidden behind it. BPM also fills the output
              #   again after a game exits.
              # - A Wayland game is re-focused if BPM takes focus: an occluded
              #   Wayland game pauses rendering (DXGI occlusion), which reads as
              #   a black/frozen stream. sway 1.11 has no color management, so
              #   these games stay SDR even with PROTON_ENABLE_HDR set.
              # Debug by hand: python3 /tmp/fs-watcher.py --debug
              cat > /tmp/fs-watcher.py <<'PYEOF'
              import json
              import re
              import subprocess
              import sys
              import time

              SOCK = "/tmp/.X11-unix/sway.socket"
              GAME_CLASS = re.compile(r"^steam_app_\d+$")
              DEBUG = "--debug" in sys.argv  # manual runs only


              def sway(*args):
                  return subprocess.run(["swaymsg", "-s", SOCK, *args],
                                        capture_output=True, text=True, timeout=5)


              def views(node):
                  for key in ("nodes", "floating_nodes"):
                      for child in node.get(key) or []:
                          if "shell" in child:
                              yield child
                          yield from views(child)


              def is_bpm(v):
                  props = v.get("window_properties") or {}
                  return props.get("class") == "steam"


              def is_game(v):
                  if not v.get("name"):
                      return False
                  if v.get("shell") == "xdg_shell":
                      return (v.get("app_id") or "").endswith(".exe")
                  props = v.get("window_properties") or {}
                  return (GAME_CLASS.match(props.get("class") or "") is not None
                          and props.get("window_type") in (None, "normal")
                          and not props.get("transient_for"))


              games = []  # game con ids, first-seen order
              last_wayland_game = None
              while True:
                  try:
                      vs = list(views(json.loads(sway("-t", "get_tree").stdout)))
                      ids = {v["id"] for v in vs}
                      games = [g for g in games if g in ids]
                      for v in vs:
                          if v["id"] in games or not is_game(v):
                              continue
                          sway(f"[con_id={v['id']}] fullscreen enable")
                          games.append(v["id"])
                          if v.get("shell") == "xdg_shell":
                              sway(f"[con_id={v['id']}] focus")
                              last_wayland_game = v["id"]
                          if DEBUG:
                              print("fullscreen", v["id"], repr(v.get("name")), flush=True)
                      if not any(v.get("fullscreen_mode") for v in vs):
                          # Nothing fullscreen: a game dropped its own fullscreen (NieR
                          # does right after start), or the game exited. Prefer the
                          # newest surviving game window, else Big Picture.
                          target = games[-1] if games else next(
                              (v["id"] for v in vs if is_bpm(v)), None)
                          if target is not None:
                              sway(f"[con_id={target}] fullscreen enable")
                              if DEBUG:
                                  print("refullscreen", target, flush=True)
                      if last_wayland_game in ids:
                          focused = next((v for v in vs if v.get("focused")), None)
                          if focused is not None and is_bpm(focused):
                              sway(f"[con_id={last_wayland_game}] focus")
                  except Exception as exc:
                      if DEBUG:
                          print("error", exc, flush=True)
                  time.sleep(2)
              PYEOF
              if [ "$RUN_SWAY" = "true" ]; then
                (
                  while [ ! -S /tmp/.X11-unix/sway.socket ]; do sleep 2; done
                  exec runuser -u ${UNAME:-retro} -- python3 /tmp/fs-watcher.py
                ) &
              fi

              chown -R $PUID:$PGID /home/retro
              chmod -R 777 /home/retro
              exec /entrypoint.sh
          volumeMounts:
            - name: uinput
              mountPath: /dev/uinput
            # /dev/input is NOT mounted here: the operator (v0.1.3+) gives
            # every session pod a pod-private emptyDir at /dev/input and the
            # wolf-agent mknods only this session's input devices into it.
            # Mounting the host's /dev/input leaked every other session's
            # uinput controllers into this pod (duplicate pads, cross-input).
            # Steam's CEF UI (steamwebhelper) allocates its GPU command buffers
            # in /dev/shm; the container-runtime default of 64Mi fills instantly
            # and Big Picture renders nothing (black screen with cursor).
            - name: dshm
              mountPath: /dev/shm
            # udev database written by the wolf-agent (fake-udev) so SDL/Steam
            # detect the virtual controllers wolf hotplugs. The volume is
            # defined in the User spec (user.yaml) and shared across the pod.
            - name: udev-data
              mountPath: /run/udev
            # DLSS: the nvngx-bridge initContainer stages the NVIDIA wine NGX
            # bridge DLLs here. Proton derives this exact path from
            # realpath(libGLX_nvidia.so)/../nvidia/wine (CDI roots driver libs in
            # /usr/local/lib) and copies them into each prefix's system32.
            - name: nvngx-cache
              mountPath: /usr/local/lib/nvidia/wine
              readOnly: true
      volumes:
        - name: uinput
          hostPath:
            path: /dev/uinput
            type: CharDevice
        # input-events (hostPath /dev/input) removed: the operator (v0.1.3+)
        # always creates a pod-private emptyDir at /dev/input. See the
        # volumeMounts comment above.
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 4Gi
        # Persistent cache (host-path on nv-01) holding the extracted wine NGX
        # bridge DLLs so the NVIDIA driver .run is downloaded at most once.
        - name: nvngx-cache
          persistentVolumeClaim:
            claimName: nvngx-cache
        # Scratch space for the initContainer to download + extract the .run.
        - name: nvngx-work
          emptyDir:
            sizeLimit: 4Gi
  wolfConfig:
    runtimeVariables:
      # See the firefox app above: pins the session to the slot-1 5090.
      renderNode: /dev/dri/renderD129
