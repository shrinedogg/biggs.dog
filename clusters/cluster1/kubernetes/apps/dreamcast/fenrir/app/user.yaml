---
# yaml-language-server: $schema=https://github.com/games-on-whales/fenrir/raw/refs/heads/main/schemas/direwolf.games-on-whales.github.io/user_v1alpha1.json
apiVersion: direwolf.games-on-whales.github.io/v1alpha1
kind: User
metadata:
  # The first user (renamed from the original hardcoded "alex").
  name: joey
  namespace: dreamcast
spec:
  resources:
    limits:
      nvidia.com/gpu: "1"
      memory: 42G
    requests:
      nvidia.com/gpu: "1"
      memory: 42G
  # wolf:stable must start as root: its supervisord.conf has user=root and
  # drops privileges per-program itself, but the operator hardcodes
  # PUID=1000/UNAME=ubuntu into the wolf container, so the GOW entrypoint
  # gosu's to a non-root user before supervisord runs -> "Can't drop
  # privilege as nonroot user" crash loop.
  #
  # Do NOT fix this by re-declaring PUID/PGID/UNAME in the policy env: the
  # operator builds the Deployment with server-side apply and env is a
  # listType=map keyed by name, so duplicate names are rejected outright
  # ("duplicate entries for key [name=PUID]") and the session Deployment is
  # never created -- Moonlight then hangs until it times out. Instead, shadow
  # the GOW /entrypoint.sh with a wrapper that forces root and skips gosu
  # (see wolf-entrypoint.yaml).
  volumes:
    - name: wolf-root-entrypoint
      configMap:
        name: wolf-root-entrypoint
        defaultMode: 0755
    # Pod-local udev database shared between the wolf-agent (writer) and the
    # app container (reader, mounted at /run/udev). The agent plays the role
    # of wolf's fake-udev: kernel uevents for the uinput devices wolf creates
    # are only delivered in the host's network namespace, so without this
    # SDL/Steam never detect hotplugged controllers.
    - name: udev-data
      emptyDir: {}
  sidecarPolicies:
    wolf:
      env:
        - name: NVIDIA_DRIVER_CAPABILITIES
          value: all
        - name: NVIDIA_VISIBLE_DEVICES
          value: all
        # The gpu-operator (CDI mode) injects the driver under /usr/local/lib
        # and creates the GBM backend symlink at /usr/local/lib/gbm/, but the
        # image's Mesa libgbm only searches /usr/lib/x86_64-linux-gnu/gbm.
        # Without the nvidia backend, waylanddisplaysrc cannot allocate
        # DMA-BUFs ("Failed to create GsCUDABuf" panic -> no video stream).
        - name: GBM_BACKENDS_PATH
          value: /usr/local/lib/gbm:/usr/lib/x86_64-linux-gnu/gbm
      volumeMounts:
        - name: wolf-root-entrypoint
          mountPath: /entrypoint.sh
          subPath: entrypoint.sh
      # NVENC on a multi-GPU host needs every GPU's device node. On session
      # open, libnvidia-encode asks the Resource Manager for the attached GPU
      # IDs (all host GPUs, even inside a 1-GPU container) and then tries to
      # open each /dev/nvidiaN for peer init; when the other card's node is
      # missing it bails with NV_ENC_ERR_UNSUPPORTED_DEVICE before the
      # encoder is even created (driver regression since 570.x, still present
      # on 595.71.05: NVIDIA/nvidia-container-toolkit#1249, k8s-device-plugin
      # #1282; reproduced here with a raw nvEncOpenEncodeSessionEx). The
      # symptom is gst-inspect logging "nvh265encoder ... Failed to open
      # session" so nvcodec registers no encoders and wolf silently uses
      # software x264/x265 at full stream resolution. Privileged exposes the
      # host's whole /dev, which satisfies the peer init and makes nvcodec
      # register nvh264enc/nvh265enc/nvav1enc (verified in a throwaway pod:
      # unprivileged + 1 GPU fails, privileged + 1 GPU works). The app
      # container is privileged already for the same class of reason (uinput
      # hotplug), so this widens nothing new for the session pod. Revisit when
      # the Talos nvidia extension moves to a driver with the RM fix (NVIDIA
      # points at 610.x), or by shipping an LD_PRELOAD filter for the
      # attached-IDs ioctl in the shrinedogg/wolf image.
      securityContext:
        privileged: true
      resources:
        requests:
          nvidia.com/gpu: "1"
          squat.ai/uinput: "1"
        limits:
          nvidia.com/gpu: "1"
          squat.ai/uinput: "1"
    wolfAgent:
      volumeMounts:
        - name: udev-data
          mountPath: /run/udev
      securityContext:
        # Broadcasting synthetic libudev netlink events (fake-udev) requires
        # CAP_NET_ADMIN in the pod's network namespace.
        capabilities:
          add: ["NET_ADMIN"]

---
# Second user for concurrent multi-session streaming (one Moonlight client
# per user; /launch only stops that user's sessions). Pair a client with
# username "stacie" on the pin page. The spec mirrors joey: same
# sidecar policies (root wolf entrypoint, GBM path, privileged wolf
# sidecar for NVENC peer-init, uinput) since both hit the same nv-01
# constraints.
apiVersion: direwolf.games-on-whales.github.io/v1alpha1
kind: User
metadata:
  name: stacie
  namespace: dreamcast
  resources:
    limits:
      nvidia.com/gpu: "1"
      memory: 42G
    requests:
      nvidia.com/gpu: "1"
      memory: 42G
  # wolf:stable must start as root: its supervisord.conf has user=root and
  # drops privileges per-program itself, but the operator hardcodes
  # PUID=1000/UNAME=ubuntu into the wolf container, so the GOW entrypoint
