---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fenrir
  namespace: dreamcast
spec:
  interval: 3m
  chartRef:
    kind: OCIRepository
    name: direwolf-operator
    namespace: flux-system
  # Upstream chart defaults are already correct for this cluster:
  # - moonlight-proxy LoadBalancer Service with lbipam.cilium.io/sharing-key: direwolf
  #   (Cilium LB-IPAM shares one LB IP between the proxy and per-session services)
  # - cert-manager Issuers/Certificates via rawResources (cert-manager is installed)
  values:
    # The SNAPSHOT chart was built from PR #7 and bakes the CI ref "7/merge"
    # into its image tags, which kubelet rejects (InvalidImageName). Override
    # all three with the published "main" tag (pullPolicy is Always upstream).
    controllers:
      direwolf_operator:
        containers:
          operator:
            image:
              # Patched fork: retries stream reconciliation (upstream stalls
              # the session until the 1-minute reaper kills it whenever the
              # agent is not up on the first try) and prunes stale
              # trackedSessions entries that spam logs.
              # v0.1.1 adds the user controller: it publishes the proxy pin
              # URL into User.Status.PublicPinURL (multi-user pairing; the
              # moonlight-proxy v0.1.2 pin page posts a username, so each
              # client pairs as its own User CR instead of hardcoded alex).
              # v0.1.2 makes concurrent sessions work: every per-session RTP
              # Service shares one LB VIP, so they are disambiguated by port.
              # The operator now allocates a unique port block per session and
              # tells wolf to listen on it (WOLF_RTSP_SETUP_PORT etc.), and no
              # longer deletes other sessions' Services (that livelock was
              # tearing two streams down). Single-session setups are
              # unchanged: the first session keeps the original ports.
              # Built from https://github.com/shrinedogg/fenrir (tag v0.1.3).
              repository: docker.io/shrinedogg/operator
              tag: v0.1.3
            # The operator's --lb-sharing-key defaults to POD_NAMESPACE
            # ("dreamcast"), but the chart's moonlight-proxy Service is
            # annotated with sharing-key "direwolf". Mismatched keys make
            # Cilium LB-IPAM hand the per-session RTP Service a *different*
            # external IP than the proxy, so Moonlight's RTSP handshake to
            # the paired IP:48010 times out (macOS errno 60). Align the key
            # so every session Service shares the proxy's LB IP.
            args:
              - --lb-sharing-key=direwolf
              # The moonlight-proxy Service in this cluster is named
              # "direwolf" (not the chart's "moonlight-proxy" default), so
              # the user controller needs the explicit name to publish the
              # pin URL.
              - --proxy-service-name=direwolf
            env:
              # Patched fork: the agent acts as fake-udev for hotplugged
              # input devices (writes /run/udev/data entries to the shared
              # udev-data volume and broadcasts synthetic udev netlink
              # events in the pod netns) so SDL/Steam detect controllers.
              # v0.1.2: the agent also mknods this session's input devices
              # into the pod-private /dev/input (see operator v0.1.3), so
              # concurrent sessions stop seeing each other's controllers.
              # Built from https://github.com/shrinedogg/fenrir (tag v0.1.2).
              AGENT_IMAGE: docker.io/shrinedogg/wolf-agent:v0.1.2
              # Patched wolf: gst-wayland-display no longer advertises the
              # legacy wl_drm global when dmabuf v4 feedback is active, which
              # crashed nested wlroots compositors (sway) with
              # assert(wl->drm_render_name == NULL). Overlay built from
              # https://github.com/shrinedogg/gst-wayland-display
              # (branch fix/optional-wl-drm) on ghcr.io/games-on-whales/wolf:stable.
              WOLF_IMAGE: docker.io/shrinedogg/wolf:v0.1.0
      moonlight_proxy:
        containers:
          proxy:
            # NOTE: also see the service.app pin below — it stabilizes the
            # shared direwolf LB VIP.
            image:
              # Patched fork: /launch waits up to 120s (upstream 25s) for the
              # session pod to come up. A cold start (image pull + wolf boot +
              # agent readiness) exceeds 25s, so upstream returned 500 right
              # before the pod was ready and the client cancelled the session.
              # v0.1.2 adds multi-user pairing: the pin page collects a
              # username (posted with the PIN) and the pairing is bound to
              # that User CR. The hardcoded-alex pin page is gone, so every
              # pairing from now on must enter a username.
              # Built from https://github.com/shrinedogg/fenrir (tag v0.1.2).
              repository: docker.io/shrinedogg/moonlight-proxy
              tag: v0.1.2
    # Pin the shared moonlight-proxy LoadBalancer VIP. The chart's service.app
    # already carries lbipam.cilium.io/sharing-key: direwolf (and the per-session
    # RTP Services share this IP via that key); Helm merges this annotation in,
    # so the whole direwolf group stays on a stable address instead of drifting
    # across the pool on recreation. .6.12 is its current assignment.
    service:
      app:
        annotations:
          io.cilium/lb-ipam-ips: "192.168.6.12"
