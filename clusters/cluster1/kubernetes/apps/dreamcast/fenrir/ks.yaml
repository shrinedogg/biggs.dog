---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: fenrir-crds
  namespace: flux-system
spec:
  interval: 3m
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: fenrir
  path: "./crds"
  prune: false
  wait: false
  timeout: 2m
  force: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app fenrir
  namespace: flux-system
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./clusters/cluster1/kubernetes/apps/dreamcast/fenrir/app
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  interval: 3m
  retryInterval: 1m
  timeout: 2m
  dependsOn:
    - name: fenrir-crds
    - name: nv-gpu-operator
