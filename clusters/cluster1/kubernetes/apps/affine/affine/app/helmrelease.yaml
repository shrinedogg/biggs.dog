apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: affine
  namespace: affine
spec:
  chartRef:
    kind: OCIRepository
    name: affine
    namespace: flux-system
  interval: 3m
  # The AFFiNE chart does not expose container securityContext values for its
  # graphql/front Deployments or the migration Job (the graphql templates render
  # no securityContext at all; front renders only a pod-level one). We inject the
  # hardening with a Flux post-render Kustomize patch. The AFFiNE image is a
  # Node.js app that runs as root, so we apply the user-independent controls only
  # (drop ALL capabilities, no privilege escalation, RuntimeDefault seccomp);
  # runAsNonRoot/readOnlyRootFilesystem are not forced because the image does not
  # support them. We additionally run every pod in a user namespace
  # (hostUsers: false, Kubernetes 1.36) so the in-container root maps to an
  # unprivileged host UID range — defense-in-depth on top of the cap drop.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
            patch: |
              - op: add
                path: /spec/template/spec/containers/0/securityContext
                value:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                      - ALL
                  seccompProfile:
                    type: RuntimeDefault
              - op: add
                path: /spec/template/spec/hostUsers
                value: false
          - target:
              kind: Job
            patch: |
              - op: add
                path: /spec/template/spec/containers/0/securityContext
                value:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                      - ALL
                  seccompProfile:
                    type: RuntimeDefault
              - op: add
                path: /spec/template/spec/hostUsers
                value: false
  values:
    global:
      image:
        repository: ghcr.io/toeverything/affine
        pullPolicy: IfNotPresent
        tag: "0.27.3"
      app:
        buildType: "stable"
        # set to "dev", "beta", or "production".
        # if not set, will use the name of the kubernetes namespace.
        environment: "production"
      ingress:
        enabled: false
        className: ""
        hosts: []
        tls: []
      gateway:
        enabled: true
        # Name of the Gateway resource to attach to (required when enabled).
        name: "wildcard-biggs-dog"
        # Namespace of the Gateway resource. Defaults to the same namespace as the HTTPRoute.
        namespace: "networking"
        # sectionName targets a specific listener on the Gateway (optional).
        sectionName: ""
        annotations: {}
        hostnames:
          - "affine.biggs.dog"
      secret:
        secretName: "affine-private-key"
        privateKey: ""
      database:
        # if "password" is set, this chart will store that password in a secret
        # that AFFiNE will use to connect.
        #
        # if you want to reuse an existing secret, leave "password" blank
        # and change `secretName` (and optionally `secretPasswordField`).
        secretName: "affine-user-password"
        secretUsernameField: "username"
        secretPasswordField: "password"
        user: ""
        host: "cnpg-affine-rw.cnpg-system.svc.cluster.local"
        port: "5432"
        name: "affine"
        password: ""
      redis:
        host: "dragonfly-db.dragonfly.svc.cluster.local"
        port: "6379"
        username: ""
        password: ""
        database: 0
      indexer:
        enabled: true
        provider: ""
        endpoint: "http://manticore-manticoresearch-balancer-svc.manticore.svc.cluster.local:9308"
        apiKey: ""
      docService:
        name: "affine-doc"
        port: 3020
      deployment:
        # Maps to DEPLOYMENT_TYPE and DEPLOYMENT_PLATFORM environment variables.
        # "selfhosted", "affine", or "unknown"
        type: "selfhosted"
        # this is referenced in the AFFiNE source, defaulting to "unknown", but
        # nothing seems to actually _use_ it.
        platform: "unknown"
    graphql:
      service:
        type: ClusterIP
        port: 3000
    front:
      services:
        sync:
          name: affine-sync
          type: ClusterIP
          port: 3010
        renderer:
          name: affine-renderer
          type: ClusterIP
          port: 3000
        web:
          name: affine-web
          type: ClusterIP
          port: 8080
        doc:
          type: ClusterIP
