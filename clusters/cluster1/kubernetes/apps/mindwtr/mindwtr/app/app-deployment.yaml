# Mindwtr PWA (mindwtr-app): the offline-capable web build, static files
# served by nginx on :5173 (client-side rendering, try_files handled in the
# image). Stateless; exposed at mindwtr.biggs.dog via internal-biggs-dog.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mindwtr-app
  namespace: mindwtr
  labels:
    app.kubernetes.io/name: mindwtr
    app.kubernetes.io/component: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mindwtr
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mindwtr
        app.kubernetes.io/component: app
    spec:
      containers:
        - name: mindwtr-app
          image: ghcr.io/dongdongbh/mindwtr-app:1.2.1
          ports:
            - containerPort: 5173
              name: http
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: mindwtr-app
  namespace: mindwtr
  labels:
    app.kubernetes.io/name: mindwtr
    app.kubernetes.io/component: app
spec:
  selector:
    app.kubernetes.io/name: mindwtr
    app.kubernetes.io/component: app
  ports:
    - name: http
      port: 5173
      targetPort: http
