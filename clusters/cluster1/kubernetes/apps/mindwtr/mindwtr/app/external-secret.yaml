# Materializes secret "mindwtr-cloud-auth" (key: token) consumed by the
# mindwtr-cloud Deployment as MINDWTR_CLOUD_AUTH_TOKENS. This is the bearer
# token for both the sync endpoint (/v1/data) and the REST API (/v1); use the
# SAME token in Mindwtr Settings -> Sync -> Self-Hosted on each client
# (Self-Hosted URL: https://mindwtr.biggs.dog — the app appends /v1/data).
#
# 1Password item required (biggs-dog vault):
#   - mindwtr-cloud-auth-token (password) — long random token, e.g.
#     `cat /dev/urandom | LC_ALL=C tr -dc 'a-zA-Z0-9' | fold -w 50 | head -n 1`
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mindwtr-cloud-auth
  namespace: mindwtr
  labels:
    app.kubernetes.io/name: mindwtr
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: mindwtr-cloud-auth
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: mindwtr-cloud-auth-token
        property: password
