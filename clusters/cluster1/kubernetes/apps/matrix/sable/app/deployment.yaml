---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sable-config
  namespace: matrix
data:
  config.json: |
    {
      "productName": "Sable",
      "defaultHomeserver": 0,
      "homeserverList": ["biggs.dog"],
      "allowCustomHomeservers": true,
      "elementCallUrl": null,
      "disableAccountSwitcher": false,
      "hideUsernamePasswordFields": false
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: sable
    app.kubernetes.io/name: sable
  name: sable
  namespace: matrix
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sable
  template:
    metadata:
      labels:
        app: sable
        app.kubernetes.io/name: sable
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sable
          image: ghcr.io/sableclient/sable:latest@sha256:7eb1c5658c81d455dc1e3172ad09ba669ddb05bda2272c336cd1000fd77f4f18
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              memory: 32Mi
              cpu: 10m
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /app/config.json
              subPath: config.json
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: caddy-data
              mountPath: /data
            - name: caddy-config
              mountPath: /config
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: sable-config
        - name: tmp
          emptyDir: {}
        - name: caddy-data
          emptyDir: {}
        - name: caddy-config
          emptyDir: {}
