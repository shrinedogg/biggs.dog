---
# lk-jwt-service: MatrixRTC authorization service — authenticates Matrix users
# and issues JWT tokens for LiveKit room access.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lk-jwt-service
  namespace: matrix
  labels:
    app.kubernetes.io/name: lk-jwt-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lk-jwt-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lk-jwt-service
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: lk-jwt-service
          # v0.5.0 — pinned tag (no latest)
          image: ghcr.io/element-hq/lk-jwt-service:0.5.0
          imagePullPolicy: IfNotPresent
          env:
            - name: LIVEKIT_JWT_BIND
              value: ":8081"
            - name: LIVEKIT_URL
              value: "ws://livekit-service.matrix.svc.cluster.local:7880"
            - name: LIVEKIT_FULL_ACCESS_HOMESERVERS
              value: "biggs.dog"
            - name: LIVEKIT_KEY
              valueFrom:
                secretKeyRef:
                  name: livekit-credentials
                  key: LIVEKIT_KEY
            - name: LIVEKIT_SECRET
              valueFrom:
                secretKeyRef:
                  name: livekit-credentials
                  key: LIVEKIT_SECRET
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            limits:
              memory: 128Mi
            requests:
              memory: 64Mi
              cpu: "0.1"
