---
apiVersion: v1
kind: Namespace
metadata:
  name: liquidctl
  labels:
    # Privileged: liquidctl drives the NZXT Kraken Elite AIO over raw USB HID
    # (/dev/hidrawN) on nv-01, which requires a privileged container.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
