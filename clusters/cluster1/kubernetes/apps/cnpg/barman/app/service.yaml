# Service/barman-cloud: the CNPG operator discovers the plugin through this
# Service (cnpg.io/pluginName label + plugin port/TLS annotations). Converted
# from the HelmRelease (Wave 1 de-Helm).

apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: plugin-barman-cloud
    app.kubernetes.io/instance: plugin-barman-cloud
    app.kubernetes.io/version: "v0.16.0"
    cnpg.io/pluginName: barman-cloud.cloudnative-pg.io
  annotations:
    cnpg.io/pluginClientSecret: barman-cloud-client-tls
    cnpg.io/pluginPort: "9090"
    cnpg.io/pluginServerSecret: barman-cloud-server-tls
  name: barman-cloud
  namespace: default
spec:
  ports:
  - port: 9090
    protocol: TCP
    targetPort: 9090
  selector:
    app.kubernetes.io/name: plugin-barman-cloud
    app.kubernetes.io/instance: plugin-barman-cloud
