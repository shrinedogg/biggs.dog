---
# Replacement TLS for the barman-cloud plugin (cloudnative-pg/charts#781).
#
# The CNPG operator builds its trust pool from the *server* secret's `tls.crt`
# (not `ca.crt`) and the plugin builds its client trust pool from the *client*
# secret's `tls.crt`:
#   operator: RootCAs = serverSecret["tls.crt"];  ServerName = "barman-cloud"
#   plugin:   ClientCAs = clientSecret["tls.crt"]
# (see internal/controller/plugin_controller.go and
#  cnpg-i-machinery pkg/pluginhelper/http/server.go)
#
# Each leaf is therefore used as its own trust anchor, so both certs MUST be
# self-signed CAs. The chart issues them with `isCA: false`; on cert-manager
# >= 1.18 that yields BasicConstraints CA:FALSE, which Go rejects with
# "parent certificate cannot sign this kind of certificate".
#
# We re-issue both as self-signed CA certs (isCA: true + `cert sign`) so each
# can validate itself.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: barman-cloud-selfsigned
  namespace: cnpg-system
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: barman-cloud-server
  namespace: cnpg-system
spec:
  isCA: true
  commonName: barman-cloud
  dnsNames:
    - barman-cloud
    - barman-cloud.cnpg-system
    - barman-cloud.cnpg-system.svc
    - barman-cloud.cnpg-system.svc.cluster.local
  secretName: barman-cloud-server-tls
  duration: 2160h
  renewBefore: 360h
  privateKey:
    rotationPolicy: Always
  usages:
    - server auth
    - cert sign
  issuerRef:
    name: barman-cloud-selfsigned
    kind: Issuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: barman-cloud-client
  namespace: cnpg-system
spec:
  isCA: true
  commonName: barman-cloud-client
  secretName: barman-cloud-client-tls
  duration: 2160h
  renewBefore: 360h
  privateKey:
    rotationPolicy: Always
  usages:
    - client auth
    - cert sign
  issuerRef:
    name: barman-cloud-selfsigned
    kind: Issuer
    group: cert-manager.io
