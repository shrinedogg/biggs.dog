# 1Password: item hister-user-password (username, password) — the CNPG
# bootstrap credential for the cnpg-hister cluster (created by the operator
# post-merge, same as the kagent-user-password item). The password must be
# alphanumeric: Hister consumes it inside a libpq key=value DSN (see
# apps/hister/hister/app/hister-database-url.yaml), which cannot quote
# values.
# Materialized into cnpg-system (the CNPG bootstrap secret) and hister.
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: hister-user-password
spec:
  externalSecretName: hister-user-password
  namespaceSelectors:
  - matchLabels:
      kubernetes.io/metadata.name: cnpg-system
  - matchLabels:
      kubernetes.io/metadata.name: hister
  externalSecretSpec:
    secretStoreRef:
      kind: ClusterSecretStore
      name: onepassword-connect
    target:
      creationPolicy: Owner
    data:
    - secretKey: password
      remoteRef:
        key: "hister-user-password"
        property: password
    - secretKey: username
      remoteRef:
        key: "hister-user-password"
        property: username
