# Password for the kritika_app role on cnpg-kritika (issue #643).
#
# 1Password item kritika-app-password (username=kritika_app, password);
# consumed by DatabaseRole kritika-app. The same item is read by the
# ExternalSecret kritika-postgres-app in the kritika namespace
# (apps/kritika/kritika/app/external-secrets.yaml). Mirrors
# substrate-user-password.yaml.
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: kritika-app-password
spec:
  externalSecretName: kritika-app-password
  namespaceSelectors:
  - matchLabels:
      kubernetes.io/metadata.name: cnpg-system
  externalSecretSpec:
    secretStoreRef:
      kind: ClusterSecretStore
      name: onepassword-connect
    target:
      creationPolicy: Owner
    data:
    - secretKey: password
      remoteRef:
        key: "kritika-app-password"
        property: password
    - secretKey: username
      remoteRef:
        key: "kritika-app-password"
        property: username
