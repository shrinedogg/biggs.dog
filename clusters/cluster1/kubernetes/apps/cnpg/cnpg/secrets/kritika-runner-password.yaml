# Password for the kritika_runner role on cnpg-kritika (issue #643).
#
# 1Password item kritika-runner-password (username=kritika_runner, password);
# consumed by DatabaseRole kritika-runner. The same item is read by the
# ExternalSecret kritika-postgres-runner in the kritika namespace
# (apps/kritika/kritika/app/external-secrets.yaml). Mirrors
# substrate-user-password.yaml.
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: kritika-runner-password
spec:
  externalSecretName: kritika-runner-password
  namespaceSelectors:
  - matchLabels:
      kubernetes.io/metadata.name: cnpg-system
  externalSecretSpec:
    secretStoreRef:
      kind: ClusterSecretStore
      name: onepassword-connect
    target:
      creationPolicy: Owner
    data:
    - secretKey: password
      remoteRef:
        key: "kritika-runner-password"
        property: password
    - secretKey: username
      remoteRef:
        key: "kritika-runner-password"
        property: username
