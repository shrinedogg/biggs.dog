apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: lightdash-user-password
spec:
  externalSecretName: lightdash-user-password
  namespaceSelectors:
  - matchLabels:
      kubernetes.io/metadata.name: cnpg-system
  externalSecretSpec:
    secretStoreRef:
      kind: ClusterSecretStore
      name: onepassword-connect
    target:
      creationPolicy: Owner
    data:
    - secretKey: password
      remoteRef:
        key: "lightdash-user-password"
        property: password
    - secretKey: username
      remoteRef:
        key: "lightdash-user-password"
        property: username
