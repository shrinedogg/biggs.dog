# Bootstrap credentials for the cnpg-substrate cluster (issue #594).
#
# The v0.5.0 substrate chart takes BYO postgres as two connection-string
# Secrets (substrate-postgres-readwrite / substrate-postgres-owner, created by
# the ExternalSecrets in ai-system/substrate/app/external-secrets.yaml). Both
# read this same 1Password login directly, so nothing in ai-system consumes
# these raw fields -- only the cnpg-system cluster bootstrap does.
#
# Single-login design: the `substrate` login is a member of BOTH the
# substrate_owner and substrate_readwrite NOLOGIN roles (created by the
# postInitApplicationSQL in ../databases/cnpg-substrate.yaml). Each pool
# connection SET ROLEs to the matching role at startup. Mirrors
# kagent-user-password.yaml.
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: substrate-user-password
spec:
  externalSecretName: substrate-user-password
  namespaceSelectors:
  - matchLabels:
      kubernetes.io/metadata.name: cnpg-system
  externalSecretSpec:
    secretStoreRef:
      kind: ClusterSecretStore
      name: onepassword-connect
    target:
      creationPolicy: Owner
    data:
    - secretKey: password
      remoteRef:
        key: "substrate-user-password"
        property: password
    - secretKey: username
      remoteRef:
        key: "substrate-user-password"
        property: username
