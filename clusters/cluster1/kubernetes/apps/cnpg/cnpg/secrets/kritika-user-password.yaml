# Bootstrap credentials for the cnpg-kritika cluster (issue #643).
#
# 1Password item kritika-user-password (username=kritika, password); consumed
# by the Cluster's bootstrap.initdb.secret as the DB owner. The same item is
# read by the ExternalSecret kritika-postgres-credentials in the kritika
# namespace (apps/kritika/kritika/app/external-secrets.yaml). Mirrors
# substrate-user-password.yaml.
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: kritika-user-password
spec:
  externalSecretName: kritika-user-password
  namespaceSelectors:
  - matchLabels:
      kubernetes.io/metadata.name: cnpg-system
  externalSecretSpec:
    secretStoreRef:
      kind: ClusterSecretStore
      name: onepassword-connect
    target:
      creationPolicy: Owner
    data:
    - secretKey: password
      remoteRef:
        key: "kritika-user-password"
        property: password
    - secretKey: username
      remoteRef:
        key: "kritika-user-password"
        property: username
