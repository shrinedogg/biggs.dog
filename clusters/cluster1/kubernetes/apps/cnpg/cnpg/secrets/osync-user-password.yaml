# 1Password item required (biggs-dog vault): osync-user-password
#   username — MUST equal the CNPG owner "osync" (see cnpg-osync.yaml)
#   password — strong random password
# Synced into cnpg-system (CNPG bootstrap secret) and osync (app namespace, so
# the role credentials are available there if ever needed; the app's
# DATABASE_URL is templated by the osync ExternalSecret from the same item).
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: osync-user-password
spec:
  externalSecretName: osync-user-password
  namespaceSelectors:
  - matchLabels:
      kubernetes.io/metadata.name: cnpg-system
  - matchLabels:
      kubernetes.io/metadata.name: osync
  externalSecretSpec:
    secretStoreRef:
      kind: ClusterSecretStore
      name: onepassword-connect
    target:
      creationPolicy: Owner
    data:
    - secretKey: password
      remoteRef:
        key: "osync-user-password"
        property: password
    - secretKey: username
      remoteRef:
        key: "osync-user-password"
        property: username
