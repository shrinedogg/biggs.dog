apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cnpg-pocket-id
  namespace: cnpg-system
spec:
  instances: 3
  # Temporary drain override (#604): accept full DB downtime during maintenance.
  # Re-enable after API readiness, CNPG recovery, and replication are verified.
  enablePDB: false
  failoverDelay: 60
  primaryUpdateMethod: unsupervised
  bootstrap:
    initdb:
      database: pocketid
      owner: pocketid
      dataChecksums: true
      secret:
        name: pocket-id-user-password
  imageName: ghcr.io/cloudnative-pg/postgresql:18.1
  resources:
    requests:
      memory: 2Gi
      cpu: 250m
    limits:
      memory: 2Gi
  postgresql:
    parameters:
      # cap parallelism to the container (was unbounded: 32)
      max_worker_processes: "8"
      max_parallel_workers: "4"
      max_parallel_maintenance_workers: "2"
      # bound WAL retention from replication slots (was uncapped; pg_wal grew to 49 GB)
      max_slot_wal_keep_size: "1GB"
      # hints force full-page writes for every changed page (was on; not needed here)
      wal_log_hints: "off"
      # let standbys apply WAL promptly instead of buffering to 30 min
      max_standby_streaming_delay: "30s"
      # do not pin full-page images for standby snapshots; CNPG rebuilds a standby
      # from basebackup when it needs to resync
      hot_standby_feedback: "off"
      # after crash recovery, exit instead of retrying forever in a tight loop
      restart_after_crash: "on"
  storage:
    storageClass: host-path
    size: 5Gi
  plugins:
  - name: barman-cloud.cloudnative-pg.io
    isWALArchiver: true
    parameters:
      barmanObjectName: barman-object-store
