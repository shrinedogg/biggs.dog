apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cnpg-bookboss
  namespace: cnpg-system
spec:
  instances: 3
  # Temporary drain override (#604): accept full DB downtime during maintenance.
  # Re-enable after API readiness, CNPG recovery, and replication are verified.
  enablePDB: false
  failoverDelay: 60
  # The operator-default 1h startDelay kept the demoted primary out of
  # the cluster after the 2026-11-24 OOMKilled failover: drop both to 5min
  startDelay: 300
  switchoverDelay: 300
  bootstrap:
    initdb:
      database: bookboss
      owner: bookboss
      dataChecksums: true
      secret:
        name: bookboss-user-password
  imageName: ghcr.io/cloudnative-pg/postgresql:18.1
  resources:
    requests:
      memory: 1Gi
      cpu: 150m
    limits:
      memory: 1Gi
  storage:
    storageClass: host-path
    size: 5Gi
  postgresql:
    parameters:
      archive_mode: "off"
