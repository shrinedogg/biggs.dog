apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cnpg-osync
  namespace: cnpg-system
spec:
  instances: 3
  bootstrap:
    initdb:
      database: osync
      owner: osync
      dataChecksums: true
      secret:
        name: osync-user-password
  imageName: ghcr.io/cloudnative-pg/postgresql:18.1
  resources:
    requests:
      memory: 300Mi
      cpu: 150m
    limits:
      memory: 300Mi
  storage:
    storageClass: host-path
    size: 5Gi
  plugins:
  - name: barman-cloud.cloudnative-pg.io
    isWALArchiver: true
    parameters:
      barmanObjectName: barman-object-store
