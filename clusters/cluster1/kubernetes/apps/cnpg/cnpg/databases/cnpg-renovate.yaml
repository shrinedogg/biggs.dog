apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cnpg-renovate
  namespace: cnpg-system
spec:
  instances: 3
  # Temporary drain override (#604): accept full DB downtime during maintenance.
  # Re-enable after API readiness, CNPG recovery, and replication are verified.
  enablePDB: false
  bootstrap:
    initdb:
      database: renovate
      owner: renovate
      dataChecksums: true
      secret:
        name: renovate-user-password
  imageName: ghcr.io/cloudnative-pg/postgresql:18.1
  resources:
    requests:
      memory: 300Mi
      cpu:  150m
    limits:
      memory: 300Mi
  storage:
    storageClass: host-path
    size: 5Gi
  plugins:
  - name: barman-cloud.cloudnative-pg.io
    isWALArchiver: true
    parameters:
      barmanObjectName: barman-object-store