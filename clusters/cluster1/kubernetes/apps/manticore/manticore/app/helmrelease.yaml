apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: manticore
  namespace: manticore
spec:
  interval: 3m
  # Rolling the worker StatefulSet is slow: every pod runs a graceful-shutdown
  # preStop hook (./shutdown.sh), so a single 25.0.0 upgrade can momentarily look
  # "stalled" and Helm aborts the wait early. With Flux's default of zero retries
  # that one failure wedges the release permanently (RetriesExceeded) even after
  # the pods come up healthy. Give the rollout headroom and let transient
  # failures self-heal instead of needing a manual reconcile.
  timeout: 15m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  chart:
    spec:
      chart: manticoresearch
      version: 29.0.2
      sourceRef:
        kind: HelmRepository
        name: manticore
        namespace: flux-system
  values:
    # The single securityContext/podSecurityContext pair is applied to BOTH the
    # balancer Deployment and the worker StatefulSet. The Manticore images
    # (manticoresearch/helm-worker|balancer) have no USER directive, so their
    # entrypoint, supervisord and searchd all run as root. The entrypoint creates
    # the /etc/ssl/cert.pem CA symlink and writes to manticore-owned data dirs,
    # which need a few capabilities; dropping ALL of them caused:
    #   ln: failed to create symbolic link '/etc/ssl/cert.pem': Permission denied
    # We therefore drop ALL and add back only the minimal set the root entrypoint
    # needs (file-permission override, ownership, and privilege-dropping caps).
    # The image is not built to start as non-root, so runAsNonRoot/runAsUser and
    # readOnlyRootFilesystem are not used.
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
        add:
          - CHOWN
          - DAC_OVERRIDE
          - FOWNER
          - SETGID
          - SETUID
          - SETPCAP
      seccompProfile:
        type: RuntimeDefault
    persistence:
      enabled: true
      storageClass: "host-path"
