---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: victoria-logs-collector
  namespace: flux-system
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: victoria-logs-collector
  path: ./clusters/cluster1/kubernetes/apps/observability/victoria-logs/victoria-logs-collector
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  interval: 5m
  retryInterval: 1m
  timeout: 5m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: victoria-logs-single
  namespace: flux-system
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: victoria-logs-single
  path: ./clusters/cluster1/kubernetes/apps/observability/victoria-logs/victoria-logs-single
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  interval: 3m
  retryInterval: 1m
  timeout: 2m
