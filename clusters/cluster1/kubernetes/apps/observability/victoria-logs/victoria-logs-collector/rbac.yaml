# vlagent (victoria-logs-collector) RBAC (converted from the HelmRelease,
# Wave 1 de-Helm).

apiVersion: v1
kind: ServiceAccount
metadata:
  name: victoria-logs-collector-vlc
  namespace: observability
  labels:
    app.kubernetes.io/instance: victoria-logs-collector
    app.kubernetes.io/name: vlc
    app.kubernetes.io/version: v1.54.0
  annotations:
    {}
automountServiceAccountToken: true

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: victoria-logs-collector-vlc
  labels:
    app.kubernetes.io/instance: victoria-logs-collector
    app.kubernetes.io/name: vlc
    app.kubernetes.io/version: v1.54.0
rules:
  - apiGroups: [""]
    resources: ["nodes", "namespaces", "pods"]
    verbs: ["get", "list", "watch"]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: victoria-logs-collector-vlc
  labels:
    app.kubernetes.io/instance: victoria-logs-collector
    app.kubernetes.io/name: vlc
    app.kubernetes.io/version: v1.54.0
subjects:
  - kind: ServiceAccount
    name: victoria-logs-collector-vlc
    namespace: observability
roleRef:
  kind: ClusterRole
  name: victoria-logs-collector-vlc
  apiGroup: rbac.authorization.k8s.io

