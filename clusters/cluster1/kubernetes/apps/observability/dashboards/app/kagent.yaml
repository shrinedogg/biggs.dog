---
# kagent dashboard: agentgateway + kagent MCP agent orchestration.
# Pod health and resource metrics come from kube-state-metrics and cAdvisor.
# LLM token metrics come from the agentgateway VMPodScrape in
# networking/agentgateway.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kagent-dashboard
  namespace: observability
  labels:
    grafana-dashboard: "1"
  annotations:
    grafana-folder: "Kagent"
data:
  kagent.json: |
    {
      "annotations": { "list": [] },
      "description": "kagent and agentgateway in ai-system: pod health, resource usage, agent orchestration, and LLM routing telemetry.",
      "editable": true,
      "graphTooltip": 1,
      "links": [],
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "AgentGateway Pods Running",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            { "expr": "count(kube_pod_status_phase{namespace=\"ai-system\", phase=\"Running\"} == 1)", "legendFormat": "Running", "refId": "A" }
          ],
          "fieldConfig": {
            "defaults": { "unit": "short", "color": { "mode": "thresholds" }, "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "green", "value": 1 } ] } }
          },
          "options": { "colorMode": "value", "graphMode": "none", "reduceOptions": { "calcs": ["lastNotNull"] }, "textMode": "value" }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Pods Not Ready",
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            { "expr": "count(kube_pod_status_ready{namespace=\"ai-system\", condition=\"true\"} == 0)", "legendFormat": "Not Ready", "refId": "A" }
          ],
          "fieldConfig": {
            "defaults": { "unit": "short", "color": { "mode": "thresholds" }, "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "red", "value": 1 } ] } }
          },
          "options": { "colorMode": "background", "graphMode": "none", "reduceOptions": { "calcs": ["lastNotNull"] }, "textMode": "value" }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Restarts (24h)",
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            { "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=\"ai-system\"}[24h]))", "legendFormat": "Restarts", "refId": "A" }
          ],
          "fieldConfig": {
            "defaults": { "unit": "short", "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "yellow", "value": 1 }, { "color": "red", "value": 5 } ] } }
          },
          "options": { "colorMode": "value", "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] }, "textMode": "value" }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Pod Age",
          "description": "How long the AgentGateway pod has been running.",
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            { "expr": "(time() - kube_pod_created{namespace=\"ai-system\"}) / 86400", "legendFormat": "{{pod}}", "refId": "A" }
          ],
          "fieldConfig": {
            "defaults": { "unit": "d" }
          },
          "options": { "colorMode": "value", "graphMode": "none", "reduceOptions": { "calcs": ["lastNotNull"] }, "textMode": "value" }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Per-Pod CPU Usage",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            { "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"ai-system\", container!=\"\", container!=\"POD\"}[5m]))", "legendFormat": "{{pod}}", "refId": "A" }
          ],
          "fieldConfig": {
            "defaults": { "unit": "short", "min": 0, "custom": { "drawStyle": "line", "lineInterpolation": "smooth", "lineWidth": 2, "fillOpacity": 10 } }
          },
          "options": { "legend": { "calcs": ["lastNotNull", "max"], "displayMode": "table", "placement": "right", "showLegend": true } }
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Per-Pod Memory Usage",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            { "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"ai-system\", container!=\"\", container!=\"POD\"})", "legendFormat": "{{pod}}", "refId": "A" }
          ],
          "fieldConfig": {
            "defaults": { "unit": "bytes", "min": 0, "custom": { "drawStyle": "line", "lineInterpolation": "smooth", "lineWidth": 2, "fillOpacity": 10 } }
          },
          "options": { "legend": { "calcs": ["lastNotNull", "max"], "displayMode": "table", "placement": "right", "showLegend": true } }
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "CPU Usage vs Request (%)",
          "description": "CPU usage as percentage of request. Sustained > 100% = throttling risk.",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 12 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            { "expr": "100 * sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"ai-system\", container!=\"\", container!=\"POD\"}[5m])) / clamp_min(sum by (pod) (kube_pod_container_resource_requests{namespace=\"ai-system\", resource=\"cpu\"}), 0.001)", "legendFormat": "{{pod}}", "refId": "A" }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent", "min": 0,
              "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "yellow", "value": 80 }, { "color": "red", "value": 100 } ] },
              "custom": { "drawStyle": "line", "lineInterpolation": "smooth", "lineWidth": 2, "fillOpacity": 10 }
            }
          },
          "options": { "legend": { "calcs": ["lastNotNull", "max"], "displayMode": "table", "placement": "right", "showLegend": true } }
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Memory Usage vs Limit (%)",
          "description": "Memory working set as percentage of limit. Approaching 100% = imminent OOMKill.",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 12 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            { "expr": "100 * sum by (pod) (container_memory_working_set_bytes{namespace=\"ai-system\", container!=\"\", container!=\"POD\"}) / clamp_min(sum by (pod) (kube_pod_container_resource_limits{namespace=\"ai-system\", resource=\"memory\"}), 1)", "legendFormat": "{{pod}}", "refId": "A" }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent", "min": 0, "max": 100,
              "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "yellow", "value": 70 }, { "color": "red", "value": 90 } ] },
              "custom": { "drawStyle": "line", "lineInterpolation": "smooth", "lineWidth": 2, "fillOpacity": 10 }
            }
          },
          "options": { "legend": { "calcs": ["lastNotNull", "max"], "displayMode": "table", "placement": "right", "showLegend": true } }
        },
        {
          "id": 9,
          "type": "stat",
          "title": "Deployment Replicas",
          "description": "Desired vs available replicas across all deployments.",
          "gridPos": { "h": 4, "w": 12, "x": 0, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            { "expr": "kube_deployment_spec_replicas{namespace=\"ai-system\"}", "legendFormat": "Desired - {{deployment}}", "refId": "A" },
            { "expr": "kube_deployment_status_replicas_available{namespace=\"ai-system\"}", "legendFormat": "Available - {{deployment}}", "refId": "B" }
          ],
          "fieldConfig": {
            "defaults": { "unit": "short", "color": { "mode": "thresholds" }, "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "green", "value": 1 } ] } }
          },
          "options": { "colorMode": "value", "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] }, "textMode": "value" }
        },
        {
          "id": 10,
          "type": "stat",
          "title": "StatefulSet Replicas",
          "description": "Desired vs available replicas for StatefulSets.",
          "gridPos": { "h": 4, "w": 12, "x": 12, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            { "expr": "kube_statefulset_replicas{namespace=\"ai-system\"}", "legendFormat": "Desired - {{statefulset}}", "refId": "A" },
            { "expr": "kube_statefulset_status_replicas{namespace=\"ai-system\"}", "legendFormat": "Current - {{statefulset}}", "refId": "B" }
          ],
          "fieldConfig": {
            "defaults": { "unit": "short" }
          },
          "options": { "colorMode": "value", "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] }, "textMode": "value" }
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "LLM Token Rate",
          "description": "Tokens per second by requested model and token type across the internal agentgateway data plane.",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 20 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            { "expr": "sum by (gen_ai_request_model, gen_ai_token_type) (rate(agentgateway_gen_ai_client_token_usage_sum{namespace=\"networking\"}[5m]))", "legendFormat": "{{gen_ai_request_model}} {{gen_ai_token_type}}", "refId": "A" }
          ],
          "fieldConfig": {
            "defaults": { "unit": "short", "min": 0, "custom": { "drawStyle": "line", "lineInterpolation": "smooth", "lineWidth": 2, "fillOpacity": 10 } }
          },
          "options": { "legend": { "calcs": ["lastNotNull", "max"], "displayMode": "table", "placement": "right", "showLegend": true } }
        },
        {
          "id": 12,
          "type": "timeseries",
          "title": "LLM Token Volume (1h)",
          "description": "One-hour token volume by requested model and token type across the internal agentgateway data plane.",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 20 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            { "expr": "sum by (gen_ai_request_model, gen_ai_token_type) (increase(agentgateway_gen_ai_client_token_usage_sum{namespace=\"networking\"}[1h]))", "legendFormat": "{{gen_ai_request_model}} {{gen_ai_token_type}}", "refId": "A" }
          ],
          "fieldConfig": {
            "defaults": { "unit": "short", "min": 0, "custom": { "drawStyle": "line", "lineInterpolation": "smooth", "lineWidth": 2, "fillOpacity": 10 } }
          },
          "options": { "legend": { "calcs": ["lastNotNull", "max"], "displayMode": "table", "placement": "right", "showLegend": true } }
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": ["kagent", "agentgateway", "ai-system"],
      "templating": {
        "list": [
          {
            "current": { "selected": false, "text": "VictoriaMetrics", "value": "VictoriaMetrics" },
            "hide": 0,
            "includeAll": false,
            "multi": false,
            "name": "datasource",
            "options": [],
            "query": "prometheus",
            "refresh": 1,
            "type": "datasource"
          }
        ]
      },
      "time": { "from": "now-6h", "to": "now" },
      "title": "Kagent",
      "uid": "kagent",
      "version": 2
    }
