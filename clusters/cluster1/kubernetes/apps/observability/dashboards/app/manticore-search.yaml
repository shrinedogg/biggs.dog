---
# Manticore Search dashboard — search engine health and resource usage.
# Uses kube-state-metrics, cadvisor, and PVC metrics. Manticore Search exposes
# internal stats via HTTP API (/stats) but it is not scraped as Prometheus metrics.
# This dashboard focuses on pod health, resource usage, and storage.
# Picked up automatically by the Grafana sidecar (searchNamespace: ALL,
# label: grafana-dashboard).
apiVersion: v1
kind: ConfigMap
metadata:
  name: manticore-search-dashboard
  namespace: observability
  labels:
    grafana-dashboard: "1"
  annotations:
    grafana-folder: "Search"
data:
  manticore-search.json: |
    {
      "annotations": { "list": [] },
      "description": "Manticore Search — balancer and worker pod health, resource usage, and PVC utilisation.",
      "editable": true,
      "graphTooltip": 1,
      "links": [],
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Workers Running",
          "gridPos": { "h": 4, "w": 4, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            { "expr": "count(kube_pod_status_phase{namespace=\"manticore\", pod=~\".*worker.*\", phase=\"Running\"} == 1)", "legendFormat": "Workers", "refId": "A" }
          ],
          "fieldConfig": {
            "defaults": { "unit": "short", "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "green", "value": 1 } ] } }
          },
          "options": { "colorMode": "value", "graphMode": "none", "reduceOptions": { "calcs": ["lastNotNull"] }, "textMode": "value" }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Balancer Running",
          "gridPos": { "h": 4, "w": 4, "x": 4, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            { "expr": "count(kube_pod_status_phase{namespace=\"manticore\", pod=~\".*balancer.*\", phase=\"Running\"} == 1)", "legendFormat": "Balancer", "refId": "A" }
          ],
          "fieldConfig": {
            "defaults": { "unit": "short", "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "green", "value": 1 } ] } }
          },
          "options": { "colorMode": "value", "graphMode": "none", "reduceOptions": { "calcs": ["lastNotNull"] }, "textMode": "value" }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Total Pods",
          "gridPos": { "h": 4, "w": 4, "x": 8, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            { "expr": "count(kube_pod_status_phase{namespace=\"manticore\"})", "legendFormat": "Pods", "refId": "A" }
          ],
          "fieldConfig": {
            "defaults": { "unit": "short" }
          },
          "options": { "colorMode": "value", "graphMode": "none", "reduceOptions": { "calcs": ["lastNotNull"] }, "textMode": "value" }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Restarts (1h)",
          "gridPos": { "h": 4, "w": 4, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            { "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=\"manticore\"}[1h]))", "legendFormat": "Restarts", "refId": "A" }
          ],
          "fieldConfig": {
            "defaults": { "unit": "short", "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "yellow", "value": 1 }, { "color": "red", "value": 5 } ] } }
          },
          "options": { "colorMode": "value", "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] }, "textMode": "value" }
        },
        {
          "id": 5,
          "type": "stat",
          "title": "PVC Utilisation",
          "gridPos": { "h": 4, "w": 8, "x": 16, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            { "expr": "100 * sum(kubelet_volume_stats_used_bytes{namespace=\"manticore\"}) / clamp_min(sum(kubelet_volume_stats_capacity_bytes{namespace=\"manticore\"}), 1)", "legendFormat": "Used %", "refId": "A" }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "yellow", "value": 80 }, { "color": "red", "value": 90 } ] }
            }
          },
          "options": { "colorMode": "value", "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] }, "textMode": "value" }
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Per-Pod CPU Usage",
          "description": "CPU per Manticore component. Workers consume more CPU during index builds.",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            { "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"manticore\", container!=\"\", container!=\"POD\"}[5m]))", "legendFormat": "{{pod}}", "refId": "A" }
          ],
          "fieldConfig": {
            "defaults": { "unit": "short", "min": 0, "custom": { "drawStyle": "line", "lineInterpolation": "smooth", "lineWidth": 2, "fillOpacity": 10 } }
          },
          "options": { "legend": { "calcs": ["lastNotNull", "max"], "displayMode": "table", "placement": "right", "showLegend": true } }
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Per-Pod Memory Usage",
          "description": "Manticore workers cache indexes in memory. Watch for steady growth (memory leak) or spikes (large index loading).",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            { "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"manticore\", container!=\"\", container!=\"POD\"})", "legendFormat": "{{pod}}", "refId": "A" }
          ],
          "fieldConfig": {
            "defaults": { "unit": "bytes", "min": 0, "custom": { "drawStyle": "line", "lineInterpolation": "smooth", "lineWidth": 2, "fillOpacity": 10 } }
          },
          "options": { "legend": { "calcs": ["lastNotNull", "max"], "displayMode": "table", "placement": "right", "showLegend": true } }
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "CPU Usage vs Request (%)",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 12 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            { "expr": "100 * sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"manticore\", container!=\"\", container!=\"POD\"}[5m])) / clamp_min(sum by (pod) (kube_pod_container_resource_requests{namespace=\"manticore\", resource=\"cpu\"}), 0.001)", "legendFormat": "{{pod}}", "refId": "A" }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent", "min": 0,
              "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "yellow", "value": 80 }, { "color": "red", "value": 100 } ] },
              "custom": { "drawStyle": "line", "lineInterpolation": "smooth", "lineWidth": 2, "fillOpacity": 10 }
            }
          },
          "options": { "legend": { "calcs": ["lastNotNull", "max"], "displayMode": "table", "placement": "right", "showLegend": true } }
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Memory Usage vs Limit (%)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 12 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            { "expr": "100 * sum by (pod) (container_memory_working_set_bytes{namespace=\"manticore\", container!=\"\", container!=\"POD\"}) / clamp_min(sum by (pod) (kube_pod_container_resource_limits{namespace=\"manticore\", resource=\"memory\"}), 1)", "legendFormat": "{{pod}}", "refId": "A" }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent", "min": 0, "max": 100,
              "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "yellow", "value": 70 }, { "color": "red", "value": 90 } ] },
              "custom": { "drawStyle": "line", "lineInterpolation": "smooth", "lineWidth": 2, "fillOpacity": 10 }
            }
          },
          "options": { "legend": { "calcs": ["lastNotNull", "max"], "displayMode": "table", "placement": "right", "showLegend": true } }
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Container Restart Rate",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 20 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            { "expr": "sum by (pod) (rate(kube_pod_container_status_restarts_total{namespace=\"manticore\"}[5m]))", "legendFormat": "{{pod}}", "refId": "A" }
          ],
          "fieldConfig": {
            "defaults": { "unit": "ops", "min": 0, "custom": { "drawStyle": "line", "lineInterpolation": "linear", "lineWidth": 2, "fillOpacity": 10 } }
          },
          "options": { "legend": { "calcs": ["lastNotNull", "max"], "displayMode": "table", "placement": "right", "showLegend": true } }
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": ["manticore", "search", "elasticsearch", "indexing"],
      "templating": {
        "list": [
          {
            "current": { "selected": false, "text": "VictoriaMetrics", "value": "VictoriaMetrics" },
            "hide": 0,
            "includeAll": false,
            "multi": false,
            "name": "datasource",
            "options": [],
            "query": "prometheus",
            "refresh": 1,
            "type": "datasource"
          }
        ]
      },
      "time": { "from": "now-6h", "to": "now" },
      "title": "Manticore Search",
      "uid": "manticore-search",
      "version": 1
    }
