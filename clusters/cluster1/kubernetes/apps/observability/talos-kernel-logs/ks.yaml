---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: talos-kernel-logs
  namespace: flux-system
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: talos-kernel-logs
  path: ./clusters/cluster1/kubernetes/apps/observability/talos-kernel-logs/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  interval: 5m
  retryInterval: 1m
  timeout: 3m
  # vlogs VMAlert + the relay's HTTP sink both target VictoriaLogs.
  dependsOn:
    - name: victoria-logs-single
