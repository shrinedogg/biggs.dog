# Wave 1 de-Helm: IAC policy for fenrir-wolf.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: fenrir-wolf
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: fenrir-wolf
  filterTags:
    pattern: '^v[0-9]+\.[0-9]+\.[0-9]+$'
  policy:
    semver:
      range: "~0.2.9"
