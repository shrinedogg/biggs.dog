# Wave 1 de-Helm: IAC enrollment of ghcr.io/home-operations/kritika (see the per-app
# $imagepolicy markers). Digest tags excluded (exclusionList).apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: kritika
  namespace: flux-system
spec:
  image: ghcr.io/home-operations/kritika
  exclusionList:
    - "^sha256-.*$"
  interval: 30m
