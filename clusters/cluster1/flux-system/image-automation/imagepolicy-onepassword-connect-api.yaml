# Wave 1 de-Helm: IAC policy for onepassword-connect-api.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: onepassword-connect-api
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: onepassword-connect-api
  filterTags:
    pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
  policy:
    semver:
      range: ">=1.8.4 <2.0.0"
