# Wave 1 de-Helm: IAC policy for fenrir-wolf-agent.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: fenrir-wolf-agent
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: fenrir-wolf-agent
  filterTags:
    pattern: '^v[0-9]+\.[0-9]+\.[0-9]+$'
  policy:
    semver:
      range: "~0.1.3"
