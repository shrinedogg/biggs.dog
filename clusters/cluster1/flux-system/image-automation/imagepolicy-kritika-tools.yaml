# Wave 1 de-Helm: IAC policy for the kritika tools image (the
# <ver>-tools tags of the shared ImageRepository/kritika);
# extract "$version" so the policy tracks the base semver.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: kritika-tools
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: kritika
  filterTags:
    pattern: '^(?P<version>[0-9]+\.[0-9]+\.[0-9]+)-tools$'
    extract: "$version"
  policy:
    semver:
      range: ">=0.0.119 <1.0.0"
