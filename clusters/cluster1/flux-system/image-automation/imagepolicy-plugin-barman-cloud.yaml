# Wave 1 de-Helm: IAC policy for plugin-barman-cloud.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: plugin-barman-cloud
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: plugin-barman-cloud
  filterTags:
    pattern: '^v[0-9]+\.[0-9]+\.[0-9]+$'
  policy:
    semver:
      range: "~0.16.0"
