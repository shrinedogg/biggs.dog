# Wave 1 de-Helm: IAC policy for oauth2-proxy.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: oauth2-proxy
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: oauth2-proxy
  filterTags:
    pattern: '^v[0-9]+\.[0-9]+\.[0-9]+$'
  policy:
    semver:
      range: ">=7.15.6 <8.0.0"
