# Wave 1 de-Helm: IAC policy for agent-sandbox-controller.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: agent-sandbox-controller
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: agent-sandbox-controller
  filterTags:
    pattern: '^v[0-9]+\.[0-9]+\.[0-9]+$'
  policy:
    semver:
      range: "~1.0.10"
