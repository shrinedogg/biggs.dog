# Wave 1 de-Helm: IAC policy for fenrir-moonlight-proxy.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: fenrir-moonlight-proxy
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: fenrir-moonlight-proxy
  filterTags:
    pattern: '^v[0-9]+\.[0-9]+\.[0-9]+$'
  policy:
    semver:
      range: "~0.1.6"
