# Wave 1 de-Helm: IAC policy for victoria-logs.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: victoria-logs
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: victoria-logs
  filterTags:
    pattern: '^v[0-9]+\.[0-9]+\.[0-9]+$'
  policy:
    semver:
      range: ">=1.53.0 <2.0.0"
