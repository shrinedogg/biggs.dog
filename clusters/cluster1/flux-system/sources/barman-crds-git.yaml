# CNPG Barman plugin CRDs from the upstream cloudnative-pg/plugin-barman-cloud
# git repo (Wave 1 de-Helm: replaces the OCIRepository barman-oci; the chart
# rendered the CRDs from the registry tarball).
#
# Bump this tag in the same commit as a plugin minor bump (the
# ImagePolicy plugin-barman-cloud range is patch-only ~0.16.0).
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: barman-crds
  namespace: flux-system
spec:
  interval: 1h
  url: https://github.com/cloudnative-pg/plugin-barman-cloud
  ref:
    tag: v0.16.0 # commit: cd3b9faeb18466bc1195688589dc20db2b247f15
