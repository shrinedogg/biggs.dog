---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: agentgateway-crds
  namespace: flux-system
spec:
  interval: 1h
  url: oci://ghcr.io/agentgateway/charts/agentgateway-crds
  ref:
    # Bumped 0.0.0-alpha.a655af15 -> v1.7.0 for the 1.x train cutover
    # (issues #745/#747). Additive: adds the agentgatewaymodels CRD; all
    # fields biggs.dog uses are unchanged. Safe for the legacy v2.2.1
    # controller (same v1alpha1, superset schema) and safe to keep during
    # any controller rollback. See docs/agentgateway-1x-migration/02.
    tag: "v2.2.1"
