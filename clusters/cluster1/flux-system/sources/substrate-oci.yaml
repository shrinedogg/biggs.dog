# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: substrate
  namespace: flux-system
spec:
  interval: 1h
  url: oci://ghcr.io/kagent-dev/substrate/helm/substrate
  ref:
    # Paired lockstep with kagent 1.0.1, whose go/go.mod replaces
    # go.ate.dev/substrate with kagent-dev/substrate v1.0.0 (the 1.0 GA
    # line). renovate.json's substrate-stack gate wants the chart to match
    # the replace version, so this lands 1.0.0; the 1.0.1 chart (a
    # chart-only patch over the same v1.0 generation) follows next cycle.
    # 1.0.0 renders the gvisor-default SandboxConfig at defaultVersion v7
    # (gVisor 20261102.0) -- reseed the B2 gvisor object BEFORE merging
    # (runbook in the PR body). Bumps for the whole substrate stack are
    # grouped + automerge:false -- see the substrate-stack rule in
    # renovate.json.
    tag: "1.0.1"
