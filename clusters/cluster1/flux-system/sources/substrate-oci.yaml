# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: substrate
  namespace: flux-system
spec:
  interval: 1h
  url: oci://ghcr.io/kagent-dev/substrate/helm/substrate
  ref:
    # Paired lockstep with kagent 1.0.0-alpha11, whose go/go.mod replaces
    # agent-substrate/substrate with kagent-dev/substrate v0.5.0-alpha2
    # (alpha11 is the only kagent 1.0 alpha that vendors 0.5.0-alpha2). The
    # v0.5.x control plane is mTLS/pod-identity only: no jwt client mode, no
    # digest-pinned ateapi fork, no bundled postgres. Bumps for the whole
    # substrate stack are grouped + automerge:false — see the substrate-stack
    # rule in renovate.json.
    tag: "0.5.0-alpha2"
