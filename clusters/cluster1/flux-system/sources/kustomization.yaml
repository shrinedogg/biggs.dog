  # The substrate-stack migration (2026-10-10) re-added substrate-crds and
  # the substrate-podcert signer source alongside substrate-oci.yaml.
  # 2026-11-09: the substrate-crds source migrated from the OCI chart to the
  # git-sourced GitRepository (substrate-crds-git.yaml, issue #798).
  # Lockstep group — see the substrate-stack rule in renovate.json.
  - substrate-crds-git.yaml
  - substrate-podcert-oci.yaml
  - substrate-oci.yaml
  - agent-sandbox-git.yaml
  # MIGRATION SAFETY: the generated root-sync Kustomization (flux-system, path
  # clusters/cluster1) runs with prune: false (flux-instance.yaml patch, see
  # docs/NOTES.md), so the 16 HelmRepository objects whose files this PR
  # deletes are NOT garbage-collected after merge. Delete them by hand:
  #   kubectl -n flux-system delete helmrepository \
  #     cloudnative-pg cert-manager cilium external-secrets grafana-operator \
  #     lightdash node-feature-discovery nfs-driver nvidia oauth2-proxy \
  #     onepass openebs piraeus rook-ceph victoria-metrics volsync
  # Re-enable prune on the root sync once the cluster0->cluster1 split is complete.
  - oauth2-proxy-oci.yaml
  - flux-operator-repo.yaml
  - flux-operator-mcp-oci.yaml
  - cert-manager-csi-driver-oci.yaml
