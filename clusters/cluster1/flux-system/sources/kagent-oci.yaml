# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: kagent
  namespace: flux-system
spec:
  interval: 5m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    # Paired lockstep with substrate 0.5.0-alpha2: go/go.mod at this tag
    # replaces agent-substrate/substrate with kagent-dev/substrate
    # v0.5.0-alpha2. 1.0.0 drops ALL legacy kagent.dev/v1alpha2 APIs — the
    # ai-system agent fleet is rewritten to api.kagent.dev/v1alpha3 in the
    # same PR.
    tag: "1.0.0-alpha11"
  url: oci://ghcr.io/kagent-dev/kagent/helm/kagent